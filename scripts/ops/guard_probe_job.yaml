apiVersion: batch/v1
kind: Job
metadata:
  # guard v6's write test when no pod of ours runs: one write to /data, then it ends; the guard deletes it.
  name: guard-probe-raunav
  namespace: cms-ml
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/sh", "-c", "date > /data/results/.write_probe && echo WRITE_OK || echo WRITE_FAIL"]
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits:   { memory: "128Mi", cpu: "100m" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
