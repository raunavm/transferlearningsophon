# configs/finetune/AspenOpenJets.yaml
# GENERATED by scripts/build_aoj_config.py -- do not hand-edit.
#
# AspenOpenJets, CMS 2016 JetHT Open Data (arXiv:2412.10504, DOI
# 10.25592/uhhfdm.16505), staged by scripts/stage_aoj.py. INFERENCE ONLY.
#
# All 17 per-particle features are present, so NOTHING is zero-filled: the
# inputs block is scripts/build_downstream_configs.py's with `missing = []`,
# i.e. the arms' slots and standardization verbatim.
#
# jet_pt / jet_energy are REBUILT from the PUPPI-weighted constituents (what the
# constituents are normalised by); aoj_jet_pt is the JEC-corrected CMS value and
# is what the selection cuts on. The label is a dummy -- this is real data.
#
# No `weights:` block.

selection:
   (aoj_jet_pt > 500) & (aoj_jet_pt < 2500) & (np.abs(aoj_jet_eta) < 2.4) & (jet_sdmass > 20) & (jet_sdmass < 500)

new_variables:

   part_mask: ak.ones_like(part_energy)

   ## scaled vectors (jet rescaled so pT = 500 GeV) -- Sophon yaml:12-20
   part_px_scale: part_px / jet_pt * 500
   part_py_scale: part_py / jet_pt * 500
   part_pz_scale: part_pz / jet_pt * 500
   part_energy_scale: part_energy / jet_pt * 500

   part_pt: np.hypot(part_px, part_py)
   part_pt_scale: np.hypot(part_px_scale, part_py_scale)
   part_pt_scale_log: np.log(part_pt_scale)
   part_e_scale_log: np.log(part_energy_scale)
   part_logptrel: np.log(part_pt/jet_pt)
   part_logerel: np.log(part_energy/jet_energy)
   part_deltaR: np.hypot(part_deta, part_dphi)

   ## displacement, as configs/data/JetClassII_base.yaml:24-25
   part_d0: np.tanh(part_d0val)
   part_dz: np.tanh(part_dzval)

   ## dummy class indicators (weaver argmaxes over these); real data has no label
   label_data: label == 0
   label_unused: label == 1

preprocess:
  method: manual
  data_fraction: 0.5

inputs:
   pf_points:
      length: 128
      pad_mode: wrap
      vars:
         - [part_deta, null]
         - [part_dphi, null]
   pf_features:
      length: 128
      pad_mode: wrap
      vars:
         - [part_pt_scale_log, 1.7, 0.7]
         - [part_e_scale_log, 2.0, 0.7]
         - [part_logptrel, -4.7, 0.7]
         - [part_logerel, -4.7, 0.7]
         - [part_deltaR, 0.2, 4.0]
         - [part_charge, null]
         - [part_isChargedHadron, null]
         - [part_isNeutralHadron, null]
         - [part_isPhoton, null]
         - [part_isElectron, null]
         - [part_isMuon, null]
         - [part_d0, null]
         - [part_d0err, 0, 1, 0, 1]
         - [part_dz, null]
         - [part_dzerr, 0, 1, 0, 1]
         - [part_deta, null]
         - [part_dphi, null]
   pf_vectors:
      length: 128
      pad_mode: wrap
      vars:
         - [part_px_scale, null]
         - [part_py_scale, null]
         - [part_pz_scale, null]
         - [part_energy_scale, null]
   pf_mask:
      length: 128
      pad_mode: constant
      vars:
         - [part_mask, null]

labels:
   type: simple
   value: [label_data, label_unused]

observers:
   - jet_pt
   - jet_eta
   - jet_sdmass
   - aoj_jet_pt
   - aoj_jet_eta
   - aoj_pn_WvsQCD
   - aoj_pn_TvsQCD
   - aoj_pn_HbbvsQCD
   - run
   - lumi
   - event
