# configs/finetune/EnergyFlowQG.yaml
# GENERATED by scripts/build_downstream_configs.py -- do not hand-edit.
#
# EnergyFlow quark/gluon, Zenodo 3164691 (Pythia)
#
# ZERO-FILL: 4 of the 17 per-particle features are absent from this
# dataset, because constituents carry (pt, y, phi, pdgid), so type and charge are recoverable in the 'exp' scenario, but the sample is generator level with no tracking and therefore no impact parameters. Each absent slot reads `part_zero`
# (= ak.zeros_like(part_energy)) while keeping the arms' standardization
# parameters, under all of which a raw 0 maps to a network input of 0.
#
# Filled: part_d0, part_d0err, part_dz, part_dzerr
#
# The paired control is configs/finetune/JetClassII_L162_maskEnergyFlowQG.yaml, which masks the SAME
# slots on JetClass-II itself so the penalty is measurable in-domain. Both files
# come from one FILLS entry; tests/test_downstream_fill.py asserts the masked
# slot sets are equal.
#
# No `weights:` block: fine-tuning legs use the downstream sample at its natural
# composition (see scripts/build_finetune_configs.py for why).

selection:
   ### Intentionally empty: the downstream sample is evaluated at its own
   ### natural population. Porting Sophon's (200<pt<2500)&(20<msd<500) cut
   ### would change what the benchmark row means.

new_variables:
   part_zero: ak.zeros_like(part_energy)

   part_mask: ak.ones_like(part_energy)

   ## scaled vectors (jet rescaled so pT = 500 GeV) -- Sophon yaml:12-20
   part_px_scale: part_px / jet_pt * 500
   part_py_scale: part_py / jet_pt * 500
   part_pz_scale: part_pz / jet_pt * 500
   part_energy_scale: part_energy / jet_pt * 500

   part_pt: np.hypot(part_px, part_py)
   part_pt_scale: np.hypot(part_px_scale, part_py_scale)
   part_pt_scale_log: np.log(part_pt_scale)
   part_e_scale_log: np.log(part_energy_scale)
   part_logptrel: np.log(part_pt/jet_pt)
   part_logerel: np.log(part_energy/jet_energy)
   part_deltaR: np.hypot(part_deta, part_dphi)

   ## class indicators (weaver argmaxes over these)
   label_gluon: label == 0
   label_quark: label == 1

preprocess:
  method: manual
  data_fraction: 0.5

inputs:
   pf_points:
      length: 128
      pad_mode: wrap
      vars:
         - [part_deta, null]
         - [part_dphi, null]
   pf_features:
      length: 128
      pad_mode: wrap
      vars:
         - [part_pt_scale_log, 1.7, 0.7]
         - [part_e_scale_log, 2.0, 0.7]
         - [part_logptrel, -4.7, 0.7]
         - [part_logerel, -4.7, 0.7]
         - [part_deltaR, 0.2, 4.0]
         - [part_charge, null]
         - [part_isChargedHadron, null]
         - [part_isNeutralHadron, null]
         - [part_isPhoton, null]
         - [part_isElectron, null]
         - [part_isMuon, null]
         - [part_zero, null]   # zero-filled: part_d0
         - [part_zero, 0, 1, 0, 1]   # zero-filled: part_d0err
         - [part_zero, null]   # zero-filled: part_dz
         - [part_zero, 0, 1, 0, 1]   # zero-filled: part_dzerr
         - [part_deta, null]
         - [part_dphi, null]
   pf_vectors:
      length: 128
      pad_mode: wrap
      vars:
         - [part_px_scale, null]
         - [part_py_scale, null]
         - [part_pz_scale, null]
         - [part_energy_scale, null]
   pf_mask:
      length: 128
      pad_mode: constant
      vars:
         - [part_mask, null]

labels:
   type: simple
   value: [label_gluon, label_quark]

observers:
   - jet_pt
   - jet_energy
