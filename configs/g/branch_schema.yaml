# configs/g/branch_schema.yaml — G-campaign ntuple branch contract  ⟨frozen at G1⟩
# The single source of truth for the ntupler extension (jetclass2_generation
# fork) and every downstream loader. Validated by the pilot's truth-survival
# check (§7.7c) and the schema assertions in the pilot analyzer.
version: 1
drafted: 2026-07-19
status: frozen-pending-pilot   # G1 acceptance finalizes it

event:
  event_dsid:        {type: int32,   source: "generation wrapper argument (per genpack process id)"}
  event_run:         {type: int32,   source: "generation wrapper argument (job/batch seed index)"}
  event_number:      {type: int64,   source: "HepMCEvent::Number (64-bit — do NOT truncate)"}
  event_split:       {type: int8,    source: "L5 stamp: 0=train 1=val 2=test; SHA256(dsid:run:event:SALT) per configs/g/split.yaml; computed by experiments/G/split_stamp.py logic — the C++ ntupler receives it precomputed OR implements SHA-256 with a MANDATORY cross-check against split_stamp.py on >=10k UIDs in the pilot (no silent second source of truth)"}
  event_npu:         {type: int32,   source: "Vertex branch entries - 1 (primary excluded); -1 if branch absent (never silently 0)"}
  event_mean_pileup: {type: float32, source: "requested MeanPileUp working point, wrapper argument (0/25/50/80/140)"}

puppi_particles:     # per selected-jet constituent, aligned with existing part_* vectors
  part_isPU:         {type: bool,    def: "pu_fraction > 0.5 (policy frozen here)"}
  part_pu_fraction:  {type: float32, def: "pileup_truth_ENERGY / total_truth_energy over the candidate's GenParticle references (energy-based — frozen; safer for neutrals); -1 if no truth references resolve"}
  part_pileup_status: {type: int8,   def: "-1 truth unavailable | 0 pure hard-scatter | 1 pure pileup | 2 mixed (0<fraction<1)"}
  part_puppi_weight: {type: float32, def: "EFFECTIVE weight = puppi_pt / raw_pt of the matched raw candidate; 1.0 for pass-through charged CHS candidates; NOT the internal PUPPI weight (Delphes 3.5.0 does not serialize it — documented limitation, validated by the pilot closure check puppi_p4 ~= raw_p4 * weight)"}
  part_raw_index:    {type: int32,   def: "index into the rawpart_* vectors of the matched pre-PUPPI candidate; -1 if unmatched"}

raw_particles:       # complete pre-PUPPI EFlow collection, jet-associated (deltaR<jet R to the selected jet axis)
  rawpart_px:        {type: float32}
  rawpart_py:        {type: float32}
  rawpart_pz:        {type: float32}
  rawpart_energy:    {type: float32}
  rawpart_pid:       {type: int32}
  rawpart_charge:    {type: int8}
  rawpart_isPU:      {type: bool,    def: "same 0.5 policy on rawpart_pu_fraction"}
  rawpart_pu_fraction: {type: float32, def: "as part_pu_fraction, computed on the raw candidate"}
  rawpart_to_part_idx: {type: int32, def: "index into part_* of the PUPPI survivor; -1 = discarded by PUPPI (its effective weight is 0)"}

card_requirements:   # TreeWriter additions (output-only; physics modules untouched)
  - "add Branch EFlowMerger/eflow EFlowCandidate ParticleFlowCandidate      # pre-PUPPI reconstructed particles"
  - "add Branch PileUpMerger/stableParticles PileupStableParticle GenParticle  # preserves GenParticle::IsPU so truth refs of PILEUP particles do not dangle on serialization"

matching_policy:     # raw <-> PUPPI association (frozen)
  order:
    - "shared GenParticle truth references (primary)"
    - "PID + charge compatibility"
    - "deltaR < 0.005 AND |pt_puppi/pt_raw - 1| sanity as fallback"
  unmatched: "recorded explicitly (part_raw_index / rawpart_to_part_idx = -1); counts reported by the pilot"

notes:
  - "mu=50 card physics-section byte-identity to the release card is preserved; TreeWriter additions are output-only (plan amendment A1, registry/gates/plan_amendments.json)"
  - "loaders refuse files missing event_split (CI check per PLAN §7.3)"
  - "pilot acceptance (§7.7c + reviewer sequence): compile in production Delphes env; mu=0 npu==0; mu=50 NPU mean ~50; vector alignment; fractions in [0,1] or -1; unresolved-ref rate reported; matching coverage; weight closure puppi~=raw*w; dropped->w=0; UID+split identical across mu; legacy branches unchanged"
