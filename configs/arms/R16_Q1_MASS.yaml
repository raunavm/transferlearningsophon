      truth_label: 1 * ((jet_label == 14)) + 2 * (((jet_label >= 12) & (jet_label < 14))) + 3 * (((jet_label >= 10) & (jet_label < 12))) + 4 * (((jet_label >= 25) & (jet_label < 30)) | ((jet_label >= 41) & (jet_label < 46)) | ((jet_label >= 56) & (jet_label < 61)) | ((jet_label >= 70) & (jet_label < 75)) | ((jet_label >= 83) & (jet_label < 88)) | ((jet_label >= 127) & (jet_label < 131))) + 5 * (((jet_label >= 110) & (jet_label < 115))) + 6 * (((jet_label >= 30) & (jet_label < 32)) | ((jet_label >= 46) & (jet_label < 48)) | ((jet_label >= 61) & (jet_label < 63)) | ((jet_label >= 75) & (jet_label < 77)) | ((jet_label >= 88) & (jet_label < 90))) + 7 * (((jet_label >= 90) & (jet_label < 100))) + 8 * (((jet_label >= 100) & (jet_label < 110))) + 9 * (((jet_label >= 15) & (jet_label < 20)) | ((jet_label >= 32) & (jet_label < 36)) | ((jet_label >= 48) & (jet_label < 51)) | ((jet_label >= 63) & (jet_label < 65)) | (jet_label == 77) | ((jet_label >= 115) & (jet_label < 127))) + 10 * ((jet_label == 24) | (jet_label == 40) | (jet_label == 55) | (jet_label == 69) | (jet_label == 82)) + 11 * (((jet_label >= 20) & (jet_label < 22)) | ((jet_label >= 36) & (jet_label < 38)) | ((jet_label >= 51) & (jet_label < 53)) | ((jet_label >= 65) & (jet_label < 67)) | ((jet_label >= 78) & (jet_label < 80))) + 12 * (((jet_label >= 22) & (jet_label < 24)) | ((jet_label >= 38) & (jet_label < 40)) | ((jet_label >= 53) & (jet_label < 55)) | ((jet_label >= 67) & (jet_label < 69)) | ((jet_label >= 80) & (jet_label < 82))) + 13 * (((jet_label >= 131) & (jet_label < 143))) + 14 * (((jet_label >= 143) & (jet_label < 155))) + 15 * (((jet_label >= 155) & (jet_label < 161))) + 16 * (((jet_label >= 161) & (jet_label < 188)))

      ### Mass-auxiliary target (D2 as amended by DECISIONS_PENDING item 3):
      ### log(genjet_sdmass / jet_sdmass), the groomed log mass-ratio, zero
