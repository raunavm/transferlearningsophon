rules:                               # the ONLY rules used to build the tree
  R16_Q1: |
    partition by [topology, visible_mode]; flavour collapsed everywhere.
    A quark parton (Q) and a gluon parton (g) are the same object.
  R42_Q1: |
    R16 further split by three-tier flavour, priority B then C then LG:
      B  = has_b >= 1
      C  = has_b == 0 and has_c >= 1
      LG = has_b == 0 and has_c == 0
    Colourless groups (no flavour variation) are not split.
  R63_Q1: |
    R42 refined by heavy-flavour parton COUNTS (n_b, n_c), read from the
    `tokens` column. NOT from has_b/has_c, which are BOOLEANS: label_X_bb
    has has_b == 1, not 2. Deriving R63 from them would silently collapse
    multiplicity back into presence.
  R29_Q1: |
    R42 with the B and C tiers merged into HF; LG untouched.
  R3_VIS: |
    Prong count on VISIBLE objects, so a neutrino does not add a prong.
    Follows the JetClass-II authors, arXiv:2405.12972 sec. 2 -- '...can
    also be 3 prongs if an object leaks out of the jet cone or if one of
    the objects is a neutrino.'
    R16 group NAMES retain generated-object prong prefixes; the three
    _NU_ groups are exactly where the two conventions differ.
  R1_Q1: |
    native 0-160 -> RESONANT_ALL; 161-187 -> QCD_ALL.
  rung_numeral_convention: |
    R-RUNG NUMERALS COUNT RESONANT GROUPS ONLY; QCD_ALL is always one further
    group on top. So the head width is the numeral PLUS ONE:
      R63_Q1 -> 64    R42_Q1 -> 43    R29_Q1 -> 30    R16_Q1 -> 17
      R3_VIS ->  4    R1_Q1  ->  2
    L-rung numerals count TOTAL groups: L188 -> 188, L162 -> 162.
    configs/arms/*.yaml already set num_classes correctly (43, 17, ...), but a
    42-way head on R42_Q1 is a silent misindex rather than a crash, so the
    convention is stated here rather than left to be inferred from the name.
  group_id_order: |
    Primary keys, SEMANTIC and not derivable from native label indices:
    prong class ascending, then hadronic -> semileptonic -> leptonic
    within a prong class.
    TIE-BREAK, which is what actually fixes the ids wherever the primary
    keys are equal: FIRST NATIVE LABEL APPEARANCE within the parent group.
    This is load-bearing, not incidental -- ordering R63's (n_b, n_c)
    sub-cells by ascending counts instead reassigns the ids of 47 of 188
    labels while leaving the partition identical. Stated here because
    this artifact, not the generator, is the sign-off document.

contraction_order: [L188, L162, R63_Q1, R42_Q1, R29_Q1, R16_Q1, R3_VIS, R1_Q1]

# The tree is the frozen label HIERARCHY. Which rungs become pretraining
# arms is a separate compute-gated decision -- see docs/RUN_MATRIX.md.
# An 8-rung tree does NOT imply 8 pretraining runs.
rungs:
  L188: {resonant: identity, qcd: identity, n: 188, role: qcd-granularity-rung,
         uniquely_retained_axis: QCD_b_vs_c}
  L162: {parent: L188, op: merge_qcd_all, resonant: identity, n: 162,
         role: fine-anchor, note: 'pure loss change, ZERO sampling change'}
  R63_Q1: {parent: L162, n: 64,
         partition_by: [topology, visible_mode, n_b, n_c],
         uniquely_retained_axis: heavy_flavour_multiplicity,
         status: 'hierarchy-only pending the J9 multiplicity pre-test'}
  R42_Q1: {parent: R63_Q1, n: 43,
         partition_by: [topology, visible_mode, flavour_tier],
         uniquely_retained_axis: resonant_b_vs_c}
  R29_Q1: {parent: R42_Q1, n: 30,
         partition_by: [topology, visible_mode, hf_vs_lg]}
  R16_Q1: {parent: R29_Q1, n: 17,
         partition_by: [topology, visible_mode]}
  R3_VIS: {parent: R16_Q1, n: 4,
         partition_by: [n_visible_objects]}
  R1_Q1: {parent: R3_VIS, n: 2,
         partition_by: [resonant_vs_qcd], role: floor-anchor}

