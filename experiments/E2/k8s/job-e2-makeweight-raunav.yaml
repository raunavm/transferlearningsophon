apiVersion: batch/v1
kind: Job
metadata:
  # E2 make_weight (CPU) — the ONE shared reweight pass (PLAN §9.4 / train_e2.sh §4).
  # Runs weaver make_weight with the g188 config over train+val, then clones the
  # generated auto config (which embeds the flat-(pt,mSD) reweight hists) into
  # per-granularity auto configs via make_data_configs.py --inject-hists, so the
  # hists are bit-identical across all five arms. Persists them to
  # /data/results/e2/config_cache/ — every Stage-0/1 training job copies from
  # there and FAILS FAST if its arm's auto config is missing.
  name: e2-makeweight-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: makeweight
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          CACHE=/data/results/e2/config_cache
          if [ "$(ls "$CACHE"/JetClassII_g*.*.auto.yaml 2>/dev/null | wc -l)" -ge 5 ]; then
            echo "config cache already has all auto configs — skip"; exit 0
          fi
          pip install -q pyarrow || { echo "pyarrow install FAILED"; exit 1; }
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          # bridge the PVC layout (/jc2/jet_data/<fam>_<idx>.parquet) to the
          # Sophon-style ${DATADIR}/Pythia/... paths train_e2.sh builds
          mkdir -p /ds && ln -sfn /jc2/jet_data /ds/Pythia

          echo "=== weaver make_weight (g188, train+val, CPU) ==="
          DATADIR=/ds OUTDIR=/data/results/e2 ./experiments/E2/train_e2.sh make_weight

          echo "=== clone hists into per-granularity auto configs ==="
          python3 experiments/E2/data/make_data_configs.py \
            --inject-hists experiments/E2/data/JetClassII_g188.*.auto.yaml

          echo "=== verify every arm's md5-named auto config exists ==="
          python3 - <<'EOF'
          import hashlib, sys
          from pathlib import Path
          d = Path("experiments/E2/data")
          missing = []
          for g in ["g2", "g10sem", "g10rand", "g30", "g188"]:
              cfg = d / f"JetClassII_{g}.yaml"
              md5 = hashlib.md5(cfg.read_bytes()).hexdigest()
              expect = d / f"JetClassII_{g}.{md5}.auto.yaml"
              if not expect.exists():
                  missing.append(expect.name)
          if missing:
              print("MISSING auto configs:", missing); sys.exit(1)
          print("all 5 auto configs present with correct md5 names")
          EOF

          mkdir -p "$CACHE"
          cp experiments/E2/data/JetClassII_g*.*.auto.yaml "$CACHE/"
          ls -la "$CACHE"
          echo "===== E2 MAKE_WEIGHT DONE ====="
        resources:
          requests: { memory: "32Gi", cpu: "8", ephemeral-storage: "10Gi" }
          limits:   { memory: "32Gi", cpu: "8", ephemeral-storage: "10Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: jc2,  mountPath: /jc2, readOnly: true }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: [us-west]
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: transfer-learning-vol }
      - name: jc2
        persistentVolumeClaim: { claimName: tn-pvc-base-jetclass2 }
