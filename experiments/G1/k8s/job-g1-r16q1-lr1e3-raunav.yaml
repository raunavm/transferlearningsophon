apiVersion: batch/v1
kind: Job
metadata:
  # G1 LEARNING-RATE SWEEP POINT: lr=1e-3, 16 epochs (20% budget).
  # Generated by scripts/build_g1_jobs.py from the seed-1 MTX job.
  # Differs from it ONLY in: name/RUN_ID/output dir/tensorboard tag,
  # --start-lr, and --num-epochs. Everything else is byte-identical.
  #
  # ORIGINALLY -- R16_Q1 (K = 17), seed 1
  #
  # GENERATED by scripts/build_arm_jobs.py -- do not hand-edit. Regenerate.
  #
  # This job differs from its sibling arms at EXACTLY these edit sites, and no
  # others: this header, metadata.name, RUN_ID, --arm/--num-classes,
  # --data-config (x2), -o num_classes, and --tensorboard. All of them carry the
  # arm name or its K. Everything else -- resources, affinity, env, volumes,
  # backoffLimit, the file lists, the guards -- is byte-identical, which is
  # invariant I1 at the run level and is asserted by the generator.
  #
  # BUDGET: 10,240,000 samples/epoch x 80 epochs = 819,200,000 examples seen
  #         (~6.1 effective passes over 110,087,593 selected training jets).
  #
  # backoffLimit is 1 ON PURPOSE. Raising it only helps if the run can resume
  # from a checkpoint; without verified resume a retry restarts from scratch and
  # burns the budget again. E1 used 12, but E1 staged a much smaller corpus and
  # had a fail-fast GPU smoke test in front of it. Raise this only after
  # checkpoint-resume is demonstrated.
  #
  # Region is pinned because weaver STREAMS from the CephFS PVC at SDSC and is
  # I/O-bound, not GPU-bound: a cross-region pod does not run slowly, it runs at
  # near-zero GPU utilisation. GPU model is pinned separately, for I7b. Both
  # constraints are required and they are not the same constraint.
  name: g1-r16q1-lr1e3-raunav
  namespace: cms-ml
spec:
  # 0, not 1. There is no --load-epoch resume wired here, so a retry does
  # not continue -- it restarts at epoch 0 in the SAME ${OUT} and
  # overwrites net_best_epoch_state.pt with a worse model. That is
  # destroying a checkpoint (CLAUDE.md section 8), on top of burning a
  # second 8-day A100 budget on an identical failure. Relaunch by hand.
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        env:
        # I7b evidence. The node label and the torch-reported device name come
        # from different layers; the manifest records BOTH so a pair whose pod
        # moved after scheduling is detectable after the fact.
        # GPU_PRODUCT is a LITERAL matching the nodeAffinity value below, not a
        # fieldRef: the downward API cannot read node labels, so a fieldRef here
        # would silently record the node NAME under a field the analysis reads
        # as a GPU model. The manifest cross-checks this literal against
        # torch.cuda.get_device_name(0); a disagreement means the pin failed.
        - name: GPU_PRODUCT
          value: "NVIDIA-GeForce-RTX-3090"
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: REGION
          value: "us-west"
        # Pin all three arms to ONE ref. A branch name here means three arms
        # launched at different times can run different code.
        - name: REPO_REF
          value: "mtx-s1.1"
        args:
        - |
          set -euo pipefail

          # The image carries no repo. Every other job in this repo clones.
          #
          # --branch takes a TAG here, not the default branch. Cloning a branch
          # tip means three arms launched minutes or days apart each get
          # whatever the tip was AT THAT MOMENT, so the arms could run
          # different code -- precisely the channel I1 and I2 exist to close,
          # and nothing downstream would notice. A tag is an exact pin, and
          # --depth 1 still applies to it, so the clone stays small.
          git clone --depth 1 --branch "${REPO_REF}"             https://github.com/raunavm/transferlearningsophon.git             /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon

          # weaver reads JetClass-II parquet through pyarrow, which the cu121
          # image does not ship. Fail loudly rather than at first fetch.
          pip install --no-cache-dir -q pyarrow || exit 1

          RUN_ID=g1-r16q1-lr1e3
          OUT=/data/results/g1/${RUN_ID}
          mkdir -p ${OUT}

          # Provenance for the two things that can drift between arms launched
          # at different times. pyarrow is deliberately UNPINNED -- guessing a
          # version blind is a worse risk than recording the resolved one --
          # so a mismatch across arms must be detectable after the fact.
          git rev-parse HEAD | tee ${OUT}/repo_commit.txt
          python3 -c "import pyarrow; print(pyarrow.__version__)"             | tee ${OUT}/pyarrow_version.txt

          # ---- split guard -------------------------------------------------
          # All three splits live in ONE directory. A bare glob would train on
          # the held-out test files and bake them into the reweighting
          # histograms, which is unrecoverable: the checkpoints, not just the
          # numbers, would be contaminated.
          #
          # This counts files that ACTUALLY EXIST, not array lengths. The array
          # is a brace expansion, so its length is a compile-time constant that
          # can never disagree with the number asserted next to it -- the old
          # form of this guard verified nothing about the PVC at all. weaver
          # resolves each path with glob.glob (train.py:187, 329) and SILENTLY
          # DROPS anything missing, so a partially-populated or partially-mounted
          # PVC would shrink the training set with no error anywhere.
          TRAIN_FILES=(/jc2/jet_data/Res2P_{0000..0199}.parquet /jc2/jet_data/Res34P_{0000..0859}.parquet /jc2/jet_data/QCD_{0000..0279}.parquet)
          VAL_FILES=(/jc2/jet_data/Res2P_{0200..0249}.parquet /jc2/jet_data/Res34P_{0860..1074}.parquet /jc2/jet_data/QCD_{0280..0349}.parquet)
          TEST_FILES=(/jc2/jet_data/Res2P_{0250..0299}.parquet /jc2/jet_data/Res34P_{1075..1289}.parquet /jc2/jet_data/QCD_{0350..0419}.parquet)
          n_present () { local n=0; for f in "$@"; do [ -f "$f" ] && n=$((n+1)); done; echo $n; }
          N_TRAIN=$(n_present "${TRAIN_FILES[@]}")
          N_VAL=$(n_present "${VAL_FILES[@]}")
          N_TEST=$(n_present "${TEST_FILES[@]}")
          echo "present on PVC: train=${N_TRAIN} val=${N_VAL} test=${N_TEST}"
          [ "${N_TRAIN}" -eq 1340 ] || { echo "FATAL: only ${N_TRAIN} of 1340 train files present on the PVC"; exit 1; }
          [ "${N_VAL}"   -eq 335 ]   || { echo "FATAL: only ${N_VAL} of 335 val files present on the PVC"; exit 1; }
          [ "${N_TEST}"  -eq 335 ]  || { echo "FATAL: only ${N_TEST} of 335 test files present on the PVC"; exit 1; }

          # ---- reweighting sidecar -----------------------------------------
          # weaver rebuilds the flat-(pT, m_SD) histograms at startup unless a
          # sidecar named <config>.<md5-of-config>.auto.yaml sits next to the
          # config (utils/dataset.py:401-406). --no-remake-weights ALONE does
          # NOT suppress that rebuild: the gate is
          #     if remake_weights or self._data_config.reweight_hists is None
          # (dataset.py:420), and these configs ship reweight_hists empty. Both
          # halves are required.
          #
          # The sidecar must come from job-mtx-makeweight-raunav, which scans
          # train+val (1675 files) per the upstream Sophon recipe. A rebuild
          # here would scan --data-train only (1340 files) -- test-clean either
          # way, but NOT the same histograms, and not the ones
          # docs/GROUND_TRUTH.md describes.
          #
          # The md5 is taken from the config THIS pod cloned, so a config edited
          # after the make_weight pass cannot silently pick up a stale sidecar:
          # the name simply is not found and the run stops here, before the GPU.
          CFG=configs/arms/R16_Q1.yaml
          MD5=$(md5sum ${CFG} | cut -d' ' -f1)
          SIDECAR=configs/arms/R16_Q1.${MD5}.auto.yaml
          SRC=/data/results/mtx/makeweight/R16_Q1.${MD5}.auto.yaml
          [ -f "${SRC}" ] || { echo "FATAL: no reweighting sidecar at ${SRC}. Run job-mtx-makeweight-raunav first. If it HAS run, then configs/arms/R16_Q1.yaml changed afterwards (its md5 is in the filename) and make_weight must be re-run."; exit 1; }
          cp -v "${SRC}" "${SIDECAR}"

          # The reweighting actually used by this run, preserved WITH the run.
          # Without this the realised histograms are unrecoverable afterwards,
          # which is a docs/RECORD.md evidence gap independent of I2.
          cp -v "${SIDECAR}" ${OUT}/
          sha256sum "${SIDECAR}" | tee ${OUT}/reweight_sidecar.sha256

          # Manifest FIRST, so a run that dies still has one (docs/RECORD.md).
          python3 scripts/write_run_manifest.py \
            --run-id ${RUN_ID} \
            --arm R16_Q1 \
            --num-classes 17 \
            --seed 1 \
            --data-config configs/arms/R16_Q1.yaml \
            --samples-per-epoch 10240000 \
            --num-epochs 16 \
            --batch-size 512 \
            --out ${OUT}/run_manifest.json

          # seed_weaver derives four independent RNG streams and REFUSES to run
          # if it cannot hook weaver's model-construction boundary -- a
          # silently-partial seeding is worse than none, because the run looks
          # seeded and is not.
          PYTHONUNBUFFERED=1 python3 experiments/E1/seed_weaver.py \
            --seed 1 \
            --data-train Res2P:/jc2/jet_data/Res2P_{0000..0199}.parquet Res34P:/jc2/jet_data/Res34P_{0000..0859}.parquet QCD:/jc2/jet_data/QCD_{0000..0279}.parquet \
            --data-val /jc2/jet_data/Res2P_{0200..0249}.parquet /jc2/jet_data/Res34P_{0860..1074}.parquet /jc2/jet_data/QCD_{0280..0349}.parquet \
            --data-config configs/arms/R16_Q1.yaml \
            --no-remake-weights \
            --network-config experiments/MTX/ParT_sophon_arch_mtx.py \
            -o num_classes 17 -o fc_params '[(512,0.1)]' \
            --use-amp --batch-size 512 --start-lr 1e-3 \
            --num-workers 2 --fetch-by-files --fetch-step 5 \
            --samples-per-epoch 10240000 --samples-per-epoch-val 1280000 \
            --num-epochs 16 --optimizer ranger \
            --model-prefix ${OUT}/net \
            --log ${OUT}/train.log \
            --tensorboard g1-r16q1-lr1e3

          # NO in-pod test evaluation here. This is deliberate.
          #
          # weaver accumulates EVERY test score in RAM and then concatenates
          # (utils/nn/tools.py: per-batch append, then np.concatenate). Over the
          # 27,448,839 selected test jets that is K-dependent and large:
          #     K=162  17.8 GB of scores, ~35.6 GB peak at the concatenate
          #     K=43    4.7 GB                9.4 GB
          #     K=17    1.9 GB                3.7 GB
          # against this pod's 64Gi, on a process whose training-only band was
          # measured at 35-58 GB, with dshm counting against the same limit.
          # L162 would OOM at roughly day 8 -- AFTER the whole 80-epoch budget
          # was spent, and BEFORE any output guard could fire. backoffLimit
          # would then buy a second identical 8-day failure.
          #
          # It is also an I1 problem in its own right: failure probability would
          # be ~8x higher for L162 than for R16_Q1, so the arms would not face
          # equal risk, and the asymmetry runs along the studied variable.
          #
          # E1 reached the same conclusion the same way and evaluated from the
          # frozen checkpoint in a separate job. docs/GATES.md's requirement to
          # cache full ROC arrays is met by that eval job reading
          # net_best_epoch_state.pt -- not by doing it inside the training pod.
          cp -r ./runs ${OUT}/tb 2>/dev/null || true
        resources:
          # 20Gi ephemeral, not 200Gi: nothing is staged locally, the corpus is
          # streamed. A 200Gi request narrows an already narrow node pool for
          # storage that is never used.
          requests: { memory: "64Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "64Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      # The us-west A100 nodes (node-{1-1..2-4}.sdsc.optiputer.net) advertise
      # `nvidia.com/a100: 8` and `nvidia.com/gpu: 0` -- the generic name is NOT
      # served there. A request for nvidia.com/gpu on these nodes is not an
      # error; it is unschedulable forever, which looks exactly like a busy
      # queue. They also carry an `nvidia.com/gpu` taint. Its effect is
      # PreferNoSchedule (soft), so this toleration is not strictly required,
      # but it stops the scheduler deprioritising us against pods that do set
      # it -- which every other GPU job on these nodes does.
      #
      # node-1-2 and node-2-4 additionally carry nautilus.io/hardware=large-gpu
      # with effect NoSchedule -- a HARD block, unlike the soft one above.
      # Without tolerating it the usable pool is four nodes (1-1, 1-3, 2-2, 2-3)
      # and node-1-4 is down for upgrade. At first launch all four were
      # saturated: the scheduler reported exactly "3 Insufficient
      # nvidia.com/a100" + "1 Insufficient memory".
      #
      # That taint exists to keep SMALL jobs off big-GPU nodes. An 80GB-A100,
      # 8-cpu, 64Gi, week-long training run is the workload it exists to admit,
      # so tolerating it is using the pool as intended rather than evading a
      # restriction. Contrast nautilus.io/reservation:* taints, which mark nodes
      # belonging to other groups -- those are NEVER tolerated here.
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      - { key: "nautilus.io/hardware", operator: "Equal", value: "large-gpu", effect: "NoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: nvidia.com/gpu.product
                operator: In
                values: ["NVIDIA-GeForce-RTX-3090"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      # DataLoader workers pass tensors through shared memory; the container
      # default /dev/shm is 64 MB, which stalls or crashes multi-worker loading.
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "16Gi" }
