apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_render_job.py: figures with LaTeX and the compiled figure mock-ups at
  # commit 42e853d, into /data/results/render/42e853d-mockups/. CPU only.
  name: render-mockups-42e853d-raunav
  namespace: cms-ml
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        env:
        - name: COMMIT
          value: "42e853dad365cbeff1bcbd9920dfc72e883a0065"
        args:
        - |
          set -uo pipefail
          OUT=/data/results/render/${COMMIT:0:7}-mockups
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          mkdir -p ${OUT}
          git clone -q https://github.com/raunavm/transferlearningsophon.git /workspace/repo || exit 1
          cd /workspace/repo && git checkout -q ${COMMIT} || exit 1
          export DEBIAN_FRONTEND=noninteractive
          (apt-get update -qq && apt-get install -y -qq --no-install-recommends texlive-latex-base \
             texlive-latex-extra texlive-fonts-recommended cm-super dvipng) > ${OUT}/apt.txt 2>&1 \
             || { echo "FATAL: TeX Live did not install"; tail -5 ${OUT}/apt.txt; exit 1; }
          pip install --no-cache-dir -q matplotlib==3.10.7 mplhep==0.4.1 pyarrow || exit 1
          latex --version | head -1
          python3 experiments/FIGS/mockup_figures.py --outdir figures/mockups > ${OUT}/figures.txt 2>&1; echo "mock-ups rc=$?"
          tail -15 ${OUT}/figures.txt
          cp -f /data/results/xbx_dryrun/report_mtx-s2.28/xbx.pdf figures/mockups/F9_xbx_standin.pdf || echo "no X->bx stand-in at /data/results/xbx_dryrun/report_mtx-s2.28/xbx.pdf"
          mkdir -p /workspace/tectonic && python3 -c "import urllib.request,sys; urllib.request.urlretrieve(sys.argv[1], '/workspace/tectonic/t.tgz')" \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz" && tar -xzf /workspace/tectonic/t.tgz -C /workspace/tectonic \
            && (cd paper/mockups && /workspace/tectonic/tectonic -X compile mockups.tex > ${OUT}/tectonic.txt 2>&1; echo "tectonic rc=$?") \
            || echo "tectonic: could not fetch or run"
          grep -i -E 'undefined|multiply defined|error|overfull' ${OUT}/tectonic.txt | head -20
          mkdir -p ${OUT}/figures
          cp -f figures/mockups/*.pdf figures/mockups/*.png ${OUT}/figures/ 2>/dev/null
          cp -f paper/mockups/mockups.pdf ${OUT}/mockups.pdf 2>/dev/null
          pdffonts ${OUT}/mockups.pdf 2>/dev/null | grep -c "Type 3" | sed 's/^/Type 3 fonts in the PDF: /'
          ls -la ${OUT} ${OUT}/figures | head -40
          echo "RENDER COMPLETE"
        resources:
          requests: { memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
