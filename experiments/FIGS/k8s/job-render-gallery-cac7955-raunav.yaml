apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_gallery_job.py: the gallery's mock-ups at commit cac7955. CPU only.
  name: render-gallery-cac7955-raunav
  namespace: cms-ml
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -uo pipefail
          OUT=/data/results/render/cac7955-gallery
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          mkdir -p ${OUT}/figures
          for T in 1 2 3 4 5; do git clone -q https://github.com/raunavm/transferlearningsophon.git /workspace/repo && break; sleep 30; done
          cd /workspace/repo && git checkout -q cac7955f5c48e91e2e7d63480544821bdb6d7ff9 || exit 1
          pip install --no-cache-dir -q matplotlib==3.10.7 mplhep==0.4.1 pyarrow || exit 1
          python3 experiments/FIGS/figstyle/gallery_figures.py --outdir ${OUT}/figures 2>&1 | tee ${OUT}/figures.txt
          (cd ${OUT} && tar czf out.tgz figures figures.txt)
          ls -la ${OUT}/figures | head -60
          echo "RENDER COMPLETE"
        resources:
          requests: { memory: "12Gi", cpu: "2", ephemeral-storage: "5Gi" }
          limits:   { memory: "12Gi", cpu: "2", ephemeral-storage: "5Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
