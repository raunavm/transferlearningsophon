apiVersion: batch/v1
kind: Job
metadata:
  # Small idle pod that reads /data for the data pull and the chunked render downloads. CPU only.
  name: pull-host-raunav
  namespace: cms-ml
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 28800
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c", "sleep 28000"]
        volumeMounts:
        - { name: data, mountPath: /data }
        resources:
          requests: { memory: "4Gi", cpu: "1", ephemeral-storage: "5Gi" }
          limits:   { memory: "4Gi", cpu: "1", ephemeral-storage: "5Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
