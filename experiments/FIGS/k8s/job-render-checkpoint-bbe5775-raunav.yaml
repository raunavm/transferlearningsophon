apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_render_job.py: figures with LaTeX and the compiled rewrite checkpoint at
  # commit bbe5775, into /data/results/render/bbe5775-checkpoint/. CPU only.
  name: render-checkpoint-bbe5775-raunav
  namespace: cms-ml
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        env:
        - name: COMMIT
          value: "bbe57753df56173c8a9b3aa4b3899cf34a3e2b7f"
        args:
        - |
          set -uo pipefail
          OUT=/data/results/render/${COMMIT:0:7}-checkpoint
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 90 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          mkdir -p ${OUT}
          git clone -q https://github.com/raunavm/transferlearningsophon.git /workspace/repo || exit 1
          cd /workspace/repo && git checkout -q ${COMMIT} || exit 1
          export DEBIAN_FRONTEND=noninteractive
          (apt-get update -qq && apt-get install -y -qq --no-install-recommends texlive-latex-base \
             texlive-latex-extra texlive-fonts-recommended cm-super dvipng) > ${OUT}/apt.txt 2>&1 \
             || { echo "FATAL: TeX Live did not install"; tail -5 ${OUT}/apt.txt; exit 1; }
          pip install --no-cache-dir -q matplotlib==3.10.7 mplhep==0.4.1 pyarrow || exit 1
          latex --version | head -1
          pip install --no-cache-dir -q pymupdf==1.26.7 || exit 1
          python3 experiments/FIGS/mlst_v2_tables.py > ${OUT}/tables.txt 2>&1; echo "tables rc=$?"
          tail -n 60 ${OUT}/tables.txt
          grep -q "^V2 TABLES COMPLETE" ${OUT}/tables.txt || exit 3
          # the main figures as the figure code draws them now; one it does not draw prints a labelled box in the draft
          python3 experiments/FIGS/figstyle/v2_main.py > ${OUT}/figures.txt 2>&1; echo "figures rc=$?"
          tail -n 8 ${OUT}/figures.txt
          # 2026-11-22: the checkout carries a committed PDF; removed first, so a failed compile leaves none to copy
          rm -f paper/journal/v2/checkpoint.pdf
          mkdir -p /workspace/tectonic && python3 -c "import urllib.request,sys; urllib.request.urlretrieve(sys.argv[1], '/workspace/tectonic/t.tgz')" \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz" && tar -xzf /workspace/tectonic/t.tgz -C /workspace/tectonic \
            && (cd paper/journal/v2 && /workspace/tectonic/tectonic -X compile checkpoint.tex > ${OUT}/tectonic.txt 2>&1; echo "tectonic rc=$?") \
            || echo "tectonic: could not fetch or run"
          grep -i -E 'undefined|multiply defined|error|overfull' ${OUT}/tectonic.txt | head -20
          mkdir -p ${OUT}/paper/journal/v2
          cp -rf paper/journal/v2/tables ${OUT}/paper/journal/v2/ 2>/dev/null
          cp -f paper/journal/v2/checkpoint.pdf ${OUT}/checkpoint.pdf 2>/dev/null
          pdffonts ${OUT}/checkpoint.pdf 2>/dev/null | grep -c "Type 3" | sed 's/^/Type 3 fonts in the PDF: /'
          python3 scripts/overfull_floats.py ${OUT}/tectonic.txt paper/journal/v2 > ${OUT}/overfull.txt 2>&1; rc=$?
          cat ${OUT}/overfull.txt
          [ "${rc}" -eq 0 ] || { echo "FATAL: the checkpoint build stops on an overfull float (overfull.txt)"; exit 4; }
          ls -la ${OUT} ${OUT}/figures | head -40
          echo "RENDER COMPLETE"
        resources:
          requests: { memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
