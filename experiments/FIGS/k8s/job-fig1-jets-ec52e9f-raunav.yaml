apiVersion: batch/v1
kind: Job
metadata:
  # Candidate jets for Fig. 1's event display (experiments/FIGS/pick_fig1_jets.py) at ec52e9f: reads three test files, writes one small JSON.
  name: fig1-jets-ec52e9f-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -uo pipefail
          OUT=/data/results/fig1_jets/ec52e9f
          [ ! -e ${OUT}/candidates.json ] || { echo "FATAL: ${OUT}/candidates.json exists"; exit 42; }
          git clone -q https://github.com/raunavm/transferlearningsophon.git /workspace/repo || exit 1
          cd /workspace/repo && git checkout -q ec52e9f || exit 1
          pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          python3 experiments/FIGS/pick_fig1_jets.py --out ${OUT}/candidates.json || exit 1
          echo "FIG1 JETS COMPLETE"
        resources:
          requests: { memory: "12Gi", cpu: "2", ephemeral-storage: "10Gi" }
          limits:   { memory: "12Gi", cpu: "2", ephemeral-storage: "10Gi" }
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["cph-dgx-node6.humboldt.edu"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
