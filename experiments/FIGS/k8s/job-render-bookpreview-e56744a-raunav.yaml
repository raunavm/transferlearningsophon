apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_render_job.py: figures with LaTeX and the compiled results book (preview of partial results) at
  # commit e56744a, into /data/results/render/e56744a-bookpreview/. CPU only.
  name: render-bookpreview-e56744a-raunav
  namespace: cms-ml
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        env:
        - name: COMMIT
          value: "e56744ae1666354dcdb902fad56762f7284e7c14"
        args:
        - |
          set -uo pipefail
          OUT=/data/results/render/${COMMIT:0:7}-bookpreview
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 90 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          mkdir -p ${OUT}
          git clone -q https://github.com/raunavm/transferlearningsophon.git /workspace/repo || exit 1
          cd /workspace/repo && git checkout -q ${COMMIT} || exit 1
          export DEBIAN_FRONTEND=noninteractive
          (apt-get update -qq && apt-get install -y -qq --no-install-recommends texlive-latex-base \
             texlive-latex-extra texlive-fonts-recommended cm-super dvipng) > ${OUT}/apt.txt 2>&1 \
             || { echo "FATAL: TeX Live did not install"; tail -5 ${OUT}/apt.txt; exit 1; }
          pip install --no-cache-dir -q matplotlib==3.10.7 mplhep==0.4.1 pyarrow || exit 1
          latex --version | head -1
          export MLST_FT_PREVIEW=1
          pip install --no-cache-dir -q pymupdf==1.26.7 || exit 1
          python3 experiments/FIGS/make_tables.py > ${OUT}/tables.txt 2>&1; echo "tables rc=$?"
          python3 experiments/FIGS/figstyle/gallery_figures.py --outdir /workspace/gal > ${OUT}/figures.txt 2>&1; echo "gallery rc=$?"
          python3 experiments/FIGS/make_results_book.py /workspace/gal --tier paper > ${OUT}/book.txt 2>&1; echo "book rc=$?"
          tail -n 15 ${OUT}/tables.txt ${OUT}/figures.txt ${OUT}/book.txt
          mkdir -p /workspace/tectonic && python3 -c "import urllib.request,sys; urllib.request.urlretrieve(sys.argv[1], '/workspace/tectonic/t.tgz')" \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz" && tar -xzf /workspace/tectonic/t.tgz -C /workspace/tectonic \
            && (cd paper/journal && /workspace/tectonic/tectonic -X compile results_book.tex > ${OUT}/tectonic.txt 2>&1; echo "tectonic rc=$?") \
            || echo "tectonic: could not fetch or run"
          grep -i -E 'undefined|multiply defined|error|overfull' ${OUT}/tectonic.txt | head -20
          mkdir -p ${OUT}/figures ${OUT}/png ${OUT}/paper/journal
          cp -f /workspace/gal/*.pdf /workspace/gal/pages.json ${OUT}/figures/ 2>/dev/null
          python3 -c "import fitz,glob,os,sys; [fitz.open(p)[0].get_pixmap(dpi=110).save(os.path.join(sys.argv[1], os.path.basename(p)[:-4] + '.png')) for p in glob.glob('/workspace/gal/*.pdf')]" ${OUT}/png
          cp -f paper/journal/results_book.tex paper/journal/results_generated.tex ${OUT}/paper/journal/ 2>/dev/null
          cp -rf paper/journal/tables ${OUT}/paper/journal/ 2>/dev/null
          cp -f paper/journal/results_book.pdf ${OUT}/results_book.pdf 2>/dev/null
          pdffonts ${OUT}/results_book.pdf 2>/dev/null | grep -c "Type 3" | sed 's/^/Type 3 fonts in the PDF: /'
          ls -la ${OUT} ${OUT}/figures | head -40
          echo "RENDER COMPLETE"
        resources:
          requests: { memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
