apiVersion: batch/v1
kind: Job
metadata:
  # REAL-DATA CHECKS: READ BACK /data/results/aoj/checks_v1. GENERATED by scripts/build_aoj_jobs.py. Prints the
  # checks' JSON files as a base64 tar between markers on the log; writes nothing.
  name: aoj-read-checks-v1-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          [ -f "/data/results/aoj/checks_v1/prong_test.json" ] || { echo "FATAL: the checks have not finished"; exit 1; }
          cd "/data/results/aoj/checks_v1"
          echo "BEGIN-TAR"
          tar czf - *.json | base64 -w 0
          echo
          echo "END-TAR"
        volumeMounts:
        - { name: data, mountPath: /data, readOnly: true }
        resources:
          requests: { memory: "1Gi", cpu: "1" }
          limits:   { memory: "1Gi", cpu: "1" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
          readOnly: true
