apiVersion: batch/v1
kind: Job
metadata:
  # FULL REAL-DATA RUN, SHARD 8 OF 10. GENERATED by scripts/build_aoj_jobs.py --
  # edit the builder, not this file. Scores every pretrained model, zero-shot, on
  # RunG_batch32.h5..RunG_batch35.h5 and RunH_batch32.h5..RunH_batch35.h5 (CMS 2016 JetHT Open Data, AspenOpenJets, arXiv:2412.10504).
  # Top channel only; the W channel is withdrawn (PRESPEC amendment 2026-09-19).
  name: aoj-full-s8-raunav
  namespace: cms-ml
spec:
  # 2, not 1: the shard resumes model by model, so a retry after a lost node
  # repeats only the ~30 min of download and staging.
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: aoj
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          OUT=/data/results/aoj/full_v1/shard8
          RAW=/scratch/raw
          STAGED=/scratch/staged
          mkdir -p "${OUT}" "${RAW}" "${STAGED}"
          MODELS="sophon-public l188-s1 l188-s2 l188-s3 l188-s4 l188-s5 l162-s1b l162-s2 l162-s3 l162-s4 l162-s5 r42q1-s1 r42q1-s2 r42q1-s3 r42q1-s4 r42q1-s5 r16q1-s1 r16q1-s2 r16q1-s3 r16q1-s4 r16q1-s5 l162mass-s1 l162mass-s2 l162mass-s3 l162mass-s4 l162mass-s5 r16q1mass-s1 r16q1mass-s2 r16q1mass-s3 r16q1mass-s4 r16q1mass-s5"

          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          FREE_G=$(df -BG --output=avail /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}%  free: ${FREE_G}G"
          [ "${USED}" -lt 95 ] || { echo "FATAL: /data is ${USED}% full"; exit 1; }
          [ "${FREE_G}" -ge 5 ] || { echo "FATAL: ${FREE_G}G free on /data, need 5G"; exit 1; }

          todo=""
          for m in ${MODELS}; do [ -f "${OUT}/scores_${m}.npz" ] || todo="${todo} ${m}"; done
          if [ -z "${todo}" ] && [ -f "${OUT}/closure.json" ]; then
            echo "shard 8 complete: every model scored"; touch "${OUT}/DONE"; exit 0
          fi
          echo "to score:${todo}"

          git clone --depth 1 --branch "mtx-s1.55" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow h5py || exit 1

          # ---- cheap preconditions BEFORE a ~20 GB download ---------------------
          for c in /data/results/mtx/mtx-l188-s1/net_epoch-79_state.pt /data/results/mtx/mtx-l188-s2/net_epoch-79_state.pt /data/results/mtx/mtx-l188-s3/net_epoch-79_state.pt /data/results/mtx/mtx-l188-s4/net_epoch-79_state.pt /data/results/mtx/mtx-l188-s5/net_epoch-79_state.pt /data/results/mtx/mtx-l162-s1b/net_epoch-79_state.pt /data/results/mtx/mtx-l162-s2/net_epoch-79_state.pt /data/results/mtx/mtx-l162-s3/net_epoch-79_state.pt /data/results/mtx/mtx-l162-s4/net_epoch-79_state.pt /data/results/mtx/mtx-l162-s5/net_epoch-79_state.pt /data/results/mtx/mtx-r42q1-s1/net_epoch-79_state.pt /data/results/mtx/mtx-r42q1-s2/net_epoch-79_state.pt /data/results/mtx/mtx-r42q1-s3/net_epoch-79_state.pt /data/results/mtx/mtx-r42q1-s4/net_epoch-79_state.pt /data/results/mtx/mtx-r42q1-s5/net_epoch-79_state.pt /data/results/mtx/mtx-r16q1-s1/net_epoch-79_state.pt /data/results/mtx/mtx-r16q1-s2/net_epoch-79_state.pt /data/results/mtx/mtx-r16q1-s3/net_epoch-79_state.pt /data/results/mtx/mtx-r16q1-s4/net_epoch-79_state.pt /data/results/mtx/mtx-r16q1-s5/net_epoch-79_state.pt /data/results/mtx/mtx-l162mass-s1/net_epoch-79_state.pt /data/results/mtx/mtx-l162mass-s2/net_epoch-79_state.pt /data/results/mtx/mtx-l162mass-s3/net_epoch-79_state.pt /data/results/mtx/mtx-l162mass-s4/net_epoch-79_state.pt /data/results/mtx/mtx-l162mass-s5/net_epoch-79_state.pt /data/results/mtx/mtx-r16q1mass-s1/net_epoch-79_state.pt /data/results/mtx/mtx-r16q1mass-s2/net_epoch-79_state.pt /data/results/mtx/mtx-r16q1mass-s3/net_epoch-79_state.pt /data/results/mtx/mtx-r16q1mass-s4/net_epoch-79_state.pt /data/results/mtx/mtx-r16q1mass-s5/net_epoch-79_state.pt; do [ -f "${c}" ] || { echo "FATAL: no ${c}"; exit 1; }; done
          REF="/jc2/jet_data/QCD_0350.parquet /jc2/jet_data/QCD_0351.parquet /jc2/jet_data/QCD_0352.parquet /jc2/jet_data/QCD_0353.parquet /jc2/jet_data/QCD_0354.parquet /jc2/jet_data/QCD_0355.parquet"
          for f in ${REF}; do [ -f "${f}" ] || { echo "FATAL: no ${f}"; exit 1; }; done
          curl -fsSL -o /workspace/sophon_public.pt https://huggingface.co/jet-universe/sophon/resolve/main/models/JetClassII_Sophon/model.pt
          GOT=$(sha256sum /workspace/sophon_public.pt | cut -d' ' -f1)
          [ "${GOT}" = "cc7c33b522e796b5bbf0aa9bb5b01361c964f4ef3acebdd9682d7519c095b824" ] || { echo "FATAL: public checkpoint sha256 ${GOT}"; exit 1; }
          CFG=configs/finetune/AspenOpenJets.yaml
          python3 scripts/build_aoj_config.py --check-only
          GPU=$(nvidia-smi --query-gpu=name --format=csv,noheader | head -1); echo "GPU: ${GPU}"

          # ---- download + stage: two files in flight, raw deleted once staged ----
          BASE=https://www.fdr.uni-hamburg.de/record/16505/files
          fetch_and_stage () {  # file md5
            curl -fsSL --retry 5 --retry-delay 20 -o "${RAW}/$1" "${BASE}/$1?download=1"
            echo "$2  ${RAW}/$1" | md5sum -c - || { echo "FATAL: md5 mismatch for $1"; return 1; }
            PYTHONUNBUFFERED=1 python3 scripts/stage_aoj.py --in "${RAW}/$1" --out "${STAGED}"
            rm -f "${RAW}/$1"
          }
          pair () {
            fetch_and_stage "$1" "$2" & local a=$!
            fetch_and_stage "$3" "$4" & local b=$!
            wait ${a}; wait ${b}
          }
          pair RunG_batch32.h5 cff8da1b4f62f83fdc7f4d23fd2478d9 RunH_batch32.h5 1f81308608b0ca5d5651ccf89f445a0f
          pair RunG_batch33.h5 b8df08c907e0d3ff880a29efb0d4b250 RunH_batch33.h5 fcf3e84e3e20f7852bca0eeb606d1dfe
          pair RunG_batch34.h5 5f1f739d0be0aaa7ea667aa72257fefb RunH_batch34.h5 db6ddc517b92f8f95c660394ebc22596
          pair RunG_batch35.h5 7a73ecf750f1c98829fb675cde4b49f9 RunH_batch35.h5 80c65779443b2301e7af6f1a9ef9c2d3
          # never overwrite what an earlier attempt of this shard persisted
          mkdir -p "${OUT}/staging" && cp -n "${STAGED}"/*.stats.json "${OUT}/staging/"
          df -h /scratch | tail -1

          # THE ORDER OF THIS LIST IS LOAD-BEARING: extract_features.py reads it in
          # order and discriminants.py re-reads the same files to check row alignment.
          FILES="${STAGED}/RunG_batch32.parquet ${STAGED}/RunH_batch32.parquet ${STAGED}/RunG_batch33.parquet ${STAGED}/RunH_batch33.parquet ${STAGED}/RunG_batch34.parquet ${STAGED}/RunH_batch34.parquet ${STAGED}/RunG_batch35.parquet ${STAGED}/RunH_batch35.parquet"

          [ -f "${OUT}/closure.json" ] || PYTHONUNBUFFERED=1 python3 experiments/AOJ/closure.py \
            --aoj ${FILES} --reference ${REF} --max-jets 50000 --out "${OUT}"

          # Every step is chained with &&, so score returns the status of the step
          # that failed even where set -e is suspended (a function run under ||).
          score () {  # name checkpoint K num_reg arm rung
            [ -f "${OUT}/scores_$1.npz" ] && { echo "skip $1 (scored)"; return 0; }
            PYTHONUNBUFFERED=1 python3 experiments/EVAL/extract_features.py \
              --checkpoint "$2" --num-classes "$3" --num-reg "$4" --arm "$5" \
              --data-config ${CFG} --observers jet_pt jet_eta jet_sdmass aoj_jet_pt aoj_jet_eta aoj_pn_WvsQCD aoj_pn_TvsQCD aoj_pn_HbbvsQCD --save-logits \
              --data-test ${FILES} --out "/scratch/extract/$1" \
              --batch-size 512 --num-workers 1 --fetch-step 1 \
            && python3 experiments/AOJ/discriminants.py --name "$1" --rung "$6" --structures three_prong \
              --extract-dir "/scratch/extract/$1" --staged ${FILES} --out "${OUT}" \
            && echo "$1 ${GPU}" >> "${OUT}/gpu_per_model.txt" \
            && rm -rf "/scratch/extract/$1"
          }
          # One log per model, so 3 models at once do not interleave; on
          # failure its tail is printed and the shard stops (set -e on the wait).
          mkdir -p /scratch/logs
          scored () {
            score "$@" > "/scratch/logs/$1.log" 2>&1 \
              || { echo "FATAL: $1 failed"; tail -40 "/scratch/logs/$1.log"; return 1; }
            echo "$1: $(grep -E 'jets/s|^skip' /scratch/logs/$1.log | tail -1)"
          }
          # The FIRST model runs alone: its discriminants.py call writes jets.npz,
          # which every later model is checked against, and two writers would race.
          scored sophon-public "/workspace/sophon_public.pt" 188 0 SOPHON_PUBLIC L188
          scored l188-s1 "/data/results/mtx/mtx-l188-s1/net_epoch-79_state.pt" 188 0 L188 L188 & p0=$!
          scored l188-s2 "/data/results/mtx/mtx-l188-s2/net_epoch-79_state.pt" 188 0 L188 L188 & p1=$!
          scored l188-s3 "/data/results/mtx/mtx-l188-s3/net_epoch-79_state.pt" 188 0 L188 L188 & p2=$!
          wait ${p0}; wait ${p1}; wait ${p2}
          scored l188-s4 "/data/results/mtx/mtx-l188-s4/net_epoch-79_state.pt" 188 0 L188 L188 & p0=$!
          scored l188-s5 "/data/results/mtx/mtx-l188-s5/net_epoch-79_state.pt" 188 0 L188 L188 & p1=$!
          scored l162-s1b "/data/results/mtx/mtx-l162-s1b/net_epoch-79_state.pt" 162 0 L162 L162 & p2=$!
          wait ${p0}; wait ${p1}; wait ${p2}
          scored l162-s2 "/data/results/mtx/mtx-l162-s2/net_epoch-79_state.pt" 162 0 L162 L162 & p0=$!
          scored l162-s3 "/data/results/mtx/mtx-l162-s3/net_epoch-79_state.pt" 162 0 L162 L162 & p1=$!
          scored l162-s4 "/data/results/mtx/mtx-l162-s4/net_epoch-79_state.pt" 162 0 L162 L162 & p2=$!
          wait ${p0}; wait ${p1}; wait ${p2}
          scored l162-s5 "/data/results/mtx/mtx-l162-s5/net_epoch-79_state.pt" 162 0 L162 L162 & p0=$!
          scored r42q1-s1 "/data/results/mtx/mtx-r42q1-s1/net_epoch-79_state.pt" 43 0 R42_Q1 R42_Q1 & p1=$!
          scored r42q1-s2 "/data/results/mtx/mtx-r42q1-s2/net_epoch-79_state.pt" 43 0 R42_Q1 R42_Q1 & p2=$!
          wait ${p0}; wait ${p1}; wait ${p2}
          scored r42q1-s3 "/data/results/mtx/mtx-r42q1-s3/net_epoch-79_state.pt" 43 0 R42_Q1 R42_Q1 & p0=$!
          scored r42q1-s4 "/data/results/mtx/mtx-r42q1-s4/net_epoch-79_state.pt" 43 0 R42_Q1 R42_Q1 & p1=$!
          scored r42q1-s5 "/data/results/mtx/mtx-r42q1-s5/net_epoch-79_state.pt" 43 0 R42_Q1 R42_Q1 & p2=$!
          wait ${p0}; wait ${p1}; wait ${p2}
          scored r16q1-s1 "/data/results/mtx/mtx-r16q1-s1/net_epoch-79_state.pt" 17 0 R16_Q1 R16_Q1 & p0=$!
          scored r16q1-s2 "/data/results/mtx/mtx-r16q1-s2/net_epoch-79_state.pt" 17 0 R16_Q1 R16_Q1 & p1=$!
          scored r16q1-s3 "/data/results/mtx/mtx-r16q1-s3/net_epoch-79_state.pt" 17 0 R16_Q1 R16_Q1 & p2=$!
          wait ${p0}; wait ${p1}; wait ${p2}
          scored r16q1-s4 "/data/results/mtx/mtx-r16q1-s4/net_epoch-79_state.pt" 17 0 R16_Q1 R16_Q1 & p0=$!
          scored r16q1-s5 "/data/results/mtx/mtx-r16q1-s5/net_epoch-79_state.pt" 17 0 R16_Q1 R16_Q1 & p1=$!
          scored l162mass-s1 "/data/results/mtx/mtx-l162mass-s1/net_epoch-79_state.pt" 162 1 L162_MASS L162 & p2=$!
          wait ${p0}; wait ${p1}; wait ${p2}
          scored l162mass-s2 "/data/results/mtx/mtx-l162mass-s2/net_epoch-79_state.pt" 162 1 L162_MASS L162 & p0=$!
          scored l162mass-s3 "/data/results/mtx/mtx-l162mass-s3/net_epoch-79_state.pt" 162 1 L162_MASS L162 & p1=$!
          scored l162mass-s4 "/data/results/mtx/mtx-l162mass-s4/net_epoch-79_state.pt" 162 1 L162_MASS L162 & p2=$!
          wait ${p0}; wait ${p1}; wait ${p2}
          scored l162mass-s5 "/data/results/mtx/mtx-l162mass-s5/net_epoch-79_state.pt" 162 1 L162_MASS L162 & p0=$!
          scored r16q1mass-s1 "/data/results/mtx/mtx-r16q1mass-s1/net_epoch-79_state.pt" 17 1 R16_Q1_MASS R16_Q1 & p1=$!
          scored r16q1mass-s2 "/data/results/mtx/mtx-r16q1mass-s2/net_epoch-79_state.pt" 17 1 R16_Q1_MASS R16_Q1 & p2=$!
          wait ${p0}; wait ${p1}; wait ${p2}
          scored r16q1mass-s3 "/data/results/mtx/mtx-r16q1mass-s3/net_epoch-79_state.pt" 17 1 R16_Q1_MASS R16_Q1 & p0=$!
          scored r16q1mass-s4 "/data/results/mtx/mtx-r16q1mass-s4/net_epoch-79_state.pt" 17 1 R16_Q1_MASS R16_Q1 & p1=$!
          scored r16q1mass-s5 "/data/results/mtx/mtx-r16q1mass-s5/net_epoch-79_state.pt" 17 1 R16_Q1_MASS R16_Q1 & p2=$!
          wait ${p0}; wait ${p1}; wait ${p2}
          touch "${OUT}/DONE"
          ls -la "${OUT}"
        volumeMounts:
        - { name: jc2,     mountPath: /jc2, readOnly: true }
        - { name: data,    mountPath: /data }
        - { name: scratch, mountPath: /scratch }
        - { name: dshm,    mountPath: /dev/shm }
        resources:
          # 8 CPU: 3 loaders at 100 % of a core plus their main processes.
          # 48Gi: one model measured 6.6 GB loader + 1.5 GB main resident, times
          # 3. Scratch: two raw files in flight (<= 10 GB), eight staged files,
          # and 3 models' logits and features (~1.5 GB each), deleted per model.
          requests: { memory: "48Gi", cpu: "8", nvidia.com/gpu: "1", ephemeral-storage: "48Gi" }
          limits:   { memory: "48Gi", cpu: "8", nvidia.com/gpu: "1", ephemeral-storage: "48Gi" }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              # never the 3090 pool: the benchmark wave is Pending for it. NotIn
              # alone also matches a node whose GPU discovery failed and left no
              # product label (ry-gpu-10, 2026-09-23), so the label must exist.
              - key: nvidia.com/gpu.product
                operator: Exists
              - key: nvidia.com/gpu.product
                operator: NotIn
                values: ["NVIDIA-GeForce-RTX-3090"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-01.sdsc.optiputer.net", "ry-gpu-10.sdsc.optiputer.net", "k8s-haosu-15.sdsc.optiputer.net"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: scratch
        emptyDir: { sizeLimit: "44Gi" }
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
