apiVersion: batch/v1
kind: Job
metadata:
  # INJECTION TOYS: READ BACK /data/results/aoj/injection_v1. GENERATED by scripts/build_aoj_jobs.py. Prints the
  # toys' JSON lines as a base64 tar between markers on the log; writes nothing.
  name: aoj-read-injection-v1-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          mkdir -p /tmp/snap
          cp "/data/results/aoj/injection_v1"/toys_*.jsonl /tmp/snap/
          cd /tmp/snap
          echo "BEGIN-TAR"
          tar czf - toys_*.jsonl | base64 -w 0
          echo
          echo "END-TAR"
        volumeMounts:
        - { name: data, mountPath: /data, readOnly: true }
        resources:
          requests: { memory: "1Gi", cpu: "1" }
          limits:   { memory: "1Gi", cpu: "1" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
          readOnly: true
