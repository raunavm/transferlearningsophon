apiVersion: batch/v1
kind: Job
metadata:
  # INJECTION TEST: TOYS, STUDY pseudo. GENERATED by scripts/build_aoj_jobs.py. Runs
  # experiments/AOJ/injection_test.py toys from the committed bins and the exported injection bins into
  # /data/results/aoj/injection_v1/toys_pseudo_<k>.jsonl (resumable), then prints them on the log as a base64 tar.
  name: aoj-injection-toys-pseudo-v1-raunav
  namespace: cms-ml
spec:
  backoffLimit: 20
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          OUT=/data/results/aoj/injection_v1
          mkdir -p "${OUT}/attempts/toys_pseudo"
          echo "$(date -u +%FT%TZ) $(hostname)" >> "${OUT}/attempts/toys_pseudo/ATTEMPTS"
          NF=$(grep -c . "${OUT}/attempts/toys_pseudo/FAILED_ATTEMPTS" 2>/dev/null || true)
          NA=$(grep -c . "${OUT}/attempts/toys_pseudo/ATTEMPTS" 2>/dev/null || true)
          if [ "${NF:-0}" -ge 2 ] || [ "${NA:-0}" -gt 8 ]; then
            echo "FATAL: ${NF} failed attempts, ${NA} in all: fix the cause, then remove ${OUT}/attempts/toys_pseudo/FAILED_ATTEMPTS"; exit 42; fi
          trap 'rc=$?; if [ ${rc} -ne 0 ] && [ ${rc} -ne 42 ]; then echo "rc=${rc} $(date -u +%FT%TZ) $(hostname)" >> "${OUT}/attempts/toys_pseudo/FAILED_ATTEMPTS"; fi' EXIT
          [ -f "${OUT}/injection_bins.npz" ] || { echo "FATAL: no injection bins"; exit 42; }
          git clone --depth 1 --branch "mtx-s1.81" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          # injection_test.py reads the pseudo window from the checks' code, which imports
          # the staging code, whose imports need pyarrow (absent from the image)
          pip install --no-cache-dir -q pyarrow || exit 1
          python3 -c "import pyarrow" || { echo "FATAL: pyarrow does not import"; exit 1; }
          export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONUNBUFFERED=1
          python3 experiments/AOJ/injection_test.py toys --regions pseudo --modes bootstrap data --toys 20 --sizes 250 500 1000 \
            --names reference sophon-public l188-s1 l188-s2 l188-s3 l188-s4 l188-s5 l162-s1b l162-s2 l162-s3 l162-s4 l162-s5 r42q1-s1 r42q1-s2 r42q1-s3 r42q1-s4 r42q1-s5 r16q1-s1 r16q1-s2 r16q1-s3 r16q1-s4 r16q1-s5 l162mass-s1 l162mass-s2 l162mass-s3 l162mass-s4 l162mass-s5 r16q1mass-s1 r16q1mass-s2 r16q1mass-s3 r16q1mass-s4 r16q1mass-s5 \
            --extra "${OUT}/injection_bins.npz" \
            --workers 31 --out "${OUT}/toys_pseudo_0.jsonl"
          cd "${OUT}"
          echo "BEGIN-TAR"
          tar czf - toys_pseudo_*.jsonl | base64 -w 0
          echo
          echo "END-TAR"
        volumeMounts:
        - { name: data, mountPath: /data }
        resources:
          requests: { memory: "24Gi", cpu: "32" }
          limits:   { memory: "24Gi", cpu: "32" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
