apiVersion: batch/v1
kind: Job
metadata:
  # FULL REAL-DATA RUN, THE BINNED COUNTS OF THE v2 FITS. GENERATED by
  # scripts/build_aoj_jobs.py. Re-merges the shards exactly as the fit did and writes
  # the (m_SD, pT) pass/fail bins of every top fit, checked against fit_v2's
  # histograms. Fits nothing; changes no stored result.
  name: aoj-full-fitbins-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: fit
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          OUT=/data/results/aoj/full_v1/fit_v2_bins
          [ -f /data/results/aoj/full_v1/fit_v2/results.json ] || { echo "FATAL: no v2 fit"; exit 1; }
          [ ! -e "${OUT}/bins.npz" ] || { echo "FATAL: ${OUT}/bins.npz exists; use a new output directory"; exit 1; }
          SHARDS=""
          for i in $(seq 0 9); do
            [ -f "/data/results/aoj/full_v1/shard${i}/DONE" ] || { echo "FATAL: shard ${i} has not finished"; exit 1; }
            SHARDS="${SHARDS} /data/results/aoj/full_v1/shard${i}"
          done
          git clone --depth 1 --branch "mtx-s1.62" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          python3 experiments/AOJ/merge_shards.py --shards ${SHARDS} --out /scratch/merged
          SCORES=""
          for m in sophon-public l188-s1 l188-s2 l188-s3 l188-s4 l188-s5 l162-s1b l162-s2 l162-s3 l162-s4 l162-s5 r42q1-s1 r42q1-s2 r42q1-s3 r42q1-s4 r42q1-s5 r16q1-s1 r16q1-s2 r16q1-s3 r16q1-s4 r16q1-s5 l162mass-s1 l162mass-s2 l162mass-s3 l162mass-s4 l162mass-s5 r16q1mass-s1 r16q1mass-s2 r16q1mass-s3 r16q1mass-s4 r16q1mass-s5; do SCORES="${SCORES} ${m}=/scratch/merged/scores_${m}.npz"; done
          mkdir -p "${OUT}"
          PYTHONUNBUFFERED=1 python3 experiments/AOJ/export_fit_bins.py --peak top \
            --jets /scratch/merged/jets.npz --results /data/results/aoj/full_v1/fit_v2/results.json \
            --histograms /data/results/aoj/full_v1/fit_v2/histograms.npz \
            --scores ${SCORES} --out "${OUT}/bins.npz"
          ls -la "${OUT}"
        volumeMounts:
        - { name: data,    mountPath: /data }
        - { name: scratch, mountPath: /scratch }
        resources:
          # ~12 M jets x (50 B + 31 float16 scores) held once in memory, then the fits.
          requests: { memory: "32Gi", cpu: "16", ephemeral-storage: "16Gi" }
          limits:   { memory: "32Gi", cpu: "16", ephemeral-storage: "16Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: scratch
        emptyDir: { sizeLimit: "12Gi" }
