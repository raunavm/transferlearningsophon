apiVersion: batch/v1
kind: Job
metadata:
  # REAL-DATA CHECKS: THE SCORES ON SIMULATION, GROUP 2 OF 6. GENERATED by
  # scripts/build_aoj_jobs.py. Scores l188-s2, l162-s3, r42q1-s4, r16q1-s5, r16q1mass-s1 with the real-data scores
  # (experiments/AOJ/sim_scores.py) on 78 JetClass-II test files through the
  # AspenOpenJets selection. One loader worker and one file list for every model and
  # group, so every model's rows are the same jets; sim_scores.py refuses otherwise.
  name: aoj-sim-g2-raunav
  namespace: cms-ml
spec:
  backoffLimit: 20
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          OUT=/data/results/aoj/sim_v1
          ACC="${OUT}/attempts/g2"
          mkdir -p "${ACC}"
          echo "$(date -u +%FT%TZ) $(hostname)" >> "${ACC}/ATTEMPTS"
          NF=$(grep -c . "${ACC}/FAILED_ATTEMPTS" 2>/dev/null || true)
          NA=$(grep -c . "${ACC}/ATTEMPTS" 2>/dev/null || true)
          if [ "${NF:-0}" -ge 2 ] || [ "${NA:-0}" -gt 8 ]; then
            echo "FATAL: ${NF} failed attempts, ${NA} in all: fix the cause, then remove ${ACC}/FAILED_ATTEMPTS"; exit 42; fi
          trap 'rc=$?; if [ ${rc} -ne 0 ] && [ ${rc} -ne 42 ]; then echo "rc=${rc} $(date -u +%FT%TZ) $(hostname)" >> "${ACC}/FAILED_ATTEMPTS"; fi' EXIT
          MODELS="l188-s2 l162-s3 r42q1-s4 r16q1-s5 r16q1mass-s1"
          todo=""
          for m in ${MODELS}; do [ -f "${OUT}/scores_${m}.npz" ] || todo="${todo} ${m}"; done
          if [ -z "${todo}" ]; then echo "group 2 complete"; touch "${ACC}/DONE"; exit 0; fi
          echo "to score:${todo}"

          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          FREE_G=$(df -BG --output=avail /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}%  free: ${FREE_G}G"
          [ "${USED}" -lt 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 1; }
          [ "${FREE_G}" -ge 5 ] || { echo "FATAL: ${FREE_G}G free on /data, need 5G"; exit 1; }

          git clone --depth 1 --branch "mtx-s1.68" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          # THE IMAGE HAS NO pyarrow, and weaver reads parquet through it. Without it weaver
          # logs the ImportError, swallows it and fails later with "Zero entries loaded"
          # (every group of the first launch, 2026-09-29) -- so install, then import.
          pip install --no-cache-dir -q pyarrow || exit 1
          python3 -c "import pyarrow" || { echo "FATAL: pyarrow does not import"; exit 1; }
          for c in /data/results/mtx/mtx-l188-s2/net_epoch-79_state.pt /data/results/mtx/mtx-l162-s3/net_epoch-79_state.pt /data/results/mtx/mtx-r42q1-s4/net_epoch-79_state.pt /data/results/mtx/mtx-r16q1-s5/net_epoch-79_state.pt /data/results/mtx/mtx-r16q1mass-s1/net_epoch-79_state.pt; do [ -f "${c}" ] || { echo "FATAL: no ${c}"; exit 1; }; done
          # THE ORDER OF THIS LIST IS LOAD-BEARING: every model reads it in this order.
          FILES="/jc2/jet_data/Res34P_1075.parquet /jc2/jet_data/Res34P_1076.parquet /jc2/jet_data/Res34P_1077.parquet /jc2/jet_data/Res34P_1078.parquet /jc2/jet_data/Res34P_1079.parquet /jc2/jet_data/Res34P_1080.parquet /jc2/jet_data/Res34P_1081.parquet /jc2/jet_data/Res34P_1082.parquet /jc2/jet_data/QCD_0350.parquet /jc2/jet_data/QCD_0351.parquet /jc2/jet_data/QCD_0352.parquet /jc2/jet_data/QCD_0353.parquet /jc2/jet_data/QCD_0354.parquet /jc2/jet_data/QCD_0355.parquet /jc2/jet_data/QCD_0356.parquet /jc2/jet_data/QCD_0357.parquet /jc2/jet_data/QCD_0358.parquet /jc2/jet_data/QCD_0359.parquet /jc2/jet_data/QCD_0360.parquet /jc2/jet_data/QCD_0361.parquet /jc2/jet_data/QCD_0362.parquet /jc2/jet_data/QCD_0363.parquet /jc2/jet_data/QCD_0364.parquet /jc2/jet_data/QCD_0365.parquet /jc2/jet_data/QCD_0366.parquet /jc2/jet_data/QCD_0367.parquet /jc2/jet_data/QCD_0368.parquet /jc2/jet_data/QCD_0369.parquet /jc2/jet_data/QCD_0370.parquet /jc2/jet_data/QCD_0371.parquet /jc2/jet_data/QCD_0372.parquet /jc2/jet_data/QCD_0373.parquet /jc2/jet_data/QCD_0374.parquet /jc2/jet_data/QCD_0375.parquet /jc2/jet_data/QCD_0376.parquet /jc2/jet_data/QCD_0377.parquet /jc2/jet_data/QCD_0378.parquet /jc2/jet_data/QCD_0379.parquet /jc2/jet_data/QCD_0380.parquet /jc2/jet_data/QCD_0381.parquet /jc2/jet_data/QCD_0382.parquet /jc2/jet_data/QCD_0383.parquet /jc2/jet_data/QCD_0384.parquet /jc2/jet_data/QCD_0385.parquet /jc2/jet_data/QCD_0386.parquet /jc2/jet_data/QCD_0387.parquet /jc2/jet_data/QCD_0388.parquet /jc2/jet_data/QCD_0389.parquet /jc2/jet_data/QCD_0390.parquet /jc2/jet_data/QCD_0391.parquet /jc2/jet_data/QCD_0392.parquet /jc2/jet_data/QCD_0393.parquet /jc2/jet_data/QCD_0394.parquet /jc2/jet_data/QCD_0395.parquet /jc2/jet_data/QCD_0396.parquet /jc2/jet_data/QCD_0397.parquet /jc2/jet_data/QCD_0398.parquet /jc2/jet_data/QCD_0399.parquet /jc2/jet_data/QCD_0400.parquet /jc2/jet_data/QCD_0401.parquet /jc2/jet_data/QCD_0402.parquet /jc2/jet_data/QCD_0403.parquet /jc2/jet_data/QCD_0404.parquet /jc2/jet_data/QCD_0405.parquet /jc2/jet_data/QCD_0406.parquet /jc2/jet_data/QCD_0407.parquet /jc2/jet_data/QCD_0408.parquet /jc2/jet_data/QCD_0409.parquet /jc2/jet_data/QCD_0410.parquet /jc2/jet_data/QCD_0411.parquet /jc2/jet_data/QCD_0412.parquet /jc2/jet_data/QCD_0413.parquet /jc2/jet_data/QCD_0414.parquet /jc2/jet_data/QCD_0415.parquet /jc2/jet_data/QCD_0416.parquet /jc2/jet_data/QCD_0417.parquet /jc2/jet_data/QCD_0418.parquet /jc2/jet_data/QCD_0419.parquet"
          for f in ${FILES}; do [ -f "${f}" ] || { echo "FATAL: no ${f}"; exit 1; }; done
          GPU=$(nvidia-smi --query-gpu=name --format=csv,noheader | head -1); echo "GPU: ${GPU}"

          score () {  # name checkpoint K num_reg arm rung
            [ -f "${OUT}/scores_$1.npz" ] && { echo "skip $1 (scored)"; return 0; }
            PYTHONUNBUFFERED=1 python3 experiments/EVAL/extract_features.py \
              --checkpoint "$2" --num-classes "$3" --num-reg "$4" --arm "$5" \
              --data-config configs/finetune/JetClassII_base_selAspenOpenJets.yaml --observers jet_pt jet_eta jet_sdmass --save-logits \
              --data-test ${FILES} --out "/scratch/extract/$1" \
              --batch-size 512 --num-workers 1 --fetch-step 1 \
            && python3 experiments/AOJ/sim_scores.py --name "$1" --rung "$6" \
              --extract-dir "/scratch/extract/$1" --out "${OUT}" \
            && echo "$1 ${GPU}" >> "${OUT}/gpu_per_model.txt" \
            && rm -rf "/scratch/extract/$1"
          }
          mkdir -p /scratch/logs
          scored () {
            score "$@" > "/scratch/logs/$1.log" 2>&1 \
              || { echo "FATAL: $1 failed"; tail -40 "/scratch/logs/$1.log"; return 1; }
            echo "$1: $(grep -E 'jets/s|^skip' /scratch/logs/$1.log | tail -1)"
          }
          scored l188-s2 "/data/results/mtx/mtx-l188-s2/net_epoch-79_state.pt" 188 0 L188 L188 & p0=$!
          scored l162-s3 "/data/results/mtx/mtx-l162-s3/net_epoch-79_state.pt" 162 0 L162 L162 & p1=$!
          scored r42q1-s4 "/data/results/mtx/mtx-r42q1-s4/net_epoch-79_state.pt" 43 0 R42_Q1 R42_Q1 & p2=$!
          wait ${p0}; wait ${p1}; wait ${p2}
          scored r16q1-s5 "/data/results/mtx/mtx-r16q1-s5/net_epoch-79_state.pt" 17 0 R16_Q1 R16_Q1 & p0=$!
          scored r16q1mass-s1 "/data/results/mtx/mtx-r16q1mass-s1/net_epoch-79_state.pt" 17 1 R16_Q1_MASS R16_Q1 & p1=$!
          wait ${p0}; wait ${p1}
          touch "${ACC}/DONE"
        volumeMounts:
        - { name: jc2,     mountPath: /jc2, readOnly: true }
        - { name: data,    mountPath: /data }
        - { name: scratch, mountPath: /scratch }
        - { name: dshm,    mountPath: /dev/shm }
        resources:
          # as the shards: 3 single-worker loaders at a core each. Each model holds
          # ~2.4 M jets of features and logits (~3 GB) before writing them.
          requests: { memory: "48Gi", cpu: "8", nvidia.com/gpu: "1", ephemeral-storage: "40Gi" }
          limits:   { memory: "48Gi", cpu: "8", nvidia.com/gpu: "1", ephemeral-storage: "40Gi" }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: nvidia.com/gpu.product
                operator: Exists
              - key: nvidia.com/gpu.product
                operator: NotIn
                values: ["NVIDIA-GeForce-RTX-3090"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-01.sdsc.optiputer.net", "ry-gpu-10.sdsc.optiputer.net", "k8s-haosu-15.sdsc.optiputer.net", "patternlab.calit2.optiputer.net"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: scratch
        emptyDir: { sizeLimit: "36Gi" }
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
