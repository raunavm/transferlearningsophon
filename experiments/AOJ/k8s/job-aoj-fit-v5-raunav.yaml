apiVersion: batch/v1
kind: Job
metadata:
  # THE REAL-DATA FITS, v5. GENERATED by scripts/build_aoj_jobs.py. Runs
  # experiments/AOJ/fit_v5.py from the committed bins (no jets): every score's top fit
  # with the tops that fail its cut in the fail region, validation toys, the shape and
  # leak systematics, and the per-vocabulary readout. Writes /data/results/aoj/fit_v5; prints it on the log.
  name: aoj-fit-v5-raunav
  namespace: cms-ml
spec:
  backoffLimit: 20
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          OUT=/data/results/aoj/fit_v5
          mkdir -p "${OUT}/attempts"
          echo "$(date -u +%FT%TZ) $(hostname)" >> "${OUT}/attempts/ATTEMPTS"
          NF=$(grep -c . "${OUT}/attempts/FAILED_ATTEMPTS" 2>/dev/null || true)
          NA=$(grep -c . "${OUT}/attempts/ATTEMPTS" 2>/dev/null || true)
          if [ "${NF:-0}" -ge 2 ] || [ "${NA:-0}" -gt 8 ]; then
            echo "FATAL: ${NF} failed attempts, ${NA} in all: fix the cause, then remove ${OUT}/attempts/FAILED_ATTEMPTS"; exit 42; fi
          trap 'rc=$?; if [ ${rc} -ne 0 ] && [ ${rc} -ne 42 ]; then echo "rc=${rc} $(date -u +%FT%TZ) $(hostname)" >> "${OUT}/attempts/FAILED_ATTEMPTS"; fi' EXIT
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          FREE_G=$(df -BG --output=avail /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}%  free: ${FREE_G}G"
          [ "${USED}" -lt 95 ] || { echo "FATAL: /data is ${USED}% full"; exit 1; }
          [ "${FREE_G}" -ge 1 ] || { echo "FATAL: ${FREE_G}G free on /data, need 1G"; exit 1; }
          if [ ! -e "${OUT}/results.json" ]; then
            git clone --depth 1 --branch "mtx-s1.86" \
              https://github.com/raunavm/transferlearningsophon.git \
              /workspace/transferlearningsophon
            cd /workspace/transferlearningsophon
            git rev-parse HEAD
            export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 PYTHONUNBUFFERED=1
            python3 experiments/AOJ/fit_v5.py --workers 31 \
              --out /scratch/fit_v5 --analysis-out /scratch/fit_v5/analysis_v5
            cp -r /scratch/fit_v5/. "${OUT}/"
          fi
          cd "${OUT}"
          echo "BEGIN-TAR"
          tar czf - results.json histograms.npz fit_quality.json analysis_v5 | base64 -w 0
          echo
          echo "END-TAR"
        volumeMounts:
        - { name: data,    mountPath: /data }
        - { name: scratch, mountPath: /scratch }
        resources:
          requests: { memory: "24Gi", cpu: "32", ephemeral-storage: "4Gi" }
          limits:   { memory: "24Gi", cpu: "32", ephemeral-storage: "4Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: scratch
        emptyDir: { sizeLimit: "4Gi" }
