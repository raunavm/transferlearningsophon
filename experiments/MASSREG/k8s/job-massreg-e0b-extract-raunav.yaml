apiVersion: batch/v1
kind: Job
metadata:
  # E0b -- FROZEN FEATURES FROM THE *PUBLIC* SOPHON CHECKPOINT.
  #
  # Everything else in this repo extracts from OUR checkpoints. This one
  # extracts from the published 188-class Sophon backbone, and that is the
  # entire point: the mass-regression paper's control figure (E1) has to be
  # reproducible by a referee who has no access to our PVC. A number that only
  # we can regenerate is not a control.
  #
  # WHAT MAKES THIS DIFFERENT FROM job-extract-mtx-*:
  #   1. K=188, arm L188 -- the native JetClass-II vocabulary, not a rung.
  #   2. configs/data/JetClassII_massreg.yaml, NOT ...base.yaml. The only
  #      difference between the two files is one added observer,
  #      `genjet_sdmass`, which is this study's regression TRUTH. It is a
  #      separate file rather than an edit to base because
  #      extract_features.py stamps data_config_sha256 into every manifest,
  #      so editing base would strand every granularity feature set already
  #      on the PVC against a config its own manifest no longer matches.
  #   3. --observers is passed explicitly. weaver materialises only what the
  #      config's `observers:` block lists and the collector skips anything
  #      absent from the batch SILENTLY, so a typo here would yield features
  #      with no regression target and no error. extract_features.py now
  #      hard-fails (exit 4) on a requested observer that never arrived.
  #
  # 4,000,000 JETS, not the 2,000,000 the granularity extractions use. E1 plots
  # QCD m_SD at background efficiencies down to eps_B = 0.5%. The file list is
  # family-interleaved so QCD is ~1/3 of any prefix: 4M jets => ~1.33M QCD =>
  # ~6,650 jets in the 0.5% tail, which is a histogram. At 2M it would be
  # ~3,300 and the tail bins would be noise.
  #
  #   4. --save-logits. E1 builds GloParT's own discriminant,
  #      Sum(alpha_i p_i) / (Sum(alpha_i p_i) + Sum_QCD p_i), which is a
  #      function of the 188 CLASS PROBABILITIES -- not of the 128-d
  #      representation everything else here probes. The head output is already
  #      computed in the extraction loop and was being discarded, so without
  #      this flag the job would stream 4M jets and still not produce the input
  #      the control figure needs.
  #
  # DISK: ~5.2 GB. features 4M x 128 x f32 = 2.05 GB, logits 4M x 188 x f32 =
  # 3.01 GB, six observers = 96 MB.
  #
  # CPU-ONLY. Forward pass only; the 3090 pool has 0 free and CPU is uncontended.
  name: massreg-e0b-extract-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: extract
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          git clone --depth 1 --branch "massreg-e0b.1" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow || exit 1

          CKPT=/workspace/sophon_public.pt
          URL=https://huggingface.co/jet-universe/sophon/resolve/main/models/JetClassII_Sophon/model.pt
          curl -fsSL -o "${CKPT}" "${URL}"

          # PIN THE ARTEFACT. A silently-updated upstream file would change the
          # paper's control figure with nothing in the manifest to show it.
          WANT=cc7c33b522e796b5bbf0aa9bb5b01361c964f4ef3acebdd9682d7519c095b824
          GOT=$(sha256sum "${CKPT}" | cut -d' ' -f1)
          echo "checkpoint sha256 ${GOT}"
          echo "checkpoint bytes  $(stat -c%s "${CKPT}")"
          [ "${GOT}" = "${WANT}" ] || { echo "FATAL: sha256 mismatch, want ${WANT}"; exit 1; }

          OUT=/data/results/eval/sophon-public/features_massreg
          mkdir -p ${OUT}

          # The file list is the SAME family-interleaved order the granularity
          # extractions use, so any prefix spans Res2P / Res34P / QCD. Built by
          # scripts/build_extract_jobs.py:interleaved_files().
          FILES=$(python3 -c "import sys; sys.path.insert(0,'scripts'); from build_extract_jobs import interleaved_files; print(interleaved_files())")
          echo "file list: $(echo ${FILES} | wc -w) files, first 3: $(echo ${FILES} | cut -d' ' -f1-3)"

          PYTHONUNBUFFERED=1 python3 experiments/EVAL/extract_features.py \
            --checkpoint "${CKPT}" \
            --num-classes 188 \
            --arm L188 \
            --data-config configs/data/JetClassII_massreg.yaml \
            --data-test ${FILES} \
            --observers jet_pt jet_sdmass jet_eta jet_nparticles jet_energy genjet_sdmass \
            --save-logits \
            --out ${OUT} \
            --batch-size 512 --num-workers 1 --fetch-step 1 \
            --max-jets 4000000

          echo "=== manifest ==="
          cat ${OUT}/extract_manifest.json
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
        resources:
          requests: { memory: "48Gi", cpu: "8", ephemeral-storage: "20Gi" }
          limits:   { memory: "48Gi", cpu: "8", ephemeral-storage: "20Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
