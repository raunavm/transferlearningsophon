apiVersion: batch/v1
kind: Job
metadata:
  # PRESPEC amendment A14, analysis rule "Checkpoint robustness": before any v2
  # number is read, the defective v1 epochs are rescored with BatchNorm statistics
  # recomputed and no averaging. See experiments/DIAG/head_bn_diag.py.
  # The eight runs, epochs and 500,000 test jets of job-diag-head-epochs-raunav.yaml
  # (ledger row diag-head-epochs-v1), every checkpoint scored in this one job:
  # epochs 70-79 as stored, the same epochs with BatchNorm statistics recomputed,
  # the weight average with BatchNorm buffers averaged (the v1 diagnostic's) and
  # with BatchNorm statistics recomputed (the v2 robustness model), and the
  # best-validation checkpoint both ways when it is not one of epochs 70-79.
  # BatchNorm sample: 200,000 jets of the v2 training stream (L188 config and its
  # make_weight sidecar; the weights block is the same in every arm) over the 1340
  # files the v1 runs trained on, drawn once with a fixed seed, the same for every
  # checkpoint. Inference only, on NVIDIA-L40 only (the v1 job allowed eleven
  # products): a retry after an eviction then lands on the same product, so the
  # script's one-product guard (exit 42 on a different product after a run has
  # finished) does not end the job. The committed v1 diagnostic also ran on an L40,
  # so the stored epochs are re-scored on its product. us-west had 17 L40 nodes (4
  # GPUs each) on 2026-10-01, none in the excluded hosts. 48Gi, not the v1 job's
  # 40Gi: the BatchNorm sample is read by the v2 loader with five workers, which v2
  # pretraining runs in 48Gi. Writes about 3.6G to /data: 184 per-jet array files
  # of ~19.4 MB (24 for a run whose best checkpoint is outside 70-79, 22 otherwise).
  # The derived states (100 of ~9 MB) go to the pod's local disk and are not kept;
  # their sha256 is in each run's DONE.
  # Retry policy of scripts/build_ft_jobs.py ("retries that survive a flaky
  # cluster"): evictions ignored, exit 42 fails the job at once, and a second
  # failed attempt exits 42. A node whose GPU does not answer (the preflight probe,
  # or the script's exit 4) is the node's fault: exit 43, retried without counting
  # as a failed attempt, as in the v2 fine-tuning specs. Finished runs are skipped on
  # a retry (their DONE file).
  # The analysis JSON and its sha256 are printed at the end, to be read from the log.
  name: diag-head-bn-raunav
  namespace: cms-ml
spec:
  backoffLimit: 20
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Count
      onExitCodes: { containerName: main, operator: In, values: [43] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        env:
        - name: REPO_REF
          value: "mtx-s1.98"
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        args:
        - |
          set -uo pipefail
          HALT=42
          NODE_FAULT=43
          OUT=/data/results/eval/head_epoch_diag_bn
          JSON=${OUT}/head_bn_diag.json
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}% (this job writes about 3.6G)"
          [ "${USED}" -le 85 ] || { echo "FATAL: /data is ${USED}% full"; exit ${HALT}; }
          mkdir -p ${OUT}
          FAILS=${OUT}/FAILED_ATTEMPTS
          fail () { echo "rc=$1 pod=${POD_NAME} node=${NODE_NAME} $(date -u +%FT%TZ)" >> ${FAILS}
                     [ "$(wc -l < ${FAILS})" -ge 2 ] && { echo "FATAL: two failed attempts: $(cat ${FAILS})"; exit ${HALT}; }
                     exit $1; }
          [ -f ${FAILS} ] && [ "$(wc -l < ${FAILS})" -ge 2 ] && { echo "FATAL: two failed attempts already: $(cat ${FAILS})"; exit ${HALT}; }
          git clone --depth 1 --branch "${REPO_REF}" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon || fail 1
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow || fail 1
          python3 experiments/FT/gpu_probe.py || {
            echo "preflight pod=${POD_NAME} node=${NODE_NAME} $(date -u +%FT%TZ)" >> ${OUT}/NODE_FAULTS; exit ${NODE_FAULT}; }
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || true
          CFG=configs/arms/L188.yaml
          MD5=$(md5sum ${CFG} | cut -d' ' -f1)
          SRC=/data/results/mtx/makeweight/L188.${MD5}.auto.yaml
          [ -f "${SRC}" ] || { echo "FATAL: no reweighting sidecar ${SRC}"; exit ${HALT}; }
          cp "${SRC}" configs/arms/ || fail 1
          export PYTHONUNBUFFERED=1
          python3 experiments/DIAG/head_bn_diag.py infer \
            --runs /data/results/mtx/mtx-l188-s5:L188:188:0 /data/results/mtx/mtx-l162-s5:L162:162:0 /data/results/mtx/mtx-r42q1-s5:R42_Q1:43:0 /data/results/mtx/mtx-r16q1mass-s4:R16_Q1:17:1 /data/results/mtx/mtx-l188-s1:L188:188:0 /data/results/mtx/mtx-l162-s1b:L162:162:0 /data/results/mtx/mtx-r42q1-s1:R42_Q1:43:0 /data/results/mtx/mtx-r16q1mass-s1:R16_Q1:17:1 \
            --epochs 70 71 72 73 74 75 76 77 78 79 \
            --data-test /jc2/jet_data/Res2P_0250.parquet /jc2/jet_data/Res34P_1075.parquet /jc2/jet_data/QCD_0350.parquet /jc2/jet_data/Res2P_0251.parquet /jc2/jet_data/Res34P_1076.parquet /jc2/jet_data/QCD_0351.parquet /jc2/jet_data/Res2P_0252.parquet /jc2/jet_data/Res34P_1077.parquet /jc2/jet_data/QCD_0352.parquet /jc2/jet_data/Res2P_0253.parquet /jc2/jet_data/Res34P_1078.parquet /jc2/jet_data/QCD_0353.parquet /jc2/jet_data/Res2P_0254.parquet /jc2/jet_data/Res34P_1079.parquet /jc2/jet_data/QCD_0354.parquet /jc2/jet_data/Res2P_0255.parquet /jc2/jet_data/Res34P_1080.parquet /jc2/jet_data/QCD_0355.parquet /jc2/jet_data/Res2P_0256.parquet /jc2/jet_data/Res34P_1081.parquet /jc2/jet_data/QCD_0356.parquet /jc2/jet_data/Res2P_0257.parquet /jc2/jet_data/Res34P_1082.parquet /jc2/jet_data/QCD_0357.parquet /jc2/jet_data/Res2P_0258.parquet /jc2/jet_data/Res34P_1083.parquet /jc2/jet_data/QCD_0358.parquet /jc2/jet_data/Res2P_0259.parquet /jc2/jet_data/Res34P_1084.parquet /jc2/jet_data/QCD_0359.parquet /jc2/jet_data/Res2P_0260.parquet /jc2/jet_data/Res34P_1085.parquet /jc2/jet_data/QCD_0360.parquet /jc2/jet_data/Res2P_0261.parquet /jc2/jet_data/Res34P_1086.parquet /jc2/jet_data/QCD_0361.parquet /jc2/jet_data/Res2P_0262.parquet /jc2/jet_data/Res34P_1087.parquet /jc2/jet_data/QCD_0362.parquet /jc2/jet_data/Res2P_0263.parquet /jc2/jet_data/Res34P_1088.parquet /jc2/jet_data/QCD_0363.parquet /jc2/jet_data/Res2P_0264.parquet /jc2/jet_data/Res34P_1089.parquet /jc2/jet_data/QCD_0364.parquet /jc2/jet_data/Res2P_0265.parquet /jc2/jet_data/Res34P_1090.parquet /jc2/jet_data/QCD_0365.parquet /jc2/jet_data/Res2P_0266.parquet /jc2/jet_data/Res34P_1091.parquet /jc2/jet_data/QCD_0366.parquet /jc2/jet_data/Res2P_0267.parquet /jc2/jet_data/Res34P_1092.parquet /jc2/jet_data/QCD_0367.parquet /jc2/jet_data/Res2P_0268.parquet /jc2/jet_data/Res34P_1093.parquet /jc2/jet_data/QCD_0368.parquet /jc2/jet_data/Res2P_0269.parquet /jc2/jet_data/Res34P_1094.parquet /jc2/jet_data/QCD_0369.parquet /jc2/jet_data/Re