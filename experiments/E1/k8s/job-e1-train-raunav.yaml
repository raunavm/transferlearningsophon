apiVersion: batch/v1
kind: Job
metadata:
  # FULL TRAIN, single arm. Duplicate this file for the two arms:
  #   Arm P -> name: e1-train-armp-raunav , ARM=arm_p
  #   Arm S -> name: e1-train-arms-raunav , ARM=arm_s
  # (Repeat each once more, e.g. -r2, for seed spread — weaver has no --seed, D1.)
  name: e1-train-armp-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          ARM=arm_p          # <-- set to arm_s for the Arm S job
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          OUT=/data/results/e1/${ARM}; mkdir -p "$OUT"

          # full per-class train glob + full val
          DT=""
          for C in HToBB HToCC HToGG HToWW2Q1L HToWW4Q TTBar TTBarLep WToQQ ZToQQ ZJetsToNuNu; do
            DT="$DT ${C}:/data/JetClass/Pythia/train_100M/${C}_*.root"
          done
          VAL="/data/JetClass/Pythia/val_5M/*.root"

          # Official single-GPU ParT-on-JetClass recipe (train_JetClass.sh). Only the
          # --data-config differs between arms. flat+decay is weaver's default (do not pass it).
          # best_epoch = highest val accuracy. NO --data-test (eval is a separate step).
          # Resume after eviction: relaunch same YAML with --load-epoch <last completed>.
          PYTHONUNBUFFERED=1 weaver \
            --data-train $DT \
            --data-val "$VAL" \
            --data-config experiments/E1/data_${ARM}.yaml \
            --network-config experiments/E1/ParT_sophon_arch_10c.py -o num_classes 10 -o fc_params '[(512,0.1)]' \
            --use-amp \
            --batch-size 512 --start-lr 1e-3 \
            --samples-per-epoch 10240000 --samples-per-epoch-val 1280000 \
            --num-epochs 50 --optimizer ranger \
            --num-workers 2 --fetch-step 0.01 --gpus 0 \
            --model-prefix "$OUT/net" \
            --log "$OUT/train.log" \
            --tensorboard "e1_${ARM}"
          echo "===== TRAIN $ARM DONE. best -> $OUT/net_best_epoch_state.pt ====="
        resources:
          requests: { memory: "64Gi", cpu: "8", nvidia.com/gpu: "1" }
          limits:   { memory: "64Gi", cpu: "8", nvidia.com/gpu: "1" }
        volumeMounts:
        - { name: pvc,  mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A40
                - NVIDIA-RTX-A6000
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-GeForce-RTX-4090
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "32Gi" }
