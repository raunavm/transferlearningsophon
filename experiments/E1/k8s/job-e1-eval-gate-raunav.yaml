apiVersion: batch/v1
kind: Job
metadata:
  # GATE-ONLY EVAL: predict the frozen Arm P best checkpoint on the official test_20M,
  # then report macro AUC (OvR) vs published ParT 0.9877 — the E1 GO/NO-GO for E2.
  # (Tax is deferred: it needs a CONVERGED Arm S; run job-e1-eval-raunav once run 2 finishes.)
  name: e1-eval-gate-raunav
  namespace: cms-ml
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: eval
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          OUT=/data/results/e1; mkdir -p "$OUT/eval"

          # fail-fast GPU smoke test (bad/hung node dies in <2min instead of silently)
          echo "=== GPU smoke test ==="
          timeout 150 python3 -c "import torch; assert torch.cuda.is_available(); x=torch.randn(4096,4096,device='cuda'); [ (x@x).sum().item() for _ in range(20) ]; torch.cuda.synchronize(); print('GPU OK:', torch.cuda.get_device_name(0))" \
            || { echo 'GPU SMOKE FAILED -> exit'; exit 1; }

          CKPT="$OUT/arm_p/net_best_epoch_state.pt"
          [ -f "$CKPT" ] || { echo "MISSING $CKPT — Arm P not done"; exit 1; }

          # stage test_20M (29G) to local scratch — streaming it over a us-central->us-west WAN
          # starves the GPU (0% util). Predict is one pass, so a one-time local copy then read is fast.
          echo "=== staging test_20M (29G) to /scratch ==="
          mkdir -p /scratch/test; T0=$(date +%s)
          timeout 1800 bash -c 'ls /data/JetClass/Pythia/test_20M/*.root | xargs -P8 -I{} cp {} /scratch/test/' \
            || { echo "TEST STAGING TIMEOUT -> exit to retry"; exit 1; }
          NT=$(ls /scratch/test/*.root | wc -l)
          [ "$NT" -eq 200 ] || { echo "STAGING INCOMPLETE: $NT/200"; exit 1; }
          echo "=== staged $NT files in $(( $(date +%s) - T0 ))s ==="

          TEST=""
          for C in HToBB HToCC HToGG HToWW2Q1L HToWW4Q TTBar TTBarLep WToQQ ZToQQ ZJetsToNuNu; do
            TEST="$TEST ${C}:/scratch/test/${C}_*.root"
          done
          NET="experiments/E1/ParT_sophon_arch_10c.py -o num_classes 10 -o fc_params [(512,0.1)]"

          echo "===== predict arm_p on test_20M (ParT preprocessing) ====="
          weaver --predict --data-test $TEST \
            --data-config experiments/E1/data_arm_p.yaml \
            --network-config $NET --gpus 0 --batch-size 512 --num-workers 4 --fetch-step 0.01 \
            --model-prefix "$CKPT" \
            --predict-output "$OUT/arm_p/pred.root" 2>&1 | tail -30

          echo "===== GATE: Arm P macro AUC vs published 0.9877 ====="
          PYTHONUNBUFFERED=1 python3 -c "
          import sys; sys.path.insert(0, 'experiments/E1')
          import json
          from eval_e1 import load, full_metrics, PUBLISHED_PART_AUC
          p, t = load('$OUT/arm_p/pred.root')
          m = full_metrics(p, t)
          auc = m['macro_auc_ovr']; gap = auc - PUBLISHED_PART_AUC
          m['gate_pass'] = bool(abs(gap) <= 0.002)
          m['published_part_auc'] = PUBLISHED_PART_AUC
          m['auc_gap_to_published'] = float(gap)
          json.dump(m, open('$OUT/eval/metrics_arm_p_gate.json','w'), indent=2, default=float)
          print(f\"Arm P macro AUC = {auc:.4f}  (published {PUBLISHED_PART_AUC}, gap {gap:+.4f})  GATE {'PASS' if abs(gap)<=0.002 else 'FAIL'}\")
          print(f\"Arm P accuracy  = {m['accuracy']:.4f}   meanRej@eff0.3 = {m.get('mean_rejection_eff0.3','?')}\")
          " | tee "$OUT/eval/gate_summary.txt"
          echo "===== GATE EVAL DONE -> $OUT/eval/gate_summary.txt ====="
        resources:
          # ephemeral-storage 60Gi = 29G staged test + container + margin
          requests: { memory: "64Gi", cpu: "8", nvidia.com/gpu: "1", ephemeral-storage: "60Gi" }
          limits:   { memory: "64Gi", cpu: "8", nvidia.com/gpu: "1", ephemeral-storage: "60Gi" }
        volumeMounts:
        - { name: pvc,     mountPath: /data }
        - { name: dshm,    mountPath: /dev/shm }
        - { name: scratch, mountPath: /scratch }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              # >=24GB VRAM. Predict is a SINGLE sequential pass over the 29G test_20M with NO
              # reweighting (no 80x amplification), so un-staged us-central WAN streaming is fine
              # here (unlike training) -> open both regions to escape us-west saturation.
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A100-SXM4-40GB
                - NVIDIA-A100-80GB-PCIe
                - NVIDIA-A40
                - NVIDIA-RTX-A6000
                - NVIDIA-RTX-A5000
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-A10
                - NVIDIA-TITAN-RTX
                # ALL >=24GB cards: after local staging the predict is one GPU-bound pass, so a
                # slower card is fine and maximizes schedulability. Smoke test guards bad nodes.
              - key: topology.kubernetes.io/region
                operator: In
                values:
                - us-west
                - us-central
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100   # prefer us-west (PVC-local, faster read) when a card is free there
            preference:
              matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values:
                - us-west
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "16Gi" }
      - name: scratch
        emptyDir: {}
