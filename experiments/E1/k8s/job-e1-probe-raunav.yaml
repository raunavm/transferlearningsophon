apiVersion: batch/v1
kind: Job
metadata:
  # Read-only inspection: weaver version, data integrity + Arm S bin design, config/network parse.
  # v2: data probe runs FIRST; weaver --print uses 1 file/class (no weight-scan hang) with a
  # timeout, and dumps its log to stdout so no `kubectl exec` is needed to diagnose failures.
  name: e1-probe-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: probe
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set +e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          OUT=/data/results/e1/probe; mkdir -p "$OUT"

          echo "===== weaver version / CLI (D6) ====="
          pip show weaver-core 2>/dev/null | grep -i -E "version|location" | tee "$OUT/weaver_version.txt"
          weaver -h > "$OUT/weaver_help.txt" 2>&1

          echo "===== DATA INTEGRITY + (jet_pt, jet_sdmass) for Arm S bins (most important) ====="
          PYTHONUNBUFFERED=1 python3 experiments/E1/probe_jetclass1.py \
            --root-dir /data/JetClass/Pythia/train_100M \
            --files-per-class 2 \
            --out "$OUT/probe_report.json" | tee "$OUT/probe_stdout.txt"

          # ONE file per class only, so weaver --print does not scan the full dataset
          DT=""
          for C in HToBB HToCC HToGG HToWW2Q1L HToWW4Q TTBar TTBarLep WToQQ ZToQQ ZJetsToNuNu; do
            F=$(ls /data/JetClass/Pythia/train_100M/${C}_*.root | head -1)
            DT="$DT ${C}:${F}"
          done

          for ARM in arm_p arm_s; do
            echo "===== weaver --print ($ARM): config parse + network load (1 file/class, 5-min cap) ====="
            timeout 300 weaver --print \
              --data-train $DT \
              --data-config experiments/E1/data_${ARM}.yaml \
              --network-config experiments/E1/ParT_sophon_arch_10c.py -o num_classes 10 -o fc_params '[(512,0.1)]' \
              --model-prefix "$OUT/tmp_${ARM}/net" --batch-size 512 --num-workers 1 \
              --data-fraction 0.05 --fetch-step 0.1 --gpus '' \
              > "$OUT/print_${ARM}.log" 2>&1
            echo "$ARM --print exit=$?"
            echo "----- print_${ARM}.log (last 40 lines) -----"
            tail -40 "$OUT/print_${ARM}.log"
          done
          echo "===== PROBE DONE ====="
        resources:
          # request == limit (Nautilus requires memory limit/request ratio <= 1.2)
          requests: { memory: "32Gi", cpu: "4" }
          limits:   { memory: "32Gi", cpu: "4" }
        volumeMounts:
        - { name: pvc, mountPath: /data }
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
