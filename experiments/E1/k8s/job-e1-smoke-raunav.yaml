apiVersion: batch/v1
kind: Job
metadata:
  # Dry run: 3 short epochs/arm on 1 file/class. Confirms loss decreases, no AMP NaN,
  # Arm S make_weight, resume, throughput -> projected wall time. Dumps a tiny pred.root
  # schema for eval_e1.py. NOT the real run.
  name: e1-smoke-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: smoke
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set +e
          set -o pipefail
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          OUT=/data/results/e1/smoke; mkdir -p "$OUT"

          # >=4 files/class: weaver shards EACH class's files by files[worker_id::num_workers],
          # so every class needs >= num_workers(2) files or a worker starves (dataset.py:172).
          DT=""
          for C in HToBB HToCC HToGG HToWW2Q1L HToWW4Q TTBar TTBarLep WToQQ ZToQQ ZJetsToNuNu; do
            for F in $(ls /data/JetClass/Pythia/train_100M/${C}_*.root | head -4); do
              DT="$DT ${C}:${F}"
            done
          done
          VAL=$(ls /data/JetClass/Pythia/val_5M/*.root | head -10)
          TEST=$(ls /data/JetClass/Pythia/test_20M/*.root | head -10)
          COMMON="--use-amp --batch-size 512 --start-lr 1e-3 --samples-per-epoch 200000 \
                  --samples-per-epoch-val 50000 --num-epochs 3 --optimizer ranger \
                  --num-workers 2 --fetch-step 0.1 --gpus 0"

          for ARM in arm_p arm_s; do
            echo "===== SMOKE $ARM (3 epochs) ====="
            weaver --data-train $DT --data-val $VAL \
              --data-config experiments/E1/data_${ARM}.yaml \
              --network-config experiments/E1/ParT_sophon_arch_10c.py -o num_classes 10 -o fc_params '[(512,0.1)]' \
              $COMMON --model-prefix "$OUT/${ARM}/net" --log "$OUT/${ARM}/train.log" \
              2>&1 | tee "$OUT/${ARM}/stdout.txt"
            echo "$ARM train exit=$?"
          done

          echo "===== RESUME check (arm_p from epoch 1) ====="
          weaver --data-train $DT --data-val $VAL \
            --data-config experiments/E1/data_arm_p.yaml \
            --network-config experiments/E1/ParT_sophon_arch_10c.py -o num_classes 10 -o fc_params '[(512,0.1)]' \
            $COMMON --model-prefix "$OUT/arm_p/net" --load-epoch 1 --log "$OUT/arm_p/resume.log" \
            2>&1 | tail -12
          echo "resume exit=$?"

          echo "===== tiny predict (arm_p) -> pred.root schema ====="
          weaver --predict --data-test $TEST \
            --data-config experiments/E1/data_arm_p.yaml \
            --network-config experiments/E1/ParT_sophon_arch_10c.py -o num_classes 10 -o fc_params '[(512,0.1)]' \
            --gpus 0 --batch-size 512 --num-workers 2 \
            --model-prefix "$OUT/arm_p/net_best_epoch_state.pt" \
            --predict-output "$OUT/arm_p/pred_smoke.root" 2>&1 | tail -15
          python3 -c "import uproot; f=uproot.open('$OUT/arm_p/pred_smoke.root'); k=f.keys()[0]; t=f[k]; print('TREE:',k); print('BRANCHES:', list(t.keys()))" 2>&1 | tail -4

          echo "===== SMOKE SUMMARY ====="
          for ARM in arm_p arm_s; do
            echo "--- $ARM: loss/acc trend + throughput + any NaN ---"
            grep -E "Train AvgLoss|entries/s|nan|inf|Traceback|Error" "$OUT/${ARM}/train.log" 2>/dev/null | tail -8
          done
          echo "===== SMOKE DONE ====="
        resources:
          requests: { memory: "32Gi", cpu: "4", nvidia.com/gpu: "1" }
          limits:   { memory: "32Gi", cpu: "4", nvidia.com/gpu: "1" }
        volumeMounts:
        - { name: pvc,  mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              # broad GPU set for the smoke — any datacenter GPU validates the pipeline
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A100-SXM4-40GB
                - NVIDIA-A40
                - NVIDIA-A10
                - NVIDIA-RTX-A6000
                - NVIDIA-RTX-A5000
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-L4
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-GeForce-RTX-3090
                - Tesla-V100-SXM2-32GB
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "32Gi" }
