apiVersion: batch/v1
kind: Job
metadata:
  # FULL TRAIN Arm S — RUN 2 (independent realization; weaver 0.4.17 has no --seed, so a second
  # run IS the second seed). Bit-identical recipe + data config to run 1; separate output dir.
  # FAST-GPU-ONLY pool (L40/A100/A40/A6000/4090/H100-class) to try to beat run 1's ~3-day A10 ETA.
  name: e1-train-arms2-raunav
  namespace: cms-ml
spec:
  backoffLimit: 12   # raised: fail-fast GPU smoke test makes bad-node retries cheap (~2min each)
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e   # NOT pipefail: the resume-detect `ls net_epoch-* | ...` legitimately fails on a
                   # fresh (no-checkpoint) dir; pipefail turned that into a fatal exit-2 right after
                   # staging, before weaver ran (killed every staged pod — misread as "bad nodes").
          ARM=arm_s
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          # RUN 2: separate output dir (no checkpoint collision with run 1); same data config.
          OUT=/data/results/e1/arm_s_run2; mkdir -p "$OUT"

          # ---- fail-fast GPU smoke test. Some nodes (ry-gpu-01, k8s-haosu-24) accept the pod but
          # their GPU HANGS weaver silently for hours -> backoffLimit burns with no output. A bounded
          # CUDA matmul catches a bad/hung GPU in <2min so the retry moves to another node fast.
          echo "=== GPU smoke test ==="
          timeout 150 python3 -c "import torch; assert torch.cuda.is_available(); x=torch.randn(4096,4096,device='cuda'); [ (x@x).sum().item() for _ in range(20) ]; torch.cuda.synchronize(); print('GPU OK:', torch.cuda.get_device_name(0))" \
            || { echo 'GPU SMOKE FAILED/timed out -> exit to retry on another node'; exit 1; }

          # ---- stage inputs to node-local scratch (INFRA ONLY — training semantics unchanged).
          # The flat (pt,mSD) reweighting rejection-samples: it reads/discards several raw jets
          # per accepted jet. Streaming that from CephFS is what starved the run (~0.44 it/s on
          # suncave). Local NVMe makes the re-reads ~free; weaver command is IDENTICAL.
          echo "=== staging train_100M (142G) + val_5M (7.1G) to local scratch ==="
          mkdir -p /scratch/train /scratch/val
          T0=$(date +%s)
          # timeout guards a pathologically slow cross-region WAN read of the us-west PVC:
          # us-west local copy is ~283s; even a slow us-central WAN copy should finish <1h.
          timeout 3600 bash -c 'ls /data/JetClass/Pythia/train_100M/*.root | xargs -P8 -I{} cp {} /scratch/train/' \
            || { echo "TRAIN STAGING TIMEOUT (>1h) -> exit to retry on a closer node"; exit 1; }
          timeout 600  bash -c 'ls /data/JetClass/Pythia/val_5M/*.root     | xargs -P8 -I{} cp {} /scratch/val/' \
            || { echo "VAL STAGING TIMEOUT -> exit"; exit 1; }
          NT=$(ls /scratch/train/*.root | wc -l); NV=$(ls /scratch/val/*.root | wc -l)
          [ "$NT" -eq 1000 ] && [ "$NV" -eq 50 ] || { echo "STAGING INCOMPLETE: $NT/1000 train, $NV/50 val"; exit 1; }
          echo "=== staged $NT+$NV files in $(( $(date +%s) - T0 ))s ==="

          DT=""
          for C in HToBB HToCC HToGG HToWW2Q1L HToWW4Q TTBar TTBarLep WToQQ ZToQQ ZJetsToNuNu; do
            DT="$DT ${C}:/scratch/train/${C}_*.root"
          done

          LOAD=""
          LAST=$(ls "$OUT"/net_epoch-*_state.pt 2>/dev/null | sed 's/.*_epoch-\([0-9]*\)_state.pt/\1/' | sort -n | tail -1 || true)
          [ -n "$LAST" ] && { LOAD="--load-epoch $LAST"; echo "RESUME from epoch $LAST"; }

          # cache/restore the reweight auto.yaml so a retry skips the ~64-min make_weight.
          # (config is stable -> weaver's hash-named auto.yaml matches across runs.)
          CACHE=/data/results/e1/arm_s_reweight_cache; mkdir -p "$CACHE"
          NOREMAKE=""
          if ls "$CACHE"/data_arm_s.*.auto.yaml >/dev/null 2>&1; then
            cp "$CACHE"/data_arm_s.*.auto.yaml experiments/E1/ && NOREMAKE="--no-remake-weights" \
              && echo "RESTORED cached reweight yaml -> skipping make_weight"
          else
            ( for k in $(seq 1 300); do
                if ls experiments/E1/data_arm_s.*.auto.yaml >/dev/null 2>&1; then
                  cp experiments/E1/data_arm_s.*.auto.yaml "$CACHE"/ 2>/dev/null && echo "CACHED reweight yaml"; break
                fi; sleep 20
              done ) &
          fi

          PYTHONUNBUFFERED=1 weaver \
            --data-train $DT \
            --data-val "/scratch/val/*.root" \
            --data-config experiments/E1/data_${ARM}.yaml \
            --network-config experiments/E1/ParT_sophon_arch_10c.py -o num_classes 10 -o fc_params '[(512,0.1)]' \
            --use-amp --batch-size 512 --start-lr 1e-3 \
            --samples-per-epoch 10240000 --samples-per-epoch-val 1280000 \
            --num-epochs 50 --optimizer ranger \
            --num-workers 8 --fetch-step 0.01 --gpus 0 $NOREMAKE $LOAD \
            --model-prefix "$OUT/net" --log "$OUT/train.log" --tensorboard "e1_arm_s_run2"
          echo "===== TRAIN $ARM DONE -> $OUT/net_best_epoch_state.pt ====="
        resources:
          # RUN 2: 10 cpu + 8 workers — a faster GPU (L40/A100 ~6+ it/s) needs ~260k raw jets/s
          # decompressed at the 80x rejection amplification; run 1 proved 6w/8cpu feeds ~165k/s
          # (A10 86% util), so scale readers with the card. 96Gi RAM held 6 workers with headroom.
          requests: { memory: "96Gi", cpu: "10", nvidia.com/gpu: "1", ephemeral-storage: "200Gi" }
          limits:   { memory: "96Gi", cpu: "10", nvidia.com/gpu: "1", ephemeral-storage: "200Gi" }
        volumeMounts:
        - { name: pvc,     mountPath: /data }
        - { name: dshm,    mountPath: /dev/shm }
        - { name: scratch, mountPath: /scratch }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              # broad set — run is I/O-bound (~1800/s on any datacenter GPU), so widen to schedule
              # FAST CARDS ONLY (run 2's purpose is speed; run 1 on the A10 is the safety net).
              # Dropped vs run 1: A10 (run 1 has it, ~4 it/s), A5000/TITAN-RTX/3090 (slow tier).
              # H100/H200 labels included speculatively (sm_90, cu121-torch compatible; usually
              # reservation-tainted -> scheduler skips; harmless if absent). NO Blackwell
              # (RTX-PRO-6000): cu121 torch lacks sm_120 kernels. >=24GB VRAM still mandatory.
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A100-SXM4-40GB
                - NVIDIA-A100-80GB-PCIe          # Fullerton A100
                - NVIDIA-A40
                - NVIDIA-RTX-A6000
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-H100-80GB-HBM3
                - NVIDIA-H100-PCIe
                - NVIDIA-H100-NVL
                - NVIDIA-H200-NVL
              # us-west (PVC-local) OR us-central (26 nodes — doubles capacity). The old hard
              # us-west pin was because weaver STREAMED ROOT from the CephFS PVC; now we STAGE to
              # local NVMe once, so region only affects the one-time staging copy, not training.
              # us-central is soft-deprioritized below (prefer us-west's fast local staging).
              # us-east excluded: only ~2 nodes and far from the PVC (slow even for a bulk copy).
              - key: topology.kubernetes.io/region
                operator: In
                values:
                - us-west
                - us-central
              # exclude ry-gpu-01: hung PVC I/O — stalled 2 Arm S pods at make_weight 0/1000
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - ry-gpu-01.sdsc.optiputer.net
          # soft-prefer us-west so its fast PVC-local staging (~283s) is chosen first;
          # spill to us-central (slower one-time WAN copy) only when us-west is full.
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values:
                - us-west
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "24Gi" }
      - name: scratch
        emptyDir: {}   # node-local disk; counted against the ephemeral-storage request
