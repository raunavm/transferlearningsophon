apiVersion: batch/v1
kind: Job
metadata:
  # FULL TRAIN Arm P (ParT preprocessing). Single GPU, official 50-epoch recipe.
  # Auto-resumes from the latest epoch checkpoint on the PVC if the pod is evicted.
  name: e1-train-armp-raunav
  namespace: cms-ml
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          ARM=arm_p
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          OUT=/data/results/e1/${ARM}; mkdir -p "$OUT"

          DT=""
          for C in HToBB HToCC HToGG HToWW2Q1L HToWW4Q TTBar TTBarLep WToQQ ZToQQ ZJetsToNuNu; do
            DT="$DT ${C}:/data/JetClass/Pythia/train_100M/${C}_*.root"
          done

          # auto-resume from the latest saved epoch if a prior pod was evicted
          LOAD=""
          LAST=$(ls "$OUT"/net_epoch-*_state.pt 2>/dev/null | sed 's/.*_epoch-\([0-9]*\)_state.pt/\1/' | sort -n | tail -1)
          [ -n "$LAST" ] && { LOAD="--load-epoch $LAST"; echo "RESUME from epoch $LAST"; }

          # Official single-GPU ParT-on-JetClass recipe. flat+decay is the default (do not pass it).
          # best_epoch = highest val accuracy. weaver 0.4.17 keeps all per-epoch checkpoints
          # (~1.35 GB/arm; no --auto-clean in this version). NO --data-test (eval is separate).
          PYTHONUNBUFFERED=1 weaver \
            --data-train $DT \
            --data-val "/data/JetClass/Pythia/val_5M/*.root" \
            --data-config experiments/E1/data_${ARM}.yaml \
            --network-config experiments/E1/ParT_sophon_arch_10c.py -o num_classes 10 -o fc_params '[(512,0.1)]' \
            --use-amp --batch-size 512 --start-lr 1e-3 \
            --samples-per-epoch 10240000 --samples-per-epoch-val 1280000 \
            --num-epochs 50 --optimizer ranger \
            --num-workers 2 --fetch-step 0.01 --gpus 0 $LOAD \
            --model-prefix "$OUT/net" --log "$OUT/train.log" --tensorboard "e1_${ARM}"
          echo "===== TRAIN $ARM DONE -> $OUT/net_best_epoch_state.pt ====="
        resources:
          # official low-memory dataloading (2 workers, fetch-step 0.01); us-west I/O is fast so
          # no aggressive fetch needed. 64Gi fits suncave RTX-3090 nodes (~94Gi RAM), the big us-west pool.
          requests: { memory: "64Gi", cpu: "4", nvidia.com/gpu: "1" }
          limits:   { memory: "64Gi", cpu: "4", nvidia.com/gpu: "1" }
        volumeMounts:
        - { name: pvc,  mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              # broad set — run is I/O-bound (~1800/s on any datacenter GPU), so widen to schedule
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A100-SXM4-40GB
                - NVIDIA-A40
                - NVIDIA-A10
                - NVIDIA-RTX-A6000
                - NVIDIA-RTX-A5000
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-GeForce-RTX-4090
                - NVIDIA-GeForce-RTX-3090
              # pin to us-west = near the CephFS PVC (SDSC/UCSD/Fullerton). us-east
              # (MGHPCC/AMNH) reads the PVC far too slowly and stalls on I/O.
              - key: topology.kubernetes.io/region
                operator: In
                values:
                - us-west
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "16Gi" }
