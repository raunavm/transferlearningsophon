apiVersion: batch/v1
kind: Job
metadata:
  # Small pod that reads /data for the SC-2 / DL-9 statistics work (bs3): lists inputs and sizes, df. CPU only,
  # reads only; ends by its deadline.
  name: bs3-inspect-raunav
  namespace: cms-ml
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c", "sleep 14000"]
        volumeMounts:
        - { name: data, mountPath: /data }
        resources:
          requests: { memory: "3Gi", cpu: "1", ephemeral-storage: "5Gi" }
          limits:   { memory: "3Gi", cpu: "1", ephemeral-storage: "5Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["node-2-3.sdsc.optiputer.net", "suncave-5"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
