            [ -f /data/results/eval/v2_linprobe_bal/fits_v5_gg/mtx-rand2p3-s1.json ] || python3 experiments/EVAL/probe_bal.py --model mtx-rand2p3-s1 --checkpoints best70 --gluon-pair --grid v5 --out /data/results/eval/v2_linprobe_bal/fits_v5_gg --probs-out /data/results/eval/v2_linprobe_bal/fits_v5_gg_probs
            [ -f /data/results/eval/v2_linprobe_bal/fits_v5_gg/mtx-rand2p4-s2.json ] || python3 experiments/EVAL/probe_bal.py --model mtx-rand2p4-s2 --checkpoints best70 --gluon-pair --grid v5 --out /data/results/eval/v2_linprobe_bal/fits_v5_gg --probs-out /data/results/eval/v2_linprobe_bal/fits_v5_gg_probs
