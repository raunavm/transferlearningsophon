apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_mlp_scores_jobs.py -- ledger 33: per-class JetClass recall fine-tuned at 1e6; the X->gg vs X->qq pair probe and its bootstrap. CPU.
  name: bs3-go8-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimitPerIndex: 2
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.86 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          CPU=$(grep -m1 "^model name" /proc/cpuinfo | cut -d: -f2- | sed "s/^ *//;s/ *$//"); [ "${CPU}" = "AMD EPYC 7402P 24-Core Processor" ] || { echo "FATAL: this node's CPU is ${CPU}, not AMD EPYC 7402P 24-Core Processor: nothing fitted"; exit 42; }
          retry pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 88 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          IDX=${JOB_COMPLETION_INDEX:?not a pod of an Indexed Job}
          case ${IDX} in
            0) [ -e /data/results/eval/perclass_recall/ft_jc1_N1000000.json ] || python3 -c 'import resource, subprocess, sys, time; t = time.time(); r = subprocess.call(sys.argv[1:]); print("PEAK_RSS_MIB", resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss // 1024, "SECONDS", round(time.time() - t)); sys.exit(r)' python3 experiments/EVAL/perclass_recall.py ft --task jc1 --n 1000000 --require-all --out /data/results/eval/perclass_recall;;
            1) [ -f /data/results/eval/v2_linprobe_bal/fits_v5_gg/mtx-l188-s1.json ] || python3 experiments/EVAL/probe_bal.py --model mtx-l188-s1 --checkpoints best70 --gluon-pair --grid v5 --out /data/results/eval/v2_linprobe_bal/fits_v5_gg --probs-out /data/results/eval/v2_linprobe_bal/fits_v5_gg_probs
            [ -f /data/results/eval/v2_linprobe_bal/fits_v5_gg/mtx-l188-s2.json ] || python3 experiments/EVAL/probe_bal.py --model mtx-l188-s2 --checkpoints best70 --gluon-pair --grid v5 --out /data/results/eval/v2_linprobe_bal/fits_v5_gg --probs-out /data/results/eval/v2_linprobe_bal/fits_v5_gg_probs
            [ -f /data/results/eval/v2_linprobe_bal/fits_v5_gg/mtx-l188-s3.json ] || python3 experiments/EVAL/probe_bal.py --model mtx-l188-s3 --checkpoints best70 --gluon-pair --grid v5 --out /data/results/eval/v2_linprobe_bal/fits_v5_gg --probs-out /data/results/eval/v2_linprobe_bal/fits_v5_gg_probs
            [ -f /data/results/eval/v2_linprobe_bal/fits_v5_gg/mtx-l162-s1.json ] || python3 experiments/EVAL/probe_bal.py --model mtx-l162-s1 --checkpoints best70 --gluon-pair --grid v5 --out /data/results/eval/v2_linprobe_bal/fits_v5_gg --probs-out /data/results/eval/v2_linprobe_bal/fits_v5_gg_probs
            [ -f /data/results/eval/v2_linprobe_bal/fits_v5_gg/mtx-l162-s2.json ] || python3 experiments/EVAL/probe_bal.py --model mtx-l162-s2 --checkpoints best70 --gluon-pair --grid v5 --out /data/results/eval/v2_linprobe_bal/fits_v5_gg --probs-out /data/results/eval/v2_linprobe_bal/fits_v5_gg_probs
