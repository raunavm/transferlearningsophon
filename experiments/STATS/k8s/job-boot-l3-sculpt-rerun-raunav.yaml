apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_boot_l3_jobs.py -- test-jet bootstraps for decision L3. CPU only; writes new files only.
  name: boot-l3-sculpt-rerun-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 1
  parallelism: 1
  backoffLimit: 1
  activeDeadlineSeconds: 43200
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.14 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 90 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          mkdir -p /data/results/bootstrap/l3_rerun
          case ${JOB_COMPLETION_INDEX} in
            0)  # sculpt
              python3 experiments/EVAL/sculpting_boot.py --head-root /data/results/eval/v2_head --models mtx-l188-s1 mtx-l188-s2 mtx-l188-s3 mtx-l162-s1 mtx-l162-s2 mtx-l162-s3 mtx-r42q1-s1 mtx-r42q1-s2 mtx-r42q1-s3 mtx-r16q1-s1 mtx-r16q1-s2 mtx-r16q1-s3 mtx-l162mass-s1 mtx-l162mass-s2 mtx-r16q1mass-s1 mtx-r16q1mass-s2 mtx-flavf0-s1 mtx-flavf0-s2 mtx-flavf1-s1 mtx-flavf1-s2 mtx-flavf1r-s1 mtx-flavf1r-s2 mtx-rand2p1-s1 mtx-rand2p2-s2 mtx-rand2p3-s1 mtx-rand2p4-s2 mtx-rand2p5-s2 --label-set mtx-flavf0-s1=FLAV_F0 mtx-flavf0-s2=FLAV_F0 mtx-flavf1-s1=FLAV_F1 mtx-flavf1-s2=FLAV_F1 mtx-flavf1r-s1=FLAV_F1R mtx-flavf1r-s2=FLAV_F1R mtx-rand2p1-s1=RAND2_p1 mtx-rand2p2-s2=RAND2_p2 mtx-rand2p3-s1=RAND2_p3 mtx-rand2p4-s2=RAND2_p4 mtx-rand2p5-s2=RAND2_p5 --replicas 200 --sculpting-dir /data/results/eval/v2_head/sculpting_v3 --out /data/results/bootstrap/l3_rerun/sculpting_boot_l3.json
              ;;
            *) echo "FATAL: no part for index ${JOB_COMPLETION_INDEX}"; exit 42 ;;
          esac
          echo "BOOT L3 PART ${JOB_COMPLETION_INDEX} COMPLETE"
        resources:
          requests: { memory: "48Gi", cpu: "4", ephemeral-storage: "5Gi" }
          limits:   { memory: "48Gi", cpu: "4", ephemeral-storage: "5Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
