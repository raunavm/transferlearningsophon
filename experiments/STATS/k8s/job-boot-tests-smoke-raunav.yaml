apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_boot_tests_jobs.py -- tab:tests' bootstraps, smoke: inputs, one row, one JetClass-II network's time and memory. CPU.
  name: boot-tests-smoke-raunav
