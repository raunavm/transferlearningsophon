apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_mlp_scores_jobs.py -- MLP probes with per-jet scores, smoke: one fit, its peak memory and seconds. CPU.
  name: bs3-mlp-smoke-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 1
  parallelism: 1
  backoffLimitPerIndex: 2
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.64 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          CPU=$(grep -m1 "^model name" /proc/cpuinfo | cut -d: -f2- | sed "s/^ *//;s/ *$//"); [ "${CPU}" = "AMD EPYC 7402P 24-Core Processor" ] || { echo "FATAL: this node's CPU is ${CPU}, not AMD EPYC 7402P 24-Core Processor: nothing fitted"; exit 42; }
          retry pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 88 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          IDX=${JOB_COMPLETION_INDEX:?not a pod of an Indexed Job}
          case ${IDX} in
            0) [ -f /data/results/eval/bs3_mlp/jc2bal/mtx-l188-s1.json ] && { echo "mtx-l188-s1 done"; exit 0; }; python3 -c 'import resource, subprocess, sys, time; t = time.time(); r = subprocess.call(sys.argv[1:]); print("PEAK_RSS_MIB", resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss // 1024, "SECONDS", round(time.time() - t)); sys.exit(r)' python3 experiments/EVAL/mlp_scores.py --family jc2bal --model mtx-l188-s1 --out /data/results/eval/bs3_mlp/jc2bal;;
            *) echo "FATAL: no model for index ${IDX}"; exit 42;;
          esac
          echo "BS3 ${IDX} COMPLETE"
        resources:
          requests: { memory: "12Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "12Gi", cpu: "4", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: feature.node.kubernetes.io/cpu-model.vendor_id
                operator: In
                values: ["AMD"]
              - key: feature.node.kubernetes.io/cpu-model.family
                operator: In
                values: ["23"]
              - key: feature.node.kubernetes.io/cpu-model.id
                operator: In
                values: ["49"]
              - key: kubernetes.io/hostname
                operator: In
                values: ["igrok-la.cenic.net", "pas.seat.net.internet2.edu", "pas.lasv.net.internet2.edu", "pas.losa.net.internet2.edu", "pas.losa2.net.internet2.edu", "pas.port.net.internet2.edu", "pas.reno.net.internet2.edu", "pas.sunn.net.internet2.edu"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net", "node-2-3.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
