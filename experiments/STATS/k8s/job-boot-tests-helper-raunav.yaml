apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_boot_tests_jobs.py -- tab:tests: JetClass-II networks of the slow cache parts, into the same cache. CPU.
  name: boot-tests-helper-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 1
  parallelism: 1
  backoffLimitPerIndex: 2
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.53 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          CPU=$(grep -m1 "^model name" /proc/cpuinfo | cut -d: -f2- | sed "s/^ *//;s/ *$//"); [ "${CPU}" = "AMD EPYC 7402P 24-Core Processor" ] || { echo "FATAL: this node's CPU is ${CPU}, not AMD EPYC 7402P 24-Core Processor: nothing fitted"; exit 42; }
          retry pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 90 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          mkdir -p /data/results/bootstrap/l3 /data/results/bootstrap/l3_v5
          IDX=${JOB_COMPLETION_INDEX:?not a pod of an Indexed Job}
          case ${IDX} in
            0) N=0; for F in /data/results/eval/v2_linprobe_bal/fits_v5_probs/mtx-flavf0-s2/best70/jc2bal_N1000000.npz /data/results/eval/v2_linprobe_bal/fits_v5_probs/mtx-flavf1-s1/best70/jc2bal_N1000000.npz /data/results/eval/v2_linprobe_bal/fits_v5_probs/mtx-flavf1r-s1/best70/jc2bal_N1000000.npz /data/results/eval/v2_linprobe_bal/fits_v5_probs/mtx-flavf1r-s2/best70/jc2bal_N1000000.npz /data/results/eval/v2_linprobe_bal/fits_v5_probs/mtx-rand2p2-s2/best70/jc2bal_N1000000.npz /data/results/eval/v2_linprobe_bal/fits_v5_probs/mtx-rand2p3-s1/best70/jc2bal_N1000000.npz /data/results/eval/v2_linprobe_bal/fits_v5_probs/mtx-rand2p5-s2/best70/jc2bal_N1000000.npz; do [ -e "${F}" ] || { echo "MISSING ${F}"; N=$((N+1)); }; done; [ ${N} = 0 ] || { echo "FATAL: ${N} inputs missing"; exit 42; }; echo "all inputs present"
            [ -e /data/results/bootstrap_cache/tests_jc2bal_N1000000/mtx-rand2p5-s2.npz ] || python3 experiments/STATS/paired_bootstrap.py --task npz --model mtx-rand2p5-s2=/data/results/eval/v2_linprobe_bal/fits_v5_probs/mtx-rand2p5-s2/best70/jc2bal_N1000000.npz --headline --native-groups --b 200 --cache /data/results/bootstrap_cache/tests_jc2bal_N1000000 --cache-only
            [ -e /data/results/bootstrap_cache/tests_jc2bal_N1000000/mtx-rand2p3-s1.npz ] || python3 experiments/STATS/paired_bootstrap.py --task npz --model mtx-rand2p3-s1=/data/results/eval/v2_linprobe_bal/fits_v5_probs/mtx-rand2p3-s1/best70/jc2bal_N1000000.npz --headline --native-groups --b 200 --cache /data/results/bootstrap_cache/tests_jc2bal_N1000000 --cache-only
            [ -e /data/results/bootstrap_cache/tests_jc2bal_N1000000/mtx-rand2p2-s2.npz ] || python3 experiments/STATS/paired_bootstrap.py --task npz --model mtx-rand2p2-s2=/data/results/eval/v2_linprobe_bal/fits_v5_probs/mtx-rand2p2-s2/best70/jc2bal_N1000000.npz --headline --native-groups --b 200 --cache /data/results/bootstrap_cache/tests_jc2bal_N1000000 --cache-only
            [ -e /data/results/bootstrap_cache/tests_jc2bal_N1000000/mtx-flavf1r-s2.npz ] || python3 experiments/STATS/paired_bootstrap.py --task npz --model mtx-flavf1r-s2=/data/results/eval/v2_linprobe_bal/fits_v5_probs/mtx-flavf1r-s2/best70/jc2bal_N1000000.npz --headline --native-groups --b 200 --cache /data/results/bootstrap_cache/tests_jc2bal_N1000000 --cache-only
            [ -e /data/results/bootstrap_cache/tests_jc2bal_N1000000/mtx-flavf1r-s1.npz ] || python3 experiments/STATS/paired_bootstrap.py --task npz --model mtx-flavf1r-s1=/data/results/eval/v2_linprobe_bal/fits_v5_probs/mtx-flavf1r-s1/best70/jc2bal_N1000000.npz --headline --native-groups --b 200 --cache /data/results/bootstrap_cache/tests_jc2bal_N1000000 --cache-only
            [ -e /data/results/bootstrap_cache/tests_jc2bal_N1000000/mtx-flavf1-s1.npz ] || python3 experiments/STATS/paired_bootstrap.py --task npz --model mtx-flavf1-s1=/data/results/eval/v2_linprobe_bal/fits_v5_probs/mtx-flavf1-s1/best70/jc2bal_N1000000.npz --headline --native-groups --b 200 --cache /data/results/bootstrap_cache/tests_jc2bal_N1000000 --cache-only
            [ -e /data/results/bootstrap_cache/tests_jc2bal_N1000000/mtx-flavf0-s2.npz ] || python3 experiments/STATS/paired_bootstrap.py --task npz --model mtx-flavf0-s2=/data/results/eval/v2_linprobe_bal/fits_v5_probs/mtx-flavf0-s2/best70/jc2bal_N1000000.npz --headline --native-groups --b 200 --cache /data/results/bootstrap_cache/tests_jc2bal_N1000000 --cache-only;;
            *) echo "FATAL: no model for index ${IDX}"; exit 42;;
          esac
          echo "BOOT TESTS PART ${IDX} COMPLETE"
        resources:
          requests: { memory: "6Gi", cpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "6Gi", cpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: feature.node.kubernetes.io/cpu-model.vendor_id
                operator: In
                values: ["AMD"]
              - key: feature.node.kubernetes.io/cpu-model.family
                operator: In
                values: ["23"]
              - key: feature.node.kubernetes.io/cpu-model.id
                operator: In
                values: ["49"]
              - key: kubernetes.io/hostname
                operator: In
                values: ["igrok-la.cenic.net"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net", "node-2-3.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
