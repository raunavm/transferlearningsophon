apiVersion: batch/v1
kind: Job
metadata:
  # FROZEN-FEATURE EXTRACTION -- g1-l162-lr1e3 (L162, K=162)
  #
  # Reads the 128-d representation the classifier head sees, for the frozen
  # probes in docs/DOWNSTREAM_SUITE.md. NOT the same as the K-way scores that
  # scripts/build_eval_jobs.py caches: a probe fitted on scores measures the
  # head that this arm's own vocabulary trained, which is the variable under
  # study. See experiments/EVAL/extract_features.py.
  #
  # CPU-ONLY ON PURPOSE. Extraction is a forward pass, so a GPU buys speed and
  # not correctness -- and the GPU queue has not scheduled anything in 3.5 days
  # while CPU is uncontended.
  name: extract-g1-l162-lr1e3-raunav
  namespace: cms-ml
spec:
  backoffLimit: 50
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: extract
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          git clone --depth 1 --branch "mtx-s1.6" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow || exit 1

          CKPT=/data/results/g1/g1-l162-lr1e3/net_best_epoch_state.pt
          # weaver writes net_best_epoch_state.pt from ITS OWN best-epoch rule.
          # If it is absent the run did not finish, and extracting from the last
          # epoch instead would silently probe a different model than the one
          # every other number refers to.
          [ -f "${CKPT}" ] || { echo "FATAL: no ${CKPT}. Run unfinished?"; ls -la /data/results/g1/g1-l162-lr1e3 | head -20; exit 1; }

          # features_v2, NOT features. The file list was interleaved by family
          # on 2026-08-27, so a re-extraction now reads DIFFERENT jets than the
          # ones under .../features -- which are what probe-bvc-v1 and the
          # recorded L162-vs-R16_Q1 numbers were computed on. extract_features.py
          # np.save()s unconditionally, so reusing the path would overwrite those
          # inputs with a different sample and silently invalidate a result
          # already in experiments/RUNS.csv. Different sample, different path.
          OUT=/data/results/eval/g1-l162-lr1e3/features_v2
          mkdir -p ${OUT}

          PYTHONUNBUFFERED=1 python3 experiments/EVAL/extract_features.py \
            --checkpoint "${CKPT}" \
            --num-classes 162 \
            --arm L162 \
            --data-config configs/data/JetClassII_base.yaml \
            --data-test /jc2/jet_data/Res2P_0250.parquet /jc2/jet_data/Res34P_1075.parquet /jc2/jet_data/QCD_0350.parquet /jc2/jet_data/Res2P_0251.parquet /jc2/jet_data/Res34P_1076.parquet /jc2/jet_data/QCD_0351.parquet /jc2/jet_data/Res2P_0252.parquet /jc2/jet_data/Res34P_1077.parquet /jc2/jet_data/QCD_0352.parquet /jc2/jet_data/Res2P_0253.parquet /jc2/jet_data/Res34P_1078.parquet /jc2/jet_data/QCD_0353.parquet /jc2/jet_data/Res2P_0254.parquet /jc2/jet_data/Res34P_1079.parquet /jc2/jet_data/QCD_0354.parquet /jc2/jet_data/Res2P_0255.parquet /jc2/jet_data/Res34P_1080.parquet /jc2/jet_data/QCD_0355.parquet /jc2/jet_data/Res2P_0256.parquet /jc2/jet_data/Res34P_1081.parquet /jc2/jet_data/QCD_0356.parquet /jc2/jet_data/Res2P_0257.parquet /jc2/jet_data/Res34P_1082.parquet /jc2/jet_data/QCD_0357.parquet /jc2/jet_data/Res2P_0258.parquet /jc2/jet_data/Res34P_1083.parquet /jc2/jet_data/QCD_0358.parquet /jc2/jet_data/Res2P_0259.parquet /jc2/jet_data/Res34P_1084.parquet /jc2/jet_data/QCD_0359.parquet /jc2/jet_data/Res2P_0260.parquet /jc2/jet_data/Res34P_1085.parquet /jc2/jet_data/QCD_0360.parquet /jc2/jet_data/Res2P_0261.parquet /jc2/jet_data/Res34P_1086.parquet /jc2/jet_data/QCD_0361.parquet /jc2/jet_data/Res2P_0262.parquet /jc2/jet_data/Res34P_1087.parquet /jc2/jet_data/QCD_0362.parquet /jc2/jet_data/Res2P_0263.parquet /jc2/jet_data/Res34P_1088.parquet /jc2/jet_data/QCD_0363.parquet /jc2/jet_data/Res2P_0264.parquet /jc2/jet_data/Res34P_1089.parquet /jc2/jet_data/QCD_0364.parquet /jc2/jet_data/Res2P_0265.parquet /jc2/jet_data/Res34P_1090.parquet /jc2/jet_data/QCD_0365.parquet /jc2/jet_data/Res2P_0266.parquet /jc2/jet_data/Res34P_1091.parquet /jc2/jet_data/QCD_0366.parquet /jc2/jet_data/Res2P_0267.parquet /jc2/jet_data/Res34P_1092.parquet /jc2/jet_data/QCD_0367.parquet /jc2/jet_data/Res2P_0268.parquet /jc2/jet_data/Res34P_1093.parquet /jc2/jet_data/QCD_0368.parquet /jc2/jet_data/Res2P_0269.parquet /jc2/jet_data/Res34P_1094.parquet /jc2/jet_data/QCD_0369.parquet /jc2/jet_data/Re