apiVersion: batch/v1
kind: Job
metadata:
  # The class pairs of the linear probes from their 188-way output on the class-balanced JetClass-II test jets (PI
  # 2026-11-21: both modes one read-out on the same jets; the two pre-registered pairs added). CPU, nothing trained.
  name: pairs188-probe-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.21 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          python3 experiments/FT/roc_points.py pairs188 --mode probe --models mtx-l188-s1 mtx-l188-s2 mtx-l188-s3 mtx-l162-s1 mtx-l162-s2 mtx-l162-s3 mtx-r42q1-s1 mtx-r42q1-s2 mtx-r42q1-s3 mtx-r16q1-s1 mtx-r16q1-s2 mtx-r16q1-s3 mtx-l162mass-s1 mtx-l162mass-s2 mtx-r16q1mass-s1 mtx-r16q1mass-s2 mtx-rand2p1-s1 mtx-rand2p2-s2 mtx-rand2p3-s1 mtx-rand2p4-s2 mtx-rand2p5-s2 mtx-flavf0-s1 mtx-flavf0-s2 mtx-flavf1-s1 mtx-flavf1-s2 mtx-flavf1r-s1 mtx-flavf1r-s2  init-s1 init-s2 init-s3 \
            --out-dir /data/results/ft_v2/curves_v2/pairs188_probe
        resources:
          requests: { memory: "8Gi", cpu: "4", ephemeral-storage: "5Gi" }
          limits:   { memory: "8Gi", cpu: "4", ephemeral-storage: "5Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
