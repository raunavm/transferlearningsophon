          same_ckpt /data/results/eval/umap_v3/features/qg/mtx-r42q1-s1/ft ${C_qg_2}/net_best_epoch_state.pt
          CK3=$(python3 -c "import json, sys; d = [json.load(open(p)) for p in sys.argv[1:]]; assert len({x['checkpoint_sha256'] for x in d}) == 1, 'the probes read different checkpoints'; print(d[0]['checkpoint'])" /data/results/eval/v2_linprobe/mtx-r16q1-s1/jc1/test/best70/manifest.json /data/results/eval/v2_linprobe_bal/mtx-r16q1-s1/jc2bal/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-r16q1-s1/top/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-r16q1-s1/qg/test/best70/manifest.json) || exit 42
          echo "mtx-r16q1-s1 frozen: ${CK3}"
