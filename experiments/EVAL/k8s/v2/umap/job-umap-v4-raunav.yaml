          C_jc2_2=/data/results/ft_v2/fixed/leg_jc2b/r42q1-s1/N1000000/s1; done_cell ${C_jc2_2}
          same_ckpt /data/results/eval/umap_v3/features/jc2/mtx-r42q1-s1/frozen ${CK2}
          C_top_2=/data/results/ft_v2/best70/leg_top/r42q1-s1/N1200000/s1; done_cell ${C_top_2}
          same_ckpt /data/results/eval/umap_v3/features/top/mtx-r42q1-s1/frozen ${CK2}
          same_ckpt /data/results/eval/umap_v3/features/top/mtx-r42q1-s1/ft ${C_top_2}/net_best_epoch_state.pt
