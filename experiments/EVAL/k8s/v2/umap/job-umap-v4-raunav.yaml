apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_umap_jobs.py -- the UMAP figures (PI 2026-11-05; round 5, L12). Writes new files only.
  name: umap-v4-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 12
  parallelism: 6
  backoffLimit: 1
  activeDeadlineSeconds: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.14 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          git rev-parse HEAD
          retry pip install --no-cache-dir -q umap-learn==0.5.7 pyarrow==25.0.1 || exit 1
          python3 -c "import pyarrow" || { echo "FATAL: pyarrow does not import"; exit 1; }
          export OMP_NUM_THREADS=7 MKL_NUM_THREADS=7      # torch would otherwise size its pool to the host
          [ ! -f /data/results/eval/umap_v4/DONE ] || { echo "/data/results/eval/umap_v4 done"; exit 0; }
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 90 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          JC1=""; for C in HToBB HToCC HToGG HToWW2Q1L HToWW4Q TTBar TTBarLep WToQQ ZToQQ ZJetsToNuNu; do JC1="${JC1} $(ls /data/JetClass/Pythia/test_20M/${C}_*.root | sort | head -1)"; done
          [ "$(echo ${JC1} | wc -w)" -eq 10 ] || { echo "FATAL: JetClass test files"; exit 42; }
          done_cell () { [ -f $1/DONE ] && [ -f $1/net_best_epoch_state.pt ] || { echo "FATAL: $1 is not done"; exit 42; }; echo "fine-tuned: $1"; }
          # same_ckpt DIR CHECKPOINT: a reused extraction must be of the checkpoint this job would read
          same_ckpt () { python3 -c "import json, sys; sys.exit(json.load(open(sys.argv[1] + '/extract_manifest.json'))['checkpoint'] != sys.argv[2])" $1 $2 || { echo "FATAL: $1 is not of $2"; exit 42; }; }
          # x TASK KIND MODEL CHECKPOINT K REG CONFIG STRIDE FILES...: the class token on FILES, every STRIDE-th jet, one loader
          # worker; REG the checkpoint head's regression outputs after its K classes
          x () {
            local D=/data/results/eval/umap_v4/features/$1/$3/$2 ARM=UMAP_$1_$3_$2 CKPT=$4 K=$5 REG=$6 CFG=$7 STRIDE=$8
            shift 8
            [ -f ${D}/extract_manifest.json ] && return 0
            python3 experiments/EVAL/extract_features.py --checkpoint ${CKPT} --num-classes ${K} --num-reg ${REG} --arm ${ARM} \
              --data-config ${CFG} --data-test "$@" --observers jet_pt --stride ${STRIDE} --num-workers 1 --out ${D}
          }
          CK0=$(python3 -c "import json, sys; d = [json.load(open(p)) for p in sys.argv[1:]]; assert len({x['checkpoint_sha256'] for x in d}) == 1, 'the probes read different checkpoints'; print(d[0]['checkpoint'])" /data/results/eval/v2_linprobe/mtx-l188-s1/jc1/test/best70/manifest.json /data/results/eval/v2_linprobe_bal/mtx-l188-s1/jc2bal/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-l188-s1/top/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-l188-s1/qg/test/best70/manifest.json) || exit 42
          echo "mtx-l188-s1 frozen: ${CK0}"
          C_jc1_0=/data/results/ft_v2/fixed/leg2/l188-s1/N1000000/s1; done_cell ${C_jc1_0}
          same_ckpt /data/results/eval/umap_v3/features/jc1/mtx-l188-s1/frozen ${CK0}
          C_jc2_0=/data/results/ft_v2/fixed/leg_jc2b/l188-s1/N1000000/s1; done_cell ${C_jc2_0}
          same_ckpt /data/results/eval/umap_v3/features/jc2/mtx-l188-s1/frozen ${CK0}
          C_top_0=/data/results/ft_v2/best70/leg_top/l188-s1/N1200000/s1; done_cell ${C_top_0}
          same_ckpt /data/results/eval/umap_v3/features/top/mtx-l188-s1/frozen ${CK0}
          same_ckpt /data/results/eval/umap_v3/features/top/mtx-l188-s1/ft ${C_top_0}/net_best_epoch_state.pt
          C_qg_0=/data/results/ft_v2/best70/leg_qg/l188-s1/N1600000/s1; done_cell ${C_qg_0}
          same_ckpt /data/results/eval/umap_v3/features/qg/mtx-l188-s1/frozen ${CK0}
          same_ckpt /data/results/eval/umap_v3/features/qg/mtx-l188-s1/ft ${C_qg_0}/net_best_epoch_state.pt
          CK1=$(python3 -c "import json, sys; d = [json.load(open(p)) for p in sys.argv[1:]]; assert len({x['checkpoint_sha256'] for x in d}) == 1, 'the probes read different checkpoints'; print(d[0]['checkpoint'])" /data/results/eval/v2_linprobe/mtx-l162-s1/jc1/test/best70/manifest.json /data/results/eval/v2_linprobe_bal/mtx-l162-s1/jc2bal/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-l162-s1/top/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-l162-s1/qg/test/best70/manifest.json) || exit 42
          echo "mtx-l162-s1 frozen: ${CK1}"
          C_jc1_1=/data/results/ft_v2/fixed/leg2/l162-s1/N1000000/s1; done_cell ${C_jc1_1}
          same_ckpt /data/results/eval/umap_v3/features/jc1/mtx-l162-s1/frozen ${CK1}
          C_jc2_1=/data/results/ft_v2/fixed/leg_jc2b/l162-s1/N1000000/s1; done_cell ${C_jc2_1}
          same_ckpt /data/results/eval/umap_v3/features/jc2/mtx-l162-s1/frozen ${CK1}
          C_top_1=/data/results/ft_v2/best70/leg_top/l162-s1/N1200000/s1; done_cell ${C_top_1}
          same_ckpt /data/results/eval/umap_v3/features/top/mtx-l162-s1/frozen ${CK1}
          same_ckpt /data/results/eval/umap_v3/features/top/mtx-l162-s1/ft ${C_top_1}/net_best_epoch_state.pt
          C_qg_1=/data/results/ft_v2/best70/leg_qg/l162-s1/N1600000/s1; done_cell ${C_qg_1}
          same_ckpt /data/results/eval/umap_v3/features/qg/mtx-l162-s1/frozen ${CK1}
          same_ckpt /data/results/eval/umap_v3/features/qg/mtx-l162-s1/ft ${C_qg_1}/net_best_epoch_state.pt
          CK2=$(python3 -c "import json, sys; d = [json.load(open(p)) for p in sys.argv[1:]]; assert len({x['checkpoint_sha256'] for x in d}) == 1, 'the probes read different checkpoints'; print(d[0]['checkpoint'])" /data/results/eval/v2_linprobe/mtx-r42q1-s1/jc1/test/best70/manifest.json /data/results/eval/v2_linprobe_bal/mtx-r42q1-s1/jc2bal/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-r42q1-s1/top/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-r42q1-s1/qg/test/best70/manifest.json) || exit 42
          echo "mtx-r42q1-s1 frozen: ${CK2}"
