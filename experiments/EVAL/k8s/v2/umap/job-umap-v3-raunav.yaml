apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_umap_jobs.py -- the UMAP figures (PI 2026-11-05; round 5, L12). Writes new files only.
  name: umap-v3-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 32
  parallelism: 12
  backoffLimit: 1
  activeDeadlineSeconds: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q https://github.com/raunavm/transferlearningsophon.git tls && git -C tls checkout -q ab5f709cfda5ac113fa7ceb939eeda171e853c4c; }
          retry clone || exit 1
          cd /workspace/tls
          git rev-parse HEAD
          retry pip install --no-cache-dir -q umap-learn==0.5.7 pyarrow==25.0.1 || exit 1
          python3 -c "import pyarrow" || { echo "FATAL: pyarrow does not import"; exit 1; }
          export OMP_NUM_THREADS=7 MKL_NUM_THREADS=7      # torch would otherwise size its pool to the host
          [ ! -f /data/results/eval/umap_v3/DONE ] || { echo "/data/results/eval/umap_v3 done"; exit 0; }
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 89 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          JC1=""; for C in HToBB HToCC HToGG HToWW2Q1L HToWW4Q TTBar TTBarLep WToQQ ZToQQ ZJetsToNuNu; do JC1="${JC1} $(ls /data/JetClass/Pythia/test_20M/${C}_*.root | sort | head -1)"; done
          [ "$(echo ${JC1} | wc -w)" -eq 10 ] || { echo "FATAL: JetClass test files"; exit 42; }
          # the JetClass-II cell at 1e6 the paper reports: the long budget where it is done, else the standard one
          jc2_cell () { for R in /data/results/ft_v2/budget_long /data/results/ft_v2/budget; do [ -f ${R}/leg_jc2b/$1/N1000000/s1/DONE ] && { echo ${R}/leg_jc2b/$1/N1000000/s1; return 0; }; done; return 1; }
          done_cell () { [ -f $1/DONE ] && [ -f $1/net_best_epoch_state.pt ] || { echo "FATAL: $1 is not done"; exit 42; }; echo "fine-tuned: $1"; }
          # x TASK KIND MODEL CHECKPOINT K REG CONFIG STRIDE FILES...: the class token on FILES, every STRIDE-th jet, one loader
          # worker; REG the checkpoint head's regression outputs after its K classes
          x () {
            local D=/data/results/eval/umap_v3/features/$1/$3/$2 ARM=UMAP_$1_$3_$2 CKPT=$4 K=$5 REG=$6 CFG=$7 STRIDE=$8
            shift 8
            [ -f ${D}/extract_manifest.json ] && return 0
            python3 experiments/EVAL/extract_features.py --checkpoint ${CKPT} --num-classes ${K} --num-reg ${REG} --arm ${ARM} \
              --data-config ${CFG} --data-test "$@" --observers jet_pt --stride ${STRIDE} --num-workers 1 --out ${D}
          }
          for D in /data/results/eval/umap_v2/features/{jc1,jc2,top,qg}/mtx-l188-s1/{frozen,ft}; do [ -f ${D}/extract_manifest.json ] || { echo "FATAL: no ${D}"; exit 42; }; done
          CK1=$(python3 -c "import json, sys; d = [json.load(open(p)) for p in sys.argv[1:]]; assert len({x['checkpoint_sha256'] for x in d}) == 1, 'the probes read different checkpoints'; print(d[0]['checkpoint'])" /data/results/eval/v2_linprobe/mtx-l162-s1/jc1/test/best70/manifest.json /data/results/eval/v2_linprobe_bal/mtx-l162-s1/jc2bal/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-l162-s1/top/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-l162-s1/qg/test/best70/manifest.json) || exit 42
          echo "mtx-l162-s1 frozen: ${CK1}"
          C_jc1_1=/data/results/ft_v2/budget_long/leg2/l162-s1/N1000000/s1; done_cell ${C_jc1_1}
          C_jc2_1=$(jc2_cell l162-s1) || { echo "FATAL: no JetClass-II cell of l162-s1 is done"; exit 42; }; done_cell ${C_jc2_1}
          C_top_1=/data/results/ft_v2/best70/leg_top/l162-s1/N1200000/s1; done_cell ${C_top_1}
          C_qg_1=/data/results/ft_v2/best70/leg_qg/l162-s1/N1600000/s1; done_cell ${C_qg_1}
          CK2=$(python3 -c "import json, sys; d = [json.load(open(p)) for p in sys.argv[1:]]; assert len({x['checkpoint_sha256'] for x in d}) == 1, 'the probes read different checkpoints'; print(d[0]['checkpoint'])" /data/results/eval/v2_linprobe/mtx-r42q1-s1/jc1/test/best70/manifest.json /data/results/eval/v2_linprobe_bal/mtx-r42q1-s1/jc2bal/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-r42q1-s1/top/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-r42q1-s1/qg/test/best70/manifest.json) || exit 42
          echo "mtx-r42q1-s1 frozen: ${CK2}"
          C_jc1_2=/data/results/ft_v2/budget_long/leg2/r42q1-s1/N1000000/s1; done_cell ${C_jc1_2}
          C_jc2_2=$(jc2_cell r42q1-s1) || { echo "FATAL: no JetClass-II cell of r42q1-s1 is done"; exit 42; }; done_cell ${C_jc2_2}
          C_top_2=/data/results/ft_v2/best70/leg_top/r42q1-s1/N1200000/s1; done_cell ${C_top_2}
          C_qg_2=/data/results/ft_v2/best70/leg_qg/r42q1-s1/N1600000/s1; done_cell ${C_qg_2}
          for D in /data/results/eval/umap_v2/features/{jc1,jc2,top,qg}/mtx-r16q1-s1/{frozen,ft}; do [ -f ${D}/extract_manifest.json ] || { echo "FATAL: no ${D}"; exit 42; }; done
          CK4=$(python3 -c "import json, sys; d = [json.load(open(p)) for p in sys.argv[1:]]; assert len({x['checkpoint_sha256'] for x in d}) == 1, 'the probes read different checkpoints'; print(d[0]['checkpoint'])" /data/results/eval/v2_linprobe/mtx-l162mass-s1/jc1/test/best70/manifest.json /data/results/eval/v2_linprobe_bal/mtx-l162mass-s1/jc2bal/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-l162mass-s1/top/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-l162mass-s1/qg/test/best70/manifest.json) || exit 42
          echo "mtx-l162mass-s1 frozen: ${CK4}"
          C_jc1_4=/data/results/ft_v2/budget_long/leg2/l162mass-s1/N1000000/s1; done_cell ${C_jc1_4}
          C_jc2_4=$(jc2_cell l162mass-s1) || { echo "FATAL: no JetClass-II cell of l162mass-s1 is done"; exit 42; }; done_cell ${C_jc2_4}
          C_top_4=/data/results/ft_v2/best70/leg_top/l162mass-s1/N1200000/s1; done_cell ${C_top_4}
          C_qg_4=/data/results/ft_v2/best70/leg_qg/l162mass-s1/N1600000/s1; done_cell ${C_qg_4}
          CK5=$(python3 -c "import json, sys; d = [json.load(open(p)) for p in sys.argv[1:]]; assert len({x['checkpoint_sha256'] for x in d}) == 1, 'the probes read different checkpoints'; print(d[0]['checkpoint'])" /data/results/eval/v2_linprobe/mtx-r16q1mass-s1/jc1/test/best70/manifest.json /data/results/eval/v2_linprobe_bal/mtx-r16q1mass-s1/jc2bal/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-r16q1mass-s1/top/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-r16q1mass-s1/qg/test/best70/manifest.json) || exit 42
          echo "mtx-r16q1mass-s1 frozen: ${CK5}"
          C_jc1_5=/data/results/ft_v2/budget_long/leg2/r16q1mass-s1/N1000000/s1; done_cell ${C_jc1_5}
          C_jc2_5=$(jc2_cell r16q1mass-s1) || { echo "FATAL: no JetClass-II cell of r16q1mass-s1 is done"; exit 42; }; done_cell ${C_jc2_5}
          C_top_5=/data/results/ft_v2/best70/leg_top/r16q1mass-s1/N1200000/s1; done_cell ${C_top_5}
          C_qg_5=/data/results/ft_v2/best70/leg_qg/r16q1mass-s1/N1600000/s1; done_cell ${C_qg_5}
          for D in /data/results/eval/xbx/mtx-{l188-s1,l162-s1,r42q1-s1,r16q1-s1,l162mass-s1,r16q1mass-s1}/{xbb,xbs,qcd}/eval/best70; do [ -f ${D}/manifest.json ] || { echo "FATAL: no ${D}"; exit 42; }; done
          case ${JOB_COMPLETION_INDEX} in
            0) x jc2 frozen mtx-l162-s1 ${CK1} 162 0 configs/data/JetClassII_base.yaml 2 /data/finetune/jc2_bal/test.parquet ;;
            1) x jc2 ft mtx-l162-s1 ${C_jc2_1}/net_best_epoch_state.pt 188 0 configs/data/JetClassII_base.yaml 2 /data/finetune/jc2_bal/test.parquet ;;
            2) x jc2 frozen mtx-r42q1-s1 ${CK2} 43 0 configs/data/JetClassII_base.yaml 2 /data/finetune/jc2_bal/test.parquet ;;
            3) x jc2 ft mtx-r42q1-s1 ${C_jc2_2}/net_best_epoch_state.pt 188 0 configs/data/JetClassII_base.yaml 2 /data/finetune/jc2_bal/test.parquet ;;
            4) x jc2 frozen mtx-l162mass-s1 ${CK4} 162 1 configs/data/JetClassII_base.yaml 2 /data/finetune/jc2_bal/test.parquet ;;
            5) x jc2 ft mtx-l162mass-s1 ${C_jc2_4}/net_best_epoch_state.pt 188 0 configs/data/JetClassII_base.yaml 2 /data/finetune/jc2_bal/test.parquet ;;
            6) x jc2 frozen mtx-r16q1mass-s1 ${CK5} 17 1 configs/data/JetClassII_base.yaml 2 /data/finetune/jc2_bal/test.parquet ;;
            7) x jc2 ft mtx-r16q1mass-s1 ${C_jc2_5}/net_best_epoch_state.pt 188 0 configs/data/JetClassII_base.yaml 2 /data/finetune/jc2_bal/test.parquet ;;
            8) x jc1 frozen mtx-l162-s1 ${CK1} 162 0 configs/finetune/JetClassI_sophon_noweight.yaml 10 ${JC1} ;;
            9) x jc1 ft mtx-l162-s1 ${C_jc1_1}/net_best_epoch_state.pt 10 0 configs/finetune/JetClassI_sophon_noweight.yaml 10 ${JC1} ;;
            10) x jc1 frozen mtx-r42q1-s1 ${CK2} 43 0 configs/finetune/JetClassI_sophon_noweight.yaml 10 ${JC1} ;;
            11) x jc1 ft mtx-r42q1-s1 ${C_jc1_2}/net_best_epoch_state.pt 10 0 configs/finetune/JetClassI_sophon_noweight.yaml 10 ${JC1} ;;
            12) x jc1 frozen mtx-l162mass-s1 ${CK4} 162 1 configs/finetune/JetClassI_sophon_noweight.yaml 10 ${JC1} ;;
            13) x jc1 ft mtx-l162mass-s1 ${C_jc1_4}/net_best_epoch_state.pt 10 0 configs/finetune/JetClassI_sophon_noweight.yaml 10 ${JC1} ;;
            14) x jc1 frozen mtx-r16q1mass-s1 ${CK5} 17 1 configs/finetune/JetClassI_sophon_noweight.yaml 10 ${JC1} ;;
            15) x jc1 ft mtx-r16q1mass-s1 ${C_jc1_5}/net_best_epoch_state.pt 10 0 configs/finetune/JetClassI_sophon_noweight.yaml 10 ${JC1} ;;
            16) x top frozen mtx-l162-s1 ${CK1} 162 0 configs/finetune/TopReference.yaml 20 /data/finetune/top/top_test.parquet ;;
            17) x top ft mtx-l162-s1 ${C_top_1}/net_best_epoch_state.pt 2 0 configs/finetune/TopReference.yaml 20 /data/finetune/top/top_test.parquet ;;
            18) x top frozen mtx-r42q1-s1 ${CK2} 43 0 configs/finetune/TopReference.yaml 20 /data/finetune/top/top_test.parquet ;;
            19) x top ft mtx-r42q1-s1 ${C_top_2}/net_best_epoch_state.pt 2 0 configs/finetune/TopReference.yaml 20 /data/finetune/top/top_test.parquet ;;
            20) x top frozen mtx-l162mass-s1 ${CK4} 162 1 configs/finetune/TopReference.yaml 20 /data/finetune/top/top_test.parquet ;;
            21) x top ft mtx-l162mass-s1 ${C_top_4}/net_best_epoch_state.pt 2 0 configs/finetune/TopReference.yaml 20 /data/finetune/top/top_test.parquet ;;
            22) x top frozen mtx-r16q1mass-s1 ${CK5} 17 1 configs/finetune/TopReference.yaml 20 /data/finetune/top/top_test.parquet ;;
            23) x top ft mtx-r16q1mass-s1 ${C_top_5}/net_best_epoch_state.pt 2 0 configs/finetune/TopReference.yaml 20 /data/finetune/top/top_test.parquet ;;
            24) x qg frozen mtx-l162-s1 ${CK1} 162 0 configs/finetune/EnergyFlowQG.yaml 10 /data/finetune/qg_v2/qg_chunk18.parquet /data/finetune/qg_v2/qg_chunk19.parquet ;;
            25) x qg ft mtx-l162-s1 ${C_qg_1}/net_best_epoch_state.pt 2 0 configs/finetune/EnergyFlowQG.yaml 10 /data/finetune/qg_v2/qg_chunk18.parquet /data/finetune/qg_v2/qg_chunk19.parquet ;;
            26) x qg frozen mtx-r42q1-s1 ${CK2} 43 0 configs/finetune/EnergyFlowQG.yaml 10 /data/finetune/qg_v2/qg_chunk18.parquet /data/finetune/qg_v2/qg_chunk19.parquet ;;
            27) x qg ft mtx-r42q1-s1 ${C_qg_2}/net_best_epoch_state.pt 2 0 configs/finetune/EnergyFlowQG.yaml 10 /data/finetune/qg_v2/qg_chunk18.parquet /data/finetune/qg_v2/qg_chunk19.parquet ;;
            28) x qg frozen mtx-l162mass-s1 ${CK4} 162 1 configs/finetune/EnergyFlowQG.yaml 10 /data/finetune/qg_v2/qg_chunk18.parquet /data/finetune/qg_v2/qg_chunk19.parquet ;;
            29) x qg ft mtx-l162mass-s1 ${C_qg_4}/net_best_epoch_state.pt 2 0 configs/finetune/EnergyFlowQG.yaml 10 /data/finetune/qg_v2/qg_chunk18.parquet /data/finetune/qg_v2/qg_chunk19.parquet ;;
            30) x qg frozen mtx-r16q1mass-s1 ${CK5} 17 1 configs/finetune/EnergyFlowQG.yaml 10 /data/finetune/qg_v2/qg_chunk18.parquet /data/finetune/qg_v2/qg_chunk19.parquet ;;
            31) x qg ft mtx-r16q1mass-s1 ${C_qg_5}/net_best_epoch_state.pt 2 0 configs/finetune/EnergyFlowQG.yaml 10 /data/finetune/qg_v2/qg_chunk18.parquet /data/finetune/qg_v2/qg_chunk19.parquet ;;
            *) echo "FATAL: no extraction for index ${JOB_COMPLETION_INDEX}"; exit 42 ;;
          esac
          N=$(find /data/results/eval/umap_v3/features -mindepth 4 -maxdepth 4 -name extract_manifest.json | wc -l)
          [ "${N}" -eq 32 ] || { echo "extraction ${JOB_COMPLETION_INDEX} in; ${N} of 32"; exit 0; }
          mkdir /data/results/eval/umap_v3/fit.lock 2>/dev/null || { echo "another pod fits the UMAPs"; exit 0; }
          for D in /data/results/eval/umap_v2/features/{jc1,jc2,top,qg}/mtx-{l188-s1,r16q1-s1}/{frozen,ft}; do L=/data/results/eval/umap_v3/features/${D#/data/results/eval/umap_v2/features/}; mkdir -p $(dirname ${L}); [ -e ${L} ] || ln -s ${D} ${L}; done
          python3 experiments/EVAL/umap_class_token.py --feat-dir /data/results/eval/umap_v3/features --out-dir /data/results/eval/umap_v3 || { rmdir /data/results/eval/umap_v3/fit.lock; exit 1; }
          touch /data/results/eval/umap_v3/DONE
          echo "UMAP COMPLETE"
        resources:
          requests: { memory: "48Gi", cpu: "8", ephemeral-storage: "20Gi" }
          limits:   { memory: "48Gi", cpu: "8", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
