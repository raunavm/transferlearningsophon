apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_umap_jobs.py -- the UMAP figures (PI 2026-11-05, round 3). Writes new files only.
  name: umap-v2-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 43200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s2.76 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          git rev-parse HEAD
          retry pip install --no-cache-dir -q umap-learn==0.5.7 pyarrow==25.0.1 || exit 1
          python3 -c "import pyarrow" || { echo "FATAL: pyarrow does not import"; exit 1; }
          python3 experiments/FT/gpu_probe.py || { sleep 120; exit 43; }
          [ ! -f /data/results/eval/umap_v2/DONE ] || { echo "/data/results/eval/umap_v2 done"; exit 0; }
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 85 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          JC1=""; for C in HToBB HToCC HToGG HToWW2Q1L HToWW4Q TTBar TTBarLep WToQQ ZToQQ ZJetsToNuNu; do JC1="${JC1} $(ls /data/JetClass/Pythia/test_20M/${C}_*.root | sort | head -1)"; done
          [ "$(echo ${JC1} | wc -w)" -eq 10 ] || { echo "FATAL: JetClass test files"; exit 42; }
          # the JetClass-II cell at 1e6 the paper reports: the long budget where it is done, else the standard one
          jc2_cell () { for R in /data/results/ft_v2/budget_long /data/results/ft_v2/budget; do [ -f ${R}/leg_jc2b/$1/N1000000/s1/DONE ] && { echo ${R}/leg_jc2b/$1/N1000000/s1; return 0; }; done; return 1; }
          done_cell () { [ -f $1/DONE ] && [ -f $1/net_best_epoch_state.pt ] || { echo "FATAL: $1 is not done"; exit 42; }; echo "fine-tuned: $1"; }
          # x TASK KIND MODEL CHECKPOINT K CONFIG STRIDE FILES...: the class token on FILES, every STRIDE-th jet, one loader worker
          x () {
            local D=/data/results/eval/umap_v2/features/$1/$3/$2 ARM=UMAP_$1_$3_$2 CKPT=$4 K=$5 CFG=$6 STRIDE=$7
            shift 7
            [ -f ${D}/extract_manifest.json ] && return 0
            python3 experiments/EVAL/extract_features.py --checkpoint ${CKPT} --num-classes ${K} --arm ${ARM} \
              --data-config ${CFG} --data-test "$@" --observers jet_pt --stride ${STRIDE} --num-workers 1 --out ${D}
          }
          CK0=$(python3 -c "import json, sys; d = [json.load(open(p)) for p in sys.argv[1:]]; assert len({x['checkpoint_sha256'] for x in d}) == 1, 'the probes read different checkpoints'; print(d[0]['checkpoint'])" /data/results/eval/v2_linprobe/mtx-l188-s1/jc1/test/best70/manifest.json /data/results/eval/v2_linprobe_bal/mtx-l188-s1/jc2bal/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-l188-s1/top/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-l188-s1/qg/test/best70/manifest.json) || exit 42
          echo "mtx-l188-s1 frozen: ${CK0}"
          C_jc1_0=/data/results/ft_v2/budget_long/leg2/l188-s1/N1000000/s1; done_cell ${C_jc1_0}
          C_jc2_0=$(jc2_cell l188-s1) || { echo "FATAL: no JetClass-II cell of l188-s1 is done"; exit 42; }; done_cell ${C_jc2_0}
          C_top_0=/data/results/ft_v2/best70/leg_top/l188-s1/N1200000/s1; done_cell ${C_top_0}
          C_qg_0=/data/results/ft_v2/best70/leg_qg/l188-s1/N1600000/s1; done_cell ${C_qg_0}
          CK1=$(python3 -c "import json, sys; d = [json.load(open(p)) for p in sys.argv[1:]]; assert len({x['checkpoint_sha256'] for x in d}) == 1, 'the probes read different checkpoints'; print(d[0]['checkpoint'])" /data/results/eval/v2_linprobe/mtx-r16q1-s1/jc1/test/best70/manifest.json /data/results/eval/v2_linprobe_bal/mtx-r16q1-s1/jc2bal/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-r16q1-s1/top/test/best70/manifest.json /data/results/eval/v2_linprobe/mtx-r16q1-s1/qg/test/best70/manifest.json) || exit 42
          echo "mtx-r16q1-s1 frozen: ${CK1}"
          C_jc1_1=/data/results/ft_v2/budget_long/leg2/r16q1-s1/N1000000/s1; done_cell ${C_jc1_1}
          C_jc2_1=$(jc2_cell r16q1-s1) || { echo "FATAL: no JetClass-II cell of r16q1-s1 is done"; exit 42; }; done_cell ${C_jc2_1}
          C_top_1=/data/results/ft_v2/best70/leg_top/r16q1-s1/N1200000/s1; done_cell ${C_top_1}
          C_qg_1=/data/results/ft_v2/best70/leg_qg/r16q1-s1/N1600000/s1; done_cell ${C_qg_1}
          x jc1 frozen mtx-l188-s1 ${CK0} 188 configs/finetune/JetClassI_sophon_noweight.yaml 10 ${JC1}
          x jc1 ft mtx-l188-s1 ${C_jc1_0}/net_best_epoch_state.pt 10 configs/finetune/JetClassI_sophon_noweight.yaml 10 ${JC1}
          x jc2 frozen mtx-l188-s1 ${CK0} 188 configs/data/JetClassII_base.yaml 1 /data/finetune/jc2_bal/test.parquet
          x jc2 ft mtx-l188-s1 ${C_jc2_0}/net_best_epoch_state.pt 188 configs/data/JetClassII_base.yaml 1 /data/finetune/jc2_bal/test.parquet
          x top frozen mtx-l188-s1 ${CK0} 188 configs/finetune/TopReference.yaml 20 /data/finetune/top/top_test.parquet
          x top ft mtx-l188-s1 ${C_top_0}/net_best_epoch_state.pt 2 configs/finetune/TopReference.yaml 20 /data/finetune/top/top_test.parquet
          x qg frozen mtx-l188-s1 ${CK0} 188 configs/finetune/EnergyFlowQG.yaml 10 /data/finetune/qg_v2/qg_chunk18.parquet /data/finetune/qg_v2/qg_chunk19.parquet
          x qg ft mtx-l188-s1 ${C_qg_0}/net_best_epoch_state.pt 2 configs/finetune/EnergyFlowQG.yaml 10 /data/finetune/qg_v2/qg_chunk18.parquet /data/finetune/qg_v2/qg_chunk19.parquet
          x jc1 frozen mtx-r16q1-s1 ${CK1} 17 configs/finetune/JetClassI_sophon_noweight.yaml 10 ${JC1}
          x jc1 ft mtx-r16q1-s1 ${C_jc1_1}/net_best_epoch_state.pt 10 configs/finetune/JetClassI_sophon_noweight.yaml 10 ${JC1}
          x jc2 frozen mtx-r16q1-s1 ${CK1} 17 configs/data/JetClassII_base.yaml 1 /data/finetune/jc2_bal/test.parquet
          x jc2 ft mtx-r16q1-s1 ${C_jc2_1}/net_best_epoch_state.pt 188 configs/data/JetClassII_base.yaml 1 /data/finetune/jc2_bal/test.parquet
          x top frozen mtx-r16q1-s1 ${CK1} 17 configs/finetune/TopReference.yaml 20 /data/finetune/top/top_test.parquet
          x top ft mtx-r16q1-s1 ${C_top_1}/net_best_epoch_state.pt 2 configs/finetune/TopReference.yaml 20 /data/finetune/top/top_test.parquet
          x qg frozen mtx-r16q1-s1 ${CK1} 17 configs/finetune/EnergyFlowQG.yaml 10 /data/finetune/qg_v2/qg_chunk18.parquet /data/finetune/qg_v2/qg_chunk19.parquet
          x qg ft mtx-r16q1-s1 ${C_qg_1}/net_best_epoch_state.pt 2 configs/finetune/EnergyFlowQG.yaml 10 /data/finetune/qg_v2/qg_chunk18.parquet /data/finetune/qg_v2/qg_chunk19.parquet
          python3 experiments/EVAL/umap_class_token.py --feat-dir /data/results/eval/umap_v2/features --out-dir /data/results/eval/umap_v2
          touch /data/results/eval/umap_v2/DONE
          echo "UMAP COMPLETE"
        resources:
          requests: { memory: "64Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "64Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
