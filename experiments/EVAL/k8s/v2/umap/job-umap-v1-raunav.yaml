apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_umap_jobs.py -- the UMAP figures (PI 2026-11-05). Writes new files only.
  name: umap-v1-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s2.71 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          git rev-parse HEAD
          retry pip install --no-cache-dir -q umap-learn==0.5.7 || exit 1
          python3 experiments/FT/gpu_probe.py || { sleep 120; exit 43; }
          [ ! -f /data/results/eval/umap_v1/DONE ] || { echo "/data/results/eval/umap_v1 done"; exit 0; }
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 85 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          FILES=""; for C in HToBB HToCC HToGG HToWW2Q1L HToWW4Q TTBar TTBarLep WToQQ ZToQQ ZJetsToNuNu; do FILES="${FILES} $(ls /data/JetClass/Pythia/test_20M/${C}_*.root | sort | head -1)"; done
          [ "$(echo ${FILES} | wc -w)" -eq 10 ] || { echo "FATAL: JetClass test files"; exit 42; }
          # x KIND MODEL CHECKPOINT K: the class token on FILES, every 10th jet, one loader worker
          x () {
            D=/data/results/eval/umap_v1/jc1/$2/$1
            [ -f ${D}/manifest.json ] && return 0
            python3 experiments/EVAL/extract_features.py --checkpoint $3 --num-classes $4 --arm UMAP_$2_$1 \
              --data-config configs/finetune/JetClassI_sophon_noweight.yaml --data-test ${FILES} --observers jet_pt --stride 10 --num-workers 1 --out ${D}
          }
          CK=$(python3 -c "import json; print(json.load(open('/data/results/eval/v2_linprobe/mtx-l188-s1/jc1/test/best70/manifest.json'))['checkpoint'])")
          CELL=/data/results/ft_v2/budget_long/leg2/l188-s1/N1000000/s1
          [ -f ${CELL}/DONE ] && [ -f ${CELL}/net_best_epoch_state.pt ] || { echo "FATAL: ${CELL} is not done"; exit 42; }
          x frozen mtx-l188-s1 ${CK} 188
          x ft mtx-l188-s1 ${CELL}/net_best_epoch_state.pt 10
          CK=$(python3 -c "import json; print(json.load(open('/data/results/eval/v2_linprobe/mtx-r16q1-s1/jc1/test/best70/manifest.json'))['checkpoint'])")
          CELL=/data/results/ft_v2/budget_long/leg2/r16q1-s1/N1000000/s1
          [ -f ${CELL}/DONE ] && [ -f ${CELL}/net_best_epoch_state.pt ] || { echo "FATAL: ${CELL} is not done"; exit 42; }
          x frozen mtx-r16q1-s1 ${CK} 17
          x ft mtx-r16q1-s1 ${CELL}/net_best_epoch_state.pt 10
          python3 experiments/EVAL/umap_class_token.py --jc1-dir /data/results/eval/umap_v1/jc1 --out-dir /data/results/eval/umap_v1
          touch /data/results/eval/umap_v1/DONE
          echo "UMAP COMPLETE"
        resources:
          requests: { memory: "32Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "32Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
