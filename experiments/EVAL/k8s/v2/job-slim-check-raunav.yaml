apiVersion: batch/v1
kind: Job
metadata:
  # Before the switch to reduced head outputs (PI 2026-11-21): one network's full output (the 188-class network of seed
  # 1, v2_ft_head) and its reduced file give the same sculpting document, number for number. CPU, writes ~50 MB.
  name: slim-check-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.21 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          O=/data/results/eval/slim_check/mtx-l188-s1
          [ ! -e ${O} ] || { echo "FATAL: ${O} exists"; exit 42; }
          python3 experiments/EVAL/slim_head_outputs.py --full /data/results/eval/v2_ft_head/mtx-l188-s1 --label-set L188 --out ${O}
          python3 -c "import json, sys, importlib.util as u; s = u.spec_from_file_location('ms', 'experiments/EVAL/mass_sculpting.py'); m = u.module_from_spec(s); s.loader.exec_module(m); a = m.head_doc(__import__('pathlib').Path(sys.argv[1]), 'L188'); b = m.head_doc(__import__('pathlib').Path(sys.argv[2]), 'L188'); d = sorted(k for k in a if k not in ('head', 'head_outputs_sha256') and a[k] != b[k]); print('IDENTICAL' if not d else 'DIFFER ' + str(d)); print(json.dumps(a['working_points'])); print(json.dumps(b['working_points'])); sys.exit(1 if d else 0)" /data/results/eval/v2_ft_head/mtx-l188-s1 ${O}
          ls -la /data/results/eval/v2_ft_head/mtx-l188-s1 ${O}
        resources:
          requests: { memory: "10Gi", cpu: "4", ephemeral-storage: "5Gi" }
          limits:   { memory: "10Gi", cpu: "4", ephemeral-storage: "5Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
