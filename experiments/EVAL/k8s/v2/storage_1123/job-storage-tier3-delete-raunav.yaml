apiVersion: batch/v1
kind: Job
metadata:
  # The approved deletion of tier 3 (PI 2026-11-23, LEDGER ST-6): 72 superseded render folders and the unpacked copy of the
  # network archive (archive.tgz and test outputs stay). Before it, tiers 1-2 (ST-5): the only copies of the 152 trained
  # networks were archived, fetched to the laptop (archive/networks_1123, every file sha256-checked) and the manifests
  # committed (experiments/EVAL/manifests/storage_1123_tier{1,2}.csv). scripts/storage_tiers.py delete: each manifest's
  # sha256 is checked first, then exactly its rows whose file re-hashes to the manifest value are deleted. CPU.
  name: storage-tier3-delete-raunav
  namespace: cms-ml
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.55 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          df -h /data | tail -1
          python3 scripts/storage_tiers.py delete --manifest /data/results/storage_1123/tier3.csv --sha256 1e1665a3e20d831b18fa57346d04bbb608140c976650abd43d6d414dc527c309
          cut -f1 /data/results/storage_1123/tier3.deleted.log | sort | uniq -c
          df -h /data | tail -1
        resources:
          requests: { memory: "4Gi", cpu: "4", ephemeral-storage: "5Gi" }
          limits:   { memory: "4Gi", cpu: "4", ephemeral-storage: "5Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["node-2-3.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
