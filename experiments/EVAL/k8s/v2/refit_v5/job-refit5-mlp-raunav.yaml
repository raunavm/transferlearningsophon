apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_refit_v5_jobs.py -- class-balanced JetClass-II MLP probes of every network on one CPU model (PI 2026-11-14). CPU.
  name: refit5-mlp-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 31
  parallelism: 1
  backoffLimitPerIndex: 2
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s2.98 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          retry pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          IDX=${JOB_COMPLETION_INDEX:?not a pod of an Indexed Job}
          case ${IDX} in
            0) MODEL=mtx-l188-s1; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-l188-s1/DONE;;
            1) MODEL=mtx-l188-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-l188-s2/DONE;;
            2) MODEL=mtx-l188-s3; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-l188-s3/DONE;;
            3) MODEL=mtx-l162-s1; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-l162-s1/DONE;;
            4) MODEL=mtx-l162-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-l162-s2/DONE;;
            5) MODEL=mtx-l162-s3; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-l162-s3/DONE;;
            6) MODEL=mtx-r42q1-s1; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-r42q1-s1/DONE;;
            7) MODEL=mtx-r42q1-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-r42q1-s2/DONE;;
            8) MODEL=mtx-r42q1-s3; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-r42q1-s3/DONE;;
            9) MODEL=mtx-r16q1-s1; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-r16q1-s1/DONE;;
            10) MODEL=mtx-r16q1-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-r16q1-s2/DONE;;
            11) MODEL=mtx-r16q1-s3; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-r16q1-s3/DONE;;
            12) MODEL=mtx-l162mass-s1; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-l162mass-s1/DONE;;
            13) MODEL=mtx-l162mass-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-l162mass-s2/DONE;;
            14) MODEL=mtx-r16q1mass-s1; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-r16q1mass-s1/DONE;;
            15) MODEL=mtx-r16q1mass-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-r16q1mass-s2/DONE;;
            16) MODEL=mtx-rand2p1-s1; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-rand2p1-s1/DONE;;
            17) MODEL=mtx-rand2p2-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-rand2p2-s2/DONE;;
            18) MODEL=mtx-rand2p3-s1; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-rand2p3-s1/DONE;;
            19) MODEL=mtx-rand2p4-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-rand2p4-s2/DONE;;
            20) MODEL=mtx-rand2p5-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-rand2p5-s2/DONE;;
            21) MODEL=mtx-flavf0-s1; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-flavf0-s1/DONE;;
            22) MODEL=mtx-flavf0-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-flavf0-s2/DONE;;
            23) MODEL=mtx-flavf1-s1; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-flavf1-s1/DONE;;
            24) MODEL=mtx-flavf1-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-flavf1-s2/DONE;;
            25) MODEL=mtx-flavf1r-s1; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-flavf1r-s1/DONE;;
            26) MODEL=mtx-flavf1r-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-flavf1r-s2/DONE;;
            27) MODEL=init-s1; CKPTS="init init_bn"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/init-s1/DONE;;
            28) MODEL=init-s2; CKPTS="init init_bn"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/init-s2/DONE;;
            29) MODEL=init-s3; CKPTS="init init_bn"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/init-s3/DONE;;
            30) MODEL=mtx-l188kin-s1; CKPTS="best70"; DS=top; NEED=/data/results/eval/v2_linprobe/mtx-l188kin-s1/top/test/best70/manifest.json;;
            *) echo "FATAL: no model for index ${IDX}"; exit 42;;
          esac
          [ -f /data/results/eval/v2_linprobe_bal/fits_v5_mlp/${MODEL}.json ] && { echo "${MODEL} done"; exit 0; }
          [ -f ${NEED} ] || { echo "FATAL: ${MODEL}'s features are missing (${NEED})"; exit 42; }
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 90 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          python3 experiments/EVAL/probe_bal.py --model ${MODEL} --checkpoints ${CKPTS} --mlp --mlp-datasets ${DS} --out /data/results/eval/v2_linprobe_bal/fits_v5_mlp
          echo "REFIT5 MLP ${MODEL} COMPLETE"
        resources:
          requests: { memory: "12Gi", cpu: "8", ephemeral-storage: "20Gi" }
          limits:   { memory: "12Gi", cpu: "8", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: feature.node.kubernetes.io/cpu-model.vendor_id
                operator: In
                values: ["AMD"]
              - key: feature.node.kubernetes.io/cpu-model.family
                operator: In
                values: ["23"]
              - key: feature.node.kubernetes.io/cpu-model.id
                operator: In
                values: ["49"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
