apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_refit_v5_jobs.py -- v5 probes of the released Sophon checkpoint, with fills. CPU.
  name: refit5-sophon-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 1
  parallelism: 1
  backoffLimitPerIndex: 2
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.13 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          retry pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=8 OPENBLAS_NUM_THREADS=8 MKL_NUM_THREADS=8
          missing () { local n=0 f; for f in /data/results/eval/v2_linprobe_sophon_fill/sophon-released/DONE; do [ -e "${f}" ] || n=$((n+1)); done; echo ${n}; }
          T0=$(date +%s)
          while M=$(missing); [ "${M}" -gt 0 ]; do
            [ $(( $(date +%s) - T0 )) -lt 518400 ] || { echo "FATAL: ${M} inputs missing"; exit 42; }
            echo "$(date -u +%FT%TZ) waiting for ${M} inputs"; sleep 1800
          done
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 90 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          [ -f /data/results/eval/v2_linprobe_sophon/fits_v5/sophon-released.json ] || python3 experiments/EVAL/probe_released.py --model sophon-released --checkpoints released \
            --root /data/results/eval/v2_linprobe_sophon --coarse R42_Q1 R16_Q1 FLAV_F0 --grid v5 --out /data/results/eval/v2_linprobe_sophon/fits_v5 --probs-out /data/results/eval/v2_linprobe_sophon/fits_v5_probs
          [ -f /data/results/eval/v2_linprobe_sophon/fits_v5_fill/sophon-released.json ] || python3 experiments/EVAL/probe_released.py --model sophon-released --checkpoints released \
            --root /data/results/eval/v2_linprobe_sophon --fill-root /data/results/eval/v2_linprobe_sophon_fill --grid v5 --out /data/results/eval/v2_linprobe_sophon/fits_v5_fill \
            --probs-out /data/results/eval/v2_linprobe_sophon/fits_v5_fill_probs
          [ -f /data/results/eval/v2_linprobe_sophon/fits_v5_qcdhf/sophon-released.json ] || python3 experiments/EVAL/qcd_hf_rejection.py --model sophon-released --checkpoints released \
            --probs-root /data/results/eval/v2_linprobe_sophon/fits_v5_probs --features-root /data/results/eval/v2_linprobe_sophon --out /data/results/eval/v2_linprobe_sophon/fits_v5_qcdhf
          echo "REFIT5 SOPHON COMPLETE"
        resources:
          requests: { memory: "24Gi", cpu: "8", ephemeral-storage: "20Gi" }
          limits:   { memory: "24Gi", cpu: "8", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
