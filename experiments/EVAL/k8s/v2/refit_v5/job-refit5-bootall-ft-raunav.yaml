apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_refit_v5_jobs.py -- the paired test-jet bootstrap of every fine-tuned top and quark/gluon network, every printed metric. CPU.
  name: refit5-bootall-ft-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 3
  parallelism: 3
  backoffLimitPerIndex: 2
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.27 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          retry pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 90 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          IDX=${JOB_COMPLETION_INDEX:?not a pod of an Indexed Job}
          case ${IDX} in
            0) [ -e /data/results/bootstrap/l3/ft_top_N1200000.all.json ] || python3 experiments/STATS/paired_bootstrap.py --task top --model mtx-l188-s1=/data/results/ft_v2/best70/leg_top/l188-s1/N1200000/s1 --model mtx-l188-s2=/data/results/ft_v2/best70/leg_top/l188-s2/N1200000/s1 --model mtx-l188-s3=/data/results/ft_v2/best70/leg_top/l188-s3/N1200000/s1 --model mtx-l162-s1=/data/results/ft_v2/best70/leg_top/l162-s1/N1200000/s1 --model mtx-l162-s2=/data/results/ft_v2/best70/leg_top/l162-s2/N1200000/s1 --model mtx-l162-s3=/data/results/ft_v2/best70/leg_top/l162-s3/N1200000/s1 --model mtx-r42q1-s1=/data/results/ft_v2/best70/leg_top/r42q1-s1/N1200000/s1 --model mtx-r42q1-s2=/data/results/ft_v2/best70/leg_top/r42q1-s2/N1200000/s1 --model mtx-r42q1-s3=/data/results/ft_v2/best70/leg_top/r42q1-s3/N1200000/s1 --model mtx-r16q1-s1=/data/results/ft_v2/best70/leg_top/r16q1-s1/N1200000/s1 --model mtx-r16q1-s2=/data/results/ft_v2/best70/leg_top/r16q1-s2/N1200000/s1 --model mtx-r16q1-s3=/data/results/ft_v2/best70/leg_top/r16q1-s3/N1200000/s1 --model mtx-l162mass-s1=/data/results/ft_v2/best70/leg_top/l162mass-s1/N1200000/s1 --model mtx-l162mass-s2=/data/results/ft_v2/best70/leg_top/l162mass-s2/N1200000/s1 --model mtx-r16q1mass-s1=/data/results/ft_v2/best70/leg_top/r16q1mass-s1/N1200000/s1 --model mtx-r16q1mass-s2=/data/results/ft_v2/best70/leg_top/r16q1mass-s2/N1200000/s1 --model mtx-flavf0-s1=/data/results/ft_v2/best70/leg_top/flavf0-s1/N1200000/s1 --model mtx-flavf0-s2=/data/results/ft_v2/best70/leg_top/flavf0-s2/N1200000/s1 --model mtx-flavf1-s1=/data/results/ft_v2/best70/leg_top/flavf1-s1/N1200000/s1 --model mtx-flavf1-s2=/data/results/ft_v2/best70/leg_top/flavf1-s2/N1200000/s1 --model mtx-flavf1r-s1=/data/results/ft_v2/best70/leg_top/flavf1r-s1/N1200000/s1 --model mtx-flavf1r-s2=/data/results/ft_v2/best70/leg_top/flavf1r-s2/N1200000/s1 --model mtx-rand2p1-s1=/data/results/ft_v2/best70/leg_top/rand2p1-s1/N1200000/s1 --model mtx-rand2p2-s2=/data/results/ft_v2/best70/leg_top/r