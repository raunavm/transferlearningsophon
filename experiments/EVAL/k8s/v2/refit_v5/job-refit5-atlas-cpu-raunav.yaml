apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_refit_v5_jobs.py (from build_atlas_res_job.spec) -- the v2 mass refit (PI 2026-11-14): alpha grid v2, MLP epochs recorded, one CPU model. CPU.
  name: refit5-atlas-cpu-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimitPerIndex: 2
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # a signal (OOM, lost node) is retried; any other failure is deterministic
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; echo "HALT: exit $rc, not retried"; exit 42; }
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.04 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          CPU=$(grep -m1 "^model name" /proc/cpuinfo | cut -d: -f2- | sed "s/^ *//;s/ *$//"); [ "${CPU}" = "AMD EPYC 7742 64-Core Processor" ] || { echo "FATAL: this node's CPU is ${CPU}, not AMD EPYC 7742 64-Core Processor: nothing fitted"; exit 42; }
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1
          # BLAS threads = the CPUs requested: nproc reports the node's cores
          export OMP_NUM_THREADS=8 OPENBLAS_NUM_THREADS=8 MKL_NUM_THREADS=8
          IDX=${JOB_COMPLETION_INDEX:?not a pod of an Indexed Job}
          case ${IDX} in
            0) MODEL=mtx-l162-s3; OBS=/data/results/eval/v2_head/mtx-l162-s3/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-l162-s3/jc2/test/best70; ARM=best70; HEAD="";;
            1) MODEL=mtx-r16q1-s3; OBS=/data/results/eval/v2_head/mtx-r16q1-s3/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-r16q1-s3/jc2/test/best70; ARM=best70; HEAD="";;
            *) echo "FATAL: no model for index ${IDX}"; exit 42;;
          esac
          OUT=/data/results/eval/atlas_res_v3
          MASSV3=/data/results/eval/v2_head/${MODEL}/mass_v3.json
          # a fit made on another CPU model leaves the family before its refit (PI 2026-11-21): kept, never deleted, in
          # <folder>.cpu_aside/ with its sha256 and recorded CPU in MANIFEST.tsv; a fit on AMD EPYC 7742 64-Core Processor stays
          aside () {
            local f=$1 got g d
            [ -f "${f}" ] || return 0
            got=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("cpu_model", ""))' "${f}")
            [ "${got}" != "AMD EPYC 7742 64-Core Processor" ] || { echo "${f}: fitted on AMD EPYC 7742 64-Core Processor"; return 0; }
            for g in "$@"; do
              [ -f "${g}" ] || continue
              d=$(dirname "${g}").cpu_aside; mkdir -p "${d}"
              [ ! -e "${d}/$(basename "${g}")" ] || { echo "FATAL: ${d}/$(basename "${g}") exists"; exit 42; }
              printf '%s\t%s\t%s\t%s\t%s\n' "$(basename "${g}")" "$(sha256sum "${g}" | cut -d' ' -f1)" "${got}" "AMD EPYC 7742 64-Core Processor" \
                "$(date -u +%FT%TZ)" >> "${d}/MANIFEST.tsv"
              mv "${g}" "${d}/"
            done
          }
          aside ${OUT}/${MODEL}.json ${OUT}/${MODEL}_perjet.npz /data/results/eval/atlas_res_fine_v3/${MODEL}.json
          if [ -f ${OUT}/${MODEL}.json ]; then
            echo "${MODEL} done"
          else
            for F in ${OBS}/head_outputs.npz ${FEAT}/manifest.json ${MASSV3}; do
              [ -f ${F} ] || { echo "FATAL: no ${F}"; exit 42; }
            done
            USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
            [ "${USED}" -le 90 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
            python3 experiments/EVAL/atlas_resolution.py --model ${MODEL} --observers ${OBS} --features ${FEAT} \
              --arm ${ARM} ${HEAD:+--head ${HEAD}} --mass-v3 ${MASSV3} --out-dir ${OUT} --grid v2 --centre global --mlp-max-epochs 200 || halt
          fi
          ALL=1
          for M in mtx-l162-s3 mtx-r16q1-s3; do [ -f ${OUT}/${M}.json ] || ALL=0; done
          [ ${ALL} = 0 ] || touch ${OUT}/DONE
          echo "ATLAS RES ${MODEL} COMPLETE"
        resources:
          requests: { memory: "8Gi", cpu: "8", ephemeral-storage: "20Gi" }
          limits:   { memory: "8Gi", cpu: "8", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: feature.node.kubernetes.io/cpu-model.vendor_id
                operator: In
                values: ["AMD"]
              - key: feature.node.kubernetes.io/cpu-model.family
                operator: In
                values: ["23"]
              - key: feature.node.kubernetes.io/cpu-model.id
                operator: In
                values: ["49"]
              - key: kubernetes.io/hostname
                operator: In
                values: ["node-2-6.sdsc.optiputer.net", "node-2-7.sdsc.optiputer.net", "node-2-8.sdsc.optiputer.net", "node-2-9.sdsc.optiputer.net"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
