apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_refit_v5_jobs.py -- class-balanced JetClass-II MLP probes of every network on one CPU model (PI 2026-11-14). CPU.
  name: refit5-mlp-cpu-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 12
  parallelism: 2
  backoffLimitPerIndex: 2
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s2.98 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          CPU=$(grep -m1 "^model name" /proc/cpuinfo | cut -d: -f2- | sed "s/^ *//;s/ *$//"); [ "${CPU}" = "AMD EPYC 7402P 24-Core Processor" ] || { echo "FATAL: this node's CPU is ${CPU}, not AMD EPYC 7402P 24-Core Processor: nothing fitted"; exit 42; }
          retry pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          IDX=${JOB_COMPLETION_INDEX:?not a pod of an Indexed Job}
          case ${IDX} in
            0) MODEL=mtx-l188-s1; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-l188-s1/DONE;;
            1) MODEL=mtx-l188-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-l188-s2/DONE;;
            2) MODEL=mtx-l188-s3; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-l188-s3/DONE;;
            3) MODEL=mtx-l162mass-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-l162mass-s2/DONE;;
            4) MODEL=mtx-rand2p4-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-rand2p4-s2/DONE;;
            5) MODEL=mtx-rand2p5-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-rand2p5-s2/DONE;;
            6) MODEL=mtx-flavf0-s1; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-flavf0-s1/DONE;;
            7) MODEL=mtx-flavf0-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-flavf0-s2/DONE;;
            8) MODEL=mtx-flavf1-s1; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-flavf1-s1/DONE;;
            9) MODEL=mtx-flavf1-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-flavf1-s2/DONE;;
            10) MODEL=mtx-flavf1r-s1; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-flavf1r-s1/DONE;;
            11) MODEL=mtx-flavf1r-s2; CKPTS="best70"; DS=jc2bal; NEED=/data/results/eval/v2_linprobe_bal/mtx-flavf1r-s2/DONE;;
            *) echo "FATAL: no model for index ${IDX}"; exit 42;;
          esac
          # a fit made on another CPU model leaves the family before its refit (PI 2026-11-21): kept, never deleted, in
          # <folder>.cpu_aside/ with its sha256 and recorded CPU in MANIFEST.tsv; a fit on AMD EPYC 7402P 24-Core Processor stays
          aside () {
            local f=$1 got g d
            [ -f "${f}" ] || return 0
            got=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("cpu_model", ""))' "${f}")
            [ "${got}" != "AMD EPYC 7402P 24-Core Processor" ] || { echo "${f}: fitted on AMD EPYC 7402P 24-Core Processor"; return 0; }
            for g in "$@"; do
              [ -f "${g}" ] || continue
              d=$(dirname "${g}").cpu_aside; mkdir -p "${d}"
              [ ! -e "${d}/$(basename "${g}")" ] || { echo "FATAL: ${d}/$(basename "${g}") exists"; exit 42; }
              printf '%s\t%s\t%s\t%s\t%s\n' "$(basename "${g}")" "$(sha256sum "${g}" | cut -d' ' -f1)" "${got}" "AMD EPYC 7402P 24-Core Processor" \
                "$(date -u +%FT%TZ)" >> "${d}/MANIFEST.tsv"
              mv "${g}" "${d}/"
            done
          }
          aside /data/results/eval/v2_linprobe_bal/fits_v5_mlp/${MODEL}.json
          [ -f /data/results/eval/v2_linprobe_bal/fits_v5_mlp/${MODEL}.json ] && { echo "${MODEL} done"; exit 0; }
          [ -f ${NEED} ] || { echo "FATAL: ${MODEL}'s features are missing (${NEED})"; exit 42; }
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 90 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          python3 experiments/EVAL/probe_bal.py --model ${MODEL} --checkpoints ${CKPTS} --mlp --mlp-datasets ${DS} --out /data/results/eval/v2_linprobe_bal/fits_v5_mlp
          echo "REFIT5 MLP ${MODEL} COMPLETE"
        resources:
          requests: { memory: "12Gi", cpu: "8", ephemeral-storage: "20Gi" }
          limits:   { memory: "12Gi", cpu: "8", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: feature.node.kubernetes.io/cpu-model.vendor_id
                operator: In
                values: ["AMD"]
              - key: feature.node.kubernetes.io/cpu-model.family
                operator: In
                values: ["23"]
              - key: feature.node.kubernetes.io/cpu-model.id
                operator: In
                values: ["49"]
              - key: kubernetes.io/hostname
                operator: In
                values: ["igrok-la.cenic.net", "pas.seat.net.internet2.edu", "pas.lasv.net.internet2.edu", "pas.losa.net.internet2.edu", "pas.losa2.net.internet2.edu", "pas.port.net.internet2.edu", "pas.reno.net.internet2.edu", "pas.sunn.net.internet2.edu"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
