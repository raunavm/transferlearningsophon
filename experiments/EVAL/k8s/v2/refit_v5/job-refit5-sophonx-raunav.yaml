apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_refit_v5_jobs.py -- the released Sophon checkpoint's features with the pretrained rows' fills (PI 2026-11-14). GPU.
  name: refit5-sophonx-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 1
  parallelism: 1
  backoffLimitPerIndex: 2
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s2.98 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          retry pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          [ -f /data/results/eval/v2_linprobe_sophon_fill/sophon-released/DONE ] && { echo "sophon-released fills done"; exit 0; }
          [ -f /data/finetune/jc2_bal/impute_ref_v2.npz ] || { echo "FATAL: /data/finetune/jc2_bal/impute_ref_v2.npz missing"; exit 42; }
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 90 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          python3 experiments/FT/gpu_probe.py || { sleep 120; exit 43; }
          mkdir -p /workspace/sophon
          retry python3 -c "import urllib.request; urllib.request.urlretrieve('https://huggingface.co/jet-universe/sophon/resolve/main/models/JetClassII_Sophon/model.pt', '/workspace/sophon/released.pt')" || exit 1
          GOT=$(sha256sum /workspace/sophon/released.pt | cut -d' ' -f1)
          [ "${GOT}" = "cc7c33b522e796b5bbf0aa9bb5b01361c964f4ef3acebdd9682d7519c095b824" ] || { echo "FATAL: /workspace/sophon/released.pt sha256 ${GOT}"; exit 42; }
          # extract DATASET SPLIT CONFIG "VARIANTS" FILES...: one pass, the zero fill and its fills; a split whose every
          # directory has its manifest (written last) is done
          extract () {
            OUT=/data/results/eval/v2_linprobe_sophon_fill/sophon-released/$1/$2; CFGX=$3; VARS=$4; shift 4
            ALL=1; for T in released $(for V in ${VARS}; do echo released.${V}; done); do
              [ -f ${OUT}/${T}/manifest.json ] || ALL=0; done
            [ ${ALL} = 0 ] || { echo "${OUT} done"; return 0; }
            python3 experiments/EVAL/extract_v2.py --run-dir /workspace/sophon --rung L188 --num-classes 188 \
              --num-reg 0 --checkpoints /workspace/sophon/released.pt --data-config ${CFGX} --max-jets 0 \
              --observers --feature-classes --prefix-features 2000000000 --head-prefix 0 --no-anomaly-rows \
              --diag-stride 0 --no-pooled --data-test "$@" --variants ${VARS} --impute-ref /data/finetune/jc2_bal/impute_ref_v2.npz --out ${OUT} || exit 1
          }
          extract top train_N1000 configs/finetune/TopReference.yaml "ntop itop4" /data/finetune/top_sub/train_N1000_s1.parquet
          extract top train_N10000 configs/finetune/TopReference.yaml "ntop itop4" /data/finetune/top_sub/train_N10000_s1.parquet
          extract top train_N100000 configs/finetune/TopReference.yaml "ntop itop4" /data/finetune/top_sub/train_N100000_s1.parquet
          extract top train_N1200000 configs/finetune/TopReference.yaml "ntop itop4" /data/finetune/top_sub/train_N1200000_s1.parquet
          extract top val configs/finetune/TopReference.yaml "ntop itop4" /data/finetune/top_sub/val.parquet
          extract top test configs/finetune/TopReference.yaml "ntop itop4" /data/finetune/top/top_test.parquet
          extract qg train_N1000 configs/finetune/EnergyFlowQG.yaml "nqg iqg4" /data/finetune/qg_v2_sub/train_N1000_s1.parquet
          extract qg train_N10000 configs/finetune/EnergyFlowQG.yaml "nqg iqg4" /data/finetune/qg_v2_sub/train_N10000_s1.parquet
          extract qg train_N100000 configs/finetune/EnergyFlowQG.yaml "nqg iqg4" /data/finetune/qg_v2_sub/train_N100000_s1.parquet
          extract qg train_N1600000 configs/finetune/EnergyFlowQG.yaml "nqg iqg4" /data/finetune/qg_v2_sub/train_N1600000_s1.parquet
          extract qg val configs/finetune/EnergyFlowQG.yaml "nqg iqg4" /data/finetune/qg_v2_sub/val.parquet
          extract qg test configs/finetune/EnergyFlowQG.yaml "nqg iqg4" /data/finetune/qg_v2/qg_chunk18.parquet /data/finetune/qg_v2/qg_chunk19.parquet
          extract qg herwig configs/finetune/EnergyFlowQG.yaml "nqg iqg4" /data/finetune/qg_herwig/qg_herwig_chunk0.parquet /data/finetune/qg_herwig/qg_herwig_chunk1.parquet
          touch /data/results/eval/v2_linprobe_sophon_fill/sophon-released/DONE
          echo "REFIT5 SOPHONX COMPLETE"
        resources:
          requests: { memory: "88Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "88Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
