apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_refit_v5_jobs.py -- v5 natural-composition JetClass-II probes, best70 and best70_bn (PI 2026-11-14). CPU.
  name: refit5-nat-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 30
  parallelism: 1
  backoffLimitPerIndex: 2
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s2.98 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          retry pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=8 OPENBLAS_NUM_THREADS=8 MKL_NUM_THREADS=8
          IDX=${JOB_COMPLETION_INDEX:?not a pod of an Indexed Job}
          case ${IDX} in
            0) MODEL=mtx-l188-s1; CKPTS="best70 best70_bn";;
            1) MODEL=mtx-l188-s2; CKPTS="best70 best70_bn";;
            2) MODEL=mtx-l188-s3; CKPTS="best70 best70_bn";;
            3) MODEL=mtx-l162-s1; CKPTS="best70 best70_bn";;
            4) MODEL=mtx-l162-s2; CKPTS="best70 best70_bn";;
            5) MODEL=mtx-l162-s3; CKPTS="best70 best70_bn";;
            6) MODEL=mtx-r42q1-s1; CKPTS="best70 best70_bn";;
            7) MODEL=mtx-r42q1-s2; CKPTS="best70 best70_bn";;
            8) MODEL=mtx-r42q1-s3; CKPTS="best70 best70_bn";;
            9) MODEL=mtx-r16q1-s1; CKPTS="best70 best70_bn";;
            10) MODEL=mtx-r16q1-s2; CKPTS="best70 best70_bn";;
            11) MODEL=mtx-r16q1-s3; CKPTS="best70 best70_bn";;
            12) MODEL=mtx-l162mass-s1; CKPTS="best70 best70_bn";;
            13) MODEL=mtx-l162mass-s2; CKPTS="best70 best70_bn";;
            14) MODEL=mtx-r16q1mass-s1; CKPTS="best70 best70_bn";;
            15) MODEL=mtx-r16q1mass-s2; CKPTS="best70 best70_bn";;
            16) MODEL=mtx-rand2p1-s1; CKPTS="best70 best70_bn";;
            17) MODEL=mtx-rand2p2-s2; CKPTS="best70 best70_bn";;
            18) MODEL=mtx-rand2p3-s1; CKPTS="best70 best70_bn";;
            19) MODEL=mtx-rand2p4-s2; CKPTS="best70 best70_bn";;
            20) MODEL=mtx-rand2p5-s2; CKPTS="best70 best70_bn";;
            21) MODEL=mtx-flavf0-s1; CKPTS="best70 best70_bn";;
            22) MODEL=mtx-flavf0-s2; CKPTS="best70 best70_bn";;
            23) MODEL=mtx-flavf1-s1; CKPTS="best70 best70_bn";;
            24) MODEL=mtx-flavf1-s2; CKPTS="best70 best70_bn";;
            25) MODEL=mtx-flavf1r-s1; CKPTS="best70 best70_bn";;
            26) MODEL=mtx-flavf1r-s2; CKPTS="best70 best70_bn";;
            27) MODEL=init-s1; CKPTS="init init_bn";;
            28) MODEL=init-s2; CKPTS="init init_bn";;
            29) MODEL=init-s3; CKPTS="init init_bn";;
            *) echo "FATAL: no model for index ${IDX}"; exit 42;;
          esac
          [ -f /data/results/eval/v2_linprobe/fits_v5_nat/${MODEL}.json ] && { echo "${MODEL} done"; exit 0; }
          for C in ${CKPTS}; do [ -f /data/results/eval/v2_linprobe/${MODEL}/jc2/test/${C}/manifest.json ] || { echo "FATAL: no ${C} features"; exit 42; }; done
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 90 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          python3 experiments/EVAL/linear_probe_v2.py --root /data/results/eval/v2_linprobe --model ${MODEL} --checkpoints ${CKPTS} \
            --datasets jc2_188 --grid v5 --out /data/results/eval/v2_linprobe/fits_v5_nat
          echo "REFIT5 NAT ${MODEL} COMPLETE"
        resources:
          requests: { memory: "16Gi", cpu: "8", ephemeral-storage: "20Gi" }
          limits:   { memory: "16Gi", cpu: "8", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
