apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_refit_v5_jobs.py -- paired bootstrap over test jets of the v5 probes, top and quark/gluon under the chosen substitutions. CPU.
  name: refit5-boot-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 1
  parallelism: 1
  backoffLimitPerIndex: 2
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; echo "HALT: exit $rc, not retried"; exit 42; }
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.17 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          retry pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 90 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          # every output new; then wait in the pod until every input exists
          for f in /data/results/bootstrap/probe_v5; do
            [ ! -e "${f}" ] || { echo "FATAL: ${f} exists; use a new output"; exit 42; }
          done
          missing () { local n=0 f; for f in /data/results/eval/v2_linprobe_bal/fits_v5/{mtx-l188-s1,mtx-l188-s2,mtx-l188-s3,mtx-l162-s1,mtx-l162-s2,mtx-l162-s3,mtx-r42q1-s1,mtx-r42q1-s2,mtx-r42q1-s3,mtx-r16q1-s1,mtx-r16q1-s2,mtx-r16q1-s3,mtx-l162mass-s1,mtx-l162mass-s2,mtx-r16q1mass-s1,mtx-r16q1mass-s2,mtx-rand2p1-s1,mtx-rand2p2-s2,mtx-rand2p3-s1,mtx-rand2p4-s2,mtx-rand2p5-s2,mtx-flavf0-s1,mtx-flavf0-s2,mtx-flavf1-s1,mtx-flavf1-s2,mtx-flavf1r-s1,mtx-flavf1r-s2,init-s1,init-s2,init-s3}.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/{mtx-l188-s1,mtx-l188-s2,mtx-l188-s3,mtx-l162-s1,mtx-l162-s2,mtx-l162-s3,mtx-r42q1-s1,mtx-r42q1-s2,mtx-r42q1-s3,mtx-r16q1-s1,mtx-r16q1-s2,mtx-r16q1-s3,mtx-l162mass-s1,mtx-l162mass-s2,mtx-r16q1mass-s1,mtx-r16q1mass-s2,mtx-rand2p1-s1,mtx-rand2p2-s2,mtx-rand2p3-s1,mtx-rand2p4-s2,mtx-rand2p5-s2,mtx-flavf0-s1,mtx-flavf0-s2,mtx-flavf1-s1,mtx-flavf1-s2,mtx-flavf1r-s1,mtx-flavf1r-s2,init-s1,init-s2,init-s3}.json; do
            [ -e "${f}" ] || n=$((n+1)); done; echo ${n}; }
          T0=$(date +%s)
          while M=$(missing); [ "${M}" -gt 0 ]; do
            [ $(( $(date +%s) - T0 )) -lt 518400 ] || { echo "FATAL: ${M} inputs still missing after 6 days"; exit 42; }
            echo "$(date -u +%FT%TZ) waiting for ${M} inputs"; sleep 1800
          done
          TMP=/data/results/bootstrap/probe_v5.staging.$(date -u +%s)
          mkdir -p ${TMP}
          PAIRS=(--pair mtx-l188-s1/init-s1 --pair mtx-l188-s2/init-s2 --pair mtx-l188-s3/init-s3 --pair mtx-l162-s1/mtx-l188-s1 --pair mtx-l162-s1/init-s1 --pair mtx-l162-s2/mtx-l188-s2 --pair mtx-l162-s2/init-s2 --pair mtx-l162-s3/mtx-l188-s3 --pair mtx-l162-s3/init-s3 --pair mtx-r42q1-s1/mtx-l188-s1 --pair mtx-r42q1-s1/init-s1 --pair mtx-r42q1-s2/mtx-l188-s2 --pair mtx-r42q1-s2/init-s2 --pair mtx-r42q1-s3/mtx-l188-s3 --pair mtx-r42q1-s3/init-s3 --pair mtx-r16q1-s1/mtx-l188-s1 --pair mtx-r16q1-s1/init-s1 --pair mtx-r16q1-s2/mtx-l188-s2 --pair mtx-r16q1-s2/init-s2 --pair mtx-r16q1-s3/mtx-l188-s3 --pair mtx-r16q1-s3/init-s3 --pair mtx-l162mass-s1/mtx-l188-s1 --pair mtx-l162mass-s1/mtx-l162-s1 --pair mtx-l162mass-s1/init-s1 --pair mtx-l162mass-s2/mtx-l188-s2 --pair mtx-l162mass-s2/mtx-l162-s2 --pair mtx-l162mass-s2/init-s2 --pair mtx-r16q1mass-s1/mtx-l188-s1 --pair mtx-r16q1mass-s1/mtx-r16q1-s1 --pair mtx-r16q1mass-s1/init-s1 --pair mtx-r16q1mass-s2/mtx-l188-s2 --pair mtx-r16q1mass-s2/mtx-r16q1-s2 --pair mtx-r16q1mass-s2/init-s2 --pair mtx-rand2p1-s1/mtx-l188-s1 --pair mtx-rand2p1-s1/init-s1 --pair mtx-rand2p2-s2/mtx-l188-s2 --pair mtx-rand2p2-s2/init-s2 --pair mtx-rand2p3-s1/mtx-l188-s1 --pair mtx-rand2p3-s1/init-s1 --pair mtx-rand2p4-s2/mtx-l188-s2 --pair mtx-rand2p4-s2/init-s2 --pair mtx-rand2p5-s2/mtx-l188-s2 --pair mtx-rand2p5-s2/init-s2 --pair mtx-flavf0-s1/mtx-l188-s1 --pair mtx-flavf0-s1/mtx-r16q1-s1 --pair mtx-flavf0-s1/init-s1 --pair mtx-flavf0-s2/mtx-l188-s2 --pair mtx-flavf0-s2/mtx-r16q1-s2 --pair mtx-flavf0-s2/init-s2 --pair mtx-flavf1-s1/mtx-l188-s1 --pair mtx-flavf1-s1/mtx-flavf0-s1 --pair mtx-flavf1-s1/init-s1 --pair mtx-flavf1-s2/mtx-l188-s2 --pair mtx-flavf1-s2/mtx-flavf0-s2 --pair mtx-flavf1-s2/init-s2 --pair mtx-flavf1r-s1/mtx-l188-s1 --pair mtx-flavf1r-s1/mtx-flavf1-s1 --pair mtx-flavf1r-s1/mtx-flavf0-s1 --pair mtx-flavf1r-s1/init-s1 --pair mtx-flavf1r-s2/mtx-l188-s2 --pair mtx-flavf1r-s2/mtx-flavf1-s2 --pair mtx-flavf1r-s2/mtx-flavf0-s2 --pair mtx-flavf1r-s2/init-s2)
          MODELS="mtx-l188-s1:best70 mtx-l188-s2:best70 mtx-l188-s3:best70 mtx-l162-s1:best70 mtx-l162-s2:best70 mtx-l162-s3:best70 mtx-r42q1-s1:best70 mtx-r42q1-s2:best70 mtx-r42q1-s3:best70 mtx-r16q1-s1:best70 mtx-r16q1-s2:best70 mtx-r16q1-s3:best70 mtx-l162mass-s1:best70 mtx-l162mass-s2:best70 mtx-r16q1mass-s1:best70 mtx-r16q1mass-s2:best70 mtx-rand2p1-s1:best70 mtx-rand2p2-s2:best70 mtx-rand2p3-s1:best70 mtx-rand2p4-s2:best70 mtx-rand2p5-s2:best70 mtx-flavf0-s1:best70 mtx-flavf0-s2:best70 mtx-flavf1-s1:best70 mtx-flavf1-s2:best70 mtx-flavf1r-s1:best70 mtx-flavf1r-s2:best70 init-s1:init init-s2:init init-s3:init"
          bootf () {
            local args=() m
            for m in ${MODELS}; do args+=(--model "${m%%:*}=/data/results/eval/v2_linprobe_bal/fits_v5_probs/${m%%:*}/${m##*:}/$1.npz"); done
            python3 experiments/STATS/paired_bootstrap.py --task npz "${args[@]}" "${PAIRS[@]}" \
              --out ${TMP}/$1.json || halt
          }
          bootfill () {
            local args=() m
            for m in ${MODELS}; do args+=(--model "${m%%:*}=/data/results/eval/v2_linprobe_bal/fits_v5_fill_probs/${m%%:*}/${m##*:}.${FILL}/$1.npz"); done
            python3 experiments/STATS/paired_bootstrap.py --task npz "${args[@]}" "${PAIRS[@]}" \
              --out ${TMP}/$1.json || halt
          }
          bootf jc1_N1000000
          bootf jc2bal_N1000000
          bootf jc2bal_pairs_bc_vs_bq_cs
          bootf jc2bal_pairs_bb_vs_cc
          bootf jc2bal_pairs_bbqq_vs_ccqq
          bootf jc2bal_pairs_qcd_bb_vs_cc
          bootf jc2bal_pairs_qcd_b_vs_light
          bootf jc2bal_pairs_qcd_c_vs_light
          FILL=itop4; bootfill top_N1000
          FILL=itop4; bootfill top_N10000
          FILL=itop4; bootfill top_N100000
          FILL=itop4; bootfill top_N1200000
          FILL=nqg; bootfill qg_N1000
          FILL=nqg; bootfill qg_N10000
          FILL=nqg; bootfill qg_N100000
          FILL=nqg; bootfill qg_N1600000
          FILL=nqg; bootfill qg_herwig_N1000
          FILL=nqg; bootfill qg_herwig_N10000
          FILL=nqg; bootfill qg_herwig_N100000
          FILL=nqg; bootfill qg_herwig_N1600000
          [ ! -e /data/results/bootstrap/probe_v5 ] || { echo "FATAL: /data/results/bootstrap/probe_v5 appeared while this ran"; exit 42; }
          mv ${TMP} /data/results/bootstrap/probe_v5
          ls -la /data/results/bootstrap/probe_v5
          echo "REFIT5 BOOT COMPLETE"
        resources:
          requests: { memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
