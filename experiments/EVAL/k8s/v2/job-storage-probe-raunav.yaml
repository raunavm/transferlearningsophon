apiVersion: batch/v1
kind: Job
metadata:
  # A pod that only sleeps, for the guard's /data write test (2026-11-20): with every fine-tuning job suspended after a
  # failed write test and the last refit finished, no pod of ours ran, so the test could never pass and the guard
  # could never resume them. Three days, then it ends; CPU only, sized to nothing.
  name: storage-probe-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 259200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/sh", "-c", "sleep 259200"]
        resources:
          requests: { memory: "256Mi", cpu: "100m" }
          limits:   { memory: "256Mi", cpu: "100m" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
