apiVersion: batch/v1
kind: Job
metadata:
  name: eval-anomaly-v2-merge-t123-raunav
  namespace: cms-ml
spec:
  backoffLimit: 6
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; echo "HALT: exit $rc, not retried"; exit 42; }
          git clone --depth 1 --branch "mtx-s2.00" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}%"
          [ "${USED}" -lt 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          units () { for r in $1; do echo /data/results/eval/v2/anomaly/${r}/$2/$3; done; for r in init-s1/init init-s2/init init-s3/init init-s4/init init-s5/init; do echo /data/results/eval/v2/anomaly/${r}/$3; done; }
          for tag in best70 bestval wavg best70_bn bestval_bn; do
            for ro in features pooled; do
              [ ${ro} = features ] && runs="mtx-l188-s1 mtx-l188-s2 mtx-l188-s3 mtx-l188-s4 mtx-l188-s5 mtx-l162-s1 mtx-l162-s2 mtx-l162-s3 mtx-l162-s4 mtx-l162-s5 mtx-r42q1-s1 mtx-r42q1-s2 mtx-r42q1-s3 mtx-r42q1-s4 mtx-r42q1-s5 mtx-r16q1-s1 mtx-r16q1-s2 mtx-r16q1-s3 mtx-r16q1-s4 mtx-r16q1-s5 mtx-r63q1-s1 mtx-r63q1-s2 mtx-r63q1-s3 mtx-r63q1-s4 mtx-r63q1-s5 mtx-r29q1-s1 mtx-r29q1-s2 mtx-r29q1-s3 mtx-r29q1-s4 mtx-r29q1-s5 mtx-l188lofo4p-s1 mtx-l188lofo4p-s2 mtx-l188lofo4p-s3 mtx-l162lofo4p-s1 mtx-l162lofo4p-s2 mtx-l162lofo4p-s3 mtx-r42q1lofo4p-s1 mtx-r42q1lofo4p-s2 mtx-r42q1lofo4p-s3 mtx-r16q1lofo4p-s1 mtx-r16q1lofo4p-s2 mtx-r16q1lofo4p-s3" || runs="mtx-l188-s1 mtx-l188-s2 mtx-l188-s3 mtx-l188-s4 mtx-l188-s5 mtx-l162-s1 mtx-l162-s2 mtx-l162-s3 mtx-l162-s4 mtx-l162-s5 mtx-r42q1-s1 mtx-r42q1-s2 mtx-r42q1-s3 mtx-r42q1-s4 mtx-r42q1-s5 mtx-r16q1-s1 mtx-r16q1-s2 mtx-r16q1-s3 mtx-r16q1-s4 mtx-r16q1-s5 mtx-mpm-s1 mtx-mpm-s2 mtx-mpm-s3 mtx-r63q1-s1 mtx-r63q1-s2 mtx-r63q1-s3 mtx-r63q1-s4 mtx-r63q1-s5 mtx-r29q1-s1 mtx-r29q1-s2 mtx-r29q1-s3 mtx-r29q1-s4 mtx-r29q1-s5 mtx-l188lofo4p-s1 mtx-l188lofo4p-s2 mtx-l188lofo4p-s3 mtx-l162lofo4p-s1 mtx-l162lofo4p-s2 mtx-l162lofo4p-s3 mtx-r42q1lofo4p-s1 mtx-r42q1lofo4p-s2 mtx-r42q1lofo4p-s3 mtx-r16q1lofo4p-s1 mtx-r16q1lofo4p-s2 mtx-r16q1lofo4p-s3 mtx-mpmlofo4p-s1 mtx-mpmlofo4p-s2 mtx-mpmlofo4p-s3"
              for u in $(units "${runs}" ${tag} ${ro}); do
                grep -qs '"null_unmeasured"' ${u}/anomaly_results.json || { echo "FATAL: ${u} absent or partial"; exit 42; }
              done
            done
          done
          for tag in best70 bestval wavg best70_bn bestval_bn; do
            for ro in features pooled; do
              [ ${ro} = features ] && runs="mtx-l188-s1 mtx-l188-s2 mtx-l188-s3 mtx-l188-s4 mtx-l188-s5 mtx-l162-s1 mtx-l162-s2 mtx-l162-s3 mtx-l162-s4 mtx-l162-s5 mtx-r42q1-s1 mtx-r42q1-s2 mtx-r42q1-s3 mtx-r42q1-s4 mtx-r42q1-s5 mtx-r16q1-s1 mtx-r16q1-s2 mtx-r16q1-s3 mtx-r16q1-s4 mtx-r16q1-s5 mtx-r63q1-s1 mtx-r63q1-s2 mtx-r63q1-s3 mtx-r63q1-s4 mtx-r63q1-s5 mtx-r29q1-s1 mtx-r29q1-s2 mtx-r29q1-s3 mtx-r29q1-s4 mtx-r29q1-s5 mtx-l188lofo4p-s1 mtx-l188lofo4p-s2 mtx-l188lofo4p-s3 mtx-l162lofo4p-s1 mtx-l162lofo4p-s2 mtx-l162lofo4p-s3 mtx-r42q1lofo4p-s1 mtx-r42q1lofo4p-s2 mtx-r42q1lofo4p-s3 mtx-r16q1lofo4p-s1 mtx-r16q1lofo4p-s2 mtx-r16q1lofo4p-s3" || runs="mtx-l188-s1 mtx-l188-s2 mtx-l188-s3 mtx-l188-s4 mtx-l188-s5 mtx-l162-s1 mtx-l162-s2 mtx-l162-s3 mtx-l162-s4 mtx-l162-s5 mtx-r42q1-s1 mtx-r42q1-s2 mtx-r42q1-s3 mtx-r42q1-s4 mtx-r42q1-s5 mtx-r16q1-s1 mtx-r16q1-s2 mtx-r16q1-s3 mtx-r16q1-s4 mtx-r16q1-s5 mtx-mpm-s1 mtx-mpm-s2 mtx-mpm-s3 mtx-r63q1-s1 mtx-r63q1-s2 mtx-r63q1-s3 mtx-r63q1-s4 mtx-r63q1-s5 mtx-r29q1-s1 mtx-r29q1-s2 mtx-r29q1-s3 mtx-r29q1-s4 mtx-r29q1-s5 mtx-l188lofo4p-s1 mtx-l188lofo4p-s2 mtx-l188lofo4p-s3 mtx-l162lofo4p-s1 mtx-l162lofo4p-s2 mtx-l162lofo4p-s3 mtx-r42q1lofo4p-s1 mtx-r42q1lofo4p-s2 mtx-r42q1lofo4p-s3 mtx-r16q1lofo4p-s1 mtx-r16q1lofo4p-s2 mtx-r16q1lofo4p-s3 mtx-mpmlofo4p-s1 mtx-mpmlofo4p-s2 mtx-mpmlofo4p-s3"
              OUT=/data/results/eval/v2/anomaly_merged_t123/${tag}/${ro}
              [ -f ${OUT}/anomaly_results.json ] && { echo "done: ${OUT}"; continue; }
              python3 experiments/EVAL/anomaly_merge.py --inputs $(units "${runs}" ${tag} ${ro}) --out ${OUT} || halt
            done
          done
        volumeMounts:
        - { name: data, mountPath: /data }
        resources:
          requests: { memory: "8Gi", cpu: "2", ephemeral-storage: "10Gi" }
          limits:   { memory: "8Gi", cpu: "2", ephemeral-storage: "10Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
