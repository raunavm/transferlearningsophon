apiVersion: batch/v1
kind: Job
metadata:
  name: eval-anomaly-v2-heads-t123-raunav
  namespace: cms-ml
spec:
  backoffLimit: 6
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; echo "HALT: exit $rc, not retried"; exit 42; }
          git clone --depth 1 --branch "mtx-s2.00" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}%"
          [ "${USED}" -lt 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          OUT=/data/results/eval/v2/anomaly_heads_t123/anomaly_heads.json
          [ -f ${OUT} ] && { echo "done by an earlier attempt"; exit 0; }
          MODELS=""
          for spec in mtx-l188-s1:L188 mtx-l188-s2:L188 mtx-l188-s3:L188 mtx-l188-s4:L188 mtx-l188-s5:L188 mtx-l162-s1:L162 mtx-l162-s2:L162 mtx-l162-s3:L162 mtx-l162-s4:L162 mtx-l162-s5:L162 mtx-r42q1-s1:R42_Q1 mtx-r42q1-s2:R42_Q1 mtx-r42q1-s3:R42_Q1 mtx-r42q1-s4:R42_Q1 mtx-r42q1-s5:R42_Q1 mtx-r16q1-s1:R16_Q1 mtx-r16q1-s2:R16_Q1 mtx-r16q1-s3:R16_Q1 mtx-r16q1-s4:R16_Q1 mtx-r16q1-s5:R16_Q1 mtx-r63q1-s1:R63_Q1 mtx-r63q1-s2:R63_Q1 mtx-r63q1-s3:R63_Q1 mtx-r63q1-s4:R63_Q1 mtx-r63q1-s5:R63_Q1 mtx-r29q1-s1:R29_Q1 mtx-r29q1-s2:R29_Q1 mtx-r29q1-s3:R29_Q1 mtx-r29q1-s4:R29_Q1 mtx-r29q1-s5:R29_Q1 mtx-l188lofo4p-s1:L188 mtx-l188lofo4p-s2:L188 mtx-l188lofo4p-s3:L188 mtx-l162lofo4p-s1:L162 mtx-l162lofo4p-s2:L162 mtx-l162lofo4p-s3:L162 mtx-r42q1lofo4p-s1:R42_Q1 mtx-r42q1lofo4p-s2:R42_Q1 mtx-r42q1lofo4p-s3:R42_Q1 mtx-r16q1lofo4p-s1:R16_Q1 mtx-r16q1lofo4p-s2:R16_Q1 mtx-r16q1lofo4p-s3:R16_Q1; do
            run=${spec%%:*}; rung=${spec##*:}
            for tag in best70 bestval wavg best70_bn bestval_bn; do
              [ -f "/data/results/eval/v2/${run}/${tag}/head_scores.npz" ] || { echo "FATAL: no heads for ${run} at ${tag}"; exit 42; }
            done
            MODELS="${MODELS} ${run#mtx-}=${rung}=/data/results/eval/v2/${run}"
          done
          mkdir -p $(dirname ${OUT})
          python3 experiments/EVAL/anomaly_heads.py \
            --models ${MODELS} \
            --labels /data/results/eval/v2/mtx-l188-s1/best70 \
            --n-sig 2000 4000 --procs 15 \
            --out ${OUT} || halt
        volumeMounts:
        - { name: data, mountPath: /data }
        resources:
          requests: { memory: "64Gi", cpu: "16", ephemeral-storage: "10Gi" }
          limits:   { memory: "64Gi", cpu: "16", ephemeral-storage: "10Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
