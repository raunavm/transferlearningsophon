apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_atlas_res_job.py -- ATLAS jet-mass resolution (PI decision P7). CPU.
  name: atlas-res-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 19
  parallelism: 5
  backoffLimitPerIndex: 6
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # a signal (OOM, lost node) is retried; any other failure is deterministic
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; echo "HALT: exit $rc, not retried"; exit 42; }
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s2.46 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1
          # BLAS threads = the CPUs requested: nproc reports the node's cores
          export OMP_NUM_THREADS=8 OPENBLAS_NUM_THREADS=8 MKL_NUM_THREADS=8
          IDX=${JOB_COMPLETION_INDEX:?not a pod of an Indexed Job}
          case ${IDX} in
            0) MODEL=mtx-l188-s1; OBS=/data/results/eval/v2_head/mtx-l188-s1/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-l188-s1/jc2/test/best70; ARM=best70; HEAD="";;
            1) MODEL=mtx-l188-s2; OBS=/data/results/eval/v2_head/mtx-l188-s2/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-l188-s2/jc2/test/best70; ARM=best70; HEAD="";;
            2) MODEL=mtx-l188-s3; OBS=/data/results/eval/v2_head/mtx-l188-s3/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-l188-s3/jc2/test/best70; ARM=best70; HEAD="";;
            3) MODEL=mtx-l162-s1; OBS=/data/results/eval/v2_head/mtx-l162-s1/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-l162-s1/jc2/test/best70; ARM=best70; HEAD="";;
            4) MODEL=mtx-l162-s2; OBS=/data/results/eval/v2_head/mtx-l162-s2/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-l162-s2/jc2/test/best70; ARM=best70; HEAD="";;
            5) MODEL=mtx-l162-s3; OBS=/data/results/eval/v2_head/mtx-l162-s3/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-l162-s3/jc2/test/best70; ARM=best70; HEAD="";;
            6) MODEL=mtx-r42q1-s1; OBS=/data/results/eval/v2_head/mtx-r42q1-s1/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-r42q1-s1/jc2/test/best70; ARM=best70; HEAD="";;
            7) MODEL=mtx-r42q1-s2; OBS=/data/results/eval/v2_head/mtx-r42q1-s2/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-r42q1-s2/jc2/test/best70; ARM=best70; HEAD="";;
            8) MODEL=mtx-r42q1-s3; OBS=/data/results/eval/v2_head/mtx-r42q1-s3/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-r42q1-s3/jc2/test/best70; ARM=best70; HEAD="";;
            9) MODEL=mtx-r16q1-s1; OBS=/data/results/eval/v2_head/mtx-r16q1-s1/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-r16q1-s1/jc2/test/best70; ARM=best70; HEAD="";;
            10) MODEL=mtx-r16q1-s2; OBS=/data/results/eval/v2_head/mtx-r16q1-s2/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-r16q1-s2/jc2/test/best70; ARM=best70; HEAD="";;
            11) MODEL=mtx-r16q1-s3; OBS=/data/results/eval/v2_head/mtx-r16q1-s3/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-r16q1-s3/jc2/test/best70; ARM=best70; HEAD="";;
            12) MODEL=mtx-l162mass-s1; OBS=/data/results/eval/v2_head/mtx-l162mass-s1/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-l162mass-s1/jc2/test/best70; ARM=best70; HEAD="/data/results/eval/v2_head/mtx-l162mass-s1/test/best70";;
            13) MODEL=mtx-l162mass-s2; OBS=/data/results/eval/v2_head/mtx-l162mass-s2/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-l162mass-s2/jc2/test/best70; ARM=best70; HEAD="/data/results/eval/v2_head/mtx-l162mass-s2/test/best70";;
            14) MODEL=mtx-r16q1mass-s1; OBS=/data/results/eval/v2_head/mtx-r16q1mass-s1/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-r16q1mass-s1/jc2/test/best70; ARM=best70; HEAD="/data/results/eval/v2_head/mtx-r16q1mass-s1/test/best70";;
            15) MODEL=mtx-r16q1mass-s2; OBS=/data/results/eval/v2_head/mtx-r16q1mass-s2/test/best70; FEAT=/data/results/eval/v2_linprobe/mtx-r16q1mass-s2/jc2/test/best70; ARM=best70; HEAD="/data/results/eval/v2_head/mtx-r16q1mass-s2/test/best70";;
            16) MODEL=init-s1; OBS=/data/results/eval/v2_head/mtx-l188-s1/test/best70; FEAT=/data/results/eval/v2_linprobe/init-s1/jc2/test/init; ARM=init; HEAD="";;
            17) MODEL=init-s2; OBS=/data/results/eval/v2_head/mtx-l188-s1/test/best70; FEAT=/data/results/eval/v2_linprobe/init-s2/jc2/test/init; ARM=init; HEAD="";;
            18) MODEL=init-s3; OBS=/data/results/eval/v2_head/mtx-l188-s1/test/best70; FEAT=/data/results/eval/v2_linprobe/init-s3/jc2/test/init; ARM=init; HEAD="";;
            *) echo "FATAL: no model for index ${IDX}"; exit 42;;
          esac
          OUT=/data/results/eval/atlas_res
          MASSV3=/data/results/eval/v2_head/${MODEL}/mass_v3.json
          if [ -f ${OUT}/${MODEL}.json ]; then
            echo "${MODEL} done"
          else
            for F in ${OBS}/head_outputs.npz ${FEAT}/manifest.json ${MASSV3}; do
              [ -f ${F} ] || { echo "FATAL: no ${F}"; exit 42; }
            done
            USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
            [ "${USED}" -lt 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
            python3 experiments/EVAL/atlas_resolution.py --model ${MODEL} --observers ${OBS} --features ${FEAT} \
              --arm ${ARM} ${HEAD:+--head ${HEAD}} --mass-v3 ${MASSV3} --out-dir ${OUT} || halt
          fi
          ALL=1
          for M in mtx-l188-s1 mtx-l188-s2 mtx-l188-s3 mtx-l162-s1 mtx-l162-s2 mtx-l162-s3 mtx-r42q1-s1 mtx-r42q1-s2 mtx-r42q1-s3 mtx-r16q1-s1 mtx-r16q1-s2 mtx-r16q1-s3 mtx-l162mass-s1 mtx-l162mass-s2 mtx-r16q1mass-s1 mtx-r16q1mass-s2 init-s1 init-s2 init-s3; do [ -f ${OUT}/${M}.json ] || ALL=0; done
          [ ${ALL} = 0 ] || touch ${OUT}/DONE
          echo "ATLAS RES ${MODEL} COMPLETE"
        resources:
          requests: { memory: "32Gi", cpu: "8", ephemeral-storage: "20Gi" }
          limits:   { memory: "32Gi", cpu: "8", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
