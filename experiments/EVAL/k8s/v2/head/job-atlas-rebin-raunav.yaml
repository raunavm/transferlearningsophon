apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_atlas_res_job.py -- ATLAS jet-mass resolution in finer pT bins (PI 2026-11-05). CPU.
  name: atlas-rebin-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s2.63 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=8 OPENBLAS_NUM_THREADS=8 MKL_NUM_THREADS=8
          [ -f /data/results/eval/atlas_res/DONE ] || { echo "FATAL: /data/results/eval/atlas_res is not complete"; exit 1; }
          python3 experiments/EVAL/atlas_rebin.py --in-dir /data/results/eval/atlas_res --out-dir /data/results/eval/atlas_res_fine
          touch /data/results/eval/atlas_res_fine/DONE
          echo "ATLAS REBIN COMPLETE"
        resources:
          requests: { memory: "32Gi", cpu: "8", ephemeral-storage: "20Gi" }
          limits:   { memory: "32Gi", cpu: "8", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
