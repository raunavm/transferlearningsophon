apiVersion: batch/v1
kind: Job
metadata:
  name: head-sculpt-v3-raunav
  namespace: cms-ml
spec:
  backoffLimit: 6
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # a signal (OOM, lost node) is retried; any other failure is deterministic
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; echo "HALT: exit $rc, not retried"; exit 42; }
          git clone --depth 1 --branch "mtx-s2.80" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow
          export PYTHONUNBUFFERED=1
          # BLAS threads = the CPUs requested: nproc reports the node's cores
          export OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}%"
          [ "${USED}" -lt 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-l188-s1/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-l188-s1: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-l188-s2/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-l188-s2: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-l188-s3/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-l188-s3: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-l162-s1/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-l162-s1: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-l162-s2/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-l162-s2: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-l162-s3/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-l162-s3: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-r42q1-s1/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-r42q1-s1: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-r42q1-s2/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-r42q1-s2: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-r42q1-s3/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-r42q1-s3: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-r16q1-s1/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-r16q1-s1: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-r16q1-s2/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-r16q1-s2: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-r16q1-s3/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-r16q1-s3: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-l162mass-s1/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-l162mass-s1: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-l162mass-s2/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-l162mass-s2: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-r16q1mass-s1/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-r16q1mass-s1: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-r16q1mass-s2/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-r16q1mass-s2: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-flavf0-s1/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-flavf0-s1: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-flavf0-s2/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-flavf0-s2: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-flavf1-s1/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-flavf1-s1: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-flavf1-s2/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-flavf1-s2: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-flavf1r-s1/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-flavf1r-s1: apply after its head job"; exit 42; }
          [ -f /data/results/eval/v2_head/mtx-flavf1r-s2/test/best70/head_outputs.npz ] || { echo "FATAL: no head outputs for mtx-flavf1r-s2: apply after its head job"; exit 42; }
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-l188-s1/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-l188-s1_sculpting.json || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-l188-s2/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-l188-s2_sculpting.json || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-l188-s3/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-l188-s3_sculpting.json || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-l162-s1/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-l162-s1_sculpting.json || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-l162-s2/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-l162-s2_sculpting.json || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-l162-s3/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-l162-s3_sculpting.json || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-r42q1-s1/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-r42q1-s1_sculpting.json || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-r42q1-s2/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-r42q1-s2_sculpting.json || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-r42q1-s3/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-r42q1-s3_sculpting.json || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-r16q1-s1/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-r16q1-s1_sculpting.json || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-r16q1-s2/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-r16q1-s2_sculpting.json || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-r16q1-s3/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-r16q1-s3_sculpting.json || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-l162mass-s1/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-l162mass-s1_sculpting.json || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-l162mass-s2/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-l162mass-s2_sculpting.json || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-r16q1mass-s1/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-r16q1mass-s1_sculpting.json || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-r16q1mass-s2/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-r16q1mass-s2_sculpting.json || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-flavf0-s1/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-flavf0-s1_sculpting.json --label-set FLAV_F0 || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-flavf0-s2/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-flavf0-s2_sculpting.json --label-set FLAV_F0 || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-flavf1-s1/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-flavf1-s1_sculpting.json --label-set FLAV_F1 || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-flavf1-s2/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-flavf1-s2_sculpting.json --label-set FLAV_F1 || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-flavf1r-s1/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-flavf1r-s1_sculpting.json --label-set FLAV_F1R || halt
          python3 experiments/EVAL/mass_sculpting.py --head /data/results/eval/v2_head/mtx-flavf1r-s2/test/best70 \
            --out /data/results/eval/v2_head/sculpting_v3/mtx-flavf1r-s2_sculpting.json --label-set FLAV_F1R || halt
          echo "sculpting of the 22 runs done"
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
        resources:
          requests: { memory: "32Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "32Gi", cpu: "4", ephemeral-storage: "20Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
