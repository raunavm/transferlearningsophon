apiVersion: batch/v1
kind: Job
metadata:
  # Every mass estimator against the soft-drop mass, paired on the same jets (PI 2026-11-21): experiments/EVAL/
  # mass_sd_boot.py on the truth-free refit's per-jet values (atlas_res_v3). CPU, nothing trained.
  name: mass-sd-boot-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.21 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          O=/data/results/eval/mass_sd_boot/mass_sd_boot.json
          [ ! -e ${O} ] || { echo "FATAL: ${O} exists"; exit 42; }
          python3 experiments/EVAL/mass_sd_boot.py --root /data/results/eval/atlas_res_v3 --out ${O}
          ls -la ${O}
        resources:
          requests: { memory: "10Gi", cpu: "4", ephemeral-storage: "5Gi" }
          limits:   { memory: "10Gi", cpu: "4", ephemeral-storage: "5Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
