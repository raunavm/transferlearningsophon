apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_refit_v5_jobs.py -- the released Sophon checkpoint's CPU probes, pairfit (SH-13). CPU.
  name: bs3-sophon-pairfit-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 1
  parallelism: 1
  backoffLimitPerIndex: 2
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.75 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          CPU=$(grep -m1 "^model name" /proc/cpuinfo | cut -d: -f2- | sed "s/^ *//;s/ *$//"); [ "${CPU}" = "AMD EPYC 7742 64-Core Processor" ] || { echo "FATAL: this node's CPU is ${CPU}, not AMD EPYC 7742 64-Core Processor: nothing fitted"; exit 42; }
          retry pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=8 OPENBLAS_NUM_THREADS=8 MKL_NUM_THREADS=8
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 88 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          N=0; for F in /data/results/eval/v2_linprobe_sophon/sophon-released/jc2bal_pairs/test/released/manifest.json /data/results/eval/v2_linprobe_sophon/sophon-released/jc2bal_pairs/train/released/manifest.json; do [ -e "${F}" ] || { echo "MISSING ${F}"; N=$((N+1)); }; done; [ ${N} = 0 ] || { echo "FATAL: ${N} inputs missing"; exit 42; }; echo "all inputs present"
          python3 -c 'import resource, subprocess, sys, time; t = time.time(); r = subprocess.call(sys.argv[1:]); print("PEAK_RSS_MIB", resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss // 1024, "SECONDS", round(time.time() - t)); sys.exit(r)' python3 experiments/EVAL/probe_sophon.py pairs --out /data/results/eval/bs3_sophon/fits_v5_pairs --probs-out /data/results/eval/bs3_sophon/fits_v5_pairs_probs
          echo "SOPHON PAIRFIT COMPLETE"
        resources:
          requests: { memory: "8Gi", cpu: "8", ephemeral-storage: "20Gi" }
          limits:   { memory: "8Gi", cpu: "8", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: feature.node.kubernetes.io/cpu-model.vendor_id
                operator: In
                values: ["AMD"]
              - key: feature.node.kubernetes.io/cpu-model.family
                operator: In
                values: ["23"]
              - key: feature.node.kubernetes.io/cpu-model.id
                operator: In
                values: ["49"]
              - key: kubernetes.io/hostname
                operator: In
                values: ["node-2-6.sdsc.optiputer.net", "node-2-7.sdsc.optiputer.net", "node-2-8.sdsc.optiputer.net", "node-2-9.sdsc.optiputer.net"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net", "node-2-3.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
