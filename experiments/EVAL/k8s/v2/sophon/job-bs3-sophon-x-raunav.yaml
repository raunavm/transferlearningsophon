apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_refit_v5_jobs.py -- the released Sophon checkpoint: pair and X->bx features, the transfer-head fits (SH-13). GPU.
  name: bs3-sophon-x-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 1
  parallelism: 1
  backoffLimitPerIndex: 2
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.73 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          retry pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 88 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          python3 experiments/FT/gpu_probe.py || { sleep 120; exit 43; }
          mkdir -p /workspace/sophon
          retry python3 -c "import urllib.request; urllib.request.urlretrieve('https://huggingface.co/jet-universe/sophon/resolve/main/models/JetClassII_Sophon/model.pt', '/workspace/sophon/released.pt')" || exit 1
          GOT=$(sha256sum /workspace/sophon/released.pt | cut -d' ' -f1)
          [ "${GOT}" = "cc7c33b522e796b5bbf0aa9bb5b01361c964f4ef3acebdd9682d7519c095b824" ] || { echo "FATAL: /workspace/sophon/released.pt sha256 ${GOT}"; exit 42; }
          # pairs OUT MAXJETS FILES...: build_jc2bal_jobs.extract_spec's extraction with the released checkpoint (sophon_spec's
          # flags); a split with its manifest is done
          pairs () {
            OUT=$1; MAXJ=$2; shift 2
            [ -f ${OUT}/released/manifest.json ] && { echo "${OUT} done"; return 0; }
            python3 experiments/EVAL/extract_v2.py --run-dir /workspace/sophon --rung L188 --num-classes 188 \
              --num-reg 0 --checkpoints /workspace/sophon/released.pt --data-config configs/data/JetClassII_massreg.yaml --max-jets ${MAXJ} \
              --observers --feature-classes --prefix-features 2000000000 --head-prefix 0 --no-anomaly-rows \
              --diag-stride 0 --no-pooled --data-test "$@" --out ${OUT} || exit 1
          }
          pairs /data/results/eval/v2_linprobe_sophon/sophon-released/jc2bal_pairs/train 0 /data/finetune/jc2_bal/pairs_train.parquet
          pairs /data/results/eval/v2_linprobe_sophon/sophon-released/jc2bal_pairs/test 0 /data/finetune/jc2_bal/pairs_test_part0.parquet /data/finetune/jc2_bal/pairs_test_part1.parquet /data/finetune/jc2_bal/pairs_test_part2.parquet
          for F in /data/xbx/v2/pairs/xbb/DONE /data/xbx/v2/pairs/xbs/DONE /data/xbx/v2/xbb/eval/DONE /data/xbx/v2/xbs/eval/DONE /data/xbx/v2/qcd/eval/DONE; do [ -f "${F}" ] || { echo "FATAL: ${F} absent: stage first"; exit 42; }; done
          xbx () {
            OUT=/data/results/eval/xbx/sophon-released/$1; shift
            [ -f ${OUT}/released/manifest.json ] && { echo "${OUT} done"; return 0; }
            python3 experiments/XBS/extract_xbx.py --arm L188 --run-dir /workspace/sophon --rung L188 \
              --num-classes 188 --num-reg 0 --checkpoints /workspace/sophon/released.pt --data-config configs/xbx/JetClassII_xbx.yaml \
              --observers jet_pt jet_eta jet_sdmass --no-pooled --data-test "$@" --out ${OUT} || exit 1
          }
          xbx xbb/train $(ls /data/xbx/v2/pairs/xbb/train_*.parquet | sort)
          xbx xbb/val /data/xbx/v2/pairs/xbb/val.parquet
          xbx xbb/eval $(ls /data/xbx/v2/xbb/eval/*.parquet | sort)
          xbx xbs/train $(ls /data/xbx/v2/pairs/xbs/train_*.parquet | sort)
          xbx xbs/val /data/xbx/v2/pairs/xbs/val.parquet
          xbx xbs/eval $(ls /data/xbx/v2/xbs/eval/*.parquet | sort)
          xbx qcd/eval $(ls /data/xbx/v2/qcd/eval/*.parquet | sort)
          [ -f /data/results/eval/xbx/fits_ihep/xbb/sophon-released.json ] || python3 experiments/XBS/fit_xbx.py model --root /data/results/eval/xbx --model sophon-released --signals xbb --checkpoint released --window 150 230 --mx 200 --out /data/results/eval/xbx/fits_ihep/xbb
          [ -f /data/results/eval/xbx/fits_ihep_v5/xbb/sophon-released.json ] || python3 experiments/XBS/fit_xbx.py model --root /data/results/eval/xbx --model sophon-released --signals xbb --checkpoint released --window 150 230 --mx 200 --linear-only --grid v5 --out /data/results/eval/xbx/fits_ihep_v5/xbb
          [ -f /data/results/eval/xbx/fits_ihep/xbs/sophon-released.json ] || python3 experiments/XBS/fit_xbx.py model --root /data/results/eval/xbx --model sophon-released --signals xbs --checkpoint released --window 150 230 --mx 200 --out /data/results/eval/xbx/fits_ihep/xbs
          [ -f /data/results/eval/xbx/fits_ihep_v5/xbs/sophon-released.json ] || python3 experiments/XBS/fit_xbx.py model --root /data/results/eval/xbx --model sophon-released --signals xbs --checkpoint released --window 150 230 --mx 200 --linear-only --grid v5 --out /data/results/eval/xbx/fits_ihep_v5/xbs
          echo "SOPHON X COMPLETE"
        resources:
          requests: { memory: "16Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "16Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net", "node-2-3.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
