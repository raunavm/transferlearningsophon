apiVersion: batch/v1
kind: Job
metadata:
  # Every file written during the 17-19 Nov storage faults loaded in full with its own reader, and every file whose
  # sha256 a manifest records re-hashed (experiments/EVAL/storage_scan.py, PI 2026-11-21). Reads only; CPU.
  name: storage-scan-records-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.33 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          retry pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          O=/data/results/eval/storage_scan_1117_1119_records
          [ ! -e ${O}/report.tsv ] || { echo "FATAL: ${O}/report.tsv exists"; exit 1; }
          python3 experiments/EVAL/storage_scan.py --records-only --out ${O}
        resources:
          requests: { memory: "4Gi", cpu: "2", ephemeral-storage: "5Gi" }
          limits:   { memory: "4Gi", cpu: "2", ephemeral-storage: "5Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
