apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_perf_pt_jobs.py -- performance against jet pT, JetClass confusion matrices. CPU.
  name: perf-pt-jc2v5-jc1probev5-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.14 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 90 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          for f in /data/results/eval/v2_linprobe_bal/fits_v5/mtx-l188-s1.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-l188-s2.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-l188-s3.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-l162-s1.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-l162-s2.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-l162-s3.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-r42q1-s1.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-r42q1-s2.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-r42q1-s3.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-r16q1-s1.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-r16q1-s2.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-r16q1-s3.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-l162mass-s1.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-l162mass-s2.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-r16q1mass-s1.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-r16q1mass-s2.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-rand2p1-s1.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-rand2p2-s2.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-rand2p3-s1.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-rand2p4-s2.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-rand2p5-s2.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-flavf0-s1.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-flavf0-s2.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-flavf1-s1.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-flavf1-s2.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-flavf1r-s1.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-flavf1r-s2.json /data/results/eval/v2_linprobe_bal/fits_v5/init-s1.json /data/results/eval/v2_linprobe_bal/fits_v5/init-s2.json /data/results/eval/v2_linprobe_bal/fits_v5/init-s3.json; do [ -e "${f}" ] || { echo "FATAL: no ${f}: the v5 fit is not done"; exit 42; }; done
          retry pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          python3 experiments/EVAL/perf_vs_pt.py jc2 --out-dir /data/results/eval/perf_vs_pt_v5/jc2 --probs-root /data/results/eval/v2_linprobe_bal/fits_v5_probs
          touch /data/results/eval/perf_vs_pt_v5/jc2/DONE
          TEST1=""
          for C in HToBB HToCC HToGG HToWW2Q1L HToWW4Q TTBar TTBarLep WToQQ ZToQQ ZJetsToNuNu; do for f in $(ls /data/JetClass/Pythia/test_20M/${C}_*.root | sort | head -2); do TEST1="${TEST1} ${f}"; done; done
          [ "$(echo ${TEST1} | wc -w)" -eq 20 ] || { echo "FATAL: expected 20 JetClass test files"; exit 42; }
          python3 experiments/EVAL/perf_vs_pt.py jc1probe --out-dir /data/results/eval/perf_vs_pt_v5/jc1_probe --probs-root /data/results/eval/v2_linprobe_bal/fits_v5_probs --test-files ${TEST1}
          touch /data/results/eval/perf_vs_pt_v5/jc1_probe/DONE
          echo "PERF PT jc2v5 jc1probev5 COMPLETE"
        resources:
          requests: { memory: "24Gi", cpu: "4", ephemeral-storage: "10Gi" }
          limits:   { memory: "24Gi", cpu: "4", ephemeral-storage: "10Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
