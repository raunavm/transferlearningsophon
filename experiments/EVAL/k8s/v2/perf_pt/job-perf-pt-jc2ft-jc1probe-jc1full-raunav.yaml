apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_perf_pt_jobs.py -- performance against jet pT, JetClass confusion matrices. CPU.
  name: perf-pt-jc2ft-jc1probe-jc1full-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q https://github.com/raunavm/transferlearningsophon.git tls && git -C tls checkout -q ab5f709cfda5ac113fa7ceb939eeda171e853c4c; }
          retry clone || exit 1
          cd /workspace/tls
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 89 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          for c in /data/results/ft_v2/budget_long_fulldecay/leg2/scratch/N1000000/s1 /data/results/ft_v2/budget_long_fulldecay/leg2/scratch/N1000000/s2 /data/results/ft_v2/budget_long_fulldecay/leg2/scratch/N1000000/s3; do [ -e "${c}/DONE" ] || { echo "FATAL: ${c} not DONE"; exit 42; }; done
          python3 experiments/EVAL/perf_vs_pt.py jc2ft --out-dir /data/results/eval/perf_vs_pt_v3/jc2_ft --probe-dir /data/results/eval/perf_vs_pt_v2/jc2
          python3 experiments/EVAL/perf_vs_pt.py jc1 --tree /data/results/ft_v2/budget_long_fulldecay/leg2 --out-dir /data/results/eval/perf_vs_pt_v3/jc1_fulldecay --confusion-out /data/results/eval/confusion_jc1_fulldecay
          TEST1=""
          for C in HToBB HToCC HToGG HToWW2Q1L HToWW4Q TTBar TTBarLep WToQQ ZToQQ ZJetsToNuNu; do for f in $(ls /data/JetClass/Pythia/test_20M/${C}_*.root | sort | head -2); do TEST1="${TEST1} ${f}"; done; done
          [ "$(echo ${TEST1} | wc -w)" -eq 20 ] || { echo "FATAL: expected 20 JetClass test files"; exit 42; }
          python3 experiments/EVAL/perf_vs_pt.py jc1probe --out-dir /data/results/eval/perf_vs_pt_v3/jc1_probe --test-files ${TEST1}
          echo "PERF PT jc2ft jc1probe jc1full COMPLETE"
        resources:
          requests: { memory: "16Gi", cpu: "4", ephemeral-storage: "10Gi" }
          limits:   { memory: "16Gi", cpu: "4", ephemeral-storage: "10Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
