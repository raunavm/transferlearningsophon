apiVersion: batch/v1
kind: Job
metadata:
  # The confusion-share test of the nine 17-group label sets (PI 2026-11-21), specified in
  # experiments/EVAL/confusion_share.py before any data was read (d662a07b): from the saved probabilities, no training. CPU.
  name: confusion-share-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.20 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          O=/data/results/eval/confusion_share/confusion_share.json
          [ ! -e ${O} ] || { echo "FATAL: ${O} exists"; exit 42; }
          python3 experiments/EVAL/confusion_share.py --root /data/results/eval/v2_linprobe_bal --out ${O}
          cat ${O}
        resources:
          requests: { memory: "6Gi", cpu: "4", ephemeral-storage: "5Gi" }
          limits:   { memory: "6Gi", cpu: "4", ephemeral-storage: "5Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
