apiVersion: batch/v1
kind: Job
metadata:
  name: v1err-batch-a2-raunav
  namespace: cms-ml
spec:
  backoffLimit: 6
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # a signal (OOM, lost node) is retried; any other failure is deterministic
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; echo "HALT: exit $rc, not retried"; exit 42; }
          git clone --depth 1 --branch "mtx-s1.75" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1
          # BLAS threads = the CPUs requested: nproc reports the node's cores
          export OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          date -u +"start %Y-%m-%dT%H:%M:%SZ"; nproc; free -g | head -2

          FT=/data/results/eval/v1err/ft_b200
          run_ft () {   # background
            if [ -f "${FT}/replicates_ft.npz" ] && [ -f "${FT}/replicates_ft.json" ]; then exit 0; fi
            mkdir -p ${FT}/cells
            python3 experiments/STATS/paired_errors.py ft-replicates \
              --leg1-root /data/results/ft/w2b/leg1 --leg1-metrics /data/results/ft/w2b_leg1_metrics_v2/leg1_metrics.json \
              --leg2-root /data/results/ft/w2b/leg2 --leg2-metrics /data/results/ft/w2b_leg2_metrics_v2/leg2_metrics.json \
              --b 200 --procs 10 --cache ${FT}/cells \
              --out ${FT}/replicates_ft.npz > ${FT}.log 2>&1
          }

          run_probe () {   # SPECS FEAT OUT TASKS EPS; background, so its exit is its status
            local ARMS=""
            for spec in $1; do
              a=${spec%%:*}; d=/data/results/eval/${a}/$2
              for f in features.npy label188.npy extract_manifest.json; do
                [ -f "${d}/${f}" ] || { echo "FATAL: no ${d}/${f}"; exit 42; }
              done
              ARMS="${ARMS} ${a#mtx-}=${d}"
            done
            if [ -f "$3/scores.npz" ] && [ -f "$3/probe_results.json" ]; then exit 0; fi
            mkdir -p $3
            OMP_NUM_THREADS=3 OPENBLAS_NUM_THREADS=3 MKL_NUM_THREADS=3 \
            python3 experiments/EVAL/probe.py --features ${ARMS} --out $3 \
              --tasks $4 --eps-s $5 --bootstrap 2000 --save-scores > $3.log 2>&1
          }
          P=""
          run_ft &
          P="$P $!"
          run_probe "mtx-rand-d1-s1b:RAND mtx-r16q1-s1:R16_Q1" features_e79 /data/results/eval/v1err/probe_ladder_randcontrol/sd1 "bvc_4prong visible_content" "0.5 0.7 0.9" &
          P="$P $!"
          run_probe "mtx-rand-d2-s2:RAND mtx-r16q1-s2:R16_Q1" features_e79 /data/results/eval/v1err/probe_ladder_randcontrol/sd2 "bvc_4prong visible_content" "0.5 0.7 0.9" &
          P="$P $!"
          run_probe "mtx-rand-d3-s3:RAND mtx-r16q1-s3:R16_Q1" features_e79 /data/results/eval/v1err/probe_ladder_randcontrol/sd3 "bvc_4prong visible_content" "0.5 0.7 0.9" &
          P="$P $!"
          run_probe "mtx-l162-s1b:L162 mtx-l162-s2:L162 mtx-l162-s3:L162 mtx-l162-s4:L162 mtx-l162-s5:L162 mtx-r16q1-s1:R16_Q1 mtx-r16q1-s2:R16_Q1 mtx-r16q1-s3:R16_Q1 mtx-r16q1-s4:R16_Q1 mtx-r16q1-s5:R16_Q1" features_vcbwindow_e79_full /data/results/eval/v1err/probe_ladder_vcbwindow/sall "bc_vs_rest" "0.6 0.4" &
          P="$P $!"
          run_probe "mtx-l162-s5:L162 mtx-l162mass-s5:L162_MASS mtx-r16q1-s5:R16_Q1 mtx-r16q1mass-s5:R16_Q1_MASS" features_e79 /data/results/eval/v1err/probe_ladder_mass2x2/s5 "bvc_resonant retained_topology bvc_qcd ee_vs_mm bvc_4prong visible_content" "0.5 0.7 0.9" &
          P="$P $!"
          for p in ${P}; do wait ${p} || halt; done
          date -u +"end %Y-%m-%dT%H:%M:%SZ"
        volumeMounts:
        - { name: data, mountPath: /data }
        resources:
          requests: { memory: "80Gi", cpu: "24", ephemeral-storage: "10Gi" }
          limits:   { memory: "80Gi", cpu: "24", ephemeral-storage: "10Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
