apiVersion: batch/v1
kind: Job
metadata:
  # RERUN of eval-anchors-raunav, which COMPLETED at tag mtx-s1.15 --
  # three commits before the unweighted-comparison fix, so it reported the
  # pre-fix number. A new NAME rather than a delete+apply: the first job
  # object stays as provenance, and a new OUTPUT PATH so no results file is
  # overwritten. Compare anchors.json (old) against anchors_v2.json (fixed).
  # THE PUBLISHED-ANCHOR CALIBRATION -- docs/PRD_PLAN.md 6.3 and 8.1.
  #
  # Before any arm-wise rejection number is quoted, the PUBLIC Sophon checkpoint
  # must reproduce the numbers its own authors published, using OUR discriminant
  # construction, OUR selection and OUR ROC code:
  #
  #   arXiv:2503.00118 Table A1 (Sophon column), QCD rejection 1/eps_B
  #     X->bb vs QCD   eps_S = 60 %    300        eps_S = 40 %    810
  #     X->cc vs QCD   eps_S = 60 %    110        eps_S = 40 %    320
  #
  # WHY IT MATTERS THAT THIS RUNS FIRST. A bias in the evaluation code would be
  # invisible internally: every arm would carry the same bias, so the ORDERING
  # across arms -- which is the paper's claim -- could still look entirely sane
  # while every absolute rejection was wrong. The published anchors are the only
  # external reference that can catch it.
  #
  # Table A1 quotes two significant figures and its numbers come from the
  # authors' own Delphes sample and selection, so agreement is judged on a 25 %
  # relative tolerance. This asks "is our evaluation code right", not "is our
  # test set theirs": a 2x miss is a bug, a 10 % miss is not.
  #
  # FIRST RUN (2026-09-07, tag mtx-s1.13) MISSED BY 2.6-3.4x, ALL FOUR HIGH:
  #   bb 60%  777.0 vs 300 | bb 40%  2554.2 vs 810
  #   cc 60%  291.6 vs 110 | cc 40%  1088.7 vs 320
  # Diagnosed, not guessed: in the raw test sample the signal and QCD kinematics
  # differ grossly -- median m_SD 141 GeV (X_bb) and 143 (X_cc) against 57 for
  # QCD, median pT 1059 against 854 -- so an UNWEIGHTED ROC lets the
  # discriminant separate on jet mass, which is not flavour tagging.
  # arXiv:2405.12972 App. B reweights (m_SD, pT) in two dimensions "to ensure
  # consistent distributions", so anchors.py now matches the QCD density to the
  # signal's on a 24 x 20 (m_SD, pT) grid and reports the unweighted number
  # beside it. THIS IS EXACTLY WHAT THE ANCHOR CHECK EXISTS TO CATCH: quoting
  # arm-wise rejections without it would have inflated every one of them ~3x
  # while leaving the ARM ORDERING -- the paper's actual claim -- looking sane.
  #
  # backoffLimit 0: a disagreement is a RESULT and anchors.py now exits 0 with
  # it recorded. The first run returned non-zero on mismatch and burned its
  # whole backoff re-deriving the same four numbers.
  #
  # CPU-ONLY, ZERO GPU. Reads cached logits written by the E0b extraction; the
  # 3 GB logits array is mmapped and consumed in 500k-row chunks.
  name: eval-anchors2-raunav
  namespace: cms-ml
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: anchors
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          git clone --depth 1 --branch "mtx-s1.26" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD

          FEAT=/data/results/eval/sophon-public/features_massreg
          for f in logits.npy label188.npy observers.npz; do
            [ -f "${FEAT}/${f}" ] || { echo "FATAL: no ${FEAT}/${f}"; exit 1; }
          done

          OUT=/data/results/eval/sophon-public
          PYTHONUNBUFFERED=1 python3 experiments/EVAL/anchors.py \
            --features ${FEAT} \
            --out ${OUT}/anchors_v2.json

          echo "=== anchors_v2.json ==="
          cat ${OUT}/anchors_v2.json
        volumeMounts:
        - { name: data, mountPath: /data }
        resources:
          requests: { memory: "16Gi", cpu: "4", ephemeral-storage: "10Gi" }
          limits:   { memory: "16Gi", cpu: "4", ephemeral-storage: "10Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
