apiVersion: batch/v1
kind: Job
metadata:
  # LEARNING RATE 1e-3 -- this arm's own optimum, not a shared rate.
  # G1 returned KILL (the optimum moves with K), so docs/GATES.md's
  # branch applies and arms are compared at their own optima.
  # Evidence: 2.5e-4 0.52183 < 5e-4 0.55232 < 1e-3 0.55548, and 2e-3 diverged to nan at iteration 2. Bracketed below by 5e-4 and above by the divergence. The 1e-3 vs 5e-4 gap is 0.00316 = 0.2x the noise floor, so the two are tied and 1e-3 is the point estimate, not a resolved winner.
  # Applied by scripts/build_mtx_launch.py.
  #
  # CORE-MATRIX GRANULARITY ARM -- L162 (K = 162), seed 1
  #
  # GENERATED by scripts/build_arm_jobs.py -- do not hand-edit. Regenerate.
  #
  # This job differs from its sibling arms at EXACTLY these edit sites, and no
  # others: this header, metadata.name, RUN_ID, --arm/--num-classes,
  # --data-config (x2), -o num_classes, and --tensorboard. All of them carry the
  # arm name or its K. Everything else -- resources, affinity, env, volumes,
  # backoffLimit, the file lists, the guards -- is byte-identical, which is
  # invariant I1 at the run level and is asserted by the generator.
  #
  # BUDGET: 10,240,000 samples/epoch x 80 epochs = 819,200,000 examples seen
  #         (~6.1 effective passes over 110,087,593 selected training jets).
  #
  # backoffLimit is 0 ON PURPOSE, not 1. A retry does not resume -- no
  # --load-epoch is wired -- so it restarts at epoch 0 in the SAME ${OUT} and
  # overwrites net_best_epoch_state.pt with a worse model. That is destroying a
  # checkpoint (CLAUDE.md section 8) on top of burning a second full budget on
  # an identical failure. Relaunch by hand after reading the logs.
  #
  # Region is pinned because weaver STREAMS from the CephFS PVC at SDSC and is
  # I/O-bound, not GPU-bound: a cross-region pod does not run slowly, it runs at
  # near-zero GPU utilisation. GPU model is pinned separately, for I7b. Both
  # constraints are required and they are not the same constraint.
  # RATE-EXCEPTION: launched 2026-08-22 at 1e-3, superseded 2026-08-27 by
  # job-mtx-l162-s1b-raunav.yaml at 5e-4. This spec is left at 1e-3 on purpose --
  # it is the record of what is RUNNING on the cluster, and editing it would make
  # the repo disagree with the live pod and with the RECIPE stamp in its own
  # output directory. Do not delete this job until s1b is actually Running: a
  # 1-GPU probe could not schedule anywhere in us-west at any memory size or
  # priority (2026-08-27), so killing first surrenders the only GPU we hold.
  # Retire this spec, and this marker, once the switchover is done.
  name: eval-mtx-l162-s1b-raunav
  namespace: cms-ml
spec:
  backoffLimit: 50
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        env:
        # I7b evidence. The node label and the torch-reported device name come
        # from different layers; the manifest records BOTH so a pair whose pod
        # moved after scheduling is detectable after the fact.
        # GPU_PRODUCT is a LITERAL matching the nodeAffinity value below, not a
        # fieldRef: the downward API cannot read node labels, so a fieldRef here
        # would silently record the node NAME under a field the analysis reads
        # as a GPU model. The manifest cross-checks this literal against
        # torch.cuda.get_device_name(0); a disagreement means the pin failed.
        - name: GPU_PRODUCT
          value: "NVIDIA-GeForce-RTX-3090"
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: REGION
          value: "us-west"
        # Pin all three arms to ONE ref. A branch name here means three arms
        # launched at different times can run different code.
        - name: REPO_REF
          value: "mtx-s1.7"
        args:
        - |
          set -euo pipefail

          # The image carries no repo. Every other job in this repo clones.
          #
          # --branch takes a TAG here, not the default branch. Cloning a branch
          # tip means three arms launched minutes or days apart each get
          # whatever the tip was AT THAT MOMENT, so the arms could run
          # different code -- precisely the channel I1 and I2 exist to close,
          # and nothing downstream would notice. A tag is an exact pin, and
          # --depth 1 still applies to it, so the clone stays small.
          git clone --depth 1 --branch "${REPO_REF}"             https://github.com/raunavm/transferlearningsophon.git             /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon

          # weaver reads JetClass-II parquet through pyarrow, which the cu121
          # image does not ship. Fail loudly rather than at first fetch.
          pip install --no-cache-dir -q pyarrow || exit 1

          RUN_ID=mtx-l162-s1b
          OUT=/data/results/mtx/${RUN_ID}/eval
          mkdir -p ${OUT}

          # Provenance for the two things that can drift between arms launched
          # at different times. pyarrow is deliberately UNPINNED -- guessing a
          # version blind is a worse risk than recording the resolved one --
          # so a mismatch across arms must be detectable after the fact.
          git rev-parse HEAD | tee ${OUT}/repo_commit.txt
          python3 -c "import pyarrow; print(pyarrow.__version__)"             | tee ${OUT}/pyarrow_version.txt

          # ---- split guard -------------------------------------------------
          # All three splits live in ONE directory. A bare glob would train on
          # the held-out test files and bake them into the reweighting
          # histograms, which is unrecoverable: the checkpoints, not just the
          # numbers, would be contaminated.
          #
          # This counts files that ACTUALLY EXIST, not array lengths. The array
          # is a brace expansion, so its length is a compile-time constant that
          # can never disagree with the number asserted next to it -- the old
          # form of this guard verified nothing about the PVC at all. weaver
          # resolves each path with glob.glob (train.py:187, 329) and SILENTLY
          # DROPS anything missing, so a partially-populated or partially-mounted
          # PVC would shrink the training set with no error anywhere.
          TRAIN_FILES=(/jc2/jet_data/Res2P_{0000..0199}.parquet /jc2/jet_data/Res34P_{0000..0859}.parquet /jc2/jet_data/QCD_{0000..0279}.parquet)
          VAL_FILES=(/jc2/jet_data/Res2P_{0200..0249}.parquet /jc2/jet_data/Res34P_{0860..1074}.parquet /jc2/jet_data/QCD_{0280..0349}.parquet)
          TEST_FILES=(/jc2/jet_data/Res2P_{0250..0299}.parquet /jc2/jet_data/Res34P_{1075..1289}.parquet /jc2/jet_data/QCD_{0350..0419}.parquet)
          n_present () { local n=0; for f in "$@"; do [ -f "$f" ] && n=$((n+1)); done; echo $n; }
          N_TRAIN=$(n_present "${TRAIN_FILES[@]}")
          N_VAL=$(n_present "${VAL_FILES[@]}")
          N_TEST=$(n_present "${TEST_FILES[@]}")
          echo "present on PVC: train=${N_TRAIN} val=${N_VAL} test=${N_TEST}"
          [ "${N_TRAIN}" -eq 1340 ] || { echo "FATAL: only ${N_TRAIN} of 1340 train files present on the PVC"; exit 1; }
          [ "${N_VAL}"   -eq 335 ]   || { echo "FATAL: only ${N_VAL} of 335 val files present on the PVC"; exit 1; }
          [ "${N_TEST}"  -eq 335 ]  || { echo "FATAL: only ${N_TEST} of 335 test files present on the PVC"; exit 1; }

          # ---- reweighting sidecar -----------------------------------------
          # weaver rebuilds the flat-(pT, m_SD) histograms at startup unless a
          # sidecar named <config>.<md5-of-config>.auto.yaml sits next to the
          # config (utils/dataset.py:401-406). --no-remake-weights ALONE does
          # NOT suppress that rebuild: the gate is
          #     if remake_weights or self._data_config.reweight_hists is None
          # (dataset.py:420), and these configs ship reweight_hists empty. Both
          # halves are required.
          #
          # The sidecar must come from job-mtx-makeweight-raunav, which scans
          # train+val (1675 files) per the upstream Sophon recipe. A rebuild
          # here would scan --data-train only (1340 files) -- test-clean either
          # way, but NOT the same histograms, and not the ones
          # docs/GROUND_TRUTH.md describes.
          #
          # The md5 is taken from the config THIS pod cloned, so a config edited
          # after the make_weight pass cannot silently pick up a stale sidecar:
          # the name simply is not found and the run stops here, before the GPU.
          CFG=configs/arms/L162.yaml
          MD5=$(md5sum ${CFG} | cut -d' ' -f1)
          SIDECAR=configs/arms/L162.${MD5}.auto.yaml
          SRC=/data/results/mtx/makeweight/L162.${MD5}.auto.yaml
          [ -f "${SRC}" ] || { echo "FATAL: no reweighting sidecar at ${SRC}. Run job-mtx-makeweight-raunav first. If it HAS run, then configs/arms/L162.yaml changed afterwards (its md5 is in the filename) and make_weight must be re-run."; exit 1; }
          cp -v "${SRC}" "${SIDECAR}"

          # The reweighting actually used by this run, preserved WITH the run.
          # Without this the realised histograms are unrecoverable afterwards,
          # which is a docs/RECORD.md evidence gap independent of I2.
          cp -v "${SIDECAR}" ${OUT}/
          sha256sum "${SIDECAR}" | tee ${OUT}/reweight_sidecar.sha256

          CKPT=/data/results/mtx/mtx-l162-s1b/net_best_epoch_state.pt
          [ -s "${CKPT}" ] || { echo "FATAL: no checkpoint at ${CKPT}"; exit 1; }
          echo "evaluating ${CKPT}"

          # --predict sets run_mode=['test'] and skips training entirely.
          # --predict-gpus 0 is MANDATORY: without it weaver evaluates on CPU,
          # silently, over 27.4 M jets. See this script's docstring.
          # --data-test is UNPREFIXED so weaver writes pred.root rather than
          # pred_<group>.root.
          PYTHONUNBUFFERED=1 weaver --predict --predict-gpus 0 \
            --data-test /jc2/jet_data/Res2P_{0250..0299}.parquet /jc2/jet_data/Res34P_{1075..1289}.parquet /jc2/jet_data/QCD_{0350..0419}.parquet \
            --data-config configs/arms/L162.yaml \
            --no-remake-weights \
            --network-config experiments/MTX/ParT_sophon_arch_mtx.py \
            -o num_classes 162 -o fc_params '[(512,0.1)]' \
            --batch-size 512 \
            --num-workers 2 --fetch-by-files --fetch-step 5 \
            --model-prefix /data/results/mtx/mtx-l162-s1b/net \
            --log ${OUT}/eval.log \
            --predict-output ${OUT}/pred.root

          # pred.root is the gate requirement, so verify it exists AND is a real
          # ROOT file. weaver wraps its writer in try/except and only LOGS a
          # failure; uproot.recreate has already created the file by then, so a
          # size check alone would pass on a corrupt write.
          # Kept to ONE line on purpose: the YAML block scalar above requires
          # every line to stay indented, and a multi-line `python3 -c` with
          # column-0 lines silently terminates the block and breaks the spec.
          [ -s ${OUT}/pred.root ] || { echo "FATAL: no pred.root written"; exit 1; }
          python3 -c "import uproot,sys; f=uproot.open('${OUT}/pred.root'); t=f[f.keys()[0].split(';')[0]]; print('pred.root OK:', t.name, t.num_entries, 'entries,', len(t.keys()), 'branches'); sys.exit(0 if t.num_entries>0 else 1)" || { echo "FATAL: pred.root unreadable or empty"; exit 1; }
          cp -r ./runs ${OUT}/tb 2>/dev/null || true
        resources:
          # 20Gi ephemeral, not 200Gi: nothing is staged locally, the corpus is
          # streamed. A 200Gi request narrows an already narrow node pool for
          # storage that is never used.
          requests: { memory: "120Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "120Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      # Every GPU node in this pool carries an `nvidia.com/gpu` taint. Its effect
      # is PreferNoSchedule (soft), so this is not strictly required, but without
      # it the scheduler deprioritises us against every other GPU job, all of
      # which do set it.
      #
      # Deliberately NOT tolerated: `nautilus.io/hardware` and
      # `nautilus.io/reservation:*`. The first is stripped by an admission
      # webhook anyway (the Job template keeps it, the Pod does not), and the
      # second marks nodes belonging to other groups.
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      # DataLoader workers pass tensors through shared memory; the container
      # default /dev/shm is 64 MB, which stalls or crashes multi-worker loading.
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
