apiVersion: batch/v1
kind: Job
metadata:
  name: probe-vcbwindow-s10-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: probe
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          git clone --depth 1 --branch "mtx-s1.53" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1
          date -u +"start %Y-%m-%dT%H:%M:%SZ"; nproc; free -g | head -2

          ARMS=""; RUNGS=""
          for spec in mtx-l162-s1b:L162 mtx-l162-s2:L162 mtx-l162-s3:L162 mtx-l162-s4:L162 mtx-l162-s5:L162 mtx-r16q1-s1:R16_Q1 mtx-r16q1-s2:R16_Q1 mtx-r16q1-s3:R16_Q1 mtx-r16q1-s4:R16_Q1 mtx-r16q1-s5:R16_Q1; do
            a=${spec%%:*}; r=${spec##*:}
            d=/data/results/eval/${a}/features_vcbwindow_e79_full
            for f in features.npy label188.npy extract_manifest.json; do
              [ -f "${d}/${f}" ] || { echo "FATAL: no ${d}/${f}"; exit 1; }
            done
            ARMS="${ARMS} ${a#mtx-}=${d}"
            RUNGS="${RUNGS} ${a#mtx-}=${r}"
          done
          echo "arms:${ARMS}"

          OUT=/data/results/eval/probe_ladder_vcbwindow/sall
          mkdir -p ${OUT}
          python3 experiments/EVAL/probe.py \
            --features ${ARMS} \
            --out ${OUT} \
            --tasks bc_vs_rest \
            --eps-s 0.6 0.4 \
            --bootstrap 2000
          date -u +"end %Y-%m-%dT%H:%M:%SZ"
        volumeMounts:
        - { name: data, mountPath: /data }
        resources:
          requests: { memory: "32Gi", cpu: "8", ephemeral-storage: "10Gi" }
          limits:   { memory: "32Gi", cpu: "8", ephemeral-storage: "10Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
