apiVersion: batch/v1
kind: Job
metadata:
  # MERGE THE PER-ARM ANOMALY RUNS AND APPLY THE CROSS-ARM PASS (PRD_PLAN 3.3).
  #
  # RUN THIS ONLY AFTER ALL THREE PER-ARM JOBS ARE Complete. It is the step that
  # makes the anomaly table mean anything: the regret the vocabulary ablation is
  # about is sigma_min / min over ARMS at fixed (signal, N_sig, family), and no
  # per-arm job can compute it -- an arm alone normalises against itself and
  # writes regret 1.000 for every family, which is the null under test
  # manufactured by the aggregation (the defect audit-2-anomaly found). The
  # per-arm files' regret columns are STALE BY CONSTRUCTION and are overwritten
  # here by anomaly.cross_arm_regret, the same function the single-process path
  # calls rather than a second copy of the arithmetic.
  #
  # FOUR INPUTS, ONE OF WHICH IS NOT RE-RUN. l162-s1b completed 2026-09-09 and
  # its artifact at /data/results/eval/anomaly is merged in as-is; only the three
  # R16_Q1 arms were recomputed. The merge refuses inputs that disagree on
  # row_alignment_sha256, trainings, n_bkg, n_template, stat_cut, min_bkg_pass or
  # sigma_t, so reusing an older arm cannot silently mix incommensurable cells --
  # and it refuses a duplicated arm rather than letting last-one-win hide which
  # run a published number came from.
  #
  # OUTPUT IS A NEW DIRECTORY. /data/results/eval/anomaly is NOT overwritten:
  # overwriting a results file is RED, and that artifact is the l162-s1b input to
  # this very merge.
  #
  # PIN mtx-s1.46, THE FIRST TAG THAT RECORDS WHAT class_sum ACTUALLY REMOVED.
  # score_class_sum leaves the signal's OWN NODE out of the resonant sum
  # (anomaly.py: `res = res - {sig_node}`) -- the standard precaution, since a
  # score that keeps the signal's dedicated output is supervised classification
  # wearing an AD costume. How many NATIVE classes that node holds is 1 at
  # L188/L162 but 3-12 at R42_Q1 and 10-29 at R16_Q1, so the SAME CODE IS A
  # DIFFERENT ESTIMATOR AT EACH RUNG. anomaly.py computed `classes_removed` per
  # repetition and the aggregation dropped it -- it keeps only keys whose value
  # is a dict, correctly, because a scalar is not a score family, and nothing
  # carried it back. It reached no artifact at all, per-arm or merged, which is
  # precisely the state anomaly.py's docstring calls unfalsifiable.
  #
  # NO ARM IS RE-RUN TO GET IT. The count is a function of the committed tree
  # and the signal alone, so this merge recomputes it for every cell. Four arms
  # at ~25 CPU-hours each stay on disk untouched.
  #
  # The same tag stamps `signal_provenance`: all six signals are NATIVE
  # JetClass-II classes that every arm saw in pretraining, so this table is
  # IN-DOMAIN sensitivity and never a discovery number (docs/PRD_PLAN.md 3.3
  # admits the module on exactly that condition). The vocabulary-free controls
  # do not exempt it -- their frozen 128-d features were learned from these
  # same classes.
  #
  # PREVIOUSLY mtx-s1.42, THE FIRST TAG THAT COUNTS RUNGS RATHER THAN ARMS.
  # The previous pin (mtx-s1.38, while this comment still said s1.36 -- the
  # comment had gone stale against the line below it) predates 56ca80a. At that
  # tag the merge reports `regret_n_arms` and nothing else, and the four inputs
  # below are FOUR ARMS SPANNING ONLY TWO RUNGS: l162-s1b plus three R16_Q1
  # seeds. A signal that l162-s1b lost -- label_X_YY_qqqq, dropped when that job
  # died at ~25 h -- then survives on the three R16_Q1 seeds alone, passes
  # `regret_n_arms >= 2`, and reads as a measured cost of coarsening while
  # actually measuring seed-to-seed variation inside ONE vocabulary. 56ca80a
  # adds `signals_with_one_rung` so that cell is named instead of published.
  #
  # CPU-ONLY, ZERO GPU, minutes: this is JSON arithmetic, not a rerun.
  name: eval-anomaly-merge-raunav
  namespace: cms-ml
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: merge
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          git clone --depth 1 --branch "mtx-s1.46" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1

          IN=""
          for d in /data/results/eval/anomaly \
                   /data/results/eval/anomaly_r16q1-s2 \
                   /data/results/eval/anomaly_r16q1-s3 \
                   /data/results/eval/anomaly_r16q1-s4; do
            [ -f "${d}/anomaly_results.json" ] || { echo "FATAL: no ${d}/anomaly_results.json -- run the per-arm jobs first"; exit 1; }
            IN="${IN} ${d}"
          done
          echo "inputs:${IN}"

          # A NEW DIRECTORY, NOT anomaly_merged. That path already holds the
          # 2026-09-15 merge; rewriting it would destroy the only record of what
          # the table looked like before classes_removed and the in-domain stamp
          # existed, and overwriting a results file is RED (CLAUDE.md 1).
          OUT=/data/results/eval/anomaly_merged_v2
          [ -e "${OUT}/anomaly_results.json" ] && {
            echo "FATAL: ${OUT}/anomaly_results.json exists; refusing to overwrite."
            exit 1; }
          mkdir -p ${OUT}
          python3 experiments/EVAL/anomaly_merge.py --inputs ${IN} --out ${OUT}

          echo "=== arms in the merged artifact ==="
          python3 -c "
          import json
          d=json.load(open('${OUT}/anomaly_results.json'))
          print(sorted(d['arms']))
          print('merged_from:', json.dumps(d.get('merged_from'), indent=1))
          print('null_not_flat:', len(d.get('null_not_flat', [])))
          print('null_unmeasured:', len(d.get('null_unmeasured', [])))
          sp=d.get('signal_provenance',{})
          print('in_domain:', sp.get('in_domain'))
          print('=== classes_removed by rung (the estimator substitution) ===')
          for sig,v in sorted(sp.get('signals',{}).items()):
              print(' ', sig, v['classes_removed_by_rung'])
          n=sum(1 for ad in d['arms'].values() for pn in ad['signals'].values()
                for c in pn.values()
                if isinstance(c,dict) and 'classes_removed' in c)
          tot=sum(1 for ad in d['arms'].values() for pn in ad['signals'].values()
                  for c in pn.values() if isinstance(c,dict))
          print('cells carrying classes_removed: %d/%d' % (n,tot))
          assert n==tot, 'every cell must carry it; that was the whole defect'
          "
        volumeMounts:
        - { name: data, mountPath: /data }
        resources:
          requests: { memory: "16Gi", cpu: "2", ephemeral-storage: "10Gi" }
          limits:   { memory: "16Gi", cpu: "2", ephemeral-storage: "10Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
