apiVersion: batch/v1
kind: Job
metadata:
  name: eval-reader-raunav
  namespace: cms-ml
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 43200
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args: ["sleep 43000"]
        volumeMounts:
        - { name: jc2,  mountPath: /jc2,  readOnly: true }
        - { name: data, mountPath: /data, readOnly: true }
        resources:
          requests: { memory: "8Gi", cpu: "1" }
          limits:   { memory: "8Gi", cpu: "1" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
          readOnly: true
