apiVersion: batch/v1
kind: Job
metadata:
  # CLASS-SUM RERUN, ONE MODEL PER JOB (2026-09-28): ONLY class_sum_matched.
  #
  # WHY. The committed class_sum leaves out the signal's own output node, which
  # is 1 native class at 188 and 162 classes but 3-12 at 43 and 10-29 at 17, so
  # comparing it across label sets mixes the label-set effect with a change of
  # estimator. class_sum_matched leaves out the signal's whole 17-class group
  # at every label set; the tree is nested, so at every finer set that group is
  # an exact union of output nodes and the SAME native classes are removed.
  #
  # HELD FIXED. The feature cache and its logits (built from the features only
  # if absent, never overwritten), --n-bkg / --n-template / --trainings, the
  # signals and injections. --features names the UNVERSIONED model, so the
  # committed resamplings are drawn exactly; anomaly_summary.py refuses the
  # merged rerun unless every cell's rng_seeds match and, at 17 classes where
  # the two estimators coincide, the committed class_sum is reproduced.
  #
  # NOT RUN. kNN, Mahalanobis, IAD. IAD is dropped from the paper: its
  # sigma_min is not the definition of arXiv:2604.20965 Sec. V.4.
  #
  # PIN mtx-s1.64. Not tagged when this was written: create the tag on the commit
  # carrying class_sum_matched BEFORE applying this spec.
  #
  # CPU-ONLY, ZERO GPU, us-west (the caches are on the PVC at SDSC). 2 CPUs,
  # not 8: class-sum scoring is single-threaded Python. Generated by
  # scripts/build_anomaly_jobs.py --class-sum-rerun; do not hand-edit.
  name: eval-anomaly-r16q1-s5-cs-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  # 36 h. ~8.5 h per model expected (measured locally and scaled by the pods'
  # measured rate; scripts/build_anomaly_jobs.py, CS_DEADLINE). The deadline
  # counts across the one retry and is TERMINAL: two attempts, 2x margin.
  activeDeadlineSeconds: 129600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: anomaly
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          git clone --depth 1 --branch "mtx-s1.64" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1

          a=mtx-r16q1-s5; r=R16_Q1; k=17
          d=/data/results/eval/${a}/features_e79
          # PRECONDITIONS MATCH WHAT probe.load_arm ACTUALLY OPENS (probe.py:211-218).
          # CORRECTED 2026-09-12: this block hard-failed on observers.npz, which
          # load_arm opens only under an `if (d/"observers.npz").exists()` guard
          # -- an OPTIONAL file -- while never checking label188.npy or
          # extract_manifest.json, which it opens UNCONDITIONALLY. That is the
          # same precondition inversion already fixed in probe-physics-v4 and in
          # eval-labelrec-v3; this was its third instance. A missing mandatory
          # file therefore reached python as a bare traceback after the clone and
          # the logits build, and a cache without observers was refused outright
          # even though anomaly.py never needs them.
          for f in features.npy label188.npy extract_manifest.json; do
            [ -f "${d}/${f}" ] || { echo "FATAL: no ${d}/${f}"; exit 1; }
          done
          # class_sum is the vocabulary-DEFINED score and needs the head's own
          # node outputs. No extraction passes --save-logits, so build them from
          # the cache: features.npy IS fc's input under extract_features' forward
          # pre-hook, so fc(features) is the logits exactly -- one matmul per jet
          # on CPU, and it cannot disagree with the features because it is
          # applied to them.
          if [ ! -f "${d}/logits.npy" ]; then
            echo "building logits for ${a} (K=${k})"
            python3 experiments/EVAL/logits_from_features.py \
              --features ${d} --num-classes ${k} \
              --checkpoint /data/results/mtx/${a}/net_epoch-79_state.pt
          fi
          [ -f "${d}/logits.npy" ] || { echo "FATAL: ${a} still has no logits.npy"; exit 1; }

          OUT=/data/results/eval/anomaly_r16q1-s5-cs
          mkdir -p ${OUT}
          python3 experiments/EVAL/anomaly.py \
            --features r16q1-s5=${d} \
            --rungs r16q1-s5=${r} \
            --out ${OUT} --families class_sum_matched \
            --n-bkg 200000 --n-template 200000 --trainings 10

          echo "=== done: ${OUT}/anomaly_results.json ==="
          echo "regret in THIS file is degenerate (one arm); read the merged artifact"
        volumeMounts:
        - { name: data, mountPath: /data }
        resources:
          requests: { memory: "16Gi", cpu: "2", ephemeral-storage: "10Gi" }
          limits:   { memory: "16Gi", cpu: "2", ephemeral-storage: "10Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
