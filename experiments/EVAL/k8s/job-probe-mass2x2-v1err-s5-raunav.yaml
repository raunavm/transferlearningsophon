apiVersion: batch/v1
kind: Job
metadata:
  name: probe-mass2x2-v1err-s5-raunav
  namespace: cms-ml
spec:
  backoffLimit: 6
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # a signal (OOM, lost node) is retried; any other failure is deterministic
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; echo "HALT: exit $rc, not retried"; exit 42; }
          git clone --depth 1 --branch "mtx-s1.66" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1
          # BLAS threads = the CPUs requested: nproc reports the node's cores
          export OMP_NUM_THREADS=8 OPENBLAS_NUM_THREADS=8 MKL_NUM_THREADS=8
          date -u +"start %Y-%m-%dT%H:%M:%SZ"; nproc; free -g | head -2

          ARMS=""; RUNGS=""
          for spec in mtx-l162-s5:L162 mtx-l162mass-s5:L162_MASS mtx-r16q1-s5:R16_Q1 mtx-r16q1mass-s5:R16_Q1_MASS; do
            a=${spec%%:*}; r=${spec##*:}
            d=/data/results/eval/${a}/features_e79
            for f in features.npy label188.npy extract_manifest.json; do
              [ -f "${d}/${f}" ] || { echo "FATAL: no ${d}/${f}"; exit 42; }
            done
            ARMS="${ARMS} ${a#mtx-}=${d}"
            RUNGS="${RUNGS} ${a#mtx-}=${r}"
          done
          echo "arms:${ARMS}"

          OUT=/data/results/eval/v1err/probe_ladder_mass2x2/s5
          if [ -f "${OUT}/scores.npz" ] && [ -f "${OUT}/probe_results.json" ]; then
            echo "done by an earlier attempt"; exit 0
          fi
          mkdir -p ${OUT}
          python3 experiments/EVAL/probe.py \
            --features ${ARMS} \
            --out ${OUT} \
            --tasks bvc_resonant retained_topology bvc_qcd ee_vs_mm bvc_4prong visible_content \
            --eps-s 0.5 0.7 0.9 \
            --bootstrap 2000 \
            --save-scores || halt
          date -u +"end %Y-%m-%dT%H:%M:%SZ"
        volumeMounts:
        - { name: data, mountPath: /data }
        resources:
          requests: { memory: "32Gi", cpu: "8", ephemeral-storage: "10Gi" }
          limits:   { memory: "32Gi", cpu: "8", ephemeral-storage: "10Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
