apiVersion: batch/v1
kind: Job
metadata:
  # THE TWO PUBLISHED PHYSICS DISCRIMINANTS -- docs/PRD_PLAN.md 3.1(b), 8.2.
  #
  #   bc_vs_rest   arXiv:2503.00118 Eq. 1, the |V_cb| discriminant:
  #                bc vs {bq, cs, bqq, QCD}, in that paper's window
  #                450 < pT < 600 and 90 < m_SD < 140, at eps_S = 60 % / 40 %.
  #                "bqq" is label_X_YY_qqb, the 3-prong q,q,b class.
  #   ee_vs_mm     the lepton-flavour split 2606.09458's background
  #                suppression uses.
  #
  # WHY THESE TWO AND NOT MORE PROBES OF THE SAME KIND. The existing three ask
  # whether an AXIS survived. These ask whether an arm can still construct a
  # discriminant a PUBLISHED analysis depends on -- the use-case-survival
  # argument. A coarse vocabulary does not merely score worse on these; the
  # nodes it would sum over no longer exist.
  #
  # Collapse rungs are DERIVED from configs/labelmaps/rung_label_maps.v1.csv by
  # tests/test_physics_probes.py at all eight rungs. Doing so CORRECTED
  # docs/PRD_PLAN.md 3.1(b): the ee/mumu split merges one rung earlier than the
  # prose says, at R63_Q1 into 2P_LEP_LL|nb0_nc0, not at R42_Q1.
  #
  # RERUN OF probe-physics-raunav AT CODE THAT CARRIES BOTH GUARDS.
  #
  # The v1 job Completed 2026-09-08T01:16:50Z at mtx-s1.18 -- twelve tags before
  # the two probe.py fixes its output depends on:
  #   - MIN_PER_CLASS is now counted on the IN-WINDOW test rows. bc_vs_rest cuts
  #     450 < pT < 600, 90 < m_SD < 140 and |eta| < 2.4, so at s1.18 the count
  #     could pass on the full cache while the windowed cell held far too few
  #     jets to support a rejection quoted at eps_S = 40 %.
  #   - the MLP probe now records `converged` / `epochs_run` per seed and
  #     `all_converged` in the meta. D6 makes the MLP mandatory beside any null
  #     precisely so a linear null cannot be read as "absent" when it is only
  #     "not linearly decodable" -- and that reading needs a CONVERGED MLP. The
  #     first eval-labelrec run showed what an unconverged one looks like: an
  #     MLP scoring BELOW its own linear probe, which is impossible at optimum.
  #
  # ITS PIN WAS NEVER THE FILE'S PIN. job-probe-physics-raunav.yaml said s1.20
  # while the job ran s1.18, because the audit-wave repin edited the spec and
  # nobody re-applied it. Repinning a spec does not repin a result. That is the
  # third instance of this defect (anchors at s1.15, labelrec at s1.31) and
  # tests/test_spec_pins.py now guards the class.
  #
  # Output goes to probe_physics_v2, never over probe_physics: overwriting a
  # results file is RED, and the two runs together are the evidence.
  #
  # CPU-ONLY, ZERO GPU: runs on features already cached by the extraction jobs.
  # Runs the three original tasks too, so the whole probe table lands at once.
  name: probe-physics-v2-raunav
  namespace: cms-ml
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: probe
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          git clone --depth 1 --branch "mtx-s1.33" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1

          # features_e79, NOT features_v2. features_v2 was extracted from
          # net_best_epoch_state.pt; DECISIONS_PENDING item 18 resolved the
          # paper checkpoint to epoch 79 uniformly, so the published
          # discriminants must be measured there. The extraction
          # saved observers.npz, which the windowed task needs; probe.py skips
          # a windowed task with a named message if they are absent rather than
          # silently computing it over the whole spectrum.
          ARMS=""
          for a in mtx-r16q1-s2 mtx-r16q1-s3 mtx-r16q1-s4 mtx-l162-s1b; do
            d=/data/results/eval/${a}/features_e79
            [ -f "${d}/features.npy" ] || { echo "FATAL: no ${d}/features.npy"; exit 1; }
            [ -f "${d}/observers.npz" ] || { echo "FATAL: no ${d}/observers.npz"; exit 1; }
            ARMS="${ARMS} ${a#mtx-}=${d}"
          done
          echo "arms:${ARMS}"

          OUT=/data/results/eval/probe_physics_v2
          mkdir -p ${OUT}
          python3 experiments/EVAL/probe.py \
            --features ${ARMS} \
            --out ${OUT} \
            --tasks bvc_resonant retained_topology bvc_qcd bc_vs_rest ee_vs_mm \
            --bootstrap 2000

          echo "=== results ==="
          cat ${OUT}/*.json
        volumeMounts:
        - { name: data, mountPath: /data }
        resources:
          requests: { memory: "32Gi", cpu: "8", ephemeral-storage: "10Gi" }
          limits:   { memory: "32Gi", cpu: "8", ephemeral-storage: "10Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
