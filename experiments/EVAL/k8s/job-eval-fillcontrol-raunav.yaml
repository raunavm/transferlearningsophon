          leg ${ROOT_OUT}/l162-s1b/unmasked /data/results/mtx/mtx-l162-s1b/net_epoch-79_state.pt 162 l162-s1b_unmasked \
              configs/data/JetClassII_base.yaml
          leg ${ROOT_OUT}/l162-s1b/TopReference /data/results/mtx/mtx-l162-s1b/net_epoch-79_state.pt 162 l162-s1b_TopReference \
              configs/finetune/JetClassII_base_maskTopReference.yaml
          leg ${ROOT_OUT}/l162-s1b/EnergyFlowQG /data/results/mtx/mtx-l162-s1b/net_epoch-79_state.pt 162 l162-s1b_EnergyFlowQG \
              configs/finetune/JetClassII_base_maskEnergyFlowQG.yaml

          echo "===== row alignment: label188 sha256 per arm ====="
          for a in r16q1-s2 r16q1-s3 r16q1-s4 l162-s1b; do
            ref=
            for leg in unmasked TopReference EnergyFlowQG; do
              h=$(python3 -c "import hashlib,numpy,sys;print(hashlib.sha256(numpy.load(sys.argv[1]).tobytes()).hexdigest())" \
                    ${ROOT_OUT}/${a}/${leg}/label188.npy)
              echo "  ${a}/${leg} ${h}"
              if [ -z "${ref}" ]; then ref="${h}"
              elif [ "${h}" != "${ref}" ]; then
                echo "FATAL: ${a}/${leg} labels differ from its own baseline;"
                echo "       the legs are not the same jets, so the fill"
                echo "       penalty would be a different-sample effect."; exit 1
              fi
            done
            cref=
            for leg in unmasked TopReference EnergyFlowQG; do
              c=$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(d.get('checkpoint_sha256') or d.get('sha256') or '')" \
                    ${ROOT_OUT}/${a}/${leg}/extract_manifest.json)
              echo "  ${a}/${leg} ckpt ${c:0:16}"
              if [ -z "${cref}" ]; then cref="${c}"
              elif [ "${c}" != "${cref}" ]; then
                echo "FATAL: ${a}/${leg} was extracted at a DIFFERENT"
                echo "       checkpoint than its own baseline. The fill"
                echo "       penalty would include a checkpoint change."; exit 1
              fi
            done
          done

          echo "===== probes: unmasked ====="
          python3 experiments/EVAL/probe.py \
            --features r16q1-s2=${ROOT_OUT}/r16q1-s2/unmasked r16q1-s3=${ROOT_OUT}/r16q1-s3/unmasked r16q1-s4=${ROOT_OUT}/r16q1-s4/unmasked l162-s1b=${ROOT_OUT}/l162-s1b/unmasked \
            --out ${ROOT_OUT}/probe_unmasked --bootstrap 2000

          echo "===== probes: TopReference ====="
          python3 experiments/EVAL/probe.py \
            --features r16q1-s2=${ROOT_OUT}/r16q1-s2/TopReference r16q1-s3=${ROOT_OUT}/r16q1-s3/TopReference r16q1-s4=${ROOT_OUT}/r16q1-s4/TopReference l162-s1b=${ROOT_OUT}/l162-s1b/TopReference \
            --out ${ROOT_OUT}/probe_TopReference --bootstrap 2000

          echo "===== probes: EnergyFlowQG ====="
          python3 experiments/EVAL/probe.py \
            --features r16q1-s2=${ROOT_OUT}/r16q1-s2/EnergyFlowQG r16q1-s3=${ROOT_OUT}/r16q1-s3/EnergyFlowQG r16q1-s4=${ROOT_OUT}/r16q1-s4/EnergyFlowQG l162-s1b=${ROOT_OUT}/l162-s1b/EnergyFlowQG \
            --out ${ROOT_OUT}/probe_EnergyFlowQG --bootstrap 2000

          echo "===== summary ====="
          for t in unmasked TopReference EnergyFlowQG; do
            echo "--- ${t}"; cat ${ROOT_OUT}/probe_${t}/*.json
          done
          echo "FILL CONTROL COMPLETE"
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: jc2, mountPath: /jc2, readOnly: true }
        resources:
          requests: { memory: "32Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "32Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
