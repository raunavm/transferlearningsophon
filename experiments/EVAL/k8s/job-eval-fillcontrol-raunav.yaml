            local d=$1 ckpt=$2 k=$3 tag=$4 cfg=$5
            case "${d}" in ${ROOT_OUT}/*/*) ;; *) echo "FATAL: refusing to touch ${d}"; exit 1;; esac
            local want=$(sha256sum ${ckpt} | cut -d' ' -f1) got=
            [ -f ${d}/extract_manifest.json ] && got=$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(d.get('checkpoint_sha256') or d.get('sha256') or '')" \
                  ${d}/extract_manifest.json)
            if [ -n "${got}" ] && [ "${got}" = "${want}" ]; then
              echo "  reuse ${d} (checkpoint ${got:0:16} matches)"; return 0
            fi
            [ -n "${got}" ] && echo "  REBUILD ${d}: holds ${got:0:16}, want ${want:0:16}"
