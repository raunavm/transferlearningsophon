            python3 experiments/EVAL/extract_features.py \
              --checkpoint ${ckpt} --num-classes ${k} --arm ${tag} \
              --data-config ${cfg} \
              --data-test ${TEST} --out ${d} \
              --batch-size 512 --num-workers 1 --fetch-step 1 --max-jets ${N}
