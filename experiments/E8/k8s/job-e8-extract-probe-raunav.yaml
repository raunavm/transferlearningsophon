apiVersion: batch/v1
kind: Job
metadata:
  # E8 JC1->JC2 transfer panel: extract frozen 128-d embeddings on JetClass-II for
  # ParT + Arm P + Arm S (each fed its own training preprocessing, same jets/order),
  # then run the linear/MLP/kNN probe at g10sem. GPU (extraction + MLP).
  #   - JC2 parquet: tn-pvc-base-jetclass2 (read-only) at /jc2
  #   - Arm P/S checkpoints + E8 output: transfer-learning-vol at /data
  #   - ParT_full.pt: in the repo (models/ParT/)
  # pyarrow is pip-installed at start (Phase A: absent from the image; weaver/awkward
  # need it to read parquet). Fails fast if it can't.
  name: e8-extract-probe-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: e8
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          pip install -q pyarrow || { echo "pyarrow install FAILED"; exit 1; }
          python3 -c "import pyarrow, awkward; print('pyarrow', pyarrow.__version__)"
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon
          # ParT_full.pt is gitignored (*.pt); fetch the public official checkpoint.
          mkdir -p models/ParT
          [ -f models/ParT/ParT_full.pt ] || \
            curl -sL -o models/ParT/ParT_full.pt \
              https://github.com/jet-universe/particle_transformer/raw/main/models/ParT_full.pt
          [ -f models/ParT/ParT_full.pt ] || { echo "ParT_full.pt fetch FAILED"; exit 1; }

          OUT=/data/results/e8/emb; mkdir -p "$OUT"
          JD=/jc2/jet_data

          # Backbone checkpoints — EXPLICIT list (frozen for provenance + restart
          # safety; a glob could change between a restart's extract and probe).
          # Arm P s2 is still training; add it via a follow-up extract when it lands.
          E1=/data/results/e1
          ARMP="$E1/arm_p_s1/net_best_epoch_state.pt $E1/arm_p_s3/net_best_epoch_state.pt"
          ARMS="$E1/arm_s_s1/net_best_epoch_state.pt $E1/arm_s_s2/net_best_epoch_state.pt $E1/arm_s_s3/net_best_epoch_state.pt"
          for c in $ARMP $ARMS; do [ -f "$c" ] || { echo "MISSING checkpoint $c"; exit 1; }; done

          # JetClass-II file splits (canonical 4:1:1 file-index regions -> no leakage:
          # Res2P train 0000-0199/val 0200-0249/test 0250-0299; Res34P 0000-0859/
          # 0860-1074/1075-1289; QCD 0000-0279/0280-0349/0350-0419).
          # Train sized so the rarest g10 classes (class 1 = 1/15 of Res2P ~6.7k/file,
          # class 8 = 6/146 of Res34P ~4.1k/file) reach >=100k -> the 1M ladder rung
          # is class-balanced, matching the Phase-2 FT ladder.
          files() { local fam=$1; shift; for i in "$@"; do printf "%s/${fam}_%s.parquet " "$JD" "$i"; done; }
          TRAIN="$(files QCD 0000 0001 0002 0003) $(files Res2P $(seq -f "%04g" 0 15)) $(files Res34P $(seq -f "%04g" 0 26))"
          VAL="$(files QCD 0280 0281) $(files Res2P 0200 0201 0202) $(files Res34P 0860 0861 0862 0863 0864)"
          TEST="$(files QCD 0350 0351 0352 0353) $(files Res2P 0250 0251 0252 0253) $(files Res34P 1075 1076 1077 1078 1079 1080)"

          for SPLIT in train val test; do
            if [ -f "$OUT/metadata_${SPLIT}.json" ]; then echo "skip $SPLIT (already extracted)"; continue; fi
            case $SPLIT in train) FL="$TRAIN";; val) FL="$VAL";; test) FL="$TEST";; esac
            echo "=== extract $SPLIT ==="
            python3 experiments/E8/extract_jc2_embeddings.py --split $SPLIT --out "$OUT" \
              --files $FL --armp-ckpts $ARMP --arms-ckpts $ARMS --batch-size 512
          done

          echo "=== probe (g10sem) ==="
          python3 experiments/E8/probe_transfer.py --emb-dir "$OUT" \
            --out /data/results/e8/probe_g10sem --mlp-seeds 0 1 2 \
            --armp armp_s1 armp_s3 \
            --arms arms_s1 arms_s2 arms_s3

          echo "=== provenance + FLOPs ==="
          GPU=$(nvidia-smi --query-gpu=name --format=csv,noheader 2>/dev/null | head -1)
          DRV=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader 2>/dev/null | head -1)
          GC=$(git rev-parse --short HEAD)
          python3 -c "
          import json, glob, os
          meta={}
          for f in sorted(glob.glob('/data/results/e8/emb/metadata_*.json')):
              d=json.load(open(f)); meta[d['split']]={'n_jets':d['n_jets'],'wall_s':d['wall_s'],
                  'total_inference_flops':d.get('total_inference_flops'),
                  'macs_per_jet':{k:v.get('macs_per_jet') for k,v in d['backbones'].items()}}
          prov={'experiment':'E8 JC1->JC2 transfer panel','git_commit':'$GC',
                'image_digest':'sha256:db235b515a278198','gpu':'$GPU','driver':'$DRV',
                'node':os.environ.get('NODE_NAME','?'),'splits':meta,
                'total_inference_flops':sum((m['total_inference_flops'] or 0) for m in meta.values()),
                'artifacts':['/data/results/e8/emb/*_emb.npy (128-d embeddings)',
                             '/data/results/e8/probe_g10sem/models/*_linear.npz + *_mlp.pt (probe heads)',
                             '/data/results/e8/probe_g10sem/transfer_results.json + transfer_table.md']}
          json.dump(prov,open('/data/results/e8/e8_provenance.json','w'),indent=2)
          print(json.dumps(prov,indent=2))
          "
          echo "===== E8 DONE ====="
          cat /data/results/e8/probe_g10sem/transfer_table.md
        resources:
          requests: { memory: "48Gi", cpu: "8", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "48Gi", cpu: "8", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: [NVIDIA-A100-SXM4-80GB, NVIDIA-A100-PCIE-40GB, NVIDIA-A100-SXM4-40GB, NVIDIA-A40, NVIDIA-A10, NVIDIA-RTX-A6000, NVIDIA-RTX-A5000, NVIDIA-L40, NVIDIA-L40S, NVIDIA-GeForce-RTX-4090, NVIDIA-GeForce-RTX-3090]
              - key: topology.kubernetes.io/region
                operator: In
                values: [us-west]
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: transfer-learning-vol }
      - name: jc2
        persistentVolumeClaim: { claimName: tn-pvc-base-jetclass2 }
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "16Gi" }
