apiVersion: batch/v1
kind: Job
metadata:
  # v2 PRETRAINING -- RAND2_p5, run 2 (master seed 2), NVIDIA-GeForce-RTX-3090.
  # GENERATED by scripts/build_mtx_launch.py (v2_job) -- do not hand-edit.
  # experiments/MTX/pretrain_v2.py: Sophon loader, epoch-seeded streams, fixed
  # validation sample, full-state auto-resume, per-epoch metrics and stream records.
  name: mtx2-rand2p5-s2-raunav
  namespace: cms-ml
spec:
  suspend: true
  backoffLimit: 60
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Count
      onExitCodes: { containerName: main, operator: In, values: [43] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        env:
        - name: IMAGE_DIGEST
          value: "sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7"
        - name: GPU_PRODUCT
          value: "NVIDIA-GeForce-RTX-3090"
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: REGION
          value: "us-west"
        - name: REPO_REF
          value: "mtx-s1.98"
        args:
        - |
          set -euo pipefail
          git clone --depth 1 --branch "${REPO_REF}" https://github.com/raunavm/transferlearningsophon.git /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          (
          set -euo pipefail
          HALT=42
          NODE_FAULT=43
          RUN_ID=mtx-rand2p5-s2
          SEED=2
          OUT=/data/results/mtx_v2/${RUN_ID}
          if [ -f ${OUT}/DONE ]; then echo "${RUN_ID} is DONE"; exit 0; fi
          # LAST = pretrain_v2.latest_complete_epoch: the newest resume file with its state file beside it.
          LAST=-1
          for f in ${OUT}/net_epoch-*_resume.pt; do
            [ -e "$f" ] || continue
            n=$(basename "$f" | sed 's/^net_epoch-\([0-9]*\)_resume\.pt$/\1/')
            if [ -f ${OUT}/net_epoch-${n}_state.pt ] && [ "$n" -gt "${LAST}" ]; then LAST=$n; fi
          done
          # Before anything is written: a fresh start needs /data at most 85% full; a run that
          # resumes goes on up to 95%, so that the epochs it has are not stranded.
          CEIL=85; [ "${LAST}" -lt 0 ] || CEIL=95
          USE=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          echo "/data at ${USE}%"
          [ "${USE}" -le "${CEIL}" ] || { echo "FATAL: /data at ${USE}%, above ${CEIL}%"; exit ${HALT}; }
          mkdir -p ${OUT}/attempts
          # A FAILED attempt leaves attempts/failed-* naming the last complete epoch (the
          # EXIT trap; an evicted pod is SIGKILLed, runs no trap and is not counted). Two
          # failed attempts with no epoch completed in between stop the job.
          NF=$(ls ${OUT}/attempts | grep -c -- "-e${LAST}$" || true)
          [ "${NF}" -lt 2 ] || { echo "FATAL: ${NF} failed attempts after epoch ${LAST}"; exit ${HALT}; }
          # A NODE FAULT is the node's failure, not the run's: the GPU does not answer
          # (experiments/FT/gpu_probe.py) at pod start or after a failed attempt, the driver finds
          # no usable GPU (rc 4), or the attempt's part of train.log holds a CUDA device
          # fault. It leaves no failed-* marker; the node is recorded in attempts.log and
          # NODE_FAULTS and the pod exits NODE_FAULT, which the Job counts against its retries.
          # 6 node faults stop the job.
          NNF=$(cat ${OUT}/NODE_FAULTS 2>/dev/null | grep -c "" || true)
          [ "${NNF}" -lt 6 ] || { echo "FATAL: ${NNF} node faults"; exit ${HALT}; }
          ATTEMPT=$(date -u +%Y%m%dT%H%M%SZ)
          node_fault () {
            echo "${ATTEMPT} NODE_FAULT $1 pod=${POD_NAME} node=${NODE_NAME} after_epoch=${LAST}" | tee -a ${OUT}/attempts.log ${OUT}/NODE_FAULTS
            exit ${NODE_FAULT}
          }
          python3 experiments/FT/gpu_probe.py || node_fault preflight
          LOG0=$(cat ${OUT}/train.log 2>/dev/null | grep -c "" || true)
          # rc 3 is pretrain_v2's non-finite training loss: always a failed attempt of the run.
          # rc 4 is a driver's "no usable GPU": always a node fault, whatever the probe says.
          on_exit () {
            local rc=$?
            [ ${rc} -ne 0 ] && [ ${rc} -ne ${HALT} ] && [ ${rc} -ne ${NODE_FAULT} ] || return 0
            [ ${rc} -ne 4 ] || node_fault "rc=${rc}"
            if [ ${rc} -ne 3 ] && { ! python3 experiments/FT/gpu_probe.py ||
                grep -qE "CUDA error: unknown error|Cannot access accelerator device|GPU is lost|CUDA-capable device\(s\) is/are busy or unavailable|uncorrectable ECC error" <(tail -n +$((LOG0 + 1)) ${OUT}/train.log 2>/dev/null); }; then
              node_fault "rc=${rc}"
            fi
            echo "rc=${rc} pod=${POD_NAME} node=${NODE_NAME}" > ${OUT}/attempts/failed-${ATTEMPT}-e${LAST}
          }
          trap on_exit EXIT
          echo "${ATTEMPT} pod=${POD_NAME} node=${NODE_NAME} gpu=${GPU_PRODUCT} after_epoch=${LAST} ref=${REPO_REF}" >> ${OUT}/attempts.log
          TRAIN_FILES=(/jc2/jet_data/Res2P_{0000..0199}.parquet /jc2/jet_data/Res34P_{0000..0859}.parquet /jc2/jet_data/QCD_{0000..0279}.parquet)
          VAL_FILES=(/jc2/jet_data/Res2P_{0200..0203}.parquet /jc2/jet_data/Res34P_{0860..0875}.parquet /jc2/jet_data/QCD_{0280..0284}.parquet)
          n_present () { local n=0; for f in "$@"; do [ -f "$f" ] && n=$((n+1)); done; echo $n; }
          N_TRAIN=$(n_present "${TRAIN_FILES[@]}"); N_VAL=$(n_present "${VAL_FILES[@]}")
          [ "${N_TRAIN}" -eq 1340 ] || { echo "FATAL: ${N_TRAIN} of 1340 training files present"; exit 1; }
          [ "${N_VAL}" -eq 25 ] || { echo "FATAL: ${N_VAL} of 25 validation files present"; exit 1; }
          CFG=configs/arms/v2/RAND2_p5.yaml
          MD5=$(md5sum ${CFG} | cut -d' ' -f1)
          SIDECAR=${CFG%.yaml}.${MD5}.auto.yaml
          SRC=/data/results/mtx/makeweight/$(basename ${SIDECAR})
          [ -f "${SRC}" ] || { echo "FATAL: no reweighting sidecar ${SRC}: run the make_weight job for ${CFG}"; exit ${HALT}; }
          cp "${SRC}" "${SIDECAR}"
          python3 - "${CFG}" "${SIDECAR}" <<'PY' || { echo "FATAL: ${SIDECAR} is not ${CFG} plus reweighting histograms"; exit ${HALT}; }
          import sys
          sys.path.insert(0, "experiments/MTX")
          import stream_v2 as sv
          bad = sv.sidecar_mismatch(sys.argv[1], sys.argv[2])
          print("sidecar check:", "differs in %s" % bad if bad else "its config plus reweight_hists")
          sys.exit(1 if bad else 0)
          PY
          cp "${SIDECAR}" ${OUT}/
          sha256sum "${SIDECAR}" > ${OUT}/reweight_sidecar.sha256
          MANIFEST=${OUT}/run_manifest.json
          [ -f ${MANIFEST} ] && MANIFEST=${OUT}/run_manifest.${ATTEMPT}.json
          python3 scripts/write_run_manifest.py --driver pretrain_v2 --run-id ${RUN_ID} --arm RAND2_p5 \
            --num-classes 17 --seed ${SEED} --data-config ${CFG} --samples-per-epoch 10240000 \
            --num-epochs 80 --batch-size 512 \
            --num-workers 5 --data-split-num 200 --fetch-step 1.0 --data-fraction 0.2 --keep-checkpoints window \
            --select-on acc \
            --val-files "${VAL_FILES[@]}" --out ${MANIFEST}
          PYTHONUNBUFFERED=1 python3 experiments/MTX/pretrain_v2.py --seed ${SEED} --out ${OUT} --device cuda --data-train Res2P:/jc2/jet_data/Res2P_{0000..0199}.parquet Res34P:/jc2/jet_data/Res34P_{0000..0859}.parquet QCD:/jc2/jet_data/QCD_{0000..0279}.parquet --data-val /jc2/jet_data/Res2P_{0200..0203}.parquet /jc2/jet_data/Res34P_{0860..0875}.parquet /jc2/jet_data/QCD_{0280..0284}.parquet --data-config ${CFG} --network-config experiments/MTX/ParT_sophon_arch_mtx.py -o num_classes 17 -o fc_params '[(512,0.1)]' --use-amp --batch-size 512 --start-lr 5e-4 --num-epochs 80 --samples-per-epoch 10240000 --num-workers 5 --fetch-step 1.0 --data-split-num 200 --data-fraction 0.2 --keep-checkpoints window --select-on acc 2>&1 | tee -a ${OUT}/train.log
          )
        resources:
          requests: { memory: "48Gi", cpu: "8", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "48Gi", cpu: "8", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: nvidia.com/gpu.product
                operator: In
                values: ["NVIDIA-GeForce-RTX-3090"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
