apiVersion: batch/v1
kind: Job
metadata:
  # Read-only inspection pod (2026-10-31): /data mounted, sleeps 12 h for kubectl exec checks.
  name: inspect-raunav
  namespace: cms-ml
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args: ["pip install --no-cache-dir -q pyarrow==25.0.1; sleep 43000"]
        resources:
          requests: { memory: "24Gi", cpu: "4" }
          limits:   { memory: "24Gi", cpu: "4" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: jc2, mountPath: /jc2, readOnly: true }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
