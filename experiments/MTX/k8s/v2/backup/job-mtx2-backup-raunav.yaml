apiVersion: batch/v1
kind: CronJob
metadata:
  # v2 BACKUPS: experiments/MTX/backup_v2_resume.py every 30 min, CPU only.
  # GENERATED by scripts/build_mtx_launch.py (v2_backup_spec) -- do not hand-edit.
  name: mtx2-backup-raunav
  namespace: cms-ml
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1500
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: main
            image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
            command: ["/bin/bash", "-c"]
            env:
            - name: REPO_REF
              value: "mtx-s2.02"
            args:
            - |
              set -euo pipefail
              git clone --depth 1 --branch "${REPO_REF}" https://github.com/raunavm/transferlearningsophon.git /workspace/transferlearningsophon
              cd /workspace/transferlearningsophon
              USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
              [ "${USED}" -lt 85 ] || { echo "FATAL: /data at ${USED}%, no backups above 85%"; exit 1; }
              python3 experiments/MTX/backup_v2_resume.py --root /data/results/mtx_v2
            resources:
              requests: { memory: "8Gi", cpu: "2", ephemeral-storage: "5Gi" }
              limits:   { memory: "8Gi", cpu: "2", ephemeral-storage: "5Gi" }
            volumeMounts:
            - { name: data, mountPath: /data }
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: ["us-west"]
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: transfer-learning-vol
