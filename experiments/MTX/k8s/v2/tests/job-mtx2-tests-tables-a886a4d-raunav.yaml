apiVersion: batch/v1
kind: Job
metadata:
  # The new and changed tests at commit a886a4d (table and manuscript tests), with zip installed for the bash harnesses, run in the v2
  # image (weaver 0.4.17, Python 3.10), so the tests marked needs_0417 run too. Run on the
  # cluster rather than the laptop (PI, 2026-10-02). CPU only; writes the pytest output
  # (kilobytes) to /data/results/tests/3639846-train and prints the failures and the summary.
  name: mtx2-tests-tables-a886a4d-raunav
  namespace: cms-ml
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        env:
        - name: COMMIT
          value: "a886a4d34142c35efe4fa4217797fc8cc4c1da40"
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        args:
        - |
          set -uo pipefail
          OUT=/data/results/tests/${COMMIT:0:7}-tables
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}%  node: ${NODE_NAME}"
          [ "${USED}" -le 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          mkdir -p ${OUT}
          git clone -q https://github.com/raunavm/transferlearningsophon.git /workspace/repo || exit 1
          cd /workspace/repo && git checkout -q ${COMMIT} || exit 1
          git rev-parse HEAD
          pip install --no-cache-dir -q pytest pyarrow || exit 1
          (apt-get update -qq && apt-get install -y -qq zip) > /dev/null 2>&1 || echo "zip: not installed"
          python3 -c "import sys, torch, weaver; print(sys.version.split()[0], torch.__version__, weaver.__file__)"
          python3 -m pytest tests/test_make_tables.py tests/test_mlst_results.py tests/test_manuscript_numbers.py tests/test_make_tables_v2.py tests/test_appendix_tables.py -q -p no:cacheprovider -rfE > ${OUT}/pytest.txt 2>&1
          echo "pytest rc=$?"
          grep -E '^(FAILED|ERROR) ' ${OUT}/pytest.txt | cut -c1-400 | head -300
          tail -3 ${OUT}/pytest.txt
          echo "TESTS COMPLETE"
        resources:
          requests: { memory: "32Gi", cpu: "8", ephemeral-storage: "20Gi" }
          limits:   { memory: "32Gi", cpu: "8", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "4Gi" }
