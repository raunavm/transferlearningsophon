apiVersion: batch/v1
kind: Job
metadata:
  # v2 REWEIGHTING SIDECARS (make_weight, CPU): configs/arms/v2/RAND2_p1.yaml, configs/arms/v2/RAND2_p3.yaml, configs/arms/v2/RAND2_p5.yaml, configs/arms/v2/FLAV_F1.yaml, configs/arms/R63_Q1.yaml.
  # GENERATED by scripts/build_mtx_launch.py v2_makeweight_specs() -- do not hand-edit.
  name: mtx2-makeweight-1-raunav
  namespace: cms-ml
spec:
  backoffLimit: 3
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        env:
        - name: REPO_REF
          value: "mtx-s1.69"
        args:
        - |
          set -euo pipefail
          git clone --depth 1 --branch "${REPO_REF}" https://github.com/raunavm/transferlearningsophon.git /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          pip install --no-cache-dir -q pyarrow || exit 1
          OUT=/data/results/mtx/makeweight
          mkdir -p ${OUT}
          USE=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USE}" -le 85 ] || { echo "FATAL: /data at ${USE}%"; exit 1; }
          ALLSET=""
          for i in $(seq -w 0000 0249); do ALLSET="$ALLSET Res2P:/jc2/jet_data/Res2P_$i.parquet"; done
          for i in $(seq -w 0000 1074); do ALLSET="$ALLSET Res34P:/jc2/jet_data/Res34P_$i.parquet"; done
          for i in $(seq -w 0000 0349); do ALLSET="$ALLSET QCD:/jc2/jet_data/QCD_$i.parquet"; done
          N=$(echo $ALLSET | wc -w)
          [ "$N" -eq 1675 ] || { echo "FATAL: expected 1675 train+val files, got $N"; exit 1; }
          run_cfg () {
            CFG=$1; K=$2
            MD5=$(md5sum ${CFG} | cut -d' ' -f1)
            SIDECAR=${CFG%.yaml}.${MD5}.auto.yaml
            NAME=$(basename ${SIDECAR})
            if [ -f ${OUT}/${NAME} ]; then echo "=== ${NAME} exists"; cp ${OUT}/${NAME} ${SIDECAR}; else
              echo "=== ${CFG} K=${K} -> ${NAME}"
              PYTHONUNBUFFERED=1 weaver --print --gpus "" --data-train $ALLSET --data-config ${CFG}       --network-config experiments/E1/ParT_sophon_arch_10c.py -o num_classes ${K} -o fc_params '[(512,0.1)]'       --batch-size 512 --start-lr 5e-4 --num-workers 2 --fetch-by-files --fetch-step 5       > ${OUT}/makeweight_$(basename ${CFG%.yaml}).log 2>&1
              [ -f "${SIDECAR}" ] || { echo "FATAL: no ${SIDECAR}"; exit 1; }
              cp -v "${SIDECAR}" ${OUT}/
            fi
            python3 - "${SIDECAR}" "${CFG}" <<'PY'
          import hashlib, json, sys, yaml
          side, cfg = yaml.safe_load(open(sys.argv[1])), yaml.safe_load(open(sys.argv[2]))
          h = hashlib.sha256(json.dumps(side["weights"]["reweight_hists"], sort_keys=True, default=str).encode()).hexdigest()
          own = side.get("labels") == cfg.get("labels")
          print(f"{sys.argv[2]}: reweight_hists sha256 {h} {'MATCH' if h == '546306f0ceb465ca095e8cb573ef3d8f4e754b026b3c6af4cf90b90c197b5a55' else 'DIFFER'}; labels block {'own' if own else 'WRONG'}")
          json.dump({sys.argv[2]: h}, open("/data/results/mtx/makeweight/hist_hashes_" + sys.argv[1].split("/")[-1].split(".")[0] + "_v2.json", "w"), indent=2)
          sys.exit(0 if (h == "546306f0ceb465ca095e8cb573ef3d8f4e754b026b3c6af4cf90b90c197b5a55" and own) else 1)
          PY
          }
          run_cfg configs/arms/v2/RAND2_p1.yaml 17
          run_cfg configs/arms/v2/RAND2_p3.yaml 17
          run_cfg configs/arms/v2/RAND2_p5.yaml 17
          run_cfg configs/arms/v2/FLAV_F1.yaml 17
          run_cfg configs/arms/R63_Q1.yaml 64
        resources:
          requests: { memory: "48Gi", cpu: "4", ephemeral-storage: "10Gi" }
          limits:   { memory: "48Gi", cpu: "4", ephemeral-storage: "10Gi" }
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
