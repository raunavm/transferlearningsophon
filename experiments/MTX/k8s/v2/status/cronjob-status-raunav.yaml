apiVersion: batch/v1
kind: CronJob
metadata:
  # STATUS: experiments/MTX/status_v2.py every 30 min, CPU only, no cluster API: counts the jobs'
  # completion files into /data/results/status/status.json (a few kB).
  # GENERATED by scripts/build_curve_jobs.py (from build_mtx_launch.v2_backup_spec) -- do not hand-edit.
  name: status-raunav
  namespace: cms-ml
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1500
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: main
            image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
            command: ["/bin/bash", "-c"]
            env:
            - name: REPO_REF
              value: "mtx-s2.19"
            args:
            - |
              set -euo pipefail
              git clone --depth 1 --branch "${REPO_REF}" https://github.com/raunavm/transferlearningsophon.git /workspace/transferlearningsophon
              cd /workspace/transferlearningsophon
              python3 experiments/MTX/status_v2.py --out /data/results/status/status.json
            resources:
              requests: { memory: "2Gi", cpu: "1", ephemeral-storage: "5Gi" }
              limits:   { memory: "2Gi", cpu: "1", ephemeral-storage: "5Gi" }
            volumeMounts:
            - { name: data, mountPath: /data }
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values: ["us-west"]
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: transfer-learning-vol
