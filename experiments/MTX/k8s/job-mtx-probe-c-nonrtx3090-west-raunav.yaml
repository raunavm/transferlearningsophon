apiVersion: batch/v1
kind: Job
metadata:
  # CAPACITY PROBE c-nonrtx3090-west -- us-west, any GPU model EXCEPT the 3090. Tests whether a second GPU model has capacity at our shape, without guessing label strings.
  # Real resource shape (1 GPU, 76Gi, 4 CPU) so a schedule here means a REAL
  # training pod would also schedule. Sleeps 60 s and exits. Trains nothing.
  name: mtx-probe-c-nonrtx3090-west-raunav
  namespace: cms-ml
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: nvidia.com/gpu.product
                operator: NotIn
                values: ["NVIDIA-GeForce-RTX-3090"]

      containers:
      - name: probe
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "PROBE c-nonrtx3090-west scheduled on ${NODE_NAME}"
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || true
          sleep 60
        env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        resources:
          requests: { memory: "76Gi", cpu: "4", nvidia.com/gpu: "1" }
          limits:   { memory: "76Gi", cpu: "4", nvidia.com/gpu: "1" }
