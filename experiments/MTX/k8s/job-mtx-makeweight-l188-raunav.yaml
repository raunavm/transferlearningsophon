apiVersion: batch/v1
kind: Job
metadata:
  # ONE SHARED REWEIGHTING PASS -- run BEFORE any training arm.
  #
  # WHAT THIS PRODUCES: three sidecar files
  #     configs/arms/<ARM>.<md5-of-that-arm-yaml>.auto.yaml
  # copied to /data/results/mtx/makeweight/ on the shared PVC. Each training job
  # recomputes its own config's md5, pulls the matching sidecar off the PVC into
  # its cloned repo, and runs with --no-remake-weights.
  #
  # WHY THE SIDECAR ROUTE AND NOT AN EDIT TO THE CONFIGS:
  # `reweight_hists:` lives INSIDE the `weights:` block, and CLAUDE.md section 8
  # forbids editing that block -- it is what makes the stream bit-identical
  # across arms. A sidecar is a NEW file, so the base configs stay byte-frozen
  # and their sha256 comparison (invariant I2) keeps meaning what it says.
  #
  # WHY THREE PASSES AND NOT ONE PLUS A COPY:
  # weaver names the sidecar from the md5 of the WHOLE config file, labels block
  # included (utils/dataset.py:401-402), and loads it as the config OF RECORD
  # (dataset.py:409, 426-431). The three arm configs hash differently. Copying
  # L162's sidecar onto another arm's md5 name would therefore train that arm
  # with L162's 162-class labels block -- silently, with no error and a plausible
  # loss curve. Three passes, each writing its own arm's sidecar, removes that
  # failure mode entirely rather than guarding against it.
  #
  # It also buys the measurement below. The histograms SHOULD be identical
  # across arms: WeightMaker keeps only `reweight_branches + reweight_classes`
  # (utils/data/preprocess.py:176), so the labels block provably cannot reach the
  # computation, and the read is full-data with no RNG and no event cap
  # (preprocess.py:196 passes no load_ranges; fileio.py:90-91). Running all three
  # in ONE pod on ONE cpu and ONE numpy build also closes the last channel --
  # a ~1 ulp float32 reduction difference in preprocess.py:257 -- by
  # construction. The final step HASHES all three and asserts equality, which
  # upgrades I2 from a claim about the config to a measurement of the realised
  # histograms. That evidence does not exist today.
  #
  # WHY THE FILE LIST STOPS AT THE LAST VALIDATION FILE:
  # allset = train + val = Res2P 0000-0249, Res34P 0000-1074, QCD 0000-0349
  #        = 250 + 1075 + 350 = 1675 files.
  # The remaining 335 are the TEST split and are deliberately excluded. This is
  # exactly what makes docs/GROUND_TRUTH.md's claim true -- "the test split is
  # clean including from the reweighting histograms, because make_weight's
  # allset_* glob stops at the last validation file". Widen this list and that
  # guarantee is void, silently.
  #
  # This 1675-file list is ALSO the reason the job is not optional. A training
  # job left to rebuild its own histograms would scan `--data-train`, which is
  # 1340 files (train only). Both are test-clean; they are not the same
  # histograms, and only the 1675 one matches the upstream Sophon recipe.
  #
  # --gpus "" IS REQUIRED. It defaults to '0' (train.py:139), and model_setup ->
  # flops() does model.to(device) (train.py:409) before --print returns
  # (train.py:840). This pod requests no GPU, so without it the job dies AFTER
  # writing the sidecars but BEFORE copying them out, and set -e discards them.
  # DERIVED from job-mtx-makeweight-raunav.yaml on 2026-08-22, changing four
  # things: the name, the clone ref (arms-s1 no longer exists on the remote;
  # mtx-s1.3 is the tag that first carries configs/arms/L188.yaml), the arm
  # list (L188 only -- the other three sidecars exist, are in use by running
  # jobs, and recomputing them risks loss for no gain), and the final check.
  #
  # The check is STRONGER than the original's. With one arm, "histograms
  # identical across arms" is vacuous, so instead L188's histogram hash is
  # compared against the shared hash the first three arms recorded in
  # hist_hashes.json. That is invariant I2 tested directly: reweighting keys
  # on NATIVE categories, so it must not move when the vocabulary does.
  name: mtx-makeweight-l188-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: makeweight
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # SAME TAG as the training jobs, and that is load-bearing, not tidiness.
          # The sidecar filename embeds md5(configs/arms/<ARM>.yaml). If this job
          # and the training jobs resolve to different commits, the arm configs
          # differ, the md5s differ, and every training job fails its sidecar
          # guard -- loudly, but only after this whole pass has been paid for.
          git clone --depth 1 --branch mtx-s1.3 \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow || exit 1

          OUT=/data/results/mtx/makeweight
          mkdir -p ${OUT}

          # train + val ONLY. Test files 0250-0299 / 1075-1289 / 0350-0419 are
          # deliberately absent -- see the header.
          ALLSET=""
          for i in $(seq -w 0000 0249); do ALLSET="$ALLSET Res2P:/jc2/jet_data/Res2P_$i.parquet"; done
          for i in $(seq -w 0000 1074); do ALLSET="$ALLSET Res34P:/jc2/jet_data/Res34P_$i.parquet"; done
          for i in $(seq -w 0000 0349); do ALLSET="$ALLSET QCD:/jc2/jet_data/QCD_$i.parquet"; done

          N=$(echo $ALLSET | wc -w)
          echo "reweighting file count: $N"
          [ "$N" -eq 1675 ] || { echo "FATAL: expected 1675 files (train+val), got $N"; exit 1; }

          # ---- one pass per arm --------------------------------------------
          # Sequential, same pod. Each sidecar is copied out IMMEDIATELY after
          # its pass: the previous version of this job copied at the end, so a
          # failure in the last step destroyed the work of all the earlier ones.
          run_arm () {
            ARM=$1; K=$2
            CFG=configs/arms/${ARM}.yaml
            MD5=$(md5sum ${CFG} | cut -d' ' -f1)
            SIDECAR=configs/arms/${ARM}.${MD5}.auto.yaml
            echo "=== ${ARM}: K=${K} md5=${MD5} -> ${SIDECAR}"
            START=$(date +%s)
            PYTHONUNBUFFERED=1 weaver --print --gpus "" \
              --data-train $ALLSET \
              --data-config ${CFG} \
              --network-config experiments/E1/ParT_sophon_arch_10c.py \
              -o num_classes ${K} -o fc_params '[(512,0.1)]' \
              --batch-size 512 --start-lr 5e-4 \
              --num-workers 2 --fetch-by-files --fetch-step 5 \
              2>&1 | tee ${OUT}/makeweight_${ARM}.log
            echo "${ARM}: $(( $(date +%s) - START )) s"
            [ -f "${SIDECAR}" ] || { echo "FATAL: ${ARM} wrote no ${SIDECAR}"; exit 1; }
            cp -v "${SIDECAR}" ${OUT}/
          }

          run_arm L188   188

          # ---- the measurement ---------------------------------------------
          # Assert the three realised histogram sets are identical, and that each
          # sidecar carries its OWN arm's labels block rather than a neighbour's.
          python3 - <<'PY'
          import glob, hashlib, json, os, sys, yaml

          ARM = "L188"
          failed = 0

          hits = glob.glob(f"configs/arms/{ARM}.*.auto.yaml")
          if len(hits) != 1:
              print(f"  [FAIL] {ARM}: expected exactly 1 sidecar, got {hits}")
              sys.exit(1)
          side = yaml.safe_load(open(hits[0]))
          base = yaml.safe_load(open(f"configs/arms/{ARM}.yaml"))

          rh = side.get("weights", {}).get("reweight_hists")
          if not rh:
              print(f"  [FAIL] {ARM}: sidecar has empty reweight_hists")
              sys.exit(1)
          h = hashlib.sha256(
              json.dumps(rh, sort_keys=True, default=str).encode()).hexdigest()

          ok = side.get("labels") == base.get("labels")
          print(f"  [{'PASS' if ok else 'FAIL'}] {ARM}: sidecar labels block is its own")
          failed += not ok

          # I2, stated directly. JetClass-II reweighting keys on NATIVE label
          # categories, so the realised histograms must not depend on the
          # classifier vocabulary. The three arms built on 2026-08-16 recorded
          # their shared hash here; L188 must reproduce it EXACTLY. If it does
          # not, the training stream is not bit-identical across arms and the
          # label-only intervention has become a data intervention.
          prior_path = "/data/results/mtx/makeweight/hist_hashes.json"
          if os.path.exists(prior_path):
              prior = json.load(open(prior_path))
              vals = set(prior.values())
              if len(vals) != 1:
                  print(f"  [FAIL] prior hist_hashes.json is not self-consistent: {prior}")
                  failed += 1
              elif h == vals.pop():
                  print(f"  [PASS] {ARM} reweight_hists MATCH the three prior arms")
                  print(f"         sha256 {h}")
              else:
                  print(f"  [FAIL] {ARM} reweight_hists DIFFER from the prior arms")
                  print(f"         {ARM}: {h}")
                  print(f"         prior: {prior}")
                  failed += 1
          else:
              print(f"  [WARN] {prior_path} absent; recording {ARM} unchecked")
              print(f"         sha256 {h}")

          # A SEPARATE file. Overwriting hist_hashes.json would destroy the
          # record of the original three-arm measurement.
          json.dump({ARM: h},
                    open("/data/results/mtx/makeweight/hist_hashes_L188.json", "w"),
                    indent=2)
          sys.exit(1 if failed else 0)
          PY

          ls -la ${OUT}
        resources:
          requests: { memory: "64Gi", cpu: "8", ephemeral-storage: "20Gi" }
          limits:   { memory: "64Gi", cpu: "8", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "16Gi" }
