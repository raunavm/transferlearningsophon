apiVersion: batch/v1
kind: Job
metadata:
  # CAPACITY PROBE b-3090-anyregion -- 3090, ANY region. Tests the us-west PVC-locality pin, whose I/O-bound justification is superseded (we measured 90-100% GPU util).
  # Real resource shape (1 GPU, 76Gi, 4 CPU) so a schedule here means a REAL
  # training pod would also schedule. Sleeps 60 s and exits. Trains nothing.
  name: mtx-probe-b-3090-anyregion-raunav
  namespace: cms-ml
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values: ["NVIDIA-GeForce-RTX-3090"]
              # excluded 2026-09-07: device plugin rejects every pod (scripts/exclude_node.py)
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu"]

      containers:
      - name: probe
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "PROBE b-3090-anyregion scheduled on ${NODE_NAME}"
          nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || true
          sleep 60
        env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        resources:
          requests: { memory: "76Gi", cpu: "4", nvidia.com/gpu: "1" }
          limits:   { memory: "76Gi", cpu: "4", nvidia.com/gpu: "1" }
