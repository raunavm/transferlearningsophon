apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_ft_jobs.py -- do not hand-edit. Regenerate.
  #
  # RETRIES (2026-09-29): pod failure policy -- evictions are not counted, exit
  # 42 (a cell that failed twice) fails the Job at once; see "retries that
  # survive a flaky cluster" in scripts/build_ft_jobs.py.
  # v2 JetClass-II fine-tuning subsets (audit must-fix 7): 1e3..1e6 jets and a
  # 20,480-jet validation set, from the fine-tuning held-out files only.
  # CPU, ~5 GB written. Then the sha256 record of these and of the reused subsets.
  name: ft-subsets-jc2-v2-raunav
  namespace: cms-ml
spec:
  backoffLimit: 20
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: REPO_REF
          value: "mtx-s1.66"
        args:
        - |
          set -euo pipefail
          # Clone the pinned TAG (not a branch): every job in this wave runs the
          # same code, and a job that queues for days cannot pick up a later
          # commit when it finally starts.
          git clone --depth 1 --branch "${REPO_REF}" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow || exit 1
          export PYTHONUNBUFFERED=1

          HALT=42   # the pod failure policy fails the Job at once on this code
          OUT=/data/finetune/jc2_v2
          [ -f ${OUT}/DONE ] && { echo "FATAL: ${OUT} is complete; staged data is never rebuilt"; exit ${HALT}; }
          POOL=(/jc2/jet_data/Res2P_{0204..0249}.parquet /jc2/jet_data/Res34P_{0876..1074}.parquet /jc2/jet_data/QCD_{0285..0349}.parquet)
          n_present () { local n=0; for f in "$@"; do [ -f "$f" ] && n=$((n+1)); done; echo $n; }
          [ "$(n_present "${POOL[@]}")" -eq 310 ] || { echo "FATAL: not all 310 held-out files are present"; exit ${HALT}; }
          df -h /data
          p=$(df --output=pcent /data | tail -1 | tr -dc 0-9); g=$(df -BG --output=avail /data | tail -1 | tr -dc 0-9)
          [ "$p" -lt 85 ] && [ "$g" -ge 100 ] || { echo "FATAL: /data at ${p}% used, ${g}G free"; exit ${HALT}; }
          # Built in ${OUT}.staging, moved into place only when complete. An attempt
          # killed with its pod leaves an incomplete build there, which no job has
          # read, and the next attempt starts it again.
          rm -rf ${OUT}.staging
          python3 experiments/FT/make_subsets.py jc2v2 --pool-files "${POOL[@]}" \
            --out ${OUT}.staging --sizes 1000 10000 100000 1000000 --seeds 1 \
            --n-files 60 --take-fraction 0.30 --val-size 20480 --n-val-files 12 || exit ${HALT}
          mv ${OUT}.staging ${OUT}
          ls -la ${OUT}; du -sh ${OUT}
          # The sha256 record every v2 job checks: the new subsets, and the ones
          # v2 reuses (their builds recorded no sha256). Read-only on the latter.
          python3 experiments/FT/ft_v2.py hash --out ${OUT}/ft_v2_subsets_sha256.json \
            --files ${OUT}/train_N*_s1.parquet ${OUT}/val.parquet /data/finetune/jc1/val.parquet /data/finetune/top_sub/val.parquet /data/finetune/qg_v2_sub/val.parquet /data/finetune/qg_herwig/qg_herwig_chunk0.parquet /data/finetune/qg_herwig/qg_herwig_chunk1.parquet /data/finetune/jc1/train_N1000_s1.parquet /data/finetune/jc1/train_N1000_s2.parquet /data/finetune/jc1/train_N1000_s3.parquet /data/finetune/jc1/train_N10000_s1.parquet /data/finetune/jc1/train_N10000_s2.parquet /data/finetune/jc1/train_N10000_s3.parquet /data/finetune/jc1/train_N100000_s1.parquet /data/finetune/jc1/train_N100000_s2.parquet /data/finetune/jc1/train_N100000_s3.parquet /data/finetune/jc1/train_N1000000_s1.parquet /data/finetune/jc1/train_N1000000_s2.parquet /data/finetune/jc1/train_N1000000_s3.parquet /data/finetune/top_sub/train_N1000_s1.parquet /data/finetune/top_sub/train_N1000_s2.parquet /data/finetune/top_sub/train_N1000_s3.parquet /data/finetune/top_sub/train_N10000_s1.parquet /data/finetune/top_sub/train_N10000_s2.parquet /data/finetune/top_sub/train_N10000_s3.parquet /data/finetune/top_sub/train_N100000_s1.parquet /data/finetune/top_sub/train_N100000_s2.parquet /data/finetune/top_sub/train_N100000_s3.parquet /data/finetune/top_sub/train_N1200000_s1.parquet /data/finetune/top_sub/train_N1200000_s2.parquet /data/finetune/top_sub/train_N1200000_s3.parquet /data/finetune/qg_v2_sub/train_N1000_s1.parquet /data/finetune/qg_v2_sub/train_N1000_s2.parquet /data/finetune/qg_v2_sub/train_N1000_s3.parquet /data/finetune/qg_v2_sub/train_N10000_s1.parquet /data/finetune/qg_v2_sub/train_N10000_s2.parquet /data/finetune/qg_v2_sub/train_N10000_s3.parquet /data/finetune/qg_v2_sub/train_N100000_s1.parquet /data/finetune/qg_v2_sub/train_N100000_s2.parquet /data/finetune/qg_v2_sub/train_N100000_s3.parquet /data/finetune/qg_v2_sub/train_N1600000_s1.parquet /data/finetune/qg_v2_sub/train_N1600000_s2.parquet /data/finetune/qg_v2_sub/train_N1600000_s3.parquet || exit ${HALT}
          df -h /data
          echo "SUBSETS JC2 V2 DONE"
        resources:
          requests: { memory: "48Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "48Gi", cpu: "4", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "4Gi" }
