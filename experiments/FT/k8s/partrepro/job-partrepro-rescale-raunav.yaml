apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_partrepro_jobs.py -- ParT top tagging from scratch, variant rescale.
  name: partrepro-rescale-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          OUT=/data/results/partrepro/rescale
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 85 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          [ ! -f ${OUT}/metrics.json ] || { echo "${OUT} is done"; cat ${OUT}/metrics.json; exit 0; }
          mkdir -p ${OUT}
          git clone -q --depth 1 --branch mtx-s2.22 https://github.com/raunavm/transferlearningsophon.git /workspace/tls
          git clone -q https://github.com/jet-universe/particle_transformer.git /workspace/part && cd /workspace/part && git checkout -q 2925bdb
          git rev-parse HEAD | tee ${OUT}/part_commit.txt
          pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          mkdir -p /workspace/data && cd /workspace/data
          python3 -c "import urllib.request,sys; urllib.request.urlretrieve(sys.argv[1], 'TopLandscape.tar')" https://hqu.web.cern.ch/datasets/TopLandscape/TopLandscape.tar
          echo "4fca2e47afbf321b0f201da6b804c404  TopLandscape.tar" | md5sum -c - || { echo "FATAL: TopLandscape.tar md5"; exit 42; }
          tar -xf TopLandscape.tar && rm TopLandscape.tar && find /workspace/data -name "*.parquet" | tee ${OUT}/files.txt
          D=$(dirname $(find /workspace/data -name train_file.parquet | head -1))
          cd /workspace/part
          nvidia-smi -L | tee ${OUT}/gpu.txt
          weaver --data-train ${D}/train_file.parquet --data-val ${D}/val_file.parquet --data-test ${D}/test_file.parquet \
            --data-config /workspace/tls/experiments/FT/partrepro/top_kin_rescale.yaml --network-config networks/example_ParticleTransformer.py \
            --use-amp --optimizer-option weight_decay 0.01  \
            --model-prefix ${OUT}/net --num-workers 1 --fetch-step 1 --in-memory \
            --batch-size 512 --samples-per-epoch $((2400 * 512)) --samples-per-epoch-val $((800 * 512)) --num-epochs 20 --gpus 0 \
            --start-lr 1e-3 --optimizer ranger --log ${OUT}/train.log --predict-output ${OUT}/pred.root 2>&1 | tee ${OUT}/stdout.log
          python3 /workspace/tls/experiments/FT/partrepro_metrics.py ${OUT}/pred.root --out ${OUT}/metrics.json
          echo "PARTREPRO COMPLETE"
        resources:
          requests: { memory: "48Gi", cpu: "6", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "48Gi", cpu: "6", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: nvidia.com/gpu.product
                operator: In
                values: ["Tesla-V100-SXM2-32GB"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
