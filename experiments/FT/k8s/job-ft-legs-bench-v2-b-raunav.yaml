apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_ft_jobs.py -- do not hand-edit. Regenerate.
  #
  # BENCHMARKS v2, shard b: top tagging and quark/gluon at the
  # published recipe (20 epochs, 1e-4 trunk / 5e-3 head, constant LR,
  # weight decay 0.01), one fine-tuning seed per pretrained checkpoint,
  # three for scratch; wave 2's prune, 20k validation at N <= 1e4 and
  # loop order; the Herwig read-out on every q/g cell. Supersedes
  # job-ft-legs-bench-raunav.yaml, which never ran.
  # inits: r16q1-s2 l188-s4 l162-s5 r42q1-s5 l162mass-s3 r16q1mass-s3
  # 52 fine-tunes, ~54 GPU-h.
  name: ft-legs-bench-v2-b-raunav
  namespace: cms-ml
spec:
  backoffLimit: 50
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        env:
        - name: GPU_PRODUCT
          value: "NVIDIA-GeForce-RTX-3090"
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: REPO_REF
          value: "mtx-s1.52"
        args:
        - |
          set -euo pipefail
          # Clone the pinned TAG (not a branch): every job in this wave runs the
          # same code, and a job that queues for days cannot pick up a later
          # commit when it finally starts.
          git clone --depth 1 --branch "${REPO_REF}" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow || exit 1
          export PYTHONUNBUFFERED=1

          ROOT_OUT=/data/results/ft/bench_v2
          SHARD=ft-legs-bench-v2-b-raunav
          NLOCKED=0
          mkdir -p ${ROOT_OUT}
          src_for () { case $1 in
            top) echo "/data/finetune/top";;
            qg)  echo "/data/finetune/qg_v2";;
            *) echo "FATAL: no source for $1" >&2; exit 1;; esac; }
          cfg_for () { case $1 in
            top) echo "configs/finetune/TopReference.yaml";;
            qg)  echo "configs/finetune/EnergyFlowQG.yaml";;
            *) echo "FATAL: no config for $1" >&2; exit 1;; esac; }
          sizes_for () { case $1 in
            top) echo "1000 10000 100000 1200000";;
            qg)  echo "1000 10000 100000 1600000";;
            *) echo "FATAL: no grid for $1" >&2; exit 1;; esac; }
          nmax_for () { case $1 in
            top) echo 1200000;; qg) echo 1600000;;
            *) echo "FATAL: no N_max for $1" >&2; exit 1;; esac; }
          test_for () { case $1 in
            top) echo "$(src_for top)/top_test.parquet";;
            qg)  echo "$(src_for qg)/qg_chunk18.parquet $(src_for qg)/qg_chunk19.parquet";;
            *) echo "FATAL: no test files for $1" >&2; exit 1;; esac; }
          # N <= 1e4 validates on 20k jets, as wave 2 does (item 36): a 200k
          # pass there is 20-200x the training set and was measured to hold the
          # GPU at 16-21%. Best-epoch selection on aggregate accuracy resolves
          # the observed ~0.01 epoch-to-epoch step at s.e. 0.003 with 20k jets.
          val_for () { if [ "$1" -le 10000 ]; then echo 20000; else echo 200000; fi; }
          # BENCH_SAMPLES_PER_EPOCH in scripts/build_ft_jobs.py; empty = N itself.
          samples_for () { case $1 in 1000) echo 10000;; *) echo $1;; esac; }
          HERWIG="/data/finetune/qg_herwig/qg_herwig_chunk0.parquet /data/finetune/qg_herwig/qg_herwig_chunk1.parquet"
          nrows () { python3 -c "import sys, pyarrow.parquet as pq; print(sum(pq.ParquetFile(f).metadata.num_rows for f in sys.argv[1:]))" "$@"; }

          for D in top qg; do
            S=$(src_for ${D}); O=${S}_sub
            [ -f ${O}/DONE ] || { echo "FATAL: ${O}/DONE absent -- run ft-subsets-bench first"; exit 1; }
            for f in $(test_for ${D}); do
              [ -f "${f}" ] || { echo "FATAL: ${D}: no test file ${f}"; exit 1; }
            done
            [ -f "$(cfg_for ${D})" ] || { echo "FATAL: ${D}: no $(cfg_for ${D})"; exit 1; }
          done
          for f in ${HERWIG}; do
            [ -f "${f}" ] || { echo "FATAL: no ${f} -- run ft-stage-qg-herwig-raunav first"; exit 1; }
          done
          # The test sets must be the PUBLISHED splits, or the rows do not drop
          # into the community table. Counted from parquet metadata, here, not
          # discovered by a failed smoke check after the fine-tune is paid for.
          NTEST_top=$(nrows $(test_for top)); NTEST_qg=$(nrows $(test_for qg)); NTEST_herwig=$(nrows ${HERWIG})
          echo "test jets: top ${NTEST_top}  qg ${NTEST_qg}  qg-herwig ${NTEST_herwig}"
          [ "${NTEST_top}" -eq 404000 ] && [ "${NTEST_qg}" -eq 200000 ] && [ "${NTEST_herwig}" -eq 200000 ] || {
            echo "FATAL: test sets are not the published 404000 / 200000 / 200000 jets"; exit 1; }
          ntest_for () { case $1 in top) echo ${NTEST_top};; qg) echo ${NTEST_qg};; esac; }
          # CLAUDE.md: check free space before a write of this size.
          FREE_G=$(df -BG --output=avail /data | tail -1 | tr -dc 0-9)
          echo "free on /data: ${FREE_G}G"
          [ "${FREE_G}" -ge 100 ] || { echo "FATAL: ${FREE_G}G free on /data, need 100G"; exit 1; }

          space_ok () { local p=$(df --output=pcent /data | tail -1 | tr -dc 0-9); local g=$(df -BG --output=avail /data | tail -1 | tr -dc 0-9); echo "/data ${p}% used, ${g}G free"; [ "$p" -lt 92 ] && [ "$g" -ge 50 ] || { echo "FATAL: /data at ${p}% used, ${g}G free: stop and ask the PI"; exit 1; }; }
          FAIL_MARK=${ROOT_OUT}/FAILED_BENCH.${SHARD}
          [ -f ${FAIL_MARK} ] && { echo "FATAL: an earlier attempt failed twice: $(cat ${FAIL_MARK}). Fix it, then remove ${FAIL_MARK}"; exit 1; }
          attempt_ok () { local o=$1; local n=$(ls -d ${o}.partial.* 2>/dev/null | wc -l); [ "$n" -ge 2 ] && { echo "${o} failed ${n} times" | tee ${FAIL_MARK}; exit 1; }; return 0; }


          INITS="r16q1-s2:/data/results/mtx/mtx-r16q1-s2/net_epoch-79_state.pt:17:1 l188-s4:/data/results/mtx/mtx-l188-s4/net_epoch-79_state.pt:188:1 l162-s5:/data/results/mtx/mtx-l162-s5/net_epoch-79_state.pt:162:1 r42q1-s5:/data/results/mtx/mtx-r42q1-s5/net_epoch-79_state.pt:43:1 l162mass-s3:/data/results/mtx/mtx-l162mass-s3/net_epoch-79_state.pt:163:1 r16q1mass-s3:/data/results/mtx/mtx-r16q1mass-s3/net_epoch-79_state.pt:18:1"
          for spec in ${INITS}; do
            name=${spec%%:*}; rest=${spec#*:}; ckpt=${rest%%:*}; k=${rest#*:}
            [ "${name}" = "scratch" ] && continue
            [ -f "${ckpt}" ] || { echo "FATAL: ${name}: no ${ckpt}"; exit 1; }
          done

          # The benchmark recipe, set in ONE place. --lr-scheduler none is the
          # constant LR the published recipe specifies; weaver's default is
          # flat+decay, which would silently anneal and make the row not
          # comparable to the community table.
          BENCH="--use-amp --batch-size 512 --num-workers 2 --fetch-by-files --fetch-step 1             --optimizer ranger --lr-scheduler none --num-epochs 20             --optimizer-option weight_decay 0.01"
          # An ARRAY, not a string. The value carries parentheses and single
          # quotes; as a plain string it is re-split on expansion and the
          # parens reach the shell as syntax.
          HEAD_MULT=(--optimizer-option lr_mult "(r'mod\.fc\..*', 50)")

          # CELL ORDER: smoke cell, then every full-training-set cell, then the
          # rest. The two confirmatory benchmark predictions (C2 on quark/gluon
          # and C3 on top tagging, docs/PRESPEC_2026-09.md 3) are BOTH defined
          # on the full training set only. Walking sizes ascending inside a
          # dataset loop -- which is what the grid literally is -- puts them
          # last, and puts C2 behind the whole top-tagging block, so an
          # interrupted wave yields a pile of small-N cells and NEITHER
          # confirmatory result. The order below is the only thing that
          # changes: same cells, same recipe, same seeds, same sizes_for
          # string. The smoke cell stays first so the cheapest cell still
          # proves the pipeline before a ~3 h cell can fail late on a config
          # error (plan section 5: "One smallest-size cell per dataset is
          # smoke-tested first"). Re-walked cells are skipped by the DONE
          # check below, so the passes cannot duplicate work.
          SMOKE_NAME=$(set -- ${INITS}; echo ${1%%:*})
          for PASS in smoke nmax rest; do
          for D in top qg; do
            SUB=$(src_for ${D})_sub; CFG=$(cfg_for ${D}); TEST=$(test_for ${D})
            NMAX=$(nmax_for ${D})
            for spec in ${INITS}; do
              name=${spec%%:*}; rest=${spec#*:}; ckpt=${rest%%:*}
              seeds=${spec##*:}; seeds=${seeds//,/ }
              # Head re-initialisations: top only, N_max only, and only the inits
              # named here -- the benchmark's convention for the headline cell,
              # restricted to two inits x 5 (the approved design). A repeat runs
              # as seed S on the s1 subset; S=1 IS the ordinary seed-1 cell.
              REPS=""
              if [ "${D}" = "top" ]; then
                case " l162-s1b r16q1-s2 " in *" ${name} "*) REPS="1 2 3 4 5";; esac
              fi
              for S in $(echo ${seeds} ${REPS} | tr ' ' '\n' | sort -nu); do
                for N in $(sizes_for ${D}); do
                case ${PASS} in
                  smoke) { [ "${N}" = "1000" ] && [ "${name}" = "${SMOKE_NAME}" ]; } || continue ;;
                  nmax)  [ "${N}" = "${NMAX}" ] || continue ;;
                  rest)  [ "${N}" = "${NMAX}" ] && continue ;;
                esac
                  # S is the TRAINING seed (head init, data order, dropout).
                  # DSEED indexes the data subset and is a different thing.
                  # Tying them together made "9 head re-initialisations" demand
                  # 9 training subsets, but make_subsets writes 3 -- so reps
                  # 4..9 read train_N..._s{4..9}.parquet, which do not exist,
                  # and weaver dies in a worker with a message naming no file.
                  # Holding the data fixed is also what the published
                  # convention MEANS (docs/PRD_PLAN.md 4.1): the spread is over
                  # re-initialisations, not over resampled training sets.
                  DSEED=${S}
                  case " ${seeds} " in
                    *" ${S} "*) ;;
                    *) [ "${N}" = "${NMAX}" ] || continue
                       DSEED=1;;
                  esac
                  OUT=${ROOT_OUT}/leg_${D}/${name}/N${N}/s${S}
                  [ -f ${OUT}/DONE ] && { echo "skip ${OUT} (DONE)"; continue; }
                  # ONE CELL, ONE POD. mkdir creates the directory or fails, atomically,
                  # so two pods can never both believe they hold a cell, whatever the
                  # init lists say. A lock left by an evicted pod of THIS job is
                  # re-entered (its half-written cell is moved to .partial below, as
                  # always); a lock held by any OTHER job is left alone and counted.
                  mkdir -p ${OUT%/*}
                  if ! mkdir ${OUT}.lock 2>/dev/null; then
                    owner=$(cat ${OUT}.lock/owner 2>/dev/null || echo unknown)
                    if [ "${owner}" != "${SHARD}" ]; then
                      echo "LOCKED: ${OUT} is held by ${owner}, this is ${SHARD}; leaving it"
                      NLOCKED=$((NLOCKED+1)); continue
                    fi
                    echo "re-entering ${OUT}.lock, left by an earlier pod of ${SHARD}"
                  fi
                  echo "${SHARD}" > ${OUT}.lock/owner
                  space_ok
                  attempt_ok ${OUT}
                  [ -d ${OUT} ] && mv ${OUT} ${OUT}.partial.$(date -u +%s)
                  mkdir -p ${OUT}
                  if [ -n "${ckpt}" ]; then
                    LOAD=(--load-model-weights ${ckpt} --exclude-model-weights "mod\.fc\..*")
                    LR=1e-4; MULT=("${HEAD_MULT[@]}")
                  else
                    LOAD=(); LR=5e-4; MULT=()
                  fi
                  python3 experiments/FT/smoke_checks.py manifest --out ${OUT}/ft_manifest.json                     leg=${D} init=${name} checkpoint=${ckpt} n_train=${N} ft_seed=${S}                     lr=${LR} head_lr_mult=50 epochs=20 lr_schedule=constant                     weight_decay=0.01 subset=${SUB}/train_N${N}_s${DSEED}.parquet                     data_config=${CFG} num_classes=2 batch_size=512 samples_per_epoch=$(samples_for ${N}) steps_per_epoch=$(($(samples_for ${N})/512)) samples_per_epoch_val=$(val_for ${N}) wave=bench-v2
                  python3 experiments/E1/seed_weaver.py --seed ${S} --lean-val-metrics                     --data-train ${SUB}/train_N${N}_s${DSEED}.parquet --data-val ${SUB}/val.parquet                     --data-config ${CFG}                     --network-config experiments/MTX/ParT_sophon_arch_mtx.py -o num_classes 2 -o fc_params '[(512,0.1)]'                     ${BENCH} ${MULT[@]+"${MULT[@]}"} --start-lr ${LR} --samples-per-epoch $(samples_for ${N}) --samples-per-epoch-val $(val_for ${N})                     ${LOAD[@]+"${LOAD[@]}"} --model-prefix ${OUT}/net --log ${OUT}/train.log 2>&1 | tee ${OUT}/stdout.log
                  [ -z "${ckpt}" ] || python3 experiments/FT/smoke_checks.py load-log --log ${OUT}/stdout.log
                  # The 50x must appear in weaver's own log, or the row is not
                  # the published recipe and nothing else would say so.
                  if [ -n "${ckpt}" ]; then
                    grep -q "Parameters with lr multiplied by 50" ${OUT}/stdout.log || {
                      echo "FATAL: weaver did not apply the head lr multiplier; the trunk/head"
                      echo "       ratio is not the published 1e-4/5e-3."; exit 1; }
                  fi
                  python3 experiments/EVAL/extract_features.py --checkpoint ${OUT}/net_best_epoch_state.pt                     --num-classes 2 --arm FT_${D}_${name}_N${N}_s${S}                     --data-config ${CFG} --data-test ${TEST} --observers jet_pt jet_energy                     --out ${OUT}/features --batch-size 512 --num-workers 1 --fetch-step 1 --save-logits
                  python3 experiments/FT/smoke_checks.py features --dir ${OUT}/features --n $(ntest_for ${D}) --k 2
                  # 128 floats per test jet that nothing reads (bench_metrics.py opens
                  # logits.npy, label188.npy and DONE): 207 MB per top cell, gone.
                  rm -f ${OUT}/features/features.npy
                  if [ "${D}" = "qg" ]; then
                    # GENERATOR SHIFT: the same model on Herwig 7.1 jets it never saw
                    # (Zenodo 3066475, staged by ft-stage-qg-herwig-raunav). Its own
                    # --out, because extract_features refuses to write a cache that
                    # holds another manifest; then the pair is moved beside the Pythia
                    # one under the names bench_metrics.py --herwig reads.
                    python3 experiments/EVAL/extract_features.py --checkpoint ${OUT}/net_best_epoch_state.pt --num-classes 2 --arm FT_${D}_${name}_N${N}_s${S}_herwig --data-config ${CFG} --data-test ${HERWIG} --observers jet_pt jet_energy --out ${OUT}/features_herwig --batch-size 512 --num-workers 1 --fetch-step 1 --save-logits
                    python3 experiments/FT/smoke_checks.py features --dir ${OUT}/features_herwig --n ${NTEST_herwig} --k 2
                    rm -f ${OUT}/features_herwig/features.npy
                    mv ${OUT}/features_herwig/logits.npy ${OUT}/features/logits_herwig.npy
                    mv ${OUT}/features_herwig/label188.npy ${OUT}/features/label_herwig.npy
                  fi
                  # Per-epoch checkpoints (state + optimizer, 20 x ~26 MB), read by
                  # nothing once the best-epoch copy exists -- wave 2's prune, item 36.
                  [ -f ${OUT}/net_best_epoch_state.pt ] || {
                    echo "FATAL: no net_best_epoch_state.pt in ${OUT};"
                    echo "       refusing to prune per-epoch checkpoints."; exit 1; }
                  rm -f ${OUT}/net_epoch-*_state.pt ${OUT}/net_epoch-*_optimizer.pt
                  [ -f ${OUT}/net_best_epoch_state.pt ] || {
                    echo "FATAL: the prune removed net_best_epoch_state.pt in ${OUT}."; exit 1; }
                  touch ${OUT}/DONE
                  rm -rf ${OUT}.lock
                done
              done
            done
          done
          done
          echo "FT BENCH V2 ${SHARD} COMPLETE (${NLOCKED} cells left to another job)"
        resources:
          requests: { memory: "88Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "88Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: nvidia.com/gpu.product
                operator: In
                values: ["NVIDIA-GeForce-RTX-3090"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
