apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_ft_jobs.py -- do not hand-edit. Regenerate.
  #
  # RETRIES (2026-10-01): pod failure policy -- evictions are not counted, exit 42
  # fails the Job at once; see "retries that survive a flaky cluster" in
  # scripts/build_ft_jobs.py.
  # READ-OUT OF THE FROM-SCRATCH REFERENCE ON SUBSET s1, JetClass (job-ft-v2-ref-v100-s1-raunav):
  # experiments/FT/leg2_metrics.py --macro-auc. Its summary block covers seeds 2-3 only; seed 1
  # on s1 is the V100 reference's, and the paper's three-seed baseline joins it from ref_v100
  # (/data/results/ft_v2/ref_v100, read by /data/results/ft_v2/best70_leg2_metrics).
  # It WAITS IN THE POD until every cell is DONE (_wait_done), so it may be applied with
  # the fine-tuning. CPU. Output /data/results/ft_v2/ref_v100_s1_leg2_metrics.
  name: ft-v2-ref-v100-s1-leg2-metrics-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: REPO_REF
          value: "mtx-s2.20"
        args:
        - |
          set -euo pipefail
          HALT=42   # the pod failure policy fails the Job at once on this code
          OUT=/data/results/ft_v2/ref_v100_s1_leg2_metrics
          [ ! -e "${OUT}" ] || { echo "FATAL: ${OUT} exists; use a new output directory"; exit ${HALT}; }
          pip install --no-cache-dir -q pyarrow==25.0.1
          git clone --depth 1 --branch "${REPO_REF}" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1

          # WAIT IN THE POD until every expected cell is DONE: poll every 30 min,
          # and after 6 days exit ${HALT}, which fails the Job at once.
          waited=0
          while :; do
            left=0
            for w in /data/results/ft_v2/ref_v100_s1/jc1/leg2/scratch-v2/N{1000,10000,100000,1000000}/s{2,3}; do
              [ -f "${w}/DONE" ] || left=$((left+1))
            done
            [ "${left}" -eq 0 ] && break
            [ "${waited}" -lt 518400 ] || { echo "FATAL: ${left} expected cells not DONE after 6 days"; exit ${HALT}; }
            echo "$(date -u +%FT%TZ) waiting for ${left} cells"
            sleep 1800; waited=$((waited+1800))
          done

          # Written into a directory of this attempt and moved into place whole.
          TMP=${OUT}.staging.$(date -u +%s)
          mkdir -p ${TMP}
          python3 experiments/FT/leg2_metrics.py --root /data/results/ft_v2/ref_v100_s1/jc1/leg2 --out ${TMP} --macro-auc --auc-stride 4
          mv ${TMP} ${OUT}
          ls -la ${OUT}
        resources:
          requests: { memory: "32Gi", cpu: "8", ephemeral-storage: "10Gi" }
          limits:   { memory: "32Gi", cpu: "8", ephemeral-storage: "10Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
