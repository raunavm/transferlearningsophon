apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_ft_jobs.py -- do not hand-edit. Regenerate.
  #
  # RETRIES (2026-10-01): pod failure policy -- evictions are not counted, exit 42
  # fails the Job at once; see "retries that survive a flaky cluster" in
  # scripts/build_ft_jobs.py.
  # v2 READ-OUT, pretrained checkpoint rule best70: top tagging and quark/gluon (Pythia and Herwig), experiments/FT/bench_metrics.py:
  # the best-validation epoch at every size, and the full training set at its last epoch.
  # Fails unless every cell experiments/FT/data/ft_v2_expected_cells_done18.json lists under best70/ is read.
  # TRIAL: the 18 runs fine-tuned before the split (V2_TRIAL_INITS) only; the final read-out is the spec without done18.
  # DO NOT APPLY before the v2 fine-tuning it reads has finished. CPU.
  # Output /data/results/ft_v2/best70_done18_bench_metrics; copy each JSON to
  #   experiments/FIGS/data/v2/benchmarks/best70_done18_bench_metrics.json
  #   experiments/FIGS/data/v2/benchmarks/best70_done18_bench_metrics_herwig.json
  #   experiments/FIGS/data/v2/benchmarks/best70_done18_bench_metrics_last.json
  #   experiments/FIGS/data/v2/benchmarks/best70_done18_bench_metrics_herwig_last.json
  name: ft-v2-best70-done18-bench-metrics-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: REPO_REF
          value: "mtx-s2.11"
        args:
        - |
          set -euo pipefail
          HALT=42   # the pod failure policy fails the Job at once on this code
          OUT=/data/results/ft_v2/best70_done18_bench_metrics
          [ ! -e "${OUT}" ] || { echo "FATAL: ${OUT} exists; use a new output directory"; exit ${HALT}; }
          pip install --no-cache-dir -q pyarrow==25.0.1
          git clone --depth 1 --branch "${REPO_REF}" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1

          ROOT=/data/results/ft_v2/best70
          for d in leg_top leg_qg; do
            [ -d "${ROOT}/${d}" ] || { echo "FATAL: no ${ROOT}/${d}"; exit ${HALT}; }
          done
          n=$(find ${ROOT}/leg_top ${ROOT}/leg_qg -name DONE | wc -l)
          echo "complete benchmark cells: ${n}"
          # The from-scratch reference is read beside the rule's cells, and
          # --expect-cells covers the rule's cells only: every reference cell must be DONE.
          missing=0
          for c in /data/results/ft/bench_v2/leg_top/scratch-v2/N{1000,10000,100000,1200000}/s{1,2,3} /data/results/ft/bench_v2/leg_qg/scratch-v2/N{1000,10000,100000,1600000}/s{1,2,3}; do
            [ -f "${c}/DONE" ] || { echo "MISSING reference cell ${c}"; missing=$((missing+1)); }
          done
          [ "${missing}" -eq 0 ] || { echo "FATAL: ${missing} reference cells not DONE"; exit ${HALT}; }

          # Written into a directory of this attempt and moved into place whole: an
          # attempt that dies part-way leaves no partial ${OUT} for the next one to refuse.
          TMP=${OUT}.staging.$(date -u +%s)
          mkdir -p ${TMP}
          # The best-validation epoch at every size (A6), beside v1's from-scratch cells.
          python3 experiments/FT/bench_metrics.py --root ${ROOT} --out ${TMP} --inits l188-s3 l162-s1 l162-s2 r42q1-s1 r42q1-s2 r42q1-s3 r16q1-s1 r16q1mass-s2 rand2p1-s1 rand2p2-s2 rand2p3-s1 rand2p4-s2 rand2p5-s2 flavf0-s1 flavf0-s2 flavf1-s1 flavf1-s2 flavf1r-s1 --expect-cells experiments/FT/data/ft_v2_expected_cells_done18.json:best70 \
            --ref-init /data/results/ft/bench_v2/leg_top/scratch-v2 --ref-init /data/results/ft/bench_v2/leg_qg/scratch-v2 --sha-table experiments/FT/data/ft_v2_subsets_sha256.json
          python3 experiments/FT/bench_metrics.py --root ${ROOT} --out ${TMP} --inits l188-s3 l162-s1 l162-s2 r42q1-s1 r42q1-s2 r42q1-s3 r16q1-s1 r16q1mass-s2 rand2p1-s1 rand2p2-s2 rand2p3-s1 rand2p4-s2 rand2p5-s2 flavf0-s1 flavf0-s2 flavf1-s1 flavf1-s2 flavf1r-s1 --expect-cells experiments/FT/data/ft_v2_expected_cells_done18.json:best70 --herwig \
            --ref-init /data/results/ft/bench_v2/leg_qg/scratch-v2 --sha-table experiments/FT/data/ft_v2_subsets_sha256.json
          # The full training set at its last epoch, A6's rule for C2, C3 and S5.
          python3 experiments/FT/bench_metrics.py --root ${ROOT} --out ${TMP} --inits l188-s3 l162-s1 l162-s2 r42q1-s1 r42q1-s2 r42q1-s3 r16q1-s1 r16q1mass-s2 rand2p1-s1 rand2p2-s2 rand2p3-s1 rand2p4-s2 rand2p5-s2 flavf0-s1 flavf0-s2 flavf1-s1 flavf1-s2 flavf1r-s1 --expect-cells experiments/FT/data/ft_v2_expected_cells_done18.json:best70 \
            --features-dir features_last --sizes 1200000 1600000
          python3 experiments/FT/bench_metrics.py --root ${ROOT} --out ${TMP} --inits l188-s3 l162-s1 l162-s2 r42q1-s1 r42q1-s2 r42q1-s3 r16q1-s1 r16q1mass-s2 rand2p1-s1 rand2p2-s2 rand2p3-s1 rand2p4-s2 rand2p5-s2 flavf0-s1 flavf0-s2 flavf1-s1 flavf1-s2 flavf1r-s1 --expect-cells experiments/FT/data/ft_v2_expected_cells_done18.json:best70 --herwig \
            --features-dir features_last --sizes 1200000 1600000
          mv ${TMP} ${OUT}
          ls -la ${OUT}
        resources:
          requests: { memory: "16Gi", cpu: "4", ephemeral-storage: "10Gi" }
          limits:   { memory: "16Gi", cpu: "4", ephemeral-storage: "10Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
