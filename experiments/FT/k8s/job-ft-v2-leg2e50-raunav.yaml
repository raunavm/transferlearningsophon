apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_ft_jobs.py -- do not hand-edit. Regenerate.
  #
  # RETRIES (2026-10-01), PER INDEX: pod failure policy -- evictions are not counted, exit 42
  # fails this pod's index (FailIndex) and no other. An interrupted cell resumes from its last
  # completed epoch; an index halts on two failed attempts of its cell or 3 attempts
  # without progress. See "retries that survive a flaky cluster" and "leg1_188" in
  # scripts/build_ft_jobs.py.
  # LEG-2 RECIPE CHECK: JetClass at N=1000000 with 50 epochs instead of 10: l188-s1 l188-s2 l188-s3
  # from best70 at the launched leg-2 recipe, and the from-scratch reference at the V100
  # references' recipe (seeds 1-3), all on subset s1.
  # INDEXED JOB: 6 cells, one at a time, V100 only. Root /data/results/ft_v2/recipe_check/leg2_e50;
  # ~0.6 GB kept (+1.3 GB while a cell trains).
  name: ft-v2-leg2e50-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 6
  parallelism: 1
  backoffLimitPerIndex: 20
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Count
      onExitCodes: { containerName: main, operator: In, values: [43] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        env:
        - name: GPU_PRODUCT
          value: "Tesla-V100-SXM2-32GB"
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: REPO_REF
          value: "mtx-s2.20"
        args:
        - |
          set -euo pipefail
          # Clone the pinned TAG (not a branch): every job in this wave runs the
          # same code, and a job that queues for days cannot pick up a later
          # commit when it finally starts.
          git clone --depth 1 --branch "${REPO_REF}" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow || exit 1
          export PYTHONUNBUFFERED=1

          SUB1=/data/finetune/jc1
          # THE CELL OF THIS POD. An Indexed Job gives each pod its index (JOB_COMPLETION_INDEX),
          # which names one cell below, in paper order; the Job controller starts the next index
          # when a pod finishes. A DONE cell is skipped here, before the GPU checks, and its
          # index completes at once.
          IDX=${JOB_COMPLETION_INDEX:?not a pod of an Indexed Job}
          case ${IDX} in
            0) ROOT_OUT=/data/results/ft_v2/recipe_check/leg2_e50; RUN_DIR=/data/results/mtx_v2/mtx-l188-s1; INITS="l188-s1:/workspace/ckpt/l188-s1.pt:188:1"; CELL_N=1000000;;
            1) ROOT_OUT=/data/results/ft_v2/recipe_check/leg2_e50; RUN_DIR=/data/results/mtx_v2/mtx-l188-s2; INITS="l188-s2:/workspace/ckpt/l188-s2.pt:188:1"; CELL_N=1000000;;
            2) ROOT_OUT=/data/results/ft_v2/recipe_check/leg2_e50; RUN_DIR=/data/results/mtx_v2/mtx-l188-s3; INITS="l188-s3:/workspace/ckpt/l188-s3.pt:188:1"; CELL_N=1000000;;
            3) ROOT_OUT=/data/results/ft_v2/recipe_check/leg2_e50; RUN_DIR=; INITS="scratch-v2::0:1"; CELL_N=1000000;;
            4) ROOT_OUT=/data/results/ft_v2/recipe_check/leg2_e50; RUN_DIR=; INITS="scratch-v2::0:2"; CELL_N=1000000;;
            5) ROOT_OUT=/data/results/ft_v2/recipe_check/leg2_e50; RUN_DIR=; INITS="scratch-v2::0:3"; CELL_N=1000000;;
            *) echo "FATAL: no cell for index ${IDX}"; exit 42;;
          esac
          # Per index: the lock owner and the halt markers, so a halt stops this index alone.
          SHARD=ft-v2-leg2e50-raunav-i${IDX}
          CELL_DONE=${ROOT_OUT}/leg2/${INITS%%:*}/N${CELL_N}/s${INITS##*:}/DONE
          [ -f ${CELL_DONE} ] && { echo "skip ${CELL_DONE%/DONE} (DONE)"; exit 0; }
          # The recipe of the cell's kind. Pretrained: the launched leg-2 cells' (lr 1e-4, head
          # x50, weight decay 0.01). From scratch: the V100 references' (ParT's own: lr 1e-3, no
          # multiplier, no weight decay; BASELINE RECIPES). Both weaver's flat+decay.
          if [ -n "${RUN_DIR}" ]; then
            WD="--optimizer-option weight_decay 0.01"; RECIPE="head_lr_mult=50 weight_decay=0.01"; RULE=best70
          else
            WD=""; RECIPE="head_lr_mult=1 weight_decay=0 recipe=part-from-scratch"; RULE=none
          fi
          NLOCKED=0
          mkdir -p ${ROOT_OUT}

          # The subsets come from two CPU jobs applied BEFORE this one, which is
          # applied only once both DONE files exist; so this wait is a guard, not
          # a plan. Bounded at 2 h, and it leaves a marker: with backoffLimit 50
          # a bare exit 1 would re-queue and hold a GPU for 2 h per retry, the
          # marker makes every retry fail at once.
          WAIT_MARK=${ROOT_OUT}/WAIT_TIMEOUT.${SHARD}
          [ -f ${WAIT_MARK} ] && { echo "FATAL: an earlier attempt timed out: $(cat ${WAIT_MARK}). Fix the producer, then remove ${WAIT_MARK}"; exit 1; }
          wait_for () { local f=$1; local t=0; until [ -f "$f" ]; do [ "$t" -ge 7200 ] && { echo "$f absent after 2 h" | tee ${WAIT_MARK}; exit 1; }; sleep 60; t=$((t+60)); done; }
          wait_for ${SUB1}/DONE
          # CLAUDE.md: check free space before a write of this size.
          FREE_G=$(df -BG --output=avail /data | tail -1 | tr -dc 0-9)
          echo "free on /data: ${FREE_G}G"
          [ "${FREE_G}" -ge 100 ] || { echo "FATAL: ${FREE_G}G free on /data, need 100G"; exit 1; }

          # Every fine-tune writes up to ~4 GB (weaver keeps state + optimizer per
          # epoch; leg 1 adds 2M x (128 + 162) float32 features + logits): ~250 GB
          # over the wave. CLAUDE.md: no write > 1 GB past 85% without the PI.
          space_ok () { local p=$(df --output=pcent /data | tail -1 | tr -dc 0-9); local g=$(df -BG --output=avail /data | tail -1 | tr -dc 0-9); echo "/data ${p}% used, ${g}G free"; [ "$p" -lt 85 ] && [ "$g" -ge 50 ] || { echo "FATAL: /data at ${p}% used, ${g}G free: stop and ask the PI"; exit 1; }; }

          # A fine-tune that fails deterministically (OOM, a failed check) would
          # otherwise be re-run by all 50 retries, each one moving the previous
          # attempt aside: 50 x hours of a held GPU and ~200 GB of .partial dirs.
          # Two attempts, then the marker stops every later pod at the top.
          # Per shard: wave 2 and the other shards write to this same tree,
          # and one job's deterministic failure must not halt another's restarts.
          FAIL_MARK=${ROOT_OUT}/FAILED.${SHARD}
          HALT=42   # the pod failure policy fails this pod's index at once on this code
          NODE_FAULT=43   # ...and counts this one against the retries
          [ -f ${FAIL_MARK} ] && { echo "FATAL: an earlier attempt halted the job: $(cat ${FAIL_MARK}). Fix the cause, then remove ${FAIL_MARK}; what it counted was renamed and is not counted again"; exit ${HALT}; }
          # Each cell is prepared by experiments/FT/cell_resume.py prepare: an
          # interrupted attempt (an evicted or lost pod is SIGKILLed and runs no trap)
          # is RESUMED from its last completed epoch; a FAILED one (ATTEMPT_FAILED,
          # from the trap below) is moved aside and the cell starts again, unless its
          # training had finished (TRAINED), when only the read-out is redone. The job
          # halts on two failed attempts of a cell, 4 node faults of a cell, or 3
          # consecutive attempts of a cell that complete no epoch.
          CELL=""
          NODE_FAULTS=${ROOT_OUT}/NODE_FAULTS.${SHARD}
          on_exit () {
            local rc=$?
            [ ${rc} -ne 0 ] && [ ${rc} -ne ${HALT} ] && [ ${rc} -ne ${NODE_FAULT} ] && [ -n "${CELL}" ] && [ -d "${CELL}" ] && [ ! -f "${CELL}/DONE" ] || return 0
            local why="rc=${rc} pod=${POD_NAME} node=${NODE_NAME} $(date -u +%FT%TZ)"
            # the node's fault, not the cell's: the GPU no longer answers, or the log
            # holds a CUDA device fault
            if ! python3 experiments/FT/gpu_probe.py || grep -qsE "CUDA error: unknown error|Cannot access accelerator device|GPU is lost|CUDA-capable device\(s\) is/are busy or unavailable|uncorrectable ECC error" "${CELL}/stdout.log" "${CELL}/predict.log"; then
              echo "${why}" > "$(mktemp "${CELL}/NODE_FAULT.XXXXXX")"
              echo "${why} ${CELL}" >> ${NODE_FAULTS}
              exit ${NODE_FAULT}
            fi
            echo "${why}" > "${CELL}/ATTEMPT_FAILED"
          }
          trap on_exit EXIT
          # A node whose GPU does not answer is refused before any cell is touched.
          python3 experiments/FT/gpu_probe.py || {
            echo "preflight pod=${POD_NAME} node=${NODE_NAME} $(date -u +%FT%TZ)" >> ${NODE_FAULTS}; exit ${NODE_FAULT}; }



          # init:checkpoint:K -- K is the CHECKPOINT's head width, checked before
          # any fine-tune so a wrong path or layout fails here, not after a run.
          # v2 PRETRAINED CHECKPOINT, rule best70 (a pretrained cell only): ft_v2.py resolve
          # links the run's selected epoch to /workspace/ckpt/<init>.pt and records the choice
          # in <init>.pt.json, which the cell copies beside its result.
          [ -z "${RUN_DIR}" ] || python3 experiments/FT/ft_v2.py resolve --run-dir ${RUN_DIR} --rule best70 --link /workspace/ckpt/${INITS%%:*}.pt || exit ${HALT}

          for spec in ${INITS}; do
            name=${spec%%:*}; rest=${spec#*:}; ckpt=${rest%%:*}; k=${rest#*:}; k=${k%%:*}
            [ -z "${ckpt}" ] && continue   # from scratch: nothing to check
            [ -f "${ckpt}" ] || { echo "FATAL: ${name}: no ${ckpt}"; exit 1; }
            python3 experiments/EVAL/extract_features.py --checkpoint ${ckpt} --num-classes ${k} --arm ${name} \
              --data-test /jc2/jet_data/Res2P_0250.parquet --out ${ROOT_OUT}/selfcheck --self-check-only
          done

          # Leg-2 preconditions, checked HERE rather than days later after leg 1.
          # The E1 arm-S checkpoints are NOT among them: wave 2 writes the
          # leg2/ref_e1arms-s* rows and this shard does not, so refusing to
          # start without a file it never opens would be a precondition on
          # someone else's input.
          for C in HToBB HToCC HToGG HToWW2Q1L HToWW4Q TTBar TTBarLep WToQQ ZToQQ ZJetsToNuNu; do
            [ "$(find /data/JetClass/Pythia/test_20M -maxdepth 1 -name "${C}_*.root" | wc -l)" -ge 2 ] || { echo "FATAL: ${C}: fewer than 2 JetClass-I test files"; exit 1; }
          done

          # EVERY SUBSET THIS JOB READS, against its sha256 record, before any GPU
          # work: the bytes the record holds, or the job stops (ft_v2.py verify).
          python3 experiments/FT/ft_v2.py verify --table experiments/FT/data/ft_v2_subsets_sha256.json \
            --files /data/finetune/jc1/train_N1000_s1.parquet /data/finetune/jc1/train_N10000_s1.parquet /data/finetune/jc1/train_N100000_s1.parquet /data/finetune/jc1/train_N1000000_s1.parquet /data/finetune/jc1/val.parquet || exit ${HALT}

          epochs_for () { case $1 in 1000) echo 50;; 10000) echo 50;; 100000) echo 30;; 1000000) echo 10;; *) echo "FATAL: no epoch budget for N=$1" >&2; exit 1;; esac; }
          # samples-per-epoch DECOUPLED from the subset size; see SAMPLES_PER_EPOCH
          # in scripts/build_ft_jobs.py. Only N=1e3 differs, and it differs so the
          # optimizer-step count matches the N=1e4 cell.
          samples_for () { case $1 in 1000) echo 10000;; *) echo $1;; esac; }
          COMMON="--use-amp --batch-size 512 --num-workers 2 --fetch-by-files --fetch-step 1 --optimizer ranger ${WD}"
          # An ARRAY, not a string: the value carries parentheses and
          # single quotes, and as a plain string it is re-split on
          # expansion so the parens reach the shell as syntax.
          HEAD_MULT=(--optimizer-option lr_mult "(r'mod\.fc\..*', 50)")

          # ---------------------------------------------------------------- leg 2
          # JetClass-I 10-class at the Sophon preprocessing: the pileup-shift leg.
          TEST1=""
          for C in HToBB HToCC HToGG HToWW2Q1L HToWW4Q TTBar TTBarLep WToQQ ZToQQ ZJetsToNuNu; do
            for f in $(ls /data/JetClass/Pythia/test_20M/${C}_*.root | sort | head -2); do TEST1="${TEST1} ${f}"; done
          done
          echo "leg-2 test subset: $(echo ${TEST1} | wc -w) files"
          [ "$(echo ${TEST1} | wc -w)" -eq 20 ] || { echo "FATAL: expected 20 JetClass-I test files"; exit 1; }
          PRED="--data-config configs/finetune/JetClassI_sophon_noweight.yaml --network-config experiments/E1/ParT_sophon_arch_10c.py -o num_classes 10 --predict-gpus 0 --batch-size 512 --num-workers 2 --fetch-by-files --fetch-step 1"

          # The E1 arm-S reference rows (leg2/ref_e1arms-s*) are written by wave 2
          # alone; they are keyed by seed, not init, and five shards racing on one
          # pred.root is exactly what the per-cell lock exists to prevent.

          for spec in ${INITS}; do
            name=${spec%%:*}; rest=${spec#*:}; ckpt=${rest%%:*}; seeds=${spec##*:}
            for S in ${seeds//,/ }; do
              for N in ${CELL_N}; do
                OUT=${ROOT_OUT}/leg2/${name}/N${N}/s${S}
                [ -f ${OUT}/DONE ] && { echo "skip ${OUT} (DONE)"; continue; }
                # ONE CELL, ONE POD. cell_resume.py lock claims the cell atomically (a
                # directory holding the owner, renamed onto the lock). A lock of this shard,
                # left by an evicted pod, is re-entered and its cell resumed below; a lock
                # held by any other job is left alone and counted, and the job halts at the end.
                HELD=$(python3 experiments/FT/cell_resume.py lock --path ${OUT}.lock --owner ${SHARD})
                case "${HELD}" in
                  acquired) ;;
                  reentered) echo "re-entering ${OUT}.lock, left by an earlier pod of ${SHARD}";;
                  *) echo "LOCKED: ${OUT} is held by ${HELD}, this is ${SHARD}; leaving it"
                     NLOCKED=$((NLOCKED+1)); continue;;
                esac
                space_ok
                E=$(python3 experiments/FT/cell_resume.py prepare --dir ${OUT} --max-failed 2 --max-node-faults 4 --max-stalled 3) || {
                  echo "${OUT}: ${E}" | tee ${FAIL_MARK}; exit ${HALT}; }
                mkdir -p ${OUT}
                CELL=${OUT}
                [ -z "${ckpt}" ] || cp /workspace/ckpt/${name}.pt.json ${OUT}/init_checkpoint.json
                RESUME=(); [ "${E}" -lt 0 ] || RESUME=(--load-epoch ${E})
                echo "$(date -u +%FT%TZ) pod=${POD_NAME} node=${NODE_NAME} from_epoch=${E}" >> ${OUT}/ATTEMPTS
                if [ -n "${ckpt}" ]; then LOAD="--load-model-weights ${ckpt} --exclude-model-weights mod\.fc\..*"; LR=1e-4; MULT=("${HEAD_MULT[@]}"); else LOAD=""; LR=1e-3; MULT=(); fi
                EP=50   # the longer-training check, in place of $(epochs_for ${N})
                SPE=$(samples_for ${N})
                [ "${E}" -ge 0 ] || python3 experiments/FT/smoke_checks.py manifest --out ${OUT}/ft_manifest.json leg=2 init=${name} checkpoint=${ckpt} n_train=${N} ft_seed=${S} lr=${LR} ${RECIPE} wave=v2 ckpt_rule=${RULE} recipe_check=leg2_e50 epochs=${EP} subset=${SUB1}/train_N${N}_s1.parquet data_config=configs/finetune/JetClassI_sophon_noweight.yaml num_classes=10 batch_size=512 samples_per_epoch=${SPE} steps_per_epoch=$((SPE/512)) samples_per_epoch_val=20000 steps_per_epoch_val=39 val_rule=rotating-stream
                python3 experiments/FT/ft_weaver.py --seed ${S} ${RESUME[@]+"${RESUME[@]}"} --lean-val-metrics \
                  --data-train ${SUB1}/train_N${N}_s1.parquet --data-val ${SUB1}/val.parquet \
                  --data-config configs/finetune/JetClassI_sophon_noweight.yaml \
                  --network-config experiments/E1/ParT_sophon_arch_10c.py -o num_classes 10 -o fc_params '[(512,0.1)]' \
                  ${COMMON} ${MULT[@]+"${MULT[@]}"} --start-lr ${LR} --samples-per-epoch ${SPE} --samples-per-epoch-val 20000 --num-epochs ${EP} \
                  ${LOAD} --model-prefix ${OUT}/net --log ${OUT}/train.log 2>&1 | tee ${OUT}/stdout.log
                # TRUE BOOKKEEPING (must-fix 14): weaver's own log must show the steps the
                # manifest records.
                grep -q "('steps_per_epoch', $((SPE/512)))" ${OUT}/train.log || {
                  echo "FATAL: ${OUT}: weaver did not run $((SPE/512)) steps per epoch"; exit 1; }
                # A run whose loss went to NaN is not a result even if it finishes: weaver
                # still keeps a best epoch. Fail the attempt; the cell starts again once.
                if grep -q "AvgLoss: nan" ${OUT}/train.log 2>/dev/null; then
                  echo "FATAL: ${OUT} diverged (NaN training loss)"; exit 1; fi
                # weaver restarts its best-validation tracking on --load-epoch: the best epoch
                # of the whole run, from the exact metric ft_weaver.py logs, as weaver picks it.
                python3 experiments/FT/cell_resume.py best --dir ${OUT} --epochs ${EP}
                [ -z "${ckpt}" ] || python3 experiments/FT/smoke_checks.py load-log --log ${OUT}/stdout.log
                if [ -n "${ckpt}" ]; then
                  grep -q "Parameters with lr multiplied by 50" ${OUT}/stdout.log || {
                    echo "FATAL: weaver did not apply the head lr multiplier; this cell"
                    echo "       ran wave 1's protocol, not ParT's published recipe."; exit 1; }
                fi
                touch ${OUT}/TRAINED   # training passed its checks: a retry redoes only what follows
                weaver --predict --data-test ${TEST1} ${PRED} -o fc_params '[(512,0.1)]' --model-prefix ${OUT}/net --predict-output ${OUT}/pred.root 2>&1 | tee ${OUT}/predict.log | tail -3
                [ -f ${OUT}/pred.root ] || { echo "FATAL: no pred.root in ${OUT}"; exit 1; }
                python3 experiments/FT/slim_outputs.py pred --file ${OUT}/pred.root
                [ -f ${OUT}/net_best_epoch_state.pt ] || {
                  echo "FATAL: no net_best_epoch_state.pt in ${OUT};"
                  echo "       refusing to prune per-epoch checkpoints."; exit 1; }
                rm -f ${OUT}/net_epoch-*_state.pt ${OUT}/net_epoch-*_optimizer.pt
                [ -f ${OUT}/net_best_epoch_state.pt ] || {
                  echo "FATAL: the prune removed net_best_epoch_state.pt in ${OUT}."; exit 1; }
                touch ${OUT}/DONE
                rm -rf ${OUT}.lock
                CELL=""
              done
            done
          done
          echo "FT V2 LEG2 ${SHARD} COMPLETE (${NLOCKED} cells left to another job)"
          [ "${NLOCKED}" -eq 0 ] || { echo "FATAL: ${NLOCKED} cells are held by another job's lock"; exit ${HALT}; }
        resources:
          requests: { memory: "88Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "88Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: nvidia.com/gpu.product
                operator: In
                values: ["Tesla-V100-SXM2-32GB"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-01.sdsc.optiputer.net", "hcc-chase-shor-c4715.unl.edu", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-chase-ci-01.calit2.optiputer.net"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
