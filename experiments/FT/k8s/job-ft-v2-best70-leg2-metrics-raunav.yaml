apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_ft_jobs.py -- do not hand-edit. Regenerate.
  #
  # RETRIES (2026-10-01): pod failure policy -- evictions are not counted, exit 42
  # fails the Job at once; see "retries that survive a flaky cluster" in
  # scripts/build_ft_jobs.py.
  # v2 READ-OUT, pretrained checkpoint rule best70: leg 2 (JetClass), experiments/FT/leg2_metrics.py --macro-auc.
  # Fails unless every cell experiments/FT/data/ft_v2_expected_cells.json lists under best70/ is read.
  # It WAITS IN THE POD until every cell it reads is DONE (_wait_done), so it may be
  # applied while the last fine-tunes run. CPU.
  # Output /data/results/ft_v2/best70_leg2_metrics; copy each JSON to
  #   experiments/FIGS/data/v2/finetune/best70_leg2_metrics.json
  name: ft-v2-best70-leg2-metrics-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: REPO_REF
          value: "mtx-s2.19"
        args:
        - |
          set -euo pipefail
          HALT=42   # the pod failure policy fails the Job at once on this code
          OUT=/data/results/ft_v2/best70_leg2_metrics
          [ ! -e "${OUT}/leg2_metrics.json" ] || { echo "FATAL: ${OUT}/leg2_metrics.json exists; use a new output directory"; exit ${HALT}; }
          pip install --no-cache-dir -q pyarrow==25.0.1
          git clone --depth 1 --branch "${REPO_REF}" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1

          # WAIT IN THE POD until every expected cell is DONE: poll every 30 min,
          # and after 6 days exit ${HALT}, which fails the Job at once.
          waited=0
          while :; do
            left=0
            for w in /data/results/ft_v2/best70/leg2/{flavf0-s1,flavf0-s2,flavf1-s1,flavf1-s2,flavf1r-s1,flavf1r-s2,l162-s1,l162-s2,l162-s3,l162mass-s1,l162mass-s2,l188-s1,l188-s2,l188-s3,r16q1-s1,r16q1-s2,r16q1-s3,r16q1mass-s1,r16q1mass-s2,r42q1-s1,r42q1-s2,r42q1-s3,rand2p1-s1,rand2p2-s2,rand2p3-s1,rand2p4-s2,rand2p5-s2}/N{1000,10000,100000,1000000}/s1; do
              [ -f "${w}/DONE" ] || left=$((left+1))
            done
            [ "${left}" -eq 0 ] && break
            [ "${waited}" -lt 518400 ] || { echo "FATAL: ${left} expected cells not DONE after 6 days"; exit ${HALT}; }
            echo "$(date -u +%FT%TZ) waiting for ${left} cells"
            sleep 1800; waited=$((waited+1800))
          done

          ROOT=/data/results/ft_v2/best70/leg2
          [ -d "${ROOT}" ] || { echo "FATAL: no ${ROOT}"; exit ${HALT}; }
          n=$(find ${ROOT} -name DONE | wc -l)
          echo "complete leg2 cells: ${n}"
          # The from-scratch reference is read beside the rule's cells, and
          # --expect-cells covers the rule's cells only: every reference cell must be DONE.
          missing=0
          for c in /data/results/ft_v2/ref_v100/jc1/leg2/scratch-v2/N{1000,10000,100000,1000000}/s{1,2,3}; do
            [ -f "${c}/DONE" ] || { echo "MISSING reference cell ${c}"; missing=$((missing+1)); }
          done
          [ "${missing}" -eq 0 ] || { echo "FATAL: ${missing} reference cells not DONE"; exit ${HALT}; }
          # A cell with a log but no DONE stops the job rather than being read half-written.
          open=0
          for f in $(find ${ROOT} -name predict.log -not -path "*.partial.*"); do
            [ -f "$(dirname ${f})/DONE" ] || { echo "NOT DONE: $(dirname ${f})"; open=$((open+1)); }
          done
          [ "${open}" -eq 0 ] || { echo "FATAL: ${open} cells have a log but no DONE"; exit ${HALT}; }

          mkdir -p ${OUT}
          python3 experiments/FT/leg2_metrics.py \
            --root ${ROOT} \
            --out ${OUT} \
            --macro-auc --auc-stride 4 \
            --ref-init /data/results/ft_v2/ref_v100/jc1/leg2/scratch-v2 --sha-table experiments/FT/data/ft_v2_subsets_sha256.json \
            --expect-cells experiments/FT/data/ft_v2_expected_cells.json:best70
          ls -la ${OUT}
        resources:
          requests: { memory: "32Gi", cpu: "8", ephemeral-storage: "10Gi" }
          limits:   { memory: "32Gi", cpu: "8", ephemeral-storage: "10Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
