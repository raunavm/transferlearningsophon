apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_ft_jobs.py -- do not hand-edit. Regenerate.
  #
  # RETRIES (2026-10-01): pod failure policy -- evictions are not counted, exit 42
  # fails the Job at once; see "retries that survive a flaky cluster" in
  # scripts/build_ft_jobs.py.
  # v2 READ-OUT, pretrained checkpoint rule best70: leg 1 (JetClass-II), experiments/FT/leg1_metrics.py.
  # Fails unless every cell experiments/FT/data/ft_v2_expected_cells_done18.json lists under best70/ is read.
  # TRIAL: the 18 runs fine-tuned before the split (V2_TRIAL_INITS) only; the final read-out is the spec without done18.
  # DO NOT APPLY before the v2 fine-tuning it reads has finished. CPU.
  # Output /data/results/ft_v2/best70_done18_leg1_metrics; copy each JSON to
  #   experiments/FIGS/data/v2/finetune/best70_done18_leg1_metrics.json
  name: ft-v2-best70-done18-leg1-metrics-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        env:
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: REPO_REF
          value: "mtx-s2.11"
        args:
        - |
          set -euo pipefail
          HALT=42   # the pod failure policy fails the Job at once on this code
          OUT=/data/results/ft_v2/best70_done18_leg1_metrics
          [ ! -e "${OUT}/leg1_metrics.json" ] || { echo "FATAL: ${OUT}/leg1_metrics.json exists; use a new output directory"; exit ${HALT}; }
          pip install --no-cache-dir -q pyarrow==25.0.1
          git clone --depth 1 --branch "${REPO_REF}" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          export PYTHONUNBUFFERED=1

          ROOT=/data/results/ft_v2/best70/leg1
          [ -d "${ROOT}" ] || { echo "FATAL: no ${ROOT}"; exit ${HALT}; }
          n=$(find ${ROOT} -name DONE | wc -l)
          echo "complete leg1 cells: ${n}"
          # The from-scratch reference is read beside the rule's cells, and
          # --expect-cells covers the rule's cells only: every reference cell must be DONE.
          missing=0
          for c in /data/results/ft_v2/scratch/leg1/scratch-v2/N{1000,10000,100000,1000000}/s{1,2,3}; do
            [ -f "${c}/DONE" ] || { echo "MISSING reference cell ${c}"; missing=$((missing+1)); }
          done
          [ "${missing}" -eq 0 ] || { echo "FATAL: ${missing} reference cells not DONE"; exit ${HALT}; }

          mkdir -p ${OUT}
          python3 experiments/FT/leg1_metrics.py \
            --root ${ROOT} /data/results/ft_v2/scratch/leg1 \
            --out ${OUT} \
            --auc-stride 4 \
            --inits l188-s3 l162-s1 l162-s2 r42q1-s1 r42q1-s2 r42q1-s3 r16q1-s1 r16q1mass-s2 rand2p1-s1 rand2p2-s2 rand2p3-s1 rand2p4-s2 rand2p5-s2 flavf0-s1 flavf0-s2 flavf1-s1 flavf1-s2 flavf1r-s1 scratch-v2 --expect-cells experiments/FT/data/ft_v2_expected_cells_done18.json:best70

          echo "=== summary ==="
          python3 -c "
          import json
          d=json.load(open('${OUT}/leg1_metrics.json'))
          for init,per in sorted(d['summary'].items()):
              for N,s in sorted(per.items()):
                  sd=s['accuracy_sd']
                  print(f\"{init:16} {N:10} acc={s['accuracy_mean']:.5f}\" +
                        (f\" +-{sd:.5f}\" if sd is not None else '') +
                        f\" macroAUC={s['macro_auc_mean']:.5f} n={s['n_seeds']}\")
          "
        resources:
          requests: { memory: "32Gi", cpu: "8", ephemeral-storage: "10Gi" }
          limits:   { memory: "32Gi", cpu: "8", ephemeral-storage: "10Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
