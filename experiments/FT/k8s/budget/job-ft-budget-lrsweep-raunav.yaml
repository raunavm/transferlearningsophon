apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_ft_budget_jobs.py -- fine-tuning with the fixed step budget (plan 3.1).
  name: ft-budget-lrsweep-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 12
  parallelism: 6
  backoffLimitPerIndex: 3
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        env:
        - name: REPO_REF
          value: "mtx-s2.23"
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        args:
        - |
          set -euo pipefail
          git clone -q --depth 1 --branch "${REPO_REF}" https://github.com/raunavm/transferlearningsophon.git /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          HALT=42
          IDX=${JOB_COMPLETION_INDEX:?not a pod of an Indexed Job}
          case ${IDX} in
            0) TASK=top; INIT=l188-s1; RUN_DIR=/data/results/mtx_v2/mtx-l188-s1; N=10000; S=1; LR=1e-4; MULT=50.0; CELL=/data/results/ft_v2/lrsweep/leg_top/l188-s1_lr1e-4/N10000/s1;;
            1) TASK=top; INIT=l188-s1; RUN_DIR=/data/results/mtx_v2/mtx-l188-s1; N=10000; S=1; LR=3e-4; MULT=16.666666666666668; CELL=/data/results/ft_v2/lrsweep/leg_top/l188-s1_lr3e-4/N10000/s1;;
            2) TASK=top; INIT=l188-s1; RUN_DIR=/data/results/mtx_v2/mtx-l188-s1; N=10000; S=1; LR=1e-3; MULT=5.0; CELL=/data/results/ft_v2/lrsweep/leg_top/l188-s1_lr1e-3/N10000/s1;;
            3) TASK=top; INIT=; RUN_DIR=; N=10000; S=1; LR=3e-4; MULT=; CELL=/data/results/ft_v2/lrsweep/leg_top/scratch_lr3e-4/N10000/s1;;
            4) TASK=top; INIT=; RUN_DIR=; N=10000; S=1; LR=1e-3; MULT=; CELL=/data/results/ft_v2/lrsweep/leg_top/scratch_lr1e-3/N10000/s1;;
            5) TASK=top; INIT=; RUN_DIR=; N=10000; S=1; LR=3e-3; MULT=; CELL=/data/results/ft_v2/lrsweep/leg_top/scratch_lr3e-3/N10000/s1;;
            6) TASK=qg; INIT=l188-s1; RUN_DIR=/data/results/mtx_v2/mtx-l188-s1; N=10000; S=1; LR=1e-4; MULT=50.0; CELL=/data/results/ft_v2/lrsweep/leg_qg/l188-s1_lr1e-4/N10000/s1;;
            7) TASK=qg; INIT=l188-s1; RUN_DIR=/data/results/mtx_v2/mtx-l188-s1; N=10000; S=1; LR=3e-4; MULT=16.666666666666668; CELL=/data/results/ft_v2/lrsweep/leg_qg/l188-s1_lr3e-4/N10000/s1;;
            8) TASK=qg; INIT=l188-s1; RUN_DIR=/data/results/mtx_v2/mtx-l188-s1; N=10000; S=1; LR=1e-3; MULT=5.0; CELL=/data/results/ft_v2/lrsweep/leg_qg/l188-s1_lr1e-3/N10000/s1;;
            9) TASK=qg; INIT=; RUN_DIR=; N=10000; S=1; LR=3e-4; MULT=; CELL=/data/results/ft_v2/lrsweep/leg_qg/scratch_lr3e-4/N10000/s1;;
            10) TASK=qg; INIT=; RUN_DIR=; N=10000; S=1; LR=1e-3; MULT=; CELL=/data/results/ft_v2/lrsweep/leg_qg/scratch_lr1e-3/N10000/s1;;
            11) TASK=qg; INIT=; RUN_DIR=; N=10000; S=1; LR=3e-3; MULT=; CELL=/data/results/ft_v2/lrsweep/leg_qg/scratch_lr3e-3/N10000/s1;;
            *) echo "FATAL: no cell for index ${IDX}"; exit ${HALT};;
          esac
          [ -f ${CELL}/DONE ] && { echo "skip ${CELL} (DONE)"; exit 0; }
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 85 ] || { echo "FATAL: /data at ${USED}%"; exit ${HALT}; }
          case ${TASK} in
            top) SUB=/data/finetune/top_sub; CFG=configs/finetune/TopReference.yaml; K=2; NET=experiments/MTX/ParT_sophon_arch_mtx.py; TEST="/data/finetune/top/top_test.parquet";;
            qg) SUB=/data/finetune/qg_v2_sub; CFG=configs/finetune/EnergyFlowQG.yaml; K=2; NET=experiments/MTX/ParT_sophon_arch_mtx.py; TEST="/data/finetune/qg_v2/qg_chunk18.parquet /data/finetune/qg_v2/qg_chunk19.parquet";;
            jc1) SUB=/data/finetune/jc1; CFG=configs/finetune/JetClassI_sophon_noweight.yaml; K=10; NET=experiments/E1/ParT_sophon_arch_10c.py; TEST=""; for C in HToBB HToCC HToGG HToWW2Q1L HToWW4Q TTBar TTBarLep WToQQ ZToQQ ZJetsToNuNu; do for f in $(ls /data/JetClass/Pythia/test_20M/${C}_*.root | sort | head -2); do TEST="${TEST} ${f}"; done; done; [ "$(echo ${TEST} | wc -w)" -eq 20 ] || { echo "FATAL: JetClass test files"; exit ${HALT}; };;
            *) echo "FATAL: task ${TASK}"; exit ${HALT};;
          esac
          python3 experiments/FT/gpu_probe.py || exit 43
          RUN=/workspace/run; rm -rf ${RUN}; mkdir -p ${RUN}
          [ -d ${CELL} ] && mv ${CELL} ${CELL}.partial.$(date -u +%s)
          mkdir -p ${CELL}
          echo "$(date -u +%FT%TZ) pod=${POD_NAME} node=${NODE_NAME} ref=${REPO_REF}" >> ${CELL}/ATTEMPTS
          if [ -n "${RUN_DIR}" ]; then
            python3 experiments/FT/ft_v2.py resolve --run-dir ${RUN_DIR} --rule best70 --link /workspace/ckpt/${INIT}.pt || exit ${HALT}
            cp /workspace/ckpt/${INIT}.pt.json ${CELL}/init_checkpoint.json
            LOAD=(--load-model-weights /workspace/ckpt/${INIT}.pt --exclude-model-weights "mod\.fc\..*")
            MULTARG=(--optimizer-option lr_mult "(r'mod\.fc\..*', ${MULT})")
            SCHED=(--lr-scheduler none); RECIPE="head_lr_mult=${MULT} lr_schedule=constant ckpt_rule=best70"
          else
            LOAD=(); MULTARG=(); SCHED=(); RECIPE="head_lr_mult=1 lr_schedule=flat+decay recipe=part-from-scratch"
          fi
          python3 experiments/FT/smoke_checks.py manifest --out ${CELL}/ft_manifest.json task=${TASK} \
            init=${INIT:-scratch} checkpoint=${RUN_DIR} n_train=${N} ft_seed=${S} lr=${LR} ${RECIPE} weight_decay=0.01 \
            subset=${SUB}/train_N${N}_s1.parquet data_config=${CFG} num_classes=${K} batch_size=512 \
            samples_per_epoch=$((500 * 512)) steps_per_epoch=500 max_epochs=40 \
            samples_per_epoch_val=200000 early_stop_patience=10 val_rule=fixed-file budget=v3.1
          python3 experiments/FT/ft_weaver.py --seed ${S} --lean-val-metrics \
            --data-train ${SUB}/train_N${N}_s1.parquet --data-val ${SUB}/val.parquet --data-config ${CFG} \
            --network-config ${NET} -o num_classes ${K} -o fc_params '[(512,0.1)]' \
            --use-amp --batch-size 512 --num-workers 2 --fetch-by-files --fetch-step 1 --optimizer ranger \
            ${SCHED[@]+"${SCHED[@]}"} --optimizer-option weight_decay 0.01 ${MULTARG[@]+"${MULTARG[@]}"} \
            --start-lr ${LR} --samples-per-epoch $((500 * 512)) --samples-per-epoch-val 200000 \
            --num-epochs 40 ${LOAD[@]+"${LOAD[@]}"} --model-prefix ${RUN}/net --log ${RUN}/train.log \
            > ${RUN}/stdout.log 2>&1 &
          PID=$!
          ES=0
          python3 experiments/FT/early_stop.py watch --log ${RUN}/train.log --pid ${PID} --patience 10 \
            --max-epochs 40 --out ${CELL}/early_stop.json || ES=$?
          wait ${PID} || true
          cp ${RUN}/train.log ${RUN}/stdout.log ${CELL}/
          [ "${ES}" -eq 0 ] || { echo "FATAL: ${CELL}: training did not finish (early_stop rc=${ES})"; tail -30 ${RUN}/stdout.log; exit 1; }
          grep -q "('steps_per_epoch', 500)" ${RUN}/train.log || { echo "FATAL: weaver did not run 500 steps per epoch"; exit 1; }
          if grep -q "AvgLoss: nan" ${RUN}/train.log; then echo "FATAL: ${CELL} diverged (NaN training loss)"; exit 1; fi
          if [ -n "${RUN_DIR}" ]; then
            python3 experiments/FT/smoke_checks.py load-log --log ${RUN}/stdout.log
            grep -q "Parameters with lr multiplied by" ${RUN}/stdout.log || { echo "FATAL: weaver did not apply the head lr multiplier"; exit 1; }
          fi
          BEST=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['best_epoch'])" ${CELL}/early_stop.json)
          LAST=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['last_epoch'])" ${CELL}/early_stop.json)
          cmp -s ${RUN}/net_best_epoch_state.pt ${RUN}/net_epoch-${BEST}_state.pt || { echo "FATAL: weaver's best state is not epoch ${BEST}"; exit ${HALT}; }
          cp ${RUN}/net_best_epoch_state.pt ${CELL}/net_best_epoch_state.pt
          cp ${RUN}/net_epoch-${LAST}_state.pt ${CELL}/net_last_epoch_state.pt
          case ${TASK} in
            jc1)
              weaver --predict --data-test ${TEST} --data-config ${CFG} --network-config ${NET} -o num_classes ${K} \
                -o fc_params '[(512,0.1)]' --predict-gpus 0 --batch-size 512 --num-workers 2 --fetch-by-files --fetch-step 1 \
                --model-prefix ${CELL}/net_best_epoch_state.pt --predict-output ${CELL}/pred.root 2>&1 | tee ${CELL}/predict.log | tail -3
              [ -f ${CELL}/pred.root ] || { echo "FATAL: no pred.root in ${CELL}"; exit 1; }
              python3 experiments/FT/slim_outputs.py pred --file ${CELL}/pred.root;;
            *)
              python3 experiments/EVAL/extract_features.py --checkpoint ${CELL}/net_best_epoch_state.pt --num-classes ${K} \
                --arm FTB_${TASK}_${INIT:-scratch}_N${N}_s${S} --data-config ${CFG} --data-test ${TEST} \
                --observers jet_pt jet_energy --out ${CELL}/features --batch-size 512 --num-workers 1 --fetch-step 1 --save-logits
              if [ "${TASK}" = "qg" ]; then
                python3 experiments/EVAL/extract_features.py --checkpoint ${CELL}/net_best_epoch_state.pt --num-classes ${K} \
                  --arm FTB_${TASK}_${INIT:-scratch}_N${N}_s${S}_herwig --data-config ${CFG} --data-test /data/finetune/qg_herwig/qg_herwig_chunk0.parquet /data/finetune/qg_herwig/qg_herwig_chunk1.parquet \
                  --observers jet_pt jet_energy --out ${CELL}/features_herwig --batch-size 512 --num-workers 1 --fetch-step 1 --save-logits
                mv ${CELL}/features_herwig/logits.npy ${CELL}/features/logits_herwig.npy
                mv ${CELL}/features_herwig/label188.npy ${CELL}/features/label_herwig.npy
              fi;;
          esac
          touch ${CELL}/DONE
          echo "FT BUDGET CELL ${IDX} DONE: ${CELL}"
        resources:
          requests: { memory: "48Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "48Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: nvidia.com/gpu.product
                operator: In
                values: ["Tesla-V100-SXM2-32GB"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
