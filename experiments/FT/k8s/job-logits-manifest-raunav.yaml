apiVersion: batch/v1
kind: Job
metadata:
  # The manifest of the test logits of the superseded 1e-2 pretrained JetClass-II cells at 1e4-1e6 (PI 2026-11-21):
  # experiments/FT/features_manifest.py manifest --set jc2b-1e-2-logits. Writes the CSV and prints it; deletes nothing. CPU.
  name: logits-manifest-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s3.19 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          M=/data/results/deleted_jc2b_1e-2_logits.csv
          python3 experiments/FT/features_manifest.py manifest --set jc2b-1e-2-logits --out ${M}
          echo "BEGIN-CSV"; gzip -c ${M} | base64 -w 0; echo; echo "END-CSV"
        resources:
          requests: { memory: "4Gi", cpu: "4", ephemeral-storage: "5Gi" }
          limits:   { memory: "4Gi", cpu: "4", ephemeral-storage: "5Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
