apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_ft_jobs.py -- do not hand-edit. Regenerate.
  #
  # RETRIES (2026-10-01): pod failure policy -- evictions are not counted, exit 42
  # fails the Job at once. An interrupted cell resumes from its last completed epoch;
  # the job halts on two failed attempts of a cell or 3 attempts without progress.
  # See "retries that survive a flaky cluster" in scripts/build_ft_jobs.py.
  # v2 FINE-TUNING (bench), pretrained checkpoint rule best70: top and quark/gluon (with Herwig) at bench v2's
  # recipe; the full training set also scored at its last epoch.
  # This job: data set top only (V2_SPLIT_RUNS).
  # DO NOT APPLY before these v2 checkpoints exist.
  # inits: flavf1r-s2
  # 4 fine-tunes, ~3 GPU-h. Root /data/results/ft_v2/best70.
  name: ft-v2-bench-best70-flavf1r-s2-top-raunav
  namespace: cms-ml
spec:
  backoffLimit: 20
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Count
      onExitCodes: { containerName: main, operator: In, values: [43] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        env:
        - name: GPU_PRODUCT
          value: "Tesla-V100-SXM2-32GB"
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: REPO_REF
          value: "mtx-s1.98"
        args:
        - |
          set -euo pipefail
          # Clone the pinned TAG (not a branch): every job in this wave runs the
          # same code, and a job that queues for days cannot pick up a later
          # commit when it finally starts.
          git clone --depth 1 --branch "${REPO_REF}" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow || exit 1
          export PYTHONUNBUFFERED=1

          ROOT_OUT=/data/results/ft_v2/best70
          SHARD=ft-v2-bench-best70-flavf1r-s2-top-raunav
          NLOCKED=0
          mkdir -p ${ROOT_OUT}
          src_for () { case $1 in
            top) echo "/data/finetune/top";;
            qg)  echo "/data/finetune/qg_v2";;
            *) echo "FATAL: no source for $1" >&2; exit 1;; esac; }
          cfg_for () { case $1 in
            top) echo "configs/finetune/TopReference.yaml";;
            qg)  echo "configs/finetune/EnergyFlowQG.yaml";;
            *) echo "FATAL: no config for $1" >&2; exit 1;; esac; }
          sizes_for () { case $1 in
            top) echo "1000 10000 100000 1200000";;
            qg)  echo "1000 10000 100000 1600000";;
            *) echo "FATAL: no grid for $1" >&2; exit 1;; esac; }
          nmax_for () { case $1 in
            top) echo 1200000;; qg) echo 1600000;;
            *) echo "FATAL: no N_max for $1" >&2; exit 1;; esac; }
          test_for () { case $1 in
            top) echo "$(src_for top)/top_test.parquet";;
            qg)  echo "$(src_for qg)/qg_chunk18.parquet $(src_for qg)/qg_chunk19.parquet";;
            *) echo "FATAL: no test files for $1" >&2; exit 1;; esac; }
          # N <= 1e4 validates on 20k jets, as wave 2 does (item 36): a 200k
          # pass there is 20-200x the training set and was measured to hold the
          # GPU at 16-21%. Best-epoch selection on aggregate accuracy resolves
          # the observed ~0.01 epoch-to-epoch step at s.e. 0.003 with 20k jets.
          val_for () { if [ "$1" -le 10000 ]; then echo 20000; else echo 200000; fi; }
          # BENCH_SAMPLES_PER_EPOCH in scripts/build_ft_jobs.py; empty = N itself.
          samples_for () { case $1 in 1000) echo 10000;; *) echo $1;; esac; }
          HERWIG="/data/finetune/qg_herwig/qg_herwig_chunk0.parquet /data/finetune/qg_herwig/qg_herwig_chunk1.parquet"
          nrows () { python3 -c "import sys, pyarrow.parquet as pq; print(sum(pq.ParquetFile(f).metadata.num_rows for f in sys.argv[1:]))" "$@"; }

          for D in top qg; do
            S=$(src_for ${D}); O=${S}_sub
            [ -f ${O}/DONE ] || { echo "FATAL: ${O}/DONE absent -- run ft-subsets-bench first"; exit 1; }
            for f in $(test_for ${D}); do
              [ -f "${f}" ] || { echo "FATAL: ${D}: no test file ${f}"; exit 1; }
            done
            [ -f "$(cfg_for ${D})" ] || { echo "FATAL: ${D}: no $(cfg_for ${D})"; exit 1; }
          done
          for f in ${HERWIG}; do
            [ -f "${f}" ] || { echo "FATAL: no ${f} -- run ft-stage-qg-herwig-raunav first"; exit 1; }
          done
          # The test sets must be the PUBLISHED splits, or the rows do not drop
          # into the community table. Counted from parquet metadata, here, not
          # discovered by a failed smoke check after the fine-tune is paid for.
          NTEST_top=$(nrows $(test_for top)); NTEST_qg=$(nrows $(test_for qg)); NTEST_herwig=$(nrows ${HERWIG})
          echo "test jets: top ${NTEST_top}  qg ${NTEST_qg}  qg-herwig ${NTEST_herwig}"
          [ "${NTEST_top}" -eq 404000 ] && [ "${NTEST_qg}" -eq 200000 ] && [ "${NTEST_herwig}" -eq 200000 ] || {
            echo "FATAL: test sets are not the published 404000 / 200000 / 200000 jets"; exit 1; }
          ntest_for () { case $1 in top) echo ${NTEST_top};; qg) echo ${NTEST_qg};; esac; }
          # CLAUDE.md: check free space before a write of this size.
          FREE_G=$(df -BG --output=avail /data | tail -1 | tr -dc 0-9)
          echo "free on /data: ${FREE_G}G"
          [ "${FREE_G}" -ge 100 ] || { echo "FATAL: ${FREE_G}G free on /data, need 100G"; exit 1; }

          space_ok () { local p=$(df --output=pcent /data | tail -1 | tr -dc 0-9); local g=$(df -BG --output=avail /data | tail -1 | tr -dc 0-9); echo "/data ${p}% used, ${g}G free"; [ "$p" -lt 85 ] && [ "$g" -ge 50 ] || { echo "FATAL: /data at ${p}% used, ${g}G free: stop and ask the PI"; exit 1; }; }
          FAIL_MARK=${ROOT_OUT}/FAILED_BENCH.${SHARD}
          HALT=42   # the pod failure policy fails the Job at once on this code
          NODE_FAULT=43   # ...and counts this one against the retries
          [ -f ${FAIL_MARK} ] && { echo "FATAL: an earlier attempt halted the job: $(cat ${FAIL_MARK}). Fix the cause, then remove ${FAIL_MARK}; what it counted was renamed and is not counted again"; exit ${HALT}; }
          # Each cell is prepared by experiments/FT/cell_resume.py prepare: an
          # interrupted attempt (an evicted or lost pod is SIGKILLed and runs no trap)
          # is RESUMED from its last completed epoch; a FAILED one (ATTEMPT_FAILED,
          # from the trap below) is moved aside and the cell starts again, unless its
          # training had finished (TRAINED), when only the read-out is redone. The job
          # halts on two failed attempts of a cell, 4 node faults of a cell, or 3
          # consecutive attempts of a cell that complete no epoch.
          CELL=""
          NODE_FAULTS=${ROOT_OUT}/NODE_FAULTS.${SHARD}
          on_exit () {
            local rc=$?
            [ ${rc} -ne 0 ] && [ ${rc} -ne ${HALT} ] && [ ${rc} -ne ${NODE_FAULT} ] && [ -n "${CELL}" ] && [ -d "${CELL}" ] && [ ! -f "${CELL}/DONE" ] || return 0
            local why="rc=${rc} pod=${POD_NAME} node=${NODE_NAME} $(date -u +%FT%TZ)"
            # the node's fault, not the cell's: the GPU no longer answers, or the log
            # holds a CUDA device fault
            if ! python3 experiments/FT/gpu_probe.py || grep -qsE "CUDA error: unknown error|Cannot access accelerator device|GPU is lost|CUDA-capable device\(s\) is/are busy or unavailable|uncorrectable ECC error" "${CELL}/stdout.log" "${CELL}/predict.log"; then
              echo "${why}" > "$(mktemp "${CELL}/NODE_FAULT.XXXXXX")"
              echo "${why} ${CELL}" >> ${NODE_FAULTS}
              exit ${NODE_FAULT}
            fi
            echo "${why}" > "${CELL}/ATTEMPT_FAILED"
          }
          trap on_exit EXIT
          # A node whose GPU does not answer is refused before any cell is touched.
          python3 experiments/FT/gpu_probe.py || {
            echo "preflight pod=${POD_NAME} node=${NODE_NAME} $(date -u +%FT%TZ)" >> ${NODE_FAULTS}; exit ${NODE_FAULT}; }


          # EVERY SUBSET THIS JOB READS, against its sha256 record, before any GPU
          # work: the bytes the record holds, or the job stops (ft_v2.py verify).
          python3 experiments/FT/ft_v2.py verify --table experiments/FT/data/ft_v2_subsets_sha256.json \
            --files /data/finetune/qg_herwig/qg_herwig_chunk0.parquet /data/finetune/qg_herwig/qg_herwig_chunk1.parquet /data/finetune/top_sub/train_N1000_s1.parquet /data/finetune/top_sub/train_N10000_s1.parquet /data/finetune/top_sub/train_N100000_s1.parquet /data/finetune/top_sub/train_N1200000_s1.parquet /data/finetune/qg_v2_sub/train_N1000_s1.parquet /data/finetune/qg_v2_sub/train_N10000_s1.parquet /data/finetune/qg_v2_sub/train_N100000_s1.parquet /data/finetune/qg_v2_sub/train_N1600000_s1.parquet /data/finetune/top_sub/val.parquet /data/finetune/qg_v2_sub/val.parquet || exit ${HALT}

          # v2 PRETRAINED CHECKPOINTS, rule best70: ft_v2.py resolve links each run's
          # selected epoch to /workspace/ckpt/<init>.pt and records the choice in
          # <init>.pt.json, which every cell copies beside its result.
          python3 experiments/FT/ft_v2.py resolve --run-dir /data/results/mtx_v2/mtx-flavf1r-s2 --rule best70 --link /workspace/ckpt/flavf1r-s2.pt || exit ${HALT}

          INITS="flavf1r-s2:/workspace/ckpt/flavf1r-s2.pt:17:1"
          for spec in ${INITS}; do
            name=${spec%%:*}; rest=${spec#*:}; ckpt=${rest%%:*}; k=${rest#*:}
            [ "${name}" = "scratch" ] && continue
            [ -f "${ckpt}" ] || { echo "FATAL: ${name}: no ${ckpt}"; exit 1; }
          done

          # The benchmark recipe, set in ONE place. --lr-scheduler none is the
          # constant LR the published recipe specifies; weaver's default is
          # flat+decay, which would silently anneal and make the row not
          # comparable to the community table.
          BENCH="--use-amp --batch-size 512 --num-workers 2 --fetch-by-files --fetch-step 1             --optimizer ranger --lr-scheduler none --num-epochs 20             --optimizer-option weight_decay 0.01"
          # An ARRAY, not a string. The value carries parentheses and single
          # quotes; as a plain string it is re-split on expansion and the
          # parens reach the shell as syntax.
          HEAD_MULT=(--optimizer-option lr_mult "(r'mod\.fc\..*', 50)")

          # CELL ORDER: smoke cell, then every full-training-set cell, then the
          # rest. The two confirmatory benchmark predictions (C2 on quark/gluon
          # and C3 on top tagging, docs/PRESPEC_2026-09.md 3) are BOTH defined
          # on the full training set only. Walking sizes ascending inside a
          # dataset loop -- which is what the grid literally is -- puts them
          # last, and puts C2 behind the whole top-tagging block, so an
          # interrupted wave yields a pile of small-N cells and NEITHER
          # confirmatory result. The order below is the only thing that
          # changes: same cells, same recipe, same seeds, same sizes_for
          # string. The smoke cell stays first so the cheapest cell still
          # proves the pipeline before a ~3 h cell can fail late on a config
          # error (plan section 5: "One smallest-size cell per dataset is
          # smoke-tested first"). Re-walked cells are skipped by the DONE
          # check below, so the passes cannot duplicate work.
          SMOKE_NAME=$(set -- ${INITS}; echo ${1%%:*})
          for PASS in smoke nmax rest; do
          for D in top; do
            SUB=$(src_for ${D})_sub; CFG=$(cfg_for ${D}); TEST=$(test_for ${D})
            NMAX=$(nmax_for ${D})
            for spec in ${INITS}; do
              name=${spec%%:*}; rest=${spec#*:}; ckpt=${rest%%:*}
              seeds=${spec##*:}; seeds=${seeds//,/ }
              # Head re-initialisations: top only, N_max only, and only the inits
              # named here -- the benchmark's convention for the headline cell,
              # restricted to two inits x 5 (the approved design). A repeat runs
              # as seed S on the s1 subset; S=1 IS the ordinary seed-1 cell.
              REPS=""
              if [ "${D}" = "top" ]; then
                case " l162-s1b r16q1-s2 " in *" ${name} "*) REPS="";; esac
              fi
              for S in $(echo ${seeds} ${REPS} | tr ' ' '\n' | sort -nu); do
                for N in $(sizes_for ${D}); do
                case ${PASS} in
                  smoke) { [ "${N}" = "1000" ] && [ "${name}" = "${SMOKE_NAME}" ]; } || continue ;;
                  nmax)  [ "${N}" = "${NMAX}" ] || continue ;;
                  rest)  [ "${N}" = "${NMAX}" ] && continue ;;
                esac
                  # S is the TRAINING seed (head init, data order, dropout).
                  # DSEED indexes the data subset and is a different thing.
                  # Tying them together made "9 head re-initialisations" demand
                  # 9 training subsets, but make_subsets writes 3 -- so reps
                  # 4..9 read train_N..._s{4..9}.parquet, which do not exist,
                  # and weaver dies in a worker with a message naming no file.
                  # Holding the data fixed is also what the published
                  # convention MEANS (docs/PRD_PLAN.md 4.1): the spread is over
                  # re-initialisations, not over resampled training sets.
                  DSEED=${S}
                  case " ${seeds} " in
                    *" ${S} "*) ;;
                    *) [ "${N}" = "${NMAX}" ] || continue
                       DSEED=1;;
                  esac
                  OUT=${ROOT_OUT}/leg_${D}/${name}/N${N}/s${S}
                  [ -f ${OUT}/DONE ] && { echo "skip ${OUT} (DONE)"; continue; }
                  # ONE CELL, ONE POD. cell_resume.py lock claims the cell atomically (a
                  # directory holding the owner, renamed onto the lock). A lock of this shard,
                  # left by an evicted pod, is re-entered and its cell resumed below; a lock
                  # held by any other job is left alone and counted, and the job halts at the end.
                  HELD=$(python3 experiments/FT/cell_resume.py lock --path ${OUT}.lock --owner ${SHARD})
                  case "${HELD}" in
                    acquired) ;;
                    reentered) echo "re-entering ${OUT}.lock, left by an earlier pod of ${SHARD}";;
                    *) echo "LOCKED: ${OUT} is held by ${HELD}, this is ${SHARD}; leaving it"
                       NLOCKED=$((NLOCKED+1)); continue;;
                  esac
                  space_ok
                  E=$(python3 experiments/FT/cell_resume.py prepare --dir ${OUT} --max-failed 2 --max-node-faults 4 --max-stalled 3) || {
                    echo "${OUT}: ${E}" | tee ${FAIL_MARK}; exit ${HALT}; }
                  mkdir -p ${OUT}
                  CELL=${OUT}
                  cp /workspace/ckpt/${name}.pt.json ${OUT}/init_checkpoint.json
                  RESUME=(); [ "${E}" -lt 0 ] || RESUME=(--load-epoch ${E})
                  echo "$(date -u +%FT%TZ) pod=${POD_NAME} node=${NODE_NAME} from_epoch=${E}" >> ${OUT}/ATTEMPTS
                  if [ -n "${ckpt}" ]; then
                    LOAD=(--load-model-weights ${ckpt} --exclude-model-weights "mod\.fc\..*")
                    LR=1e-4; MULT=("${HEAD_MULT[@]}")
                  else
                    LOAD=(); LR=5e-4; MULT=()
                  fi
                  [ "${E}" -ge 0 ] || python3 experiments/FT/smoke_checks.py manifest --out ${OUT}/ft_manifest.json                     leg=${D} init=${name} checkpoint=${ckpt} n_train=${N} ft_seed=${S}                     lr=${LR} head_lr_mult=50 epochs=20 lr_schedule=constant                     weight_decay=0.01 subset=${SUB}/train_N${N}_s${DSEED}.parquet                     data_config=${CFG} num_classes=2 batch_size=512 samples_per_epoch=$(samples_for ${N}) steps_per_epoch=$(($(samples_for ${N})/512)) samples_per_epoch_val=$(val_for ${N}) steps_per_epoch_val=$(($(val_for ${N})/512)) val_rule=rotating-stream wave=v2 ckpt_rule=best70
                  python3 experiments/FT/ft_weaver.py --seed ${S} ${RESUME[@]+"${RESUME[@]}"} --lean-val-metrics                     --data-train ${SUB}/train_N${N}_s${DSEED}.parquet --data-val ${SUB}/val.parquet                     --data-config ${CFG}                     --network-config experiments/MTX/ParT_sophon_arch_mtx.py -o num_classes 2 -o fc_params '[(512,0.1)]'                     ${BENCH} ${MULT[@]+"${MULT[@]}"} --start-lr ${LR} --samples-per-epoch $(samples_for ${N}) --samples-per-epoch-val $(val_for ${N})                     ${LOAD[@]+"${LOAD[@]}"} --model-prefix ${OUT}/net --log ${OUT}/train.log 2>&1 | tee ${OUT}/stdout.log
                  # TRUE BOOKKEEPING (must-fix 14): weaver's own log must show the steps the
                  # manifest records.
                  grep -q "('steps_per_epoch', $(($(samples_for ${N})/512)))" ${OUT}/train.log || {
                    echo "FATAL: ${OUT}: weaver did not run $(($(samples_for ${N})/512)) steps per epoch"; exit 1; }
                  # A run whose loss went to NaN is not a result even if it finishes: weaver
                  # still keeps a best epoch. Fail the attempt; the cell starts again once.
                  if grep -q "AvgLoss: nan" ${OUT}/train.log 2>/dev/null; then
                    echo "FATAL: ${OUT} diverged (NaN training loss)"; exit 1; fi
                  # weaver restarts its best-validation tracking on --load-epoch: the best epoch
                  # of the whole run, from the exact metric ft_weaver.py logs, as weaver picks it.
                  python3 experiments/FT/cell_resume.py best --dir ${OUT} --epochs 20
                  [ -z "${ckpt}" ] || python3 experiments/FT/smoke_checks.py load-log --log ${OUT}/stdout.log
                  # The 50x must appear in weaver's own log, or the row is not
                  # the published recipe and nothing else would say so.
                  if [ -n "${ckpt}" ]; then
                    grep -q "Parameters with lr multiplied by 50" ${OUT}/stdout.log || {
                      echo "FATAL: weaver did not apply the head lr multiplier; the trunk/head"
                      echo "       ratio is not the published 1e-4/5e-3."; exit 1; }
                  fi
                  python3 experiments/EVAL/extract_features.py --checkpoint ${OUT}/net_best_epoch_state.pt                     --num-classes 2 --arm FT_${D}_${name}_N${N}_s${S}                     --data-config ${CFG} --data-test ${TEST} --observers jet_pt jet_energy                     --out ${OUT}/features --batch-size 512 --num-workers 1 --fetch-step 1 --save-logits
                  python3 experiments/FT/smoke_checks.py features --dir ${OUT}/features --n $(ntest_for ${D}) --k 2
                  # 128 floats per test jet that nothing reads (bench_metrics.py opens
                  # logits.npy, label188.npy and DONE): 207 MB per top cell, gone.
                  rm -f ${OUT}/features/features.npy
                  if [ "${D}" = "qg" ]; then
                    # GENERATOR SHIFT: the same model on Herwig 7.1 jets it never saw
                    # (Zenodo 3066475, staged by ft-stage-qg-herwig-raunav). Its own
                    # --out, because extract_features refuses to write a cache that
                    # holds another manifest; then the pair is moved beside the Pythia
                    # one under the names bench_metrics.py --herwig reads.
                    touch ${OUT}/TRAINED   # training passed its checks: a retry redoes only what follows
                  python3 experiments/EVAL/extract_features.py --checkpoint ${OUT}/net_best_epoch_state.pt --num-classes 2 --arm FT_${D}_${name}_N${N}_s${S}_herwig --data-config ${CFG} --data-test ${HERWIG} --observers jet_pt jet_energy --out ${OUT}/features_herwig --batch-size 512 --num-workers 1 --fetch-step 1 --save-logits
                    python3 experiments/FT/smoke_checks.py features --dir ${OUT}/features_herwig --n ${NTEST_herwig} --k 2
                    rm -f ${OUT}/features_herwig/features.npy
                    mv ${OUT}/features_herwig/logits.npy ${OUT}/features/logits_herwig.npy
                    mv ${OUT}/features_herwig/label188.npy ${OUT}/features/label_herwig.npy
                  fi
                  if [ "${N}" = "${NMAX}" ]; then
                    # PRESPEC 2.8's rule: the LAST epoch. Same extractor, same test set.
                    [ -f ${OUT}/net_epoch-19_state.pt ] || { echo "FATAL: no ${OUT}/net_epoch-19_state.pt; the last epoch is what PRESPEC 2.8 registers"; exit 1; }
                    python3 experiments/EVAL/extract_features.py --checkpoint ${OUT}/net_epoch-19_state.pt --num-classes 2 --arm FT_${D}_${name}_N${N}_s${S}_last --data-config ${CFG} --data-test ${TEST} --observers jet_pt jet_energy --out ${OUT}/features_last --batch-size 512 --num-workers 1 --fetch-step 1 --save-logits
                    python3 experiments/FT/smoke_checks.py features --dir ${OUT}/features_last --n $(ntest_for ${D}) --k 2
                    rm -f ${OUT}/features_last/features.npy
                    if [ "${D}" = "qg" ]; then
                      python3 experiments/EVAL/extract_features.py --checkpoint ${OUT}/net_epoch-19_state.pt --num-classes 2 --arm FT_${D}_${name}_N${N}_s${S}_last_herwig --data-config ${CFG} --data-test ${HERWIG} --observers jet_pt jet_energy --out ${OUT}/features_last_herwig --batch-size 512 --num-workers 1 --fetch-step 1 --save-logits
                      python3 experiments/FT/smoke_checks.py features --dir ${OUT}/features_last_herwig --n ${NTEST_herwig} --k 2
                      mv ${OUT}/features_last_herwig/logits.npy ${OUT}/features_last/logits_herwig.npy
                      mv ${OUT}/features_last_herwig/label188.npy ${OUT}/features_last/label_herwig.npy
                      rm -rf ${OUT}/features_last_herwig
                    fi
                    cp ${OUT}/net_epoch-19_state.pt ${OUT}/net_last_epoch_state.pt
                  fi
                  # Per-epoch checkpoints (state + optimizer, 20 x ~26 MB), read by
                  # nothing once the best-epoch copy exists -- wave 2's prune, item 36.
                  [ -f ${OUT}/net_best_epoch_state.pt ] || {
                    echo "FATAL: no net_best_epoch_state.pt in ${OUT};"
                    echo "       refusing to prune per-epoch checkpoints."; exit 1; }
                  rm -f ${OUT}/net_epoch-*_state.pt ${OUT}/net_epoch-*_optimizer.pt
                  [ -f ${OUT}/net_best_epoch_state.pt ] || {
                    echo "FATAL: the prune removed net_best_epoch_state.pt in ${OUT}."; exit 1; }
                  touch ${OUT}/DONE
                  rm -rf ${OUT}.lock
                  CELL=""
                done
              done
            done
          done
          done
          echo "FT V2 BENCH (best70) ${SHARD} COMPLETE (${NLOCKED} cells left to another job)"
          [ "${NLOCKED}" -eq 0 ] || { echo "FATAL: ${NLOCKED} cells are held by another job's lock"; exit ${HALT}; }
        resources:
          requests: { memory: "88Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "88Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: nvidia.com/gpu.product
                operator: In
                values: ["Tesla-V100-SXM2-32GB"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-01.sdsc.optiputer.net", "hcc-chase-shor-c4715.unl.edu", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-chase-ci-01.calit2.optiputer.net"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
