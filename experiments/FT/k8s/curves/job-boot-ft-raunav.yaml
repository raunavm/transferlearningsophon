apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_curve_jobs.py -- do not hand-edit. Regenerate.
  # Paired bootstrap over test jets, JetClass, top and q/g fine-tunes. CPU; waits in the pod for its inputs (30 min polls, 6 days, then exit 42).
  name: boot-ft-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # a signal (OOM, lost node) is retried; any other failure is deterministic
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; echo "HALT: exit $rc, not retried"; exit 42; }
          git clone --depth 1 --branch "mtx-s2.19" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow
          export PYTHONUNBUFFERED=1
          # BLAS threads = the CPUs requested: nproc reports the node's cores
          export OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}%"
          [ "${USED}" -lt 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          # every output new; then wait in the pod until every input exists
          for f in /data/results/bootstrap/ft; do
            [ ! -e "${f}" ] || { echo "FATAL: ${f} exists; use a new output"; exit 42; }
          done
          missing () { local n=0 f; for f in /data/results/ft_v2/best70/leg2/{l188-s1,l188-s2,l188-s3,l162-s1,l162-s2,l162-s3,r42q1-s1,r42q1-s2,r42q1-s3,r16q1-s1,r16q1-s2,r16q1-s3,l162mass-s1,l162mass-s2,r16q1mass-s1,r16q1mass-s2}/N{1000,10000,100000,1000000}/s1/DONE /data/results/ft_v2/ref_v100/jc1/leg2/scratch-v2/N{1000,10000,100000,1000000}/s{1,2,3}/DONE /data/results/ft_v2/best70/leg_top/{l188-s1,l188-s2,l188-s3,l162-s1,l162-s2,l162-s3,r42q1-s1,r42q1-s2,r42q1-s3,r16q1-s1,r16q1-s2,r16q1-s3,l162mass-s1,l162mass-s2,r16q1mass-s1,r16q1mass-s2}/N{1000,10000,100000,1200000}/s1/DONE /data/results/ft_v2/ref_v100/bench/leg_top/scratch-v2/N{1000,10000,100000,1200000}/s{1,2,3}/DONE /data/results/ft_v2/best70/leg_qg/{l188-s1,l188-s2,l188-s3,l162-s1,l162-s2,l162-s3,r42q1-s1,r42q1-s2,r42q1-s3,r16q1-s1,r16q1-s2,r16q1-s3,l162mass-s1,l162mass-s2,r16q1mass-s1,r16q1mass-s2}/N{1000,10000,100000,1600000}/s1/DONE /data/results/ft_v2/ref_v100/bench/leg_qg/scratch-v2/N{1000,10000,100000,1600000}/s{1,2,3}/DONE; do
            [ -e "${f}" ] || n=$((n+1)); done; echo ${n}; }
          T0=$(date +%s)
          while M=$(missing); [ "${M}" -gt 0 ]; do
            [ $(( $(date +%s) - T0 )) -lt 518400 ] || { echo "FATAL: ${M} inputs still missing after 6 days"; exit 42; }
            echo "$(date -u +%FT%TZ) waiting for ${M} inputs"; sleep 1800
          done
          TMP=/data/results/bootstrap/ft.staging.$(date -u +%s)
          mkdir -p ${TMP}
          PAIRS=(--pair l188-s1/scratch-v2-s1 --pair l188-s2/scratch-v2-s1 --pair l188-s3/scratch-v2-s1 --pair l162-s1/l188-s1 --pair l162-s1/scratch-v2-s1 --pair l162-s2/l188-s2 --pair l162-s2/scratch-v2-s1 --pair l162-s3/l188-s3 --pair l162-s3/scratch-v2-s1 --pair r42q1-s1/l188-s1 --pair r42q1-s1/scratch-v2-s1 --pair r42q1-s2/l188-s2 --pair r42q1-s2/scratch-v2-s1 --pair r42q1-s3/l188-s3 --pair r42q1-s3/scratch-v2-s1 --pair r16q1-s1/l188-s1 --pair r16q1-s1/scratch-v2-s1 --pair r16q1-s2/l188-s2 --pair r16q1-s2/scratch-v2-s1 --pair r16q1-s3/l188-s3 --pair r16q1-s3/scratch-v2-s1 --pair l162mass-s1/l188-s1 --pair l162mass-s1/l162-s1 --pair l162mass-s1/scratch-v2-s1 --pair l162mass-s2/l188-s2 --pair l162mass-s2/l162-s2 --pair l162mass-s2/scratch-v2-s1 --pair r16q1mass-s1/l188-s1 --pair r16q1mass-s1/r16q1-s1 --pair r16q1mass-s1/scratch-v2-s1 --pair r16q1mass-s2/l188-s2 --pair r16q1mass-s2/r16q1-s2 --pair r16q1mass-s2/scratch-v2-s1)
          RUNS="l188-s1 l188-s2 l188-s3 l162-s1 l162-s2 l162-s3 r42q1-s1 r42q1-s2 r42q1-s3 r16q1-s1 r16q1-s2 r16q1-s3 l162mass-s1 l162mass-s2 r16q1mass-s1 r16q1mass-s2"
          boot () {
            local args=() r s
            for r in ${RUNS}; do args+=(--model "${r}=$2/${r}/N$4/s1"); done
            for s in 1 2 3; do args+=(--model "scratch-v2-s${s}=$3/scratch-v2/N$4/s${s}"); done
            python3 experiments/STATS/paired_bootstrap.py --task $1 "${args[@]}" "${PAIRS[@]}" \
              --out ${TMP}/$1_N$4.json || halt
          }
          boot jc1 /data/results/ft_v2/best70/leg2 /data/results/ft_v2/ref_v100/jc1/leg2 1000
          boot jc1 /data/results/ft_v2/best70/leg2 /data/results/ft_v2/ref_v100/jc1/leg2 10000
          boot jc1 /data/results/ft_v2/best70/leg2 /data/results/ft_v2/ref_v100/jc1/leg2 100000
          boot jc1 /data/results/ft_v2/best70/leg2 /data/results/ft_v2/ref_v100/jc1/leg2 1000000
          boot top /data/results/ft_v2/best70/leg_top /data/results/ft_v2/ref_v100/bench/leg_top 1000
          boot top /data/results/ft_v2/best70/leg_top /data/results/ft_v2/ref_v100/bench/leg_top 10000
          boot top /data/results/ft_v2/best70/leg_top /data/results/ft_v2/ref_v100/bench/leg_top 100000
          boot top /data/results/ft_v2/best70/leg_top /data/results/ft_v2/ref_v100/bench/leg_top 1200000
          boot qg /data/results/ft_v2/best70/leg_qg /data/results/ft_v2/ref_v100/bench/leg_qg 1000
          boot qg /data/results/ft_v2/best70/leg_qg /data/results/ft_v2/ref_v100/bench/leg_qg 10000
          boot qg /data/results/ft_v2/best70/leg_qg /data/results/ft_v2/ref_v100/bench/leg_qg 100000
          boot qg /data/results/ft_v2/best70/leg_qg /data/results/ft_v2/ref_v100/bench/leg_qg 1600000
          boot qg_herwig /data/results/ft_v2/best70/leg_qg /data/results/ft_v2/ref_v100/bench/leg_qg 1000
          boot qg_herwig /data/results/ft_v2/best70/leg_qg /data/results/ft_v2/ref_v100/bench/leg_qg 10000
          boot qg_herwig /data/results/ft_v2/best70/leg_qg /data/results/ft_v2/ref_v100/bench/leg_qg 100000
          boot qg_herwig /data/results/ft_v2/best70/leg_qg /data/results/ft_v2/ref_v100/bench/leg_qg 1600000
          [ ! -e /data/results/bootstrap/ft ] || { echo "FATAL: /data/results/bootstrap/ft appeared while this ran"; exit 42; }
          mv ${TMP} /data/results/bootstrap/ft
          ls -la /data/results/bootstrap/ft
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
        resources:
          requests: { memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["patternlab.calit2.optiputer.net", "nautilus-ext-gpu01.fullerton.edu"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
