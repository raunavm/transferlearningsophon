apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_curve_jobs.py -- do not hand-edit. Regenerate.
  # ROC points and per-class tables, JetClass, top and q/g fine-tunes on the full training sets. CPU; waits in the pod for its inputs (30 min polls, 6 days, then exit 42).
  name: curves-full-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # a signal (OOM, lost node) is retried; any other failure is deterministic
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; echo "HALT: exit $rc, not retried"; exit 42; }
          git clone --depth 1 --branch "mtx-s2.28" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow
          export PYTHONUNBUFFERED=1
          # BLAS threads = the CPUs requested: nproc reports the node's cores
          export OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}%"
          [ "${USED}" -lt 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          # wait in the pod until every input exists
          missing () { local n=0 f; for f in /data/results/ft_v2/best70/leg2/{l188-s1,l188-s2,l188-s3,l162-s1,l162-s2,l162-s3,r42q1-s1,r42q1-s2,r42q1-s3,r16q1-s1,r16q1-s2,r16q1-s3,l162mass-s1,l162mass-s2,r16q1mass-s1,r16q1mass-s2,rand2p1-s1,rand2p2-s2,rand2p3-s1,rand2p4-s2,rand2p5-s2,flavf0-s1,flavf0-s2,flavf1-s1,flavf1-s2,flavf1r-s1,flavf1r-s2}/N1000000/s1/DONE /data/results/ft_v2/best70/leg_top/{l188-s1,l188-s2,l188-s3,l162-s1,l162-s2,l162-s3,r42q1-s1,r42q1-s2,r42q1-s3,r16q1-s1,r16q1-s2,r16q1-s3,l162mass-s1,l162mass-s2,r16q1mass-s1,r16q1mass-s2,rand2p1-s1,rand2p2-s2,rand2p3-s1,rand2p4-s2,rand2p5-s2,flavf0-s1,flavf0-s2,flavf1-s1,flavf1-s2,flavf1r-s1,flavf1r-s2}/N1200000/s1/DONE /data/results/ft_v2/best70/leg_qg/{l188-s1,l188-s2,l188-s3,l162-s1,l162-s2,l162-s3,r42q1-s1,r42q1-s2,r42q1-s3,r16q1-s1,r16q1-s2,r16q1-s3,l162mass-s1,l162mass-s2,r16q1mass-s1,r16q1mass-s2,rand2p1-s1,rand2p2-s2,rand2p3-s1,rand2p4-s2,rand2p5-s2,flavf0-s1,flavf0-s2,flavf1-s1,flavf1-s2,flavf1r-s1,flavf1r-s2}/N1600000/s1/DONE /data/results/ft_v2/ref_v100/jc1/leg2/scratch-v2/N1000000/s{1,2,3}/DONE /data/results/ft_v2/ref_v100/bench/leg_top/scratch-v2/N1200000/s{1,2,3}/DONE /data/results/ft_v2/ref_v100/bench/leg_qg/scratch-v2/N1600000/s{1,2,3}/DONE; do
            [ -e "${f}" ] || n=$((n+1)); done; echo ${n}; }
          T0=$(date +%s)
          while M=$(missing); [ "${M}" -gt 0 ]; do
            [ $(( $(date +%s) - T0 )) -lt 518400 ] || { echo "FATAL: ${M} inputs still missing after 6 days"; exit 42; }
            echo "$(date -u +%FT%TZ) waiting for ${M} inputs"; sleep 1800
          done
          if [ -e /data/results/ft_v2/curves/full_best70_leg2.json ]; then echo "skip full_best70_leg2.json: exists"; else
            python3 experiments/FT/ft_curves.py cells --tree /data/results/ft_v2/best70/leg2 --task jc1 --n 1000000 \
              --out /data/results/ft_v2/curves/full_best70_leg2.json || halt
          fi
          if [ -e /data/results/ft_v2/curves/full_best70_leg_top.json ]; then echo "skip full_best70_leg_top.json: exists"; else
            python3 experiments/FT/ft_curves.py cells --tree /data/results/ft_v2/best70/leg_top --task top --n 1200000 \
              --out /data/results/ft_v2/curves/full_best70_leg_top.json || halt
          fi
          if [ -e /data/results/ft_v2/curves/full_best70_leg_qg.json ]; then echo "skip full_best70_leg_qg.json: exists"; else
            python3 experiments/FT/ft_curves.py cells --tree /data/results/ft_v2/best70/leg_qg --task qg --n 1600000 \
              --out /data/results/ft_v2/curves/full_best70_leg_qg.json || halt
          fi
          if [ -e /data/results/ft_v2/curves/full_ref_v100_jc1_leg2.json ]; then echo "skip full_ref_v100_jc1_leg2.json: exists"; else
            python3 experiments/FT/ft_curves.py cells --tree /data/results/ft_v2/ref_v100/jc1/leg2 --task jc1 --n 1000000 \
              --out /data/results/ft_v2/curves/full_ref_v100_jc1_leg2.json || halt
          fi
          if [ -e /data/results/ft_v2/curves/full_ref_v100_bench_leg_top.json ]; then echo "skip full_ref_v100_bench_leg_top.json: exists"; else
            python3 experiments/FT/ft_curves.py cells --tree /data/results/ft_v2/ref_v100/bench/leg_top --task top --n 1200000 \
              --out /data/results/ft_v2/curves/full_ref_v100_bench_leg_top.json || halt
          fi
          if [ -e /data/results/ft_v2/curves/full_ref_v100_bench_leg_qg.json ]; then echo "skip full_ref_v100_bench_leg_qg.json: exists"; else
            python3 experiments/FT/ft_curves.py cells --tree /data/results/ft_v2/ref_v100/bench/leg_qg --task qg --n 1600000 \
              --out /data/results/ft_v2/curves/full_ref_v100_bench_leg_qg.json || halt
          fi
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
        resources:
          requests: { memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["patternlab.calit2.optiputer.net", "nautilus-ext-gpu01.fullerton.edu"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
