apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_curve_jobs.py -- do not hand-edit. Regenerate.
  # Per-class ROC curves with the 20-background-jet cut, the paper's ROC figures. CPU; waits in the pod for its inputs (30 min polls, 6 days, then exit 42).
  name: curves-roc-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # a signal (OOM, lost node) is retried; any other failure is deterministic
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; echo "HALT: exit $rc, not retried"; exit 42; }
          git clone --depth 1 --branch "mtx-s2.53" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow
          export PYTHONUNBUFFERED=1
          # BLAS threads = the CPUs requested: nproc reports the node's cores
          export OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}%"
          [ "${USED}" -lt 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          # wait in the pod until every input exists
          missing () { local n=0 f; for f in /data/results/ft_v2/best70/leg2/{l188-s1,l188-s2,l188-s3,l162-s1,l162-s2,l162-s3,r42q1-s1,r42q1-s2,r42q1-s3,r16q1-s1,r16q1-s2,r16q1-s3,l162mass-s1,l162mass-s2,r16q1mass-s1,r16q1mass-s2,rand2p1-s1,rand2p2-s2,rand2p3-s1,rand2p4-s2,rand2p5-s2,flavf0-s1,flavf0-s2,flavf1-s1,flavf1-s2,flavf1r-s1,flavf1r-s2}/N1000000/s1/DONE /data/results/ft_v2/best70/leg_top/{l188-s1,l188-s2,l188-s3,l162-s1,l162-s2,l162-s3,r42q1-s1,r42q1-s2,r42q1-s3,r16q1-s1,r16q1-s2,r16q1-s3,l162mass-s1,l162mass-s2,r16q1mass-s1,r16q1mass-s2,rand2p1-s1,rand2p2-s2,rand2p3-s1,rand2p4-s2,rand2p5-s2,flavf0-s1,flavf0-s2,flavf1-s1,flavf1-s2,flavf1r-s1,flavf1r-s2}/N1200000/s1/DONE /data/results/ft_v2/best70/leg_qg/{l188-s1,l188-s2,l188-s3,l162-s1,l162-s2,l162-s3,r42q1-s1,r42q1-s2,r42q1-s3,r16q1-s1,r16q1-s2,r16q1-s3,l162mass-s1,l162mass-s2,r16q1mass-s1,r16q1mass-s2,rand2p1-s1,rand2p2-s2,rand2p3-s1,rand2p4-s2,rand2p5-s2,flavf0-s1,flavf0-s2,flavf1-s1,flavf1-s2,flavf1r-s1,flavf1r-s2}/N1600000/s1/DONE /data/results/ft_v2/ref_v100/jc1/leg2/scratch-v2/N1000000/s{1,2,3}/DONE /data/results/ft_v2/ref_v100/bench/leg_top/scratch-v2/N1200000/s{1,2,3}/DONE /data/results/ft_v2/ref_v100/bench/leg_qg/scratch-v2/N1600000/s{1,2,3}/DONE /data/results/eval/v2_linprobe_bal/fits_v4/{mtx-l188-s1,mtx-l188-s2,mtx-l188-s3,mtx-l162-s1,mtx-l162-s2,mtx-l162-s3,mtx-r42q1-s1,mtx-r42q1-s2,mtx-r42q1-s3,mtx-r16q1-s1,mtx-r16q1-s2,mtx-r16q1-s3,mtx-l162mass-s1,mtx-l162mass-s2,mtx-r16q1mass-s1,mtx-r16q1mass-s2,mtx-rand2p1-s1,mtx-rand2p2-s2,mtx-rand2p3-s1,mtx-rand2p4-s2,mtx-rand2p5-s2,mtx-flavf0-s1,mtx-flavf0-s2,mtx-flavf1-s1,mtx-flavf1-s2,mtx-flavf1r-s1,mtx-flavf1r-s2,init-s1,init-s2,init-s3}.json /data/results/eval/v2_linprobe_bal/fits_v4_sib/{mtx-l188-s1,mtx-l188-s2,mtx-l188-s3,mtx-l162-s1,mtx-l162-s2,mtx-l162-s3,mtx-r42q1-s1,mtx-r42q1-s2,mtx-r42q1-s3,mtx-r16q1-s1,mtx-r16q1-s2,mtx-r16q1-s3,mtx-l162mass-s1,mtx-l162mass-s2,mtx-r16q1mass-s1,mtx-r16q1mass-s2,mtx-rand2p1-s1,mtx-rand2p2-s2,mtx-rand2p3-s1,mtx-rand2p4-s2,mtx-rand2p5-s2,mtx-flavf0-s1,mtx-flavf0-s2,mtx-flavf1-s1,mtx-flavf1-s2,mtx-flavf1r-s1,mtx-flavf1r-s2,init-s1,init-s2,init-s3}.json; do
            [ -e "${f}" ] || n=$((n+1)); done; echo ${n}; }
          T0=$(date +%s)
          while M=$(missing); [ "${M}" -gt 0 ]; do
            [ $(( $(date +%s) - T0 )) -lt 518400 ] || { echo "FATAL: ${M} inputs still missing after 6 days"; exit 42; }
            echo "$(date -u +%FT%TZ) waiting for ${M} inputs"; sleep 1800
          done
          export REPO_REF="mtx-s2.53"
          python3 experiments/FT/roc_points.py ft --family jc1_ft --tree /data/results/ft_v2/best70/leg2 --task jc1 --n 1000000 --inits l188-s1 l188-s2 l188-s3 l162-s1 l162-s2 l162-s3 r42q1-s1 r42q1-s2 r42q1-s3 r16q1-s1 r16q1-s2 r16q1-s3 l162mass-s1 l162mass-s2 r16q1mass-s1 r16q1mass-s2 rand2p1-s1 rand2p2-s2 rand2p3-s1 rand2p4-s2 rand2p5-s2 flavf0-s1 flavf0-s2 flavf1-s1 flavf1-s2 flavf1r-s1 flavf1r-s2 \
            --out-dir /data/results/ft_v2/curves_v2/jc1_ft || halt
          python3 experiments/FT/roc_points.py ft --family jc1_ft --tree /data/results/ft_v2/ref_v100/jc1/leg2 --task jc1 --n 1000000 --inits scratch-v2 \
            --out-dir /data/results/ft_v2/curves_v2/jc1_ft || halt
          [ -e /data/results/ft_v2/curves_v2/jc1_ft/DONE ] || echo "mtx-s2.53" > /data/results/ft_v2/curves_v2/jc1_ft/DONE
          python3 experiments/FT/roc_points.py probes --family jc1_probe --probs-root /data/results/eval/v2_linprobe_bal/fits_v4_probs --files jc1_N1000000 --models mtx-l188-s1 mtx-l188-s2 mtx-l188-s3 mtx-l162-s1 mtx-l162-s2 mtx-l162-s3 mtx-r42q1-s1 mtx-r42q1-s2 mtx-r42q1-s3 mtx-r16q1-s1 mtx-r16q1-s2 mtx-r16q1-s3 mtx-l162mass-s1 mtx-l162mass-s2 mtx-r16q1mass-s1 mtx-r16q1mass-s2 mtx-rand2p1-s1 mtx-rand2p2-s2 mtx-rand2p3-s1 mtx-rand2p4-s2 mtx-rand2p5-s2 mtx-flavf0-s1 mtx-flavf0-s2 mtx-flavf1-s1 mtx-flavf1-s2 mtx-flavf1r-s1 mtx-flavf1r-s2 init-s1 init-s2 init-s3 \
            --out-dir /data/results/ft_v2/curves_v2/jc1_probe || halt
          [ -e /data/results/ft_v2/curves_v2/jc1_probe/DONE ] || echo "mtx-s2.53" > /data/results/ft_v2/curves_v2/jc1_probe/DONE
          python3 experiments/FT/roc_points.py ft --family top_ft --tree /data/results/ft_v2/best70/leg_top --task top --n 1200000 --inits l188-s1 l188-s2 l188-s3 l162-s1 l162-s2 l162-s3 r42q1-s1 r42q1-s2 r42q1-s3 r16q1-s1 r16q1-s2 r16q1-s3 l162mass-s1 l162mass-s2 r16q1mass-s1 r16q1mass-s2 rand2p1-s1 rand2p2-s2 rand2p3-s1 rand2p4-s2 rand2p5-s2 flavf0-s1 flavf0-s2 flavf1-s1 flavf1-s2 flavf1r-s1 flavf1r-s2 \
            --out-dir /data/results/ft_v2/curves_v2/top_ft || halt
          python3 experiments/FT/roc_points.py ft --family top_ft --tree /data/results/ft_v2/ref_v100/bench/leg_top --task top --n 1200000 --inits scratch-v2 \
            --out-dir /data/results/ft_v2/curves_v2/top_ft || halt
          [ -e /data/results/ft_v2/curves_v2/top_ft/DONE ] || echo "mtx-s2.53" > /data/results/ft_v2/curves_v2/top_ft/DONE
          python3 experiments/FT/roc_points.py ft --family qg_ft --tree /data/results/ft_v2/best70/leg_qg --task qg --n 1600000 --inits l188-s1 l188-s2 l188-s3 l162-s1 l162-s2 l162-s3 r42q1-s1 r42q1-s2 r42q1-s3 r16q1-s1 r16q1-s2 r16q1-s3 l162mass-s1 l162mass-s2 r16q1mass-s1 r16q1mass-s2 rand2p1-s1 rand2p2-s2 rand2p3-s1 rand2p4-s2 rand2p5-s2 flavf0-s1 flavf0-s2 flavf1-s1 flavf1-s2 flavf1r-s1 flavf1r-s2 \
            --out-dir /data/results/ft_v2/curves_v2/qg_ft || halt
          python3 experiments/FT/roc_points.py ft --family qg_ft --tree /data/results/ft_v2/ref_v100/bench/leg_qg --task qg --n 1600000 --inits scratch-v2 \
            --out-dir /data/results/ft_v2/curves_v2/qg_ft || halt
          [ -e /data/results/ft_v2/curves_v2/qg_ft/DONE ] || echo "mtx-s2.53" > /data/results/ft_v2/curves_v2/qg_ft/DONE
          python3 experiments/FT/roc_points.py probes --family jc2_ovr --probs-root /data/results/eval/v2_linprobe_bal/fits_v4_probs --files jc2bal_N1000000 --models mtx-l188-s1 mtx-l188-s2 mtx-l188-s3 mtx-l162-s1 mtx-l162-s2 mtx-l162-s3 mtx-r42q1-s1 mtx-r42q1-s2 mtx-r42q1-s3 mtx-r16q1-s1 mtx-r16q1-s2 mtx-r16q1-s3 \
            --out-dir /data/results/ft_v2/curves_v2/jc2_ovr || halt
          [ -e /data/results/ft_v2/curves_v2/jc2_ovr/DONE ] || echo "mtx-s2.53" > /data/results/ft_v2/curves_v2/jc2_ovr/DONE
          python3 experiments/FT/roc_points.py probes --family pairs --probs-root /data/results/eval/v2_linprobe_bal/fits_v4_probs /data/results/eval/v2_linprobe_bal/fits_v4_sib_probs --fits-root /data/results/eval/v2_linprobe_bal/fits_v4 /data/results/eval/v2_linprobe_bal/fits_v4_sib --files jc2bal_pairs_bb_vs_cc jc2bal_pairs_bbqq_vs_ccqq jc2bal_pairs_bc_vs_bq_cs jc2bal_pairs_qcd_b_vs_light jc2bal_pairs_qcd_bb_vs_cc jc2bal_pairs_qcd_c_vs_light jc2bal_pairs_ee_vs_mm --models mtx-l188-s1 mtx-l188-s2 mtx-l188-s3 mtx-l162-s1 mtx-l162-s2 mtx-l162-s3 mtx-r42q1-s1 mtx-r42q1-s2 mtx-r42q1-s3 mtx-r16q1-s1 mtx-r16q1-s2 mtx-r16q1-s3 mtx-l162mass-s1 mtx-l162mass-s2 mtx-r16q1mass-s1 mtx-r16q1mass-s2 mtx-rand2p1-s1 mtx-rand2p2-s2 mtx-rand2p3-s1 mtx-rand2p4-s2 mtx-rand2p5-s2 mtx-flavf0-s1 mtx-flavf0-s2 mtx-flavf1-s1 mtx-flavf1-s2 mtx-flavf1r-s1 mtx-flavf1r-s2 \
            --out-dir /data/results/ft_v2/curves_v2/pairs || halt
          python3 experiments/FT/roc_points.py probes --family pairs --probs-root /data/results/eval/v2_linprobe_bal/fits_v4_sib_probs --fits-root /data/results/eval/v2_linprobe_bal/fits_v4_sib --files jc2bal_pairs_ee_vs_mm --models init-s1 init-s2 init-s3 \
            --out-dir /data/results/ft_v2/curves_v2/pairs || halt
          [ -e /data/results/ft_v2/curves_v2/pairs/DONE ] || echo "mtx-s2.53" > /data/results/ft_v2/curves_v2/pairs/DONE
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
        resources:
          requests: { memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-haosu-10.sdsc.optiputer.net", "ry-gpu-08.sdsc.optiputer.net"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
