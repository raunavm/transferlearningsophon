          echo done > /data/results/ft_v2/curves_v2/jc1_ft_long/DONE
          python3 experiments/FT/roc_points.py ft --family jc1_ft_ovr --tree /data/results/ft_v2/budget_long/leg2 --task jc1 --n 1000000 --inits flavf0-s1 flavf0-s2 flavf1-s1 flavf1-s2 flavf1r-s1 flavf1r-s2 l162-s1 l162-s2 l162-s3 l162mass-s1 l162mass-s2 l188-s1 l188-s2 l188-s3 r16q1-s1 r16q1-s2 r16q1-s3 r16q1mass-s1 r16q1mass-s2 r42q1-s1 r42q1-s2 r42q1-s3 rand2p1-s1 rand2p2-s2 rand2p3-s1 rand2p4-s2 rand2p5-s2 scratch --out-dir /data/results/ft_v2/curves_v2/jc1_ft_ovr_long
