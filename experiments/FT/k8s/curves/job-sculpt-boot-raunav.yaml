apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_gallery_data_job.py. CPU only; writes new files only.
  name: sculpt-boot-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 28800
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          for T in 1 2 3 4 5; do git clone -q --depth 1 --branch "mtx-s2.86" https://github.com/raunavm/transferlearningsophon.git /workspace/repo && break; sleep 30; done
          cd /workspace/repo
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          pip install --no-cache-dir -q pyarrow==25.0.1 scikit-learn
          export OMP_NUM_THREADS=8 OPENBLAS_NUM_THREADS=8 MKL_NUM_THREADS=8
          mkdir -p /data/results/eval/v2_head
          for f in /data/results/eval/v2_head/mtx-l188-s1/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-l188-s2/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-l188-s3/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-l162-s1/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-l162-s2/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-l162-s3/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-r42q1-s1/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-r42q1-s2/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-r42q1-s3/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-r16q1-s1/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-r16q1-s2/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-r16q1-s3/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-l162mass-s1/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-l162mass-s2/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-r16q1mass-s1/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-r16q1mass-s2/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-flavf0-s1/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-flavf0-s2/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-flavf1-s1/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-flavf1-s2/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-flavf1r-s1/test/best70/head_outputs.npz /data/results/eval/v2_head/mtx-flavf1r-s2/test/best70/head_outputs.npz /data/results/eval/v2_head/sculpting_v3/mtx-l188-s1_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-l188-s2_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-l188-s3_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-l162-s1_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-l162-s2_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-l162-s3_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-r42q1-s1_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-r42q1-s2_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-r42q1-s3_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-r16q1-s1_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-r16q1-s2_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-r16q1-s3_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-l162mass-s1_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-l162mass-s2_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-r16q1mass-s1_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-r16q1mass-s2_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-flavf0-s1_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-flavf0-s2_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-flavf1-s1_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-flavf1-s2_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-flavf1r-s1_sculpting.json /data/results/eval/v2_head/sculpting_v3/mtx-flavf1r-s2_sculpting.json; do [ -e "${f}" ] || { echo "FATAL: no ${f}"; exit 42; }; done
          python3 experiments/EVAL/sculpting_boot.py --head-root /data/results/eval/v2_head --models mtx-l188-s1 mtx-l188-s2 mtx-l188-s3 mtx-l162-s1 mtx-l162-s2 mtx-l162-s3 mtx-r42q1-s1 mtx-r42q1-s2 mtx-r42q1-s3 mtx-r16q1-s1 mtx-r16q1-s2 mtx-r16q1-s3 mtx-l162mass-s1 mtx-l162mass-s2 mtx-r16q1mass-s1 mtx-r16q1mass-s2 mtx-flavf0-s1 mtx-flavf0-s2 mtx-flavf1-s1 mtx-flavf1-s2 mtx-flavf1r-s1 mtx-flavf1r-s2 --label-set mtx-flavf0-s1=FLAV_F0 mtx-flavf0-s2=FLAV_F0 mtx-flavf1-s1=FLAV_F1 mtx-flavf1-s2=FLAV_F1 mtx-flavf1r-s1=FLAV_F1R mtx-flavf1r-s2=FLAV_F1R --replicas 200 --sculpting-dir /data/results/eval/v2_head/sculpting_v3 --out /data/results/eval/v2_head/sculpting_boot.json
          echo "GALLERY DATA COMPLETE"
        resources:
          requests: { memory: "32Gi", cpu: "8", ephemeral-storage: "5Gi" }
          limits:   { memory: "32Gi", cpu: "8", ephemeral-storage: "5Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
