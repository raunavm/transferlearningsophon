apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_gallery_data_job.py. CPU only; writes new files only.
  name: gallery-data-long-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 28800
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          for T in 1 2 3 4 5; do git clone -q --depth 1 --branch "mtx-s2.71" https://github.com/raunavm/transferlearningsophon.git /workspace/repo && break; sleep 30; done
          cd /workspace/repo
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          pip install --no-cache-dir -q pyarrow==25.0.1 scikit-learn
          export OMP_NUM_THREADS=8 OPENBLAS_NUM_THREADS=8 MKL_NUM_THREADS=8
          mkdir -p /data/results/ft_v2/curves_v2/jc2_ft_ovr_long
          python3 experiments/FT/roc_points.py ft --family jc2_ft_ovr --tree /data/results/ft_v2/budget_long/leg_jc2b --task jc2b --n 1000000 --inits flavf0-s1 flavf0-s2 flavf1-s1 flavf1-s2 flavf1r-s1 flavf1r-s2 r16q1-s1 rand2p1-s1 rand2p2-s2 rand2p3-s1 rand2p4-s2 rand2p5-s2 scratch --out-dir /data/results/ft_v2/curves_v2/jc2_ft_ovr_long
          echo done > /data/results/ft_v2/curves_v2/jc2_ft_ovr_long/DONE
          echo "GALLERY DATA COMPLETE"
        resources:
          requests: { memory: "32Gi", cpu: "8", ephemeral-storage: "5Gi" }
          limits:   { memory: "32Gi", cpu: "8", ephemeral-storage: "5Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
