apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_gallery_data_job.py. CPU only; writes new files only.
  name: jc1-acc-boot-1e4-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 28800
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          for T in 1 2 3 4 5; do git clone -q --depth 1 --branch "mtx-s2.94" https://github.com/raunavm/transferlearningsophon.git /workspace/repo && break; sleep 30; done
          cd /workspace/repo
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 90 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          pip install --no-cache-dir -q pyarrow==25.0.1 scikit-learn
          export OMP_NUM_THREADS=8 OPENBLAS_NUM_THREADS=8 MKL_NUM_THREADS=8
          mkdir -p /data/results/ft_v2/jc1_acc_boot
          python3 experiments/FT/jc1_acc_boot.py --root /data/results/ft_v2/budget --n 10000 --metrics /data/results/ft_v2/budget/budget_metrics.json --replicas 200 --out /data/results/ft_v2/jc1_acc_boot/jc1_acc_boot_N10000.json.new
          mv -n /data/results/ft_v2/jc1_acc_boot/jc1_acc_boot_N10000.json.new /data/results/ft_v2/jc1_acc_boot/jc1_acc_boot_N10000.json
          echo "GALLERY DATA COMPLETE"
        resources:
          requests: { memory: "32Gi", cpu: "8", ephemeral-storage: "5Gi" }
          limits:   { memory: "32Gi", cpu: "8", ephemeral-storage: "5Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
