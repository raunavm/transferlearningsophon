apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_gallery_data_job.py. CPU only; writes new files only.
  name: gallery-data-scratch-full-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 28800
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          for T in 1 2 3 4 5; do git clone -q --depth 1 --branch "mtx-s2.85" https://github.com/raunavm/transferlearningsophon.git /workspace/repo && break; sleep 30; done
          cd /workspace/repo
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          pip install --no-cache-dir -q pyarrow==25.0.1 scikit-learn
          export OMP_NUM_THREADS=8 OPENBLAS_NUM_THREADS=8 MKL_NUM_THREADS=8
          mkdir -p /data/results/ft_v2/curves_v2/jc2_ft_ovr_fulldecay /data/results/ft_v2/curves_v2/jc1_ft_fulldecay /data/results/ft_v2/curves_v2/jc1_ft_ovr_fulldecay
          for c in /data/results/ft_v2/budget_long_fulldecay/leg_jc2b/scratch/N1000000/s1 /data/results/ft_v2/budget_long_fulldecay/leg_jc2b/scratch/N1000000/s2 /data/results/ft_v2/budget_long_fulldecay/leg_jc2b/scratch/N1000000/s3 /data/results/ft_v2/budget_long_fulldecay/leg2/scratch/N1000000/s1 /data/results/ft_v2/budget_long_fulldecay/leg2/scratch/N1000000/s2 /data/results/ft_v2/budget_long_fulldecay/leg2/scratch/N1000000/s3; do [ -e "${c}/DONE" ] || { echo "FATAL: ${c} not DONE"; exit 42; }; done
          python3 experiments/FT/roc_points.py ft --family jc2_ft_ovr --tree /data/results/ft_v2/budget_long_fulldecay/leg_jc2b --task jc2b --n 1000000 --inits scratch --out-dir /data/results/ft_v2/curves_v2/jc2_ft_ovr_fulldecay
          echo done > /data/results/ft_v2/curves_v2/jc2_ft_ovr_fulldecay/DONE
          python3 experiments/FT/roc_points.py ft --family jc1_ft --tree /data/results/ft_v2/budget_long_fulldecay/leg2 --task jc1 --n 1000000 --inits scratch --out-dir /data/results/ft_v2/curves_v2/jc1_ft_fulldecay
          echo done > /data/results/ft_v2/curves_v2/jc1_ft_fulldecay/DONE
          python3 experiments/FT/roc_points.py ft --family jc1_ft_ovr --tree /data/results/ft_v2/budget_long_fulldecay/leg2 --task jc1 --n 1000000 --inits scratch --out-dir /data/results/ft_v2/curves_v2/jc1_ft_ovr_fulldecay
          echo done > /data/results/ft_v2/curves_v2/jc1_ft_ovr_fulldecay/DONE
          [ -e /data/results/ft_v2/curves/full_budget_long_fulldecay_leg2.json ] || python3 experiments/FT/ft_curves.py cells --tree /data/results/ft_v2/budget_long_fulldecay/leg2 --task jc1 --n 1000000 --out /data/results/ft_v2/curves/full_budget_long_fulldecay_leg2.json
          echo "GALLERY DATA COMPLETE"
        resources:
          requests: { memory: "32Gi", cpu: "8", ephemeral-storage: "5Gi" }
          limits:   { memory: "32Gi", cpu: "8", ephemeral-storage: "5Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
