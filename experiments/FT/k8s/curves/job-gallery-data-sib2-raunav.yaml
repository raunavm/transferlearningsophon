apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_gallery_data_job.py. CPU only; writes new files only.
  name: gallery-data-sib2-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 28800
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          for T in 1 2 3 4 5; do git clone -q --depth 1 --branch "mtx-s2.68" https://github.com/raunavm/transferlearningsophon.git /workspace/repo && break; sleep 30; done
          cd /workspace/repo
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          pip install --no-cache-dir -q pyarrow==25.0.1 scikit-learn
          export OMP_NUM_THREADS=8 OPENBLAS_NUM_THREADS=8 MKL_NUM_THREADS=8
          mkdir -p /data/results/ft_v2/curves_v2/pairs_sib2
          python3 experiments/FT/roc_points.py probes --family pairs --probs-root /data/results/eval/v2_linprobe_bal/fits_v4_sib2_probs --fits-root /data/results/eval/v2_linprobe_bal/fits_v4_sib2 --files jc2bal_pairs_ee_vs_mm --models mtx-l188-s1 mtx-l188-s2 mtx-l188-s3 mtx-l162-s1 mtx-l162-s2 mtx-l162-s3 mtx-r42q1-s1 mtx-r42q1-s2 mtx-r42q1-s3 mtx-r16q1-s1 mtx-r16q1-s2 mtx-r16q1-s3 mtx-l162mass-s1 mtx-l162mass-s2 mtx-r16q1mass-s1 mtx-r16q1mass-s2 mtx-rand2p1-s1 mtx-rand2p2-s2 mtx-rand2p3-s1 mtx-rand2p4-s2 mtx-rand2p5-s2 mtx-flavf0-s1 mtx-flavf0-s2 mtx-flavf1-s1 mtx-flavf1-s2 mtx-flavf1r-s1 mtx-flavf1r-s2 init-s1 init-s2 init-s3 --out-dir /data/results/ft_v2/curves_v2/pairs_sib2
          echo done > /data/results/ft_v2/curves_v2/pairs_sib2/DONE
          echo "GALLERY DATA COMPLETE"
        resources:
          requests: { memory: "32Gi", cpu: "8", ephemeral-storage: "5Gi" }
          limits:   { memory: "32Gi", cpu: "8", ephemeral-storage: "5Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
