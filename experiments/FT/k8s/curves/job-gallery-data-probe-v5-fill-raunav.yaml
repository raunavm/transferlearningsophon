apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_gallery_data_job.py. CPU only; writes new files only.
  name: gallery-data-probe-v5-fill-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 28800
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          for T in 1 2 3 4 5; do git clone -q --depth 1 --branch "mtx-s3.14" https://github.com/raunavm/transferlearningsophon.git /workspace/repo && break; sleep 30; done
          cd /workspace/repo
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 90 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          pip install --no-cache-dir -q pyarrow==25.0.1 scikit-learn
          export OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          mkdir -p /data/results/ft_v2/curves_v2/top_probe_v5 /data/results/ft_v2/curves_v2/qg_probe_v5
          for f in /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-l188-s1.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-l188-s2.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-l188-s3.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-l162-s1.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-l162-s2.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-l162-s3.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-r42q1-s1.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-r42q1-s2.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-r42q1-s3.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-r16q1-s1.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-r16q1-s2.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-r16q1-s3.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-l162mass-s1.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-l162mass-s2.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-r16q1mass-s1.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-r16q1mass-s2.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-rand2p1-s1.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-rand2p2-s2.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-rand2p3-s1.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-rand2p4-s2.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-rand2p5-s2.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-flavf0-s1.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-flavf0-s2.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-flavf1-s1.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-flavf1-s2.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-flavf1r-s1.json /data/results/eval/v2_linprobe_bal/fits_v5_fill/mtx-flavf1r-s2.json /data/results/eval/v2_linprobe_bal/fits_v5/mtx-l188kin-s1.json; do [ -e "${f}" ] || { echo "FATAL: no ${f}"; exit 42; }; done
          python3 experiments/EVAL/refit_checks.py --family /data/results/eval/v2_linprobe_bal/fits_v5_fill --expect mtx-l188-s1 mtx-l188-s2 mtx-l188-s3 mtx-l162-s1 mtx-l162-s2 mtx-l162-s3 mtx-r42q1-s1 mtx-r42q1-s2 mtx-r42q1-s3 mtx-r16q1-s1 mtx-r16q1-s2 mtx-r16q1-s3 mtx-l162mass-s1 mtx-l162mass-s2 mtx-r16q1mass-s1 mtx-r16q1mass-s2 mtx-rand2p1-s1 mtx-rand2p2-s2 mtx-rand2p3-s1 mtx-rand2p4-s2 mtx-rand2p5-s2 mtx-flavf0-s1 mtx-flavf0-s2 mtx-flavf1-s1 mtx-flavf1-s2 mtx-flavf1r-s1 mtx-flavf1r-s2 || { echo "FATAL: the v5 fits fail the refit rules"; exit 42; }
          python3 experiments/EVAL/refit_checks.py --family /data/results/eval/v2_linprobe_bal/fits_v5 --expect mtx-l188kin-s1 || { echo "FATAL: the v5 fits fail the refit rules"; exit 42; }
          python3 experiments/FT/roc_points.py probes --family top_probe --probs-root /data/results/eval/v2_linprobe_bal/fits_v5_fill_probs --ckpt best70.itop4 --files top_N1200000 --models mtx-l188-s1 mtx-l188-s2 mtx-l188-s3 mtx-l162-s1 mtx-l162-s2 mtx-l162-s3 mtx-r42q1-s1 mtx-r42q1-s2 mtx-r42q1-s3 mtx-r16q1-s1 mtx-r16q1-s2 mtx-r16q1-s3 mtx-l162mass-s1 mtx-l162mass-s2 mtx-r16q1mass-s1 mtx-r16q1mass-s2 mtx-rand2p1-s1 mtx-rand2p2-s2 mtx-rand2p3-s1 mtx-rand2p4-s2 mtx-rand2p5-s2 mtx-flavf0-s1 mtx-flavf0-s2 mtx-flavf1-s1 mtx-flavf1-s2 mtx-flavf1r-s1 mtx-flavf1r-s2 --out-dir /data/results/ft_v2/curves_v2/top_probe_v5
          python3 experiments/FT/roc_points.py probes --family top_probe --probs-root /data/results/eval/v2_linprobe_bal/fits_v5_probs --ckpt best70 --files top_N1200000 --models mtx-l188kin-s1 --out-dir /data/results/ft_v2/curves_v2/top_probe_v5
          python3 experiments/FT/roc_points.py probes --family qg_probe --probs-root /data/results/eval/v2_linprobe_bal/fits_v5_fill_probs --ckpt best70.nqg --files qg_N1600000 qg_herwig_N1600000 --models mtx-l188-s1 mtx-l188-s2 mtx-l188-s3 mtx-l162-s1 mtx-l162-s2 mtx-l162-s3 mtx-r42q1-s1 mtx-r42q1-s2 mtx-r42q1-s3 mtx-r16q1-s1 mtx-r16q1-s2 mtx-r16q1-s3 mtx-l162mass-s1 mtx-l162mass-s2 mtx-r16q1mass-s1 mtx-r16q1mass-s2 mtx-rand2p1-s1 mtx-rand2p2-s2 mtx-rand2p3-s1 mtx-rand2p4-s2 mtx-rand2p5-s2 mtx-flavf0-s1 mtx-flavf0-s2 mtx-flavf1-s1 mtx-flavf1-s2 mtx-flavf1r-s1 mtx-flavf1r-s2 --out-dir /data/results/ft_v2/curves_v2/qg_probe_v5
          echo done > /data/results/ft_v2/curves_v2/top_probe_v5/DONE
          echo done > /data/results/ft_v2/curves_v2/qg_probe_v5/DONE
          echo "GALLERY DATA COMPLETE"
        resources:
          requests: { memory: "16Gi", cpu: "4", ephemeral-storage: "5Gi" }
          limits:   { memory: "16Gi", cpu: "4", ephemeral-storage: "5Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
