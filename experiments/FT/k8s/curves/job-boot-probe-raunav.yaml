apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_curve_jobs.py -- do not hand-edit. Regenerate.
  # Paired bootstrap over test jets, the linear probes (fits_v3). CPU; waits in the pod for its inputs (30 min polls, 6 days, then exit 42).
  name: boot-probe-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # a signal (OOM, lost node) is retried; any other failure is deterministic
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; echo "HALT: exit $rc, not retried"; exit 42; }
          git clone --depth 1 --branch "mtx-s2.20" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow
          export PYTHONUNBUFFERED=1
          # BLAS threads = the CPUs requested: nproc reports the node's cores
          export OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}%"
          [ "${USED}" -lt 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          # every output new; then wait in the pod until every input exists
          for f in /data/results/bootstrap/probe; do
            [ ! -e "${f}" ] || { echo "FATAL: ${f} exists; use a new output"; exit 42; }
          done
          missing () { local n=0 f; for f in /data/results/eval/v2_linprobe/fits_v3/{mtx-l188-s1,mtx-l188-s2,mtx-l188-s3,mtx-l162-s1,mtx-l162-s2,mtx-l162-s3,mtx-r42q1-s1,mtx-r42q1-s2,mtx-r42q1-s3,mtx-r16q1-s1,mtx-r16q1-s2,mtx-r16q1-s3,mtx-l162mass-s1,mtx-l162mass-s2,mtx-r16q1mass-s1,mtx-r16q1mass-s2,mtx-rand2p1-s1,mtx-rand2p2-s2,mtx-rand2p3-s1,mtx-rand2p4-s2,mtx-rand2p5-s2,mtx-flavf0-s1,mtx-flavf0-s2,mtx-flavf1-s1,mtx-flavf1-s2,mtx-flavf1r-s1,mtx-flavf1r-s2,init-s1,init-s2,init-s3}.json; do
            [ -e "${f}" ] || n=$((n+1)); done; echo ${n}; }
          T0=$(date +%s)
          while M=$(missing); [ "${M}" -gt 0 ]; do
            [ $(( $(date +%s) - T0 )) -lt 518400 ] || { echo "FATAL: ${M} inputs still missing after 6 days"; exit 42; }
            echo "$(date -u +%FT%TZ) waiting for ${M} inputs"; sleep 1800
          done
          TMP=/data/results/bootstrap/probe.staging.$(date -u +%s)
          mkdir -p ${TMP}
          PAIRS=(--pair mtx-l188-s1/init-s1 --pair mtx-l188-s2/init-s2 --pair mtx-l188-s3/init-s3 --pair mtx-l162-s1/mtx-l188-s1 --pair mtx-l162-s1/init-s1 --pair mtx-l162-s2/mtx-l188-s2 --pair mtx-l162-s2/init-s2 --pair mtx-l162-s3/mtx-l188-s3 --pair mtx-l162-s3/init-s3 --pair mtx-r42q1-s1/mtx-l188-s1 --pair mtx-r42q1-s1/init-s1 --pair mtx-r42q1-s2/mtx-l188-s2 --pair mtx-r42q1-s2/init-s2 --pair mtx-r42q1-s3/mtx-l188-s3 --pair mtx-r42q1-s3/init-s3 --pair mtx-r16q1-s1/mtx-l188-s1 --pair mtx-r16q1-s1/init-s1 --pair mtx-r16q1-s2/mtx-l188-s2 --pair mtx-r16q1-s2/init-s2 --pair mtx-r16q1-s3/mtx-l188-s3 --pair mtx-r16q1-s3/init-s3 --pair mtx-l162mass-s1/mtx-l188-s1 --pair mtx-l162mass-s1/mtx-l162-s1 --pair mtx-l162mass-s1/init-s1 --pair mtx-l162mass-s2/mtx-l188-s2 --pair mtx-l162mass-s2/mtx-l162-s2 --pair mtx-l162mass-s2/init-s2 --pair mtx-r16q1mass-s1/mtx-l188-s1 --pair mtx-r16q1mass-s1/mtx-r16q1-s1 --pair mtx-r16q1mass-s1/init-s1 --pair mtx-r16q1mass-s2/mtx-l188-s2 --pair mtx-r16q1mass-s2/mtx-r16q1-s2 --pair mtx-r16q1mass-s2/init-s2 --pair mtx-rand2p1-s1/mtx-l188-s1 --pair mtx-rand2p1-s1/init-s1 --pair mtx-rand2p2-s2/mtx-l188-s2 --pair mtx-rand2p2-s2/init-s2 --pair mtx-rand2p3-s1/mtx-l188-s1 --pair mtx-rand2p3-s1/init-s1 --pair mtx-rand2p4-s2/mtx-l188-s2 --pair mtx-rand2p4-s2/init-s2 --pair mtx-rand2p5-s2/mtx-l188-s2 --pair mtx-rand2p5-s2/init-s2 --pair mtx-flavf0-s1/mtx-l188-s1 --pair mtx-flavf0-s1/mtx-r16q1-s1 --pair mtx-flavf0-s1/init-s1 --pair mtx-flavf0-s2/mtx-l188-s2 --pair mtx-flavf0-s2/mtx-r16q1-s2 --pair mtx-flavf0-s2/init-s2 --pair mtx-flavf1-s1/mtx-l188-s1 --pair mtx-flavf1-s1/mtx-flavf0-s1 --pair mtx-flavf1-s1/init-s1 --pair mtx-flavf1-s2/mtx-l188-s2 --pair mtx-flavf1-s2/mtx-flavf0-s2 --pair mtx-flavf1-s2/init-s2 --pair mtx-flavf1r-s1/mtx-l188-s1 --pair mtx-flavf1r-s1/mtx-flavf1-s1 --pair mtx-flavf1r-s1/mtx-flavf0-s1 --pair mtx-flavf1r-s1/init-s1 --pair mtx-flavf1r-s2/mtx-l188-s2 --pair mtx-flavf1r-s2/mtx-flavf1-s2 --pair mtx-flavf1r-s2/mtx-flavf0-s2 --pair mtx-flavf1r-s2/init-s2)
          MODELS="mtx-l188-s1:best70 mtx-l188-s2:best70 mtx-l188-s3:best70 mtx-l162-s1:best70 mtx-l162-s2:best70 mtx-l162-s3:best70 mtx-r42q1-s1:best70 mtx-r42q1-s2:best70 mtx-r42q1-s3:best70 mtx-r16q1-s1:best70 mtx-r16q1-s2:best70 mtx-r16q1-s3:best70 mtx-l162mass-s1:best70 mtx-l162mass-s2:best70 mtx-r16q1mass-s1:best70 mtx-r16q1mass-s2:best70 mtx-rand2p1-s1:best70 mtx-rand2p2-s2:best70 mtx-rand2p3-s1:best70 mtx-rand2p4-s2:best70 mtx-rand2p5-s2:best70 mtx-flavf0-s1:best70 mtx-flavf0-s2:best70 mtx-flavf1-s1:best70 mtx-flavf1-s2:best70 mtx-flavf1r-s1:best70 mtx-flavf1r-s2:best70 init-s1:init init-s2:init init-s3:init"
          boot () {
            local args=() m
            for m in ${MODELS}; do args+=(--model "${m%%:*}=/data/results/eval/v2_linprobe/fits_v3_probs/${m%%:*}/${m##*:}/$1_N$2.npz"); done
            python3 experiments/STATS/paired_bootstrap.py --task npz "${args[@]}" "${PAIRS[@]}" \
              --out ${TMP}/$1_N$2.json || halt
          }
          boot top 1000
          boot top 10000
          boot top 100000
          boot top 1200000
          boot qg 1000
          boot qg 10000
          boot qg 100000
          boot qg 1600000
          boot qg_herwig 1000
          boot qg_herwig 10000
          boot qg_herwig 100000
          boot qg_herwig 1600000
          boot jc1 1000000
          boot jc2_188 1000000
          boot jc2_188_pairs_bc_vs_bq_cs 1000000
          boot jc2_188_pairs_bb_vs_cc 1000000
          boot jc2_188_pairs_bbqq_vs_ccqq 1000000
          boot jc2_188_pairs_qcd_bb_vs_cc 1000000
          boot jc2_188_pairs_qcd_b_vs_light 1000000
          boot jc2_188_pairs_qcd_c_vs_light 1000000
          [ ! -e /data/results/bootstrap/probe ] || { echo "FATAL: /data/results/bootstrap/probe appeared while this ran"; exit 42; }
          mv ${TMP} /data/results/bootstrap/probe
          ls -la /data/results/bootstrap/probe
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
        resources:
          requests: { memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "16Gi", cpu: "4", ephemeral-storage: "20Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["patternlab.calit2.optiputer.net", "nautilus-ext-gpu01.fullerton.edu"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
