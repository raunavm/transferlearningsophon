_data/Res34P_1256.parquet /jc2/jet_data/Res34P_1257.parquet /jc2/jet_data/Res34P_1258.parquet /jc2/jet_data/Res34P_1259.parquet /jc2/jet_data/Res34P_1260.parquet /jc2/jet_data/Res34P_1261.parquet /jc2/jet_data/Res34P_1262.parquet /jc2/jet_data/Res34P_1263.parquet /jc2/jet_data/Res34P_1264.parquet /jc2/jet_data/Res34P_1265.parquet /jc2/jet_data/Res34P_1266.parquet /jc2/jet_data/Res34P_1267.parquet /jc2/jet_data/Res34P_1268.parquet /jc2/jet_data/Res34P_1269.parquet /jc2/jet_data/Res34P_1270.parquet /jc2/jet_data/Res34P_1271.parquet /jc2/jet_data/Res34P_1272.parquet /jc2/jet_data/Res34P_1273.parquet /jc2/jet_data/Res34P_1274.parquet /jc2/jet_data/Res34P_1275.parquet /jc2/jet_data/Res34P_1276.parquet /jc2/jet_data/Res34P_1277.parquet /jc2/jet_data/Res34P_1278.parquet /jc2/jet_data/Res34P_1279.parquet /jc2/jet_data/Res34P_1280.parquet /jc2/jet_data/Res34P_1281.parquet /jc2/jet_data/Res34P_1282.parquet /jc2/jet_data/Res34P_1283.parquet /jc2/jet_data/Res34P_1284.parquet /jc2/jet_data/Res34P_1285.parquet /jc2/jet_data/Res34P_1286.parquet /jc2/jet_data/Res34P_1287.parquet /jc2/jet_data/Res34P_1288.parquet /jc2/jet_data/Res34P_1289.parquet"
          for spec in ${INITS}; do
            name=${spec%%:*}; rest=${spec#*:}; ckpt=${rest%%:*}; seeds=${spec##*:}
            for S in ${seeds//,/ }; do
              for N in 1000 10000 100000 1000000; do
                OUT=${ROOT_OUT}/leg1/${name}/N${N}/s${S}
                [ -f ${OUT}/DONE ] && { echo "skip ${OUT} (DONE)"; continue; }
                # ONE CELL, ONE POD. cell_resume.py lock claims the cell atomically (a
                # directory holding the owner, renamed onto the lock). A lock of this shard,
                # left by an evicted pod, is re-entered and its cell resumed below; a lock
                # held by any other job is left alone and counted, and the job halts at the end.
                HELD=$(python3 experiments/FT/cell_resume.py lock --path ${OUT}.lock --owner ${SHARD})
                case "${HELD}" in
                  acquired) ;;
                  reentered) echo "re-entering ${OUT}.lock, left by an earlier pod of ${SHARD}";;
                  *) echo "LOCKED: ${OUT} is held by ${HELD}, this is ${SHARD}; leaving it"
                     NLOCKED=$((NLOCKED+1)); continue;;
                esac
                space_ok
                E=$(python3 experiments/FT/cell_resume.py prepare --dir ${OUT} --max-failed 2 --max-node-faults 4 --max-stalled 3) || {
                  echo "${OUT}: ${E}" | tee ${FAIL_MARK}; exit ${HALT}; }
                mkdir -p ${OUT}
                CELL=${OUT}
                RESUME=(); [ "${E}" -lt 0 ] || RESUME=(--load-epoch ${E})
                echo "$(date -u +%FT%TZ) pod=${POD_NAME} node=${NODE_NAME} from_epoch=${E}" >> ${OUT}/ATTEMPTS
                if [ -n "${ckpt}" ]; then LOAD="--load-model-weights ${ckpt} --exclude-model-weights mod\.fc\..*"; LR=1e-4; MULT=("${HEAD_MULT[@]}"); else LOAD=""; LR=1e-3; MULT=(); fi
                EP=$(epochs_for ${N})
                SPE=$(samples_for ${N})
                [ "${E}" -ge 0 ] || python3 experiments/FT/smoke_checks.py manifest --out ${OUT}/ft_manifest.json leg=1 init=${name} checkpoint=${ckpt} n_train=${N} ft_seed=${S} lr=${LR} head_lr_mult=1 weight_decay=0 recipe=part-from-scratch wave=v2 ckpt_rule=none epochs=${EP} subset=${SUB2}/train_N${N}_s1.parquet data_config=configs/finetune/JetClassII_L162_noweight.yaml num_classes=162 batch_size=512 samples_per_epoch=${SPE} steps_per_epoch=$((SPE/512)) val_jets=20480 steps_per_epoch_val=40 val_rule=fixed-sample-whole-pass
                python3 experiments/FT/ft_weaver.py --seed ${S} ${RESUME[@]+"${RESUME[@]}"} --lean-val-metrics \
                  --data-train ${SUB2}/train_N${N}_s1.parquet --data-val ${SUB2}/val.parquet \
                  --data-config configs/finetune/JetClassII_L162_noweight.yaml \
                  --network-config experiments/MTX/ParT_sophon_arch_mtx.py -o num_classes 162 -o fc_params '[(512,0.1)]' \
                  ${COMMON} ${MULT[@]+"${MULT[@]}"} --start-lr ${LR} --samples-per-epoch ${SPE} --steps-per-epoch-val -1 --num-epochs ${EP} \
                  ${LOAD} --model-prefix ${OUT}/net --log ${OUT}/train.log 2>&1 | tee ${OUT}/stdout.log
                # TRUE BOOKKEEPING (must-fix 14): weaver's own log must show the steps the
                # manifest records.
                grep -q "('steps_per_epoch', $((SPE/512)))" ${OUT}/train.log || {
                  echo "FATAL: ${OUT}: weaver did not run $((SPE/512)) steps per epoch"; exit 1; }
                # ...and every epoch validated on the whole fixed sample, 20480 jets.
                [ "$(grep -c "Processed 20480 entries" ${OUT}/train.log)" -eq "${EP}" ] || {
                  echo "FATAL: ${OUT}: not every epoch validated on the fixed sample"; exit 1; }
                # A run whose loss went to NaN is not a result even if it finishes: weaver
                # still keeps a best epoch. Fail the attempt; the cell starts again once.
                if grep -q "AvgLoss: nan" ${OUT}/train.log 2>/dev/null; then
                  echo "FATAL: ${OUT} diverged (NaN training loss)"; exit 1; fi
                # weaver restarts its best-validation tracking on --load-epoch: the best epoch
                # of the whole run, from the exact metric ft_weaver.py logs, as weaver picks it.
                python3 experiments/FT/cell_resume.py best --dir ${OUT} --epochs ${EP}
                [ -z "${ckpt}" ] || python3 experiments/FT/smoke_checks.py load-log --log ${OUT}/stdout.log
                if [ -n "${ckpt}" ]; then
                  grep -q "Parameters with lr multiplied by 50" ${OUT}/stdout.log || {
                    echo "FATAL: weaver did not apply the head lr multiplier; this cell"
                    echo "       ran wave 1's protocol, not ParT's published recipe."; exit 1; }
                fi
                touch ${OUT}/TRAINED   # training passed its checks: a retry redoes only what follows
                python3 experiments/EVAL/extract_features.py --checkpoint ${OUT}/net_best_epoch_state.pt --num-classes 162 --arm FT1_${name}_N${N}_s${S} \
                  --data-config configs/data/JetClassII_base.yaml --data-test ${TEST2M} \
                  --out ${OUT}/features_v2 --batch-size 512 --num-workers 1 --fetch-step 1 --max-jets 2000000 --stride 4 --save-logits
                python3 experiments/FT/smoke_checks.py features --dir ${OUT}/features_v2 --n 500000 --k 162
                rm -f ${OUT}/features_v2/features.npy
                python3 experiments/FT/slim_outputs.py leg1 --dir ${OUT}/features_v2 --stride 4
                [ -f ${OUT}/net_best_epoch_state.pt ] || {
                  echo "FATAL: no net_best_epoch_state.pt in ${OUT};"
                  echo "       refusing to prune per-epoch checkpoints."; exit 1; }
                rm -f ${OUT}/net_epoch-*_state.pt ${OUT}/net_epoch-*_optimizer.pt
                [ -f ${OUT}/net_best_epoch_state.pt ] || {
                  echo "FATAL: the prune removed net_best_epoch_state.pt in ${OUT}."; exit 1; }
                touch ${OUT}/DONE
                rm -rf ${OUT}.lock
                CELL=""
              done
            done
          done

          echo "FT V2 LEGS (scratch) ${SHARD} COMPLETE (${NLOCKED} cells left to another job)"
          [ "${NLOCKED}" -eq 0 ] || { echo "FATAL: ${NLOCKED} cells are held by another job's lock"; exit ${HALT}; }
        resources:
          requests: { memory: "88Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "88Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: nvidia.com/gpu.product
                operator: In
                values: ["NVIDIA-GeForce-RTX-3090"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-01.sdsc.optiputer.net", "ry-gpu-10.sdsc.optiputer.net"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
