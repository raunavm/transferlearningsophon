apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_ft_jobs.py -- do not hand-edit. Regenerate.
  #
  # RETRIES (2026-10-01): pod failure policy -- evictions are not counted, exit 42
  # fails the Job at once. An interrupted cell resumes from its last completed epoch;
  # the job halts on two failed attempts of a cell or 3 attempts without progress.
  # See "retries that survive a flaky cluster" in scripts/build_ft_jobs.py.
  # v2 FROM-SCRATCH REFERENCE on the held-out JetClass-II subsets: ParT's own
  # from-scratch recipe (BASELINE RECIPES), three fine-tuning seeds on the one
  # subset per size, leg 1 only; loads no pretrained checkpoint.
  # 12 fine-tunes, ~12 GPU-h. Root /data/results/ft_v2/scratch.
  name: ft-v2-legs-scratch-raunav
  namespace: cms-ml
spec:
  backoffLimit: 20
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Count
      onExitCodes: { containerName: main, operator: In, values: [43] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        env:
        - name: GPU_PRODUCT
          value: "NVIDIA-GeForce-RTX-3090"
        - name: NODE_NAME
          valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
        - name: POD_NAME
          valueFrom: { fieldRef: { fieldPath: metadata.name } }
        - name: REPO_REF
          value: "mtx-s1.88"
        args:
        - |
          set -euo pipefail
          # Clone the pinned TAG (not a branch): every job in this wave runs the
          # same code, and a job that queues for days cannot pick up a later
          # commit when it finally starts.
          git clone --depth 1 --branch "${REPO_REF}" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow || exit 1
          export PYTHONUNBUFFERED=1

          SUB2=/data/finetune/jc2_v2
          ROOT_OUT=/data/results/ft_v2/scratch
          SHARD=ft-v2-legs-scratch-raunav
          NLOCKED=0
          mkdir -p ${ROOT_OUT}

          # The subsets come from two CPU jobs applied BEFORE this one, which is
          # applied only once both DONE files exist; so this wait is a guard, not
          # a plan. Bounded at 2 h, and it leaves a marker: with backoffLimit 50
          # a bare exit 1 would re-queue and hold a GPU for 2 h per retry, the
          # marker makes every retry fail at once.
          WAIT_MARK=${ROOT_OUT}/WAIT_TIMEOUT.${SHARD}
          [ -f ${WAIT_MARK} ] && { echo "FATAL: an earlier attempt timed out: $(cat ${WAIT_MARK}). Fix the producer, then remove ${WAIT_MARK}"; exit 1; }
          wait_for () { local f=$1; local t=0; until [ -f "$f" ]; do [ "$t" -ge 7200 ] && { echo "$f absent after 2 h" | tee ${WAIT_MARK}; exit 1; }; sleep 60; t=$((t+60)); done; }
          wait_for ${SUB2}/DONE
          # CLAUDE.md: check free space before a write of this size.
          FREE_G=$(df -BG --output=avail /data | tail -1 | tr -dc 0-9)
          echo "free on /data: ${FREE_G}G"
          [ "${FREE_G}" -ge 100 ] || { echo "FATAL: ${FREE_G}G free on /data, need 100G"; exit 1; }

          # Every fine-tune writes up to ~4 GB (weaver keeps state + optimizer per
          # epoch; leg 1 adds 2M x (128 + 162) float32 features + logits): ~250 GB
          # over the wave. CLAUDE.md: no write > 1 GB past 85% without the PI.
          space_ok () { local p=$(df --output=pcent /data | tail -1 | tr -dc 0-9); local g=$(df -BG --output=avail /data | tail -1 | tr -dc 0-9); echo "/data ${p}% used, ${g}G free"; [ "$p" -lt 85 ] && [ "$g" -ge 50 ] || { echo "FATAL: /data at ${p}% used, ${g}G free: stop and ask the PI"; exit 1; }; }

          # A fine-tune that fails deterministically (OOM, a failed check) would
          # otherwise be re-run by all 50 retries, each one moving the previous
          # attempt aside: 50 x hours of a held GPU and ~200 GB of .partial dirs.
          # Two attempts, then the marker stops every later pod at the top.
          # Per shard: wave 2 and the other shards write to this same tree,
          # and one job's deterministic failure must not halt another's restarts.
          FAIL_MARK=${ROOT_OUT}/FAILED.${SHARD}
          HALT=42   # the pod failure policy fails the Job at once on this code
          NODE_FAULT=43   # ...and counts this one against the retries
          [ -f ${FAIL_MARK} ] && { echo "FATAL: an earlier attempt halted the job: $(cat ${FAIL_MARK}). Fix the cause, then remove ${FAIL_MARK}; what it counted was renamed and is not counted again"; exit ${HALT}; }
          # Each cell is prepared by experiments/FT/cell_resume.py prepare: an
          # interrupted attempt (an evicted or lost pod is SIGKILLed and runs no trap)
          # is RESUMED from its last completed epoch; a FAILED one (ATTEMPT_FAILED,
          # from the trap below) is moved aside and the cell starts again, unless its
          # training had finished (TRAINED), when only the read-out is redone. The job
          # halts on two failed attempts of a cell, 4 node faults of a cell, or 3
          # consecutive attempts of a cell that complete no epoch.
          CELL=""
          NODE_FAULTS=${ROOT_OUT}/NODE_FAULTS.${SHARD}
          on_exit () {
            local rc=$?
            [ ${rc} -ne 0 ] && [ ${rc} -ne ${HALT} ] && [ ${rc} -ne ${NODE_FAULT} ] && [ -n "${CELL}" ] && [ -d "${CELL}" ] && [ ! -f "${CELL}/DONE" ] || return 0
            local why="rc=${rc} pod=${POD_NAME} node=${NODE_NAME} $(date -u +%FT%TZ)"
            # the node's fault, not the cell's: the GPU no longer answers, or the log
            # holds a CUDA device fault
            if ! python3 experiments/FT/gpu_probe.py || grep -qsE "CUDA error: unknown error|Cannot access accelerator device|GPU is lost|CUDA-capable device\(s\) is/are busy or unavailable|uncorrectable ECC error" "${CELL}/stdout.log" "${CELL}/predict.log"; then
              echo "${why}" > "$(mktemp "${CELL}/NODE_FAULT.XXXXXX")"
              echo "${why} ${CELL}" >> ${NODE_FAULTS}
              exit ${NODE_FAULT}
            fi
            echo "${why}" > "${CELL}/ATTEMPT_FAILED"
          }
          trap on_exit EXIT
          # A node whose GPU does not answer is refused before any cell is touched.
          python3 experiments/FT/gpu_probe.py || {
            echo "preflight pod=${POD_NAME} node=${NODE_NAME} $(date -u +%FT%TZ)" >> ${NODE_FAULTS}; exit ${NODE_FAULT}; }



          # init:checkpoint:K -- K is the CHECKPOINT's head width, checked before
          # any fine-tune so a wrong path or layout fails here, not after a run.
          INITS="scratch-v2::0:1,2,3"
          for spec in ${INITS}; do
            name=${spec%%:*}; rest=${spec#*:}; ckpt=${rest%%:*}; k=${rest#*:}; k=${k%%:*}
            [ -z "${ckpt}" ] && continue   # from scratch: nothing to check
            [ -f "${ckpt}" ] || { echo "FATAL: ${name}: no ${ckpt}"; exit 1; }
            python3 experiments/EVAL/extract_features.py --checkpoint ${ckpt} --num-classes ${k} --arm ${name} \
              --data-test /jc2/jet_data/Res2P_0250.parquet --out ${ROOT_OUT}/selfcheck --self-check-only
          done

          # EVERY SUBSET THIS JOB READS, against its sha256 record, before any GPU
          # work: the bytes the record holds, or the job stops (ft_v2.py verify).
          python3 experiments/FT/ft_v2.py verify --table experiments/FT/data/ft_v2_subsets_sha256.json \
            --files /data/finetune/jc2_v2/train_N1000_s1.parquet /data/finetune/jc2_v2/train_N10000_s1.parquet /data/finetune/jc2_v2/train_N100000_s1.parquet /data/finetune/jc2_v2/train_N1000000_s1.parquet /data/finetune/jc2_v2/val.parquet || exit ${HALT}

          epochs_for () { case $1 in 1000) echo 50;; 10000) echo 50;; 100000) echo 30;; 1000000) echo 10;; *) echo "FATAL: no epoch budget for N=$1" >&2; exit 1;; esac; }
          # samples-per-epoch DECOUPLED from the subset size; see SAMPLES_PER_EPOCH
          # in scripts/build_ft_jobs.py. Only N=1e3 differs, and it differs so the
          # optimizer-step count matches the N=1e4 cell.
          samples_for () { case $1 in 1000) echo 10000;; *) echo $1;; esac; }
          # ParT from scratch on JetClass (train_JetClass.sh): no weight decay.
          COMMON="--use-amp --batch-size 512 --num-workers 2 --fetch-by-files --fetch-step 1 --optimizer ranger"
          # An ARRAY, not a string: the value carries parentheses and
          # single quotes, and as a plain string it is re-split on
          # expansion so the parens reach the shell as syntax.
          HEAD_MULT=(--optimizer-option lr_mult "(r'mod\.fc\..*', 50)")

          # ---------------------------------------------------------------- leg 1
          # R16_Q1 (and every other init) -> the 162-way vocabulary. Readout:
          # frozen 128-d features + 162 logits on the paper's 2M-jet test subset.
          TEST2M="/jc2/jet_data/Res2P_0250.parquet /jc2/jet_data/Res34P_1075.parquet /jc2/jet_data/QCD_0350.parquet /jc2/jet_data/Res2P_0251.parquet /jc2/jet_data/Res34P_1076.parquet /jc2/jet_data/QCD_0351.parquet /jc2/jet_data/Res2P_0252.parquet /jc2/jet_data/Res34P_1077.parquet /jc2/jet_data/QCD_0352.parquet /jc2/jet_data/Res2P_0253.parquet /jc2/jet_data/Res34P_1078.parquet /jc2/jet_data/QCD_0353.parquet /jc2/jet_data/Res2P_0254.parquet /jc2/jet_data/Res34P_1079.parquet /jc2/jet_data/QCD_0354.parquet /jc2/jet_data/Res2P_0255.parquet /jc2/jet_data/Res34P_1080.parquet /jc2/jet_data/QCD_0355.parquet /jc2/jet_data/Res2P_0256.parquet /jc2/jet_data/Res34P_1081.parquet /jc2/jet_data/QCD_0356.parquet /jc2/jet_data/Res2P_0257.parquet /jc2/jet_data/Res34P_1082.parquet /jc2/jet_data/QCD_0357.parquet /jc2/jet_data/Res2P_0258.parquet /jc2/jet_data/Res34P_1083.parquet /jc2/jet_data/QCD_0358.parquet /jc2/jet_data/Res2P_0259.parquet /jc2/jet_data/Res34P_1084.parquet /jc2/jet_data/QCD_0359.parquet /jc2/jet_data/Res2P_0260.parquet /jc2/jet_data/Res34P_1085.parquet /jc2/jet_data/QCD_0360.parquet /jc2/jet_data/Res2P_0261.parquet /jc2/jet_data/Res34P_1086.parquet /jc2/jet_data/QCD_0361.parquet /jc2/jet_data/Res2P_0262.parquet /jc2/jet_data/Res34P_1087.parquet /jc2/jet_data/QCD_0362.parquet /jc2/jet_data/Res2P_0263.parquet /jc2/jet_data/Res34P_1088.parquet /jc2/jet_data/QCD_0363.parquet /jc2/jet_data/Res2P_0264.parquet /jc2/jet_data/Res34P_1089.parquet /jc2/jet_data/QCD_0364.parquet /jc2/jet_data/Res2P_0265.parquet /jc2/jet_data/Res34P_1090.parquet /jc2/jet_data/QCD_0365.parquet /jc2/jet_data/Res2P_0266.parquet /jc2/jet_data/Res34P_1091.parquet /jc2/jet_data/QCD_0366.parquet /jc2/jet_data/Res2P_0267.parquet /jc2/jet_data/Res34P_1092.parquet /jc2/jet_data/QCD_0367.parquet /jc2/jet_data/Res2P_0268.parquet /jc2/jet_data/Res34P_1093.parquet /jc2/jet_data/QCD_0368.parquet /jc2/jet_data/Res2P_0269.parquet /jc2/jet_data/Res34P_1094.parquet /jc2/jet_data/QCD_0369.parquet /jc2/jet_data/Res2P_02