apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_jc2bal_jobs.py -- pairs_test in three parts for the extraction. CPU.
  name: jc2bal-split-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          git clone -q --depth 1 --branch mtx-s2.32 https://github.com/raunavm/transferlearningsophon.git /workspace/tls
          cd /workspace/tls
          pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          [ -f /data/finetune/jc2_bal/DONE ] || { echo "FATAL: /data/finetune/jc2_bal is not staged"; exit 42; }
          [ ! -f /data/finetune/jc2_bal/pairs_test_part2.parquet ] || { echo "/data/finetune/jc2_bal/pairs_test_part2.parquet exists"; exit 0; }
          python3 experiments/FT/split_parquet.py /data/finetune/jc2_bal/pairs_test.parquet --parts 3
          echo "JC2BAL SPLIT COMPLETE"
        resources:
          requests: { memory: "16Gi", cpu: "2", ephemeral-storage: "20Gi" }
          limits:   { memory: "16Gi", cpu: "2", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      # weaver's DataLoader workers need more than the pod's default 64 MB of shared memory
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
