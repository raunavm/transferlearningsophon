apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_jc2bal_jobs.py -- v4 linear probes (plan 2.3, 3.2, 3.4, 3.5). GPU.
  name: jc2bal-fit-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 30
  parallelism: 5
  backoffLimitPerIndex: 2
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          git clone -q --depth 1 --branch mtx-s2.25 https://github.com/raunavm/transferlearningsophon.git /workspace/tls
          cd /workspace/tls
          pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          IDX=${JOB_COMPLETION_INDEX:?not a pod of an Indexed Job}
          case ${IDX} in
            0) MODEL=mtx-l188-s1; CKPTS="best70"; EXTRA="--variants mtop mqg itop iqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs --hidden";;
            1) MODEL=mtx-l188-s2; CKPTS="best70"; EXTRA="--variants mtop mqg itop iqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs --hidden";;
            2) MODEL=mtx-l188-s3; CKPTS="best70"; EXTRA="--variants mtop mqg itop iqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs --hidden";;
            3) MODEL=mtx-l162-s1; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            4) MODEL=mtx-l162-s2; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            5) MODEL=mtx-l162-s3; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            6) MODEL=mtx-r42q1-s1; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            7) MODEL=mtx-r42q1-s2; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            8) MODEL=mtx-r42q1-s3; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            9) MODEL=mtx-r16q1-s1; CKPTS="best70"; EXTRA="--variants mtop mqg itop iqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            10) MODEL=mtx-r16q1-s2; CKPTS="best70"; EXTRA="--variants mtop mqg itop iqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            11) MODEL=mtx-r16q1-s3; CKPTS="best70"; EXTRA="--variants mtop mqg itop iqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            12) MODEL=mtx-l162mass-s1; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            13) MODEL=mtx-l162mass-s2; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            14) MODEL=mtx-r16q1mass-s1; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            15) MODEL=mtx-r16q1mass-s2; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            16) MODEL=mtx-rand2p1-s1; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            17) MODEL=mtx-rand2p2-s2; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            18) MODEL=mtx-rand2p3-s1; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            19) MODEL=mtx-rand2p4-s2; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            20) MODEL=mtx-rand2p5-s2; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            21) MODEL=mtx-flavf0-s1; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            22) MODEL=mtx-flavf0-s2; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            23) MODEL=mtx-flavf1-s1; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            24) MODEL=mtx-flavf1-s2; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            25) MODEL=mtx-flavf1r-s1; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            26) MODEL=mtx-flavf1r-s2; CKPTS="best70"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            27) MODEL=init-s1; CKPTS="init init_bn"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            28) MODEL=init-s2; CKPTS="init init_bn"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            29) MODEL=init-s3; CKPTS="init init_bn"; EXTRA="--variants mtop mqg --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs";;
            *) echo "FATAL: no model for index ${IDX}"; exit 42;;
          esac
          [ -f /data/results/eval/v2_linprobe_bal/${MODEL}/DONE ] || { echo "FATAL: ${MODEL} is not extracted"; exit 42; }
          python3 experiments/EVAL/probe_bal.py --model ${MODEL} --checkpoints ${CKPTS} ${EXTRA} --out /data/results/eval/v2_linprobe_bal/fits_v4
          echo "JC2BAL FIT ${MODEL} COMPLETE"
        resources:
          requests: { memory: "48Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "48Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: nvidia.com/gpu.product
                operator: In
                values: ["NVIDIA-GeForce-RTX-3090", "NVIDIA-L40", "NVIDIA-L40S", "NVIDIA-RTX-A6000", "NVIDIA-A40", "NVIDIA-GeForce-RTX-4090", "NVIDIA-RTX-A5000", "NVIDIA-A10", "NVIDIA-RTX-5000-Ada-Generation"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
