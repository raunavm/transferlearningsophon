apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_jc2bal_jobs.py -- class-balanced JetClass-II sets (plan 3.4). CPU.
  name: jc2bal-stage-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          git clone -q --depth 1 --branch mtx-s2.24 https://github.com/raunavm/transferlearningsophon.git /workspace/tls
          cd /workspace/tls
          pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 85 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          rm -rf /data/finetune/jc2_bal.staging
          python3 experiments/FT/stage_jc2_balanced.py --out /data/finetune/jc2_bal.staging --workers 8
          mv /data/finetune/jc2_bal.staging /data/finetune/jc2_bal
          du -sh /data/finetune/jc2_bal; ls -la /data/finetune/jc2_bal
          echo "JC2BAL STAGE COMPLETE"
        resources:
          requests: { memory: "96Gi", cpu: "8", ephemeral-storage: "20Gi" }
          limits:   { memory: "96Gi", cpu: "8", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: jc2, mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
