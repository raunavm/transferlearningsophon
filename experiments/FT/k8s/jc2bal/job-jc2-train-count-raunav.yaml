apiVersion: batch/v1
kind: Job
metadata:
  # experiments/FT/count_jc2_train.py: the selected jets of the 1,340 pretraining files (DesignNTrainSelected).
  # CPU; reads JetClass-II, writes one JSON.
  name: jc2-train-count-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          git clone -q --depth 1 --branch mtx-s2.69 https://github.com/raunavm/transferlearningsophon.git /workspace/tls
          cd /workspace/tls
          pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          mkdir -p /data/results/eval/jc2_train
          python3 experiments/FT/count_jc2_train.py --out /data/results/eval/jc2_train/counts.json --workers 8
          echo "COUNT COMPLETE"
        resources:
          requests: { memory: "32Gi", cpu: "8", ephemeral-storage: "20Gi" }
          limits:   { memory: "32Gi", cpu: "8", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: jc2, mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
