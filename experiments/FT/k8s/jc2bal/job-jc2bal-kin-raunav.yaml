apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_jc2bal_jobs.py -- top-tagging probes of the kinematic-only models (plan 3.7).
  name: jc2bal-kin-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimitPerIndex: 2
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          git clone -q --depth 1 --branch mtx-s2.29 https://github.com/raunavm/transferlearningsophon.git /workspace/tls
          cd /workspace/tls
          pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          IDX=${JOB_COMPLETION_INDEX:?not a pod of an Indexed Job}
          case ${IDX} in
            0) MODEL=mtx-l188kin-s1; RUNG=L188; K=188;;
            1) MODEL=mtx-r16q1kin-s1; RUNG=R16_Q1; K=17;;
            *) echo "FATAL: no model for index ${IDX}"; exit 42;;
          esac
          RUN_DIR=/data/results/mtx_v2/${MODEL}
          [ -f ${RUN_DIR}/DONE ] || { echo "FATAL: ${RUN_DIR} has not finished"; exit 42; }
          [ ! -f /data/results/eval/v2_linprobe_bal/fits_v4_mlp/${MODEL}.json ] || { echo "${MODEL} done"; exit 0; }
          python3 experiments/FT/gpu_probe.py || exit 43
          extract () {
            OUT=/data/results/eval/v2_linprobe/${MODEL}/top/$1; FILE=$2
            [ -f ${OUT}/best70/manifest.json ] && return 0
            python3 experiments/EVAL/extract_v2.py --run-dir ${RUN_DIR} --rung ${RUNG} --num-classes ${K} \
              --num-reg 0 --checkpoints best70 --data-config configs/finetune/TopReference_kin.yaml --max-jets 0 \
              --observers --feature-classes --prefix-features 2000000000 --head-prefix 0 --no-anomaly-rows \
              --diag-stride 0 --no-pooled --data-test ${FILE} --out ${OUT} || exit 1
          }
          for N in 1000 10000 100000 1200000; do extract train_N${N} /data/finetune/top_sub/train_N${N}_s1.parquet; done
          extract val /data/finetune/top_sub/val.parquet
          extract test /data/finetune/top/top_test.parquet
          python3 experiments/EVAL/probe_bal.py --model ${MODEL} --checkpoints best70 --old-only top \
            --out /data/results/eval/v2_linprobe_bal/fits_v4 --probs-out /data/results/eval/v2_linprobe_bal/fits_v4_probs
          python3 experiments/EVAL/probe_bal.py --model ${MODEL} --checkpoints best70 --mlp --mlp-datasets top \
            --out /data/results/eval/v2_linprobe_bal/fits_v4_mlp
          echo "JC2BAL KIN ${MODEL} COMPLETE"
        resources:
          requests: { memory: "48Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "48Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: nvidia.com/gpu.product
                operator: In
                values: ["NVIDIA-GeForce-RTX-3090", "NVIDIA-L40", "NVIDIA-L40S", "NVIDIA-RTX-A6000", "NVIDIA-A40", "NVIDIA-GeForce-RTX-4090", "NVIDIA-RTX-A5000", "NVIDIA-A10", "NVIDIA-RTX-5000-Ada-Generation"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
