apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_jc2bal_jobs.py -- the imputation reference (plan 3.2). CPU.
  name: jc2bal-ref-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          git clone -q --depth 1 --branch mtx-s2.25 https://github.com/raunavm/transferlearningsophon.git /workspace/tls
          cd /workspace/tls
          pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          [ -f /data/finetune/jc2_bal/DONE ] || { echo "FATAL: /data/finetune/jc2_bal is not staged"; exit 42; }
          [ ! -f /data/finetune/jc2_bal/impute_ref.npz ] || { echo "/data/finetune/jc2_bal/impute_ref.npz exists"; exit 0; }
          python3 experiments/EVAL/input_variants.py ref --data /data/finetune/jc2_bal/train_N100000_s1.parquet \
            --data-config configs/data/JetClassII_base.yaml --max-jets 100000 --out /data/finetune/jc2_bal/impute_ref.npz
          echo "JC2BAL REF COMPLETE"
        resources:
          requests: { memory: "32Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "32Gi", cpu: "4", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
