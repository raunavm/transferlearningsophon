apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_jc2bal_jobs.py -- features on the class-balanced JetClass-II sets (plan 3.2, 3.4).
  name: jc2bal-x2-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 13
  parallelism: 6
  backoffLimitPerIndex: 6
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s2.34 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          retry pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          IDX=${JOB_COMPLETION_INDEX:?not a pod of an Indexed Job}
          case ${IDX} in
            0) MODEL=mtx-l188-s2; RUN_DIR=/data/results/mtx_v2/mtx-l188-s2; RUNG=L188; K=188; REG=0; CKPTS="best70"; VARIANTS="mtop mqg itop iqg";;
            1) MODEL=mtx-l188-s3; RUN_DIR=/data/results/mtx_v2/mtx-l188-s3; RUNG=L188; K=188; REG=0; CKPTS="best70"; VARIANTS="mtop mqg itop iqg";;
            2) MODEL=mtx-l162-s1; RUN_DIR=/data/results/mtx_v2/mtx-l162-s1; RUNG=L162; K=162; REG=0; CKPTS="best70"; VARIANTS="mtop mqg";;
            3) MODEL=mtx-l162-s2; RUN_DIR=/data/results/mtx_v2/mtx-l162-s2; RUNG=L162; K=162; REG=0; CKPTS="best70"; VARIANTS="mtop mqg";;
            4) MODEL=mtx-l162-s3; RUN_DIR=/data/results/mtx_v2/mtx-l162-s3; RUNG=L162; K=162; REG=0; CKPTS="best70"; VARIANTS="mtop mqg";;
            5) MODEL=mtx-r42q1-s1; RUN_DIR=/data/results/mtx_v2/mtx-r42q1-s1; RUNG=R42_Q1; K=43; REG=0; CKPTS="best70"; VARIANTS="mtop mqg";;
            6) MODEL=mtx-r42q1-s2; RUN_DIR=/data/results/mtx_v2/mtx-r42q1-s2; RUNG=R42_Q1; K=43; REG=0; CKPTS="best70"; VARIANTS="mtop mqg";;
            7) MODEL=mtx-r42q1-s3; RUN_DIR=/data/results/mtx_v2/mtx-r42q1-s3; RUNG=R42_Q1; K=43; REG=0; CKPTS="best70"; VARIANTS="mtop mqg";;
            8) MODEL=mtx-r16q1-s1; RUN_DIR=/data/results/mtx_v2/mtx-r16q1-s1; RUNG=R16_Q1; K=17; REG=0; CKPTS="best70"; VARIANTS="mtop mqg itop iqg";;
            9) MODEL=mtx-r16q1-s2; RUN_DIR=/data/results/mtx_v2/mtx-r16q1-s2; RUNG=R16_Q1; K=17; REG=0; CKPTS="best70"; VARIANTS="mtop mqg itop iqg";;
            10) MODEL=mtx-r16q1-s3; RUN_DIR=/data/results/mtx_v2/mtx-r16q1-s3; RUNG=R16_Q1; K=17; REG=0; CKPTS="best70"; VARIANTS="mtop mqg itop iqg";;
            11) MODEL=mtx-l162mass-s1; RUN_DIR=/data/results/mtx_v2/mtx-l162mass-s1; RUNG=L162; K=162; REG=1; CKPTS="best70"; VARIANTS="mtop mqg";;
            12) MODEL=mtx-l162mass-s2; RUN_DIR=/data/results/mtx_v2/mtx-l162mass-s2; RUNG=L162; K=162; REG=1; CKPTS="best70"; VARIANTS="mtop mqg";;
            *) echo "FATAL: no model for index ${IDX}"; exit 42;;
          esac
          [ -f /data/results/eval/v2_linprobe_bal/${MODEL}/DONE ] && { echo "${MODEL} done"; exit 0; }
          [ -f /data/finetune/jc2_bal/DONE ] && [ -f /data/finetune/jc2_bal/impute_ref.npz ] && [ -f /data/finetune/jc2_bal/pairs_test_part2.parquet ] || { echo "FATAL: /data/finetune/jc2_bal not staged"; exit 42; }
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 85 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          python3 experiments/FT/gpu_probe.py || { sleep 120; exit 43; }
          # extract DATASET SPLIT "FILES" [variants]: one pass over the files, every checkpoint (and variant);
          # a set whose every checkpoint directory has its manifest (written last) is done
          extract () {
            OUT=/data/results/eval/v2_linprobe_bal/${MODEL}/$1/$2; FILES=$3; shift 3
            TAGS=""; for C in ${CKPTS}; do TAGS="${TAGS} ${C}"; [ "${1:-}" != --variants ] || for V in ${VARIANTS}; do TAGS="${TAGS} ${C}.${V}"; done; done
            ALL=1; for T in ${TAGS}; do [ -f ${OUT}/${T}/manifest.json ] || ALL=0; done
            [ ${ALL} = 0 ] || { echo "${OUT} done"; return 0; }
            python3 experiments/EVAL/extract_v2.py --run-dir ${RUN_DIR} --rung ${RUNG} --num-classes ${K} \
              --num-reg ${REG} --checkpoints ${CKPTS} --data-config configs/data/JetClassII_massreg.yaml --max-jets 0 \
              --observers --feature-classes --prefix-features 2000000000 --head-prefix 0 --no-anomaly-rows \
              --diag-stride 0 --no-pooled --data-test ${FILES} "$@" --out ${OUT} || exit 1
          }
          for N in 1000 10000 100000; do extract jc2bal train_N${N} /data/finetune/jc2_bal/train_N${N}_s1.parquet; done
          for S in train_N1000000:train_N1000000_s1 val:val test:test; do
            extract jc2bal ${S%%:*} /data/finetune/jc2_bal/${S##*:}.parquet --variants ${VARIANTS} --impute-ref /data/finetune/jc2_bal/impute_ref.npz
          done
          extract jc2bal_pairs train /data/finetune/jc2_bal/pairs_train.parquet
          extract jc2bal_pairs test "/data/finetune/jc2_bal/pairs_test_part0.parquet /data/finetune/jc2_bal/pairs_test_part1.parquet /data/finetune/jc2_bal/pairs_test_part2.parquet"
          touch /data/results/eval/v2_linprobe_bal/${MODEL}/DONE
          echo "JC2BAL X ${MODEL} COMPLETE"
        resources:
          requests: { memory: "48Gi", cpu: "2", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "48Gi", cpu: "2", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
