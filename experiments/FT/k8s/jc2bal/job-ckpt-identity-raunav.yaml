apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_jc2bal_jobs.py -- bestval against best70 for every paper run. CPU.
  name: ckpt-identity-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          git clone -q --depth 1 --branch mtx-s2.81 https://github.com/raunavm/transferlearningsophon.git /workspace/tls
          cd /workspace/tls
          python3 experiments/EVAL/checkpoint_identity.py --runs configs/arms/v2_paper_runs.txt --root /data/results/mtx_v2 --out /data/results/eval/v2_ckpt_identity/identity.json
          echo "CKPT IDENTITY COMPLETE"
        resources:
          requests: { memory: "4Gi", cpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "4Gi", cpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      # weaver's DataLoader workers need more than the pod's default 64 MB of shared memory
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
