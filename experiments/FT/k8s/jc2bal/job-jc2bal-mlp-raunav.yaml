apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_jc2bal_jobs.py -- nonlinear probes on the balanced JetClass-II task and pairs (plan 3.3). CPU.
  name: jc2bal-mlp-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 21
  parallelism: 5
  backoffLimitPerIndex: 2
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          git clone -q --depth 1 --branch mtx-s2.25 https://github.com/raunavm/transferlearningsophon.git /workspace/tls
          cd /workspace/tls
          pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          IDX=${JOB_COMPLETION_INDEX:?not a pod of an Indexed Job}
          case ${IDX} in
            0) MODEL=mtx-l188-s1; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            1) MODEL=mtx-l188-s2; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            2) MODEL=mtx-l188-s3; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            3) MODEL=mtx-l162-s1; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            4) MODEL=mtx-l162-s2; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            5) MODEL=mtx-l162-s3; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            6) MODEL=mtx-r42q1-s1; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            7) MODEL=mtx-r42q1-s2; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            8) MODEL=mtx-r42q1-s3; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            9) MODEL=mtx-r16q1-s1; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            10) MODEL=mtx-r16q1-s2; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            11) MODEL=mtx-r16q1-s3; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            12) MODEL=mtx-flavf0-s1; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            13) MODEL=mtx-flavf0-s2; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            14) MODEL=mtx-flavf1-s1; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            15) MODEL=mtx-flavf1-s2; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            16) MODEL=mtx-flavf1r-s1; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            17) MODEL=mtx-flavf1r-s2; CKPTS="best70"; EXTRA="--mlp --mlp-datasets jc2bal";;
            18) MODEL=init-s1; CKPTS="init init_bn"; EXTRA="--mlp --mlp-datasets jc2bal";;
            19) MODEL=init-s2; CKPTS="init init_bn"; EXTRA="--mlp --mlp-datasets jc2bal";;
            20) MODEL=init-s3; CKPTS="init init_bn"; EXTRA="--mlp --mlp-datasets jc2bal";;
            *) echo "FATAL: no model for index ${IDX}"; exit 42;;
          esac
          [ -f /data/results/eval/v2_linprobe_bal/${MODEL}/DONE ] || { echo "FATAL: ${MODEL} is not extracted"; exit 42; }
          python3 experiments/EVAL/probe_bal.py --model ${MODEL} --checkpoints ${CKPTS} ${EXTRA} --out /data/results/eval/v2_linprobe_bal/fits_v4_mlp
          echo "JC2BAL MLP ${MODEL} COMPLETE"
        resources:
          requests: { memory: "64Gi", cpu: "8", ephemeral-storage: "20Gi" }
          limits:   { memory: "64Gi", cpu: "8", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
