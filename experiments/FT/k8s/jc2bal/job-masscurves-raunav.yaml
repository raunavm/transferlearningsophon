apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_jc2bal_jobs.py -- mass-response histograms and sculpting curves. CPU.
  name: masscurves-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          git clone -q --depth 1 --branch mtx-s2.26 https://github.com/raunavm/transferlearningsophon.git /workspace/tls
          cd /workspace/tls
          OUT=/data/results/eval/v2_head/curves_v2
          mkdir -p ${OUT}
          for M in mtx-l188-s1 mtx-l188-s2 mtx-l188-s3 mtx-l162-s1 mtx-l162-s2 mtx-l162-s3 mtx-r42q1-s1 mtx-r42q1-s2 mtx-r42q1-s3 mtx-r16q1-s1 mtx-r16q1-s2 mtx-r16q1-s3 mtx-l162mass-s1 mtx-l162mass-s2 mtx-r16q1mass-s1 mtx-r16q1mass-s2; do
            H=/data/results/eval/v2_head/${M}/test/best70
            [ -f ${H}/head_outputs.npz ] || { echo "FATAL: no head outputs for ${M}"; exit 42; }
            [ -f ${OUT}/${M}_sculpting_v2.json ] || python3 experiments/EVAL/mass_sculpting.py --head ${H} --out ${OUT}/${M}_sculpting_v2.json
            [ -f ${OUT}/${M}_response.json ] || python3 experiments/EVAL/mass_response_hist.py --head ${H} --out ${OUT}/${M}_response.json
          done
          echo "MASSCURVES COMPLETE"
        resources:
          requests: { memory: "32Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "32Gi", cpu: "4", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
