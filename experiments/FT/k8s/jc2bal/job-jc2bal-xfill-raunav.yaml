apiVersion: batch/v1
kind: Job
metadata:
  # GENERATED by scripts/build_jc2bal_jobs.py -- the fills of the absent inputs, every model (PI 2026-11-01). GPU.
  name: jc2bal-xfill-raunav
  namespace: cms-ml
spec:
  completionMode: Indexed
  completions: 30
  parallelism: 5
  backoffLimitPerIndex: 6
  podFailurePolicy:
    rules:
    - action: FailIndex
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning@sha256:db235b515a278198ebc6dc2c607c9c38cfb10e6b46e29ed2847ec9f4af6191e7
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          retry () { for T in 1 2 3 4 5; do "$@" && return 0; echo "attempt $T failed: $1"; sleep 30; done; return 1; }
          clone () { mkdir -p /workspace && cd /workspace && rm -rf tls && git clone -q --depth 1 --branch mtx-s2.40 https://github.com/raunavm/transferlearningsophon.git tls; }
          retry clone || exit 1
          cd /workspace/tls
          retry pip install --no-cache-dir -q pyarrow==25.0.1 || exit 1
          IDX=${JOB_COMPLETION_INDEX:?not a pod of an Indexed Job}
          case ${IDX} in
            0) MODEL=mtx-l188-s1; RUN_DIR=/data/results/mtx_v2/mtx-l188-s1; RUNG=L188; K=188; REG=0; CKPTS="best70";;
            1) MODEL=mtx-l188-s2; RUN_DIR=/data/results/mtx_v2/mtx-l188-s2; RUNG=L188; K=188; REG=0; CKPTS="best70";;
            2) MODEL=mtx-l188-s3; RUN_DIR=/data/results/mtx_v2/mtx-l188-s3; RUNG=L188; K=188; REG=0; CKPTS="best70";;
            3) MODEL=mtx-l162-s1; RUN_DIR=/data/results/mtx_v2/mtx-l162-s1; RUNG=L162; K=162; REG=0; CKPTS="best70";;
            4) MODEL=mtx-l162-s2; RUN_DIR=/data/results/mtx_v2/mtx-l162-s2; RUNG=L162; K=162; REG=0; CKPTS="best70";;
            5) MODEL=mtx-l162-s3; RUN_DIR=/data/results/mtx_v2/mtx-l162-s3; RUNG=L162; K=162; REG=0; CKPTS="best70";;
            6) MODEL=mtx-r42q1-s1; RUN_DIR=/data/results/mtx_v2/mtx-r42q1-s1; RUNG=R42_Q1; K=43; REG=0; CKPTS="best70";;
            7) MODEL=mtx-r42q1-s2; RUN_DIR=/data/results/mtx_v2/mtx-r42q1-s2; RUNG=R42_Q1; K=43; REG=0; CKPTS="best70";;
            8) MODEL=mtx-r42q1-s3; RUN_DIR=/data/results/mtx_v2/mtx-r42q1-s3; RUNG=R42_Q1; K=43; REG=0; CKPTS="best70";;
            9) MODEL=mtx-r16q1-s1; RUN_DIR=/data/results/mtx_v2/mtx-r16q1-s1; RUNG=R16_Q1; K=17; REG=0; CKPTS="best70";;
            10) MODEL=mtx-r16q1-s2; RUN_DIR=/data/results/mtx_v2/mtx-r16q1-s2; RUNG=R16_Q1; K=17; REG=0; CKPTS="best70";;
            11) MODEL=mtx-r16q1-s3; RUN_DIR=/data/results/mtx_v2/mtx-r16q1-s3; RUNG=R16_Q1; K=17; REG=0; CKPTS="best70";;
            12) MODEL=mtx-l162mass-s1; RUN_DIR=/data/results/mtx_v2/mtx-l162mass-s1; RUNG=L162; K=162; REG=1; CKPTS="best70";;
            13) MODEL=mtx-l162mass-s2; RUN_DIR=/data/results/mtx_v2/mtx-l162mass-s2; RUNG=L162; K=162; REG=1; CKPTS="best70";;
            14) MODEL=mtx-r16q1mass-s1; RUN_DIR=/data/results/mtx_v2/mtx-r16q1mass-s1; RUNG=R16_Q1; K=17; REG=1; CKPTS="best70";;
            15) MODEL=mtx-r16q1mass-s2; RUN_DIR=/data/results/mtx_v2/mtx-r16q1mass-s2; RUNG=R16_Q1; K=17; REG=1; CKPTS="best70";;
            16) MODEL=mtx-rand2p1-s1; RUN_DIR=/data/results/mtx_v2/mtx-rand2p1-s1; RUNG=none; K=17; REG=0; CKPTS="best70";;
            17) MODEL=mtx-rand2p2-s2; RUN_DIR=/data/results/mtx_v2/mtx-rand2p2-s2; RUNG=none; K=17; REG=0; CKPTS="best70";;
            18) MODEL=mtx-rand2p3-s1; RUN_DIR=/data/results/mtx_v2/mtx-rand2p3-s1; RUNG=none; K=17; REG=0; CKPTS="best70";;
            19) MODEL=mtx-rand2p4-s2; RUN_DIR=/data/results/mtx_v2/mtx-rand2p4-s2; RUNG=none; K=17; REG=0; CKPTS="best70";;
            20) MODEL=mtx-rand2p5-s2; RUN_DIR=/data/results/mtx_v2/mtx-rand2p5-s2; RUNG=none; K=17; REG=0; CKPTS="best70";;
            21) MODEL=mtx-flavf0-s1; RUN_DIR=/data/results/mtx_v2/mtx-flavf0-s1; RUNG=none; K=17; REG=0; CKPTS="best70";;
            22) MODEL=mtx-flavf0-s2; RUN_DIR=/data/results/mtx_v2/mtx-flavf0-s2; RUNG=none; K=17; REG=0; CKPTS="best70";;
            23) MODEL=mtx-flavf1-s1; RUN_DIR=/data/results/mtx_v2/mtx-flavf1-s1; RUNG=none; K=17; REG=0; CKPTS="best70";;
            24) MODEL=mtx-flavf1-s2; RUN_DIR=/data/results/mtx_v2/mtx-flavf1-s2; RUNG=none; K=17; REG=0; CKPTS="best70";;
            25) MODEL=mtx-flavf1r-s1; RUN_DIR=/data/results/mtx_v2/mtx-flavf1r-s1; RUNG=none; K=17; REG=0; CKPTS="best70";;
            26) MODEL=mtx-flavf1r-s2; RUN_DIR=/data/results/mtx_v2/mtx-flavf1r-s2; RUNG=none; K=17; REG=0; CKPTS="best70";;
            27) MODEL=init-s1; RUN_DIR=/data/results/mtx_v2/mtx-l188-s1; RUNG=none; K=0; REG=0; CKPTS="init init_bn";;
            28) MODEL=init-s2; RUN_DIR=/data/results/mtx_v2/mtx-l188-s2; RUNG=none; K=0; REG=0; CKPTS="init init_bn";;
            29) MODEL=init-s3; RUN_DIR=/data/results/mtx_v2/mtx-l188-s3; RUNG=none; K=0; REG=0; CKPTS="init init_bn";;
            *) echo "FATAL: no model for index ${IDX}"; exit 42;;
          esac
          [ -f /data/results/eval/v2_linprobe_fill/${MODEL}/DONE ] && { echo "${MODEL} done"; exit 0; }
          [ -f /data/finetune/jc2_bal/impute_ref_v2.npz ] || { echo "FATAL: /data/finetune/jc2_bal/impute_ref_v2.npz missing (ref2 job)"; exit 42; }
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          [ "${USED}" -le 85 ] || { echo "FATAL: /data at ${USED}%"; exit 42; }
          python3 experiments/FT/gpu_probe.py || { sleep 120; exit 43; }
          # extract DATASET SPLIT CONFIG "VARIANTS" "FILES": one pass, every checkpoint and its fills; a set whose
          # every directory has its manifest (written last) is done
          extract () {
            OUT=/data/results/eval/v2_linprobe_fill/${MODEL}/$1/$2; CFGX=$3; VARS=$4; FILES=$5
            ALL=1; for C in ${CKPTS}; do for T in ${C} $(for V in ${VARS}; do echo ${C}.${V}; done); do
              [ -f ${OUT}/${T}/manifest.json ] || ALL=0; done; done
            [ ${ALL} = 0 ] || { echo "${OUT} done"; return 0; }
            python3 experiments/EVAL/extract_v2.py --run-dir ${RUN_DIR} --rung ${RUNG} --num-classes ${K} \
              --num-reg ${REG} --checkpoints ${CKPTS} --data-config ${CFGX} --max-jets 0 \
              --observers --feature-classes --prefix-features 2000000000 --head-prefix 0 --no-anomaly-rows \
              --diag-stride 0 --no-pooled --data-test ${FILES} --variants ${VARS} --impute-ref /data/finetune/jc2_bal/impute_ref_v2.npz \
              --out ${OUT} || exit 1
          }
          extract top train_N1000 configs/finetune/TopReference.yaml "ntop itop4" "/data/finetune/top_sub/train_N1000_s1.parquet"
          extract top train_N10000 configs/finetune/TopReference.yaml "ntop itop4" "/data/finetune/top_sub/train_N10000_s1.parquet"
          extract top train_N100000 configs/finetune/TopReference.yaml "ntop itop4" "/data/finetune/top_sub/train_N100000_s1.parquet"
          extract top train_N1200000 configs/finetune/TopReference.yaml "ntop itop4" "/data/finetune/top_sub/train_N1200000_s1.parquet"
          extract top val configs/finetune/TopReference.yaml "ntop itop4" "/data/finetune/top_sub/val.parquet"
          extract top test configs/finetune/TopReference.yaml "ntop itop4" "/data/finetune/top/top_test.parquet"
          extract qg train_N1000 configs/finetune/EnergyFlowQG.yaml "nqg iqg4" "/data/finetune/qg_v2_sub/train_N1000_s1.parquet"
          extract qg train_N10000 configs/finetune/EnergyFlowQG.yaml "nqg iqg4" "/data/finetune/qg_v2_sub/train_N10000_s1.parquet"
          extract qg train_N100000 configs/finetune/EnergyFlowQG.yaml "nqg iqg4" "/data/finetune/qg_v2_sub/train_N100000_s1.parquet"
          extract qg train_N1600000 configs/finetune/EnergyFlowQG.yaml "nqg iqg4" "/data/finetune/qg_v2_sub/train_N1600000_s1.parquet"
          extract qg val configs/finetune/EnergyFlowQG.yaml "nqg iqg4" "/data/finetune/qg_v2_sub/val.parquet"
          extract qg test configs/finetune/EnergyFlowQG.yaml "nqg iqg4" "/data/finetune/qg_v2/qg_chunk18.parquet /data/finetune/qg_v2/qg_chunk19.parquet"
          extract qg herwig configs/finetune/EnergyFlowQG.yaml "nqg iqg4" "/data/finetune/qg_herwig/qg_herwig_chunk0.parquet /data/finetune/qg_herwig/qg_herwig_chunk1.parquet"
          extract jc2bal train_N1000000 configs/data/JetClassII_massreg.yaml "ntop nqg itop4 iqg4" "/data/finetune/jc2_bal/train_N1000000_s1.parquet"
          extract jc2bal val configs/data/JetClassII_massreg.yaml "ntop nqg itop4 iqg4" "/data/finetune/jc2_bal/val.parquet"
          extract jc2bal test configs/data/JetClassII_massreg.yaml "ntop nqg itop4 iqg4" "/data/finetune/jc2_bal/test.parquet"
          touch /data/results/eval/v2_linprobe_fill/${MODEL}/DONE
          echo "JC2BAL XFILL ${MODEL} COMPLETE"
        resources:
          requests: { memory: "88Gi", cpu: "2", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "88Gi", cpu: "2", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
        volumeMounts:
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      tolerations:
      - { key: "nvidia.com/gpu", operator: "Exists", effect: "PreferNoSchedule" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["ry-gpu-01.sdsc.optiputer.net", "ry-gpu-03.sdsc.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "hcc-chase-shor-c4705.unl.edu", "hcc-chase-shor-c4709.unl.edu", "hcc-chase-shor-c4715.unl.edu", "k8s-chase-ci-07.calit2.optiputer.net", "nrp-fiona-001.sdmz.amnh.org", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-02.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
