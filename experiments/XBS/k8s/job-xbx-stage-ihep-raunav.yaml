apiVersion: batch/v1
kind: Job
metadata:
  name: xbx-stage-ihep-raunav
  namespace: cms-ml
spec:
  backoffLimit: 6
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # a signal (OOM, lost node) is retried; any other failure is deterministic
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; echo "HALT: exit $rc, not retried"; exit 42; }
          git clone --depth 1 --branch "mtx-s2.13" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow
          export PYTHONUNBUFFERED=1
          # BLAS threads = the CPUs requested: nproc reports the node's cores
          export OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}%"
          [ "${USED}" -lt 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          mkdir -p /data/xbx/v1
          F_xbb=$(ls /data/xbx/ihep/Xbb_ntuple/*.root 2>/dev/null | sort || true)
          [ -n "${F_xbb}" ] || { echo "FATAL: no files in /data/xbx/ihep/Xbb_ntuple"; exit 42; }
          python3 experiments/XBS/stage_xbx.py check --files ${F_xbb} --out /data/xbx/v1/check_xbb.json || halt
          [ -f /data/xbx/v1/xbb/eval/DONE ] || python3 experiments/XBS/stage_xbx.py --root /data/xbx/v1 convert --name xbb --files ${F_xbb} || halt
          [ -f /data/xbx/v1/pairs/xbb/DONE ] || python3 experiments/XBS/stage_xbx.py --root /data/xbx/v1 pair --signal xbb || halt
          F_xbs=$(ls /data/xbx/ihep/Xbs_ntuple/*.root 2>/dev/null | sort || true)
          [ -n "${F_xbs}" ] || { echo "FATAL: no files in /data/xbx/ihep/Xbs_ntuple"; exit 42; }
          python3 experiments/XBS/stage_xbx.py check --files ${F_xbs} --out /data/xbx/v1/check_xbs.json || halt
          [ -f /data/xbx/v1/xbs/eval/DONE ] || python3 experiments/XBS/stage_xbx.py --root /data/xbx/v1 convert --name xbs --files ${F_xbs} || halt
          [ -f /data/xbx/v1/pairs/xbs/DONE ] || python3 experiments/XBS/stage_xbx.py --root /data/xbx/v1 pair --signal xbs || halt
          du -sh /data/xbx/v1/*
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
        resources:
          requests: { memory: "32Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "32Gi", cpu: "4", ephemeral-storage: "20Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["patternlab.calit2.optiputer.net", "nautilus-ext-gpu01.fullerton.edu"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
