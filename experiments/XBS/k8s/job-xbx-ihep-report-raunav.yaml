apiVersion: batch/v1
kind: Job
metadata:
  name: xbx-ihep-report-raunav
  namespace: cms-ml
spec:
  backoffLimit: 6
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # a signal (OOM, lost node) is retried; any other failure is deterministic
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; echo "HALT: exit $rc, not retried"; exit 42; }
          git clone --depth 1 --branch "mtx-s2.27" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow
          export PYTHONUNBUFFERED=1
          # BLAS threads = the CPUs requested: nproc reports the node's cores
          export OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}%"
          [ "${USED}" -lt 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          [ ! -e /data/results/eval/xbx/report_ihep_mtx-s2.27 ] || { echo "FATAL: /data/results/eval/xbx/report_ihep_mtx-s2.27 exists"; exit 42; }
          pip install --no-cache-dir -q matplotlib==3.10.7 mplhep==0.4.1 || exit 1
          python3 experiments/XBS/xbx_report.py --fits /data/results/eval/xbx/fits_ihep --out /data/results/eval/xbx/report_ihep_mtx-s2.27 || halt
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
        resources:
          requests: { memory: "32Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "32Gi", cpu: "4", ephemeral-storage: "20Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["patternlab.calit2.optiputer.net", "nautilus-ext-gpu01.fullerton.edu"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
