apiVersion: batch/v1
kind: Job
metadata:
  name: xbx-stage-jc2-raunav
  namespace: cms-ml
spec:
  backoffLimit: 6
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # a signal (OOM, lost node) is retried; any other failure is deterministic
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; echo "HALT: exit $rc, not retried"; exit 42; }
          git clone --depth 1 --branch "mtx-s2.17" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow
          export PYTHONUNBUFFERED=1
          # BLAS threads = the CPUs requested: nproc reports the node's cores
          export OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}%"
          [ "${USED}" -lt 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          pip install --no-cache-dir -q pytest || exit 1
          python3 -m pytest -q -p no:cacheprovider -rs tests/test_xbx.py tests/test_xbx_stage.py tests/test_xbx_fit.py 2>&1 | tee /tmp/xbx_tests.log || halt
          if grep -q "skipped" /tmp/xbx_tests.log; then echo "FATAL: an X->bx test was skipped in the image"; exit 42; fi
          [ -f /data/xbx/v2/qcd/eval/DONE ] || python3 experiments/XBS/stage_xbx.py --root /data/xbx/v2 jc2-eval --name qcd || halt
          [ -f /data/xbx/v2/xbb_jc2/eval/DONE ] || python3 experiments/XBS/stage_xbx.py --root /data/xbx/v2 jc2-eval --name xbb_jc2 || halt
          [ -f /data/xbx/v2/pairs/xbb_jc2/DONE ] || python3 experiments/XBS/stage_xbx.py --root /data/xbx/v2 pair --signal xbb_jc2 || halt
          du -sh /data/xbx/v2/*
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
        resources:
          requests: { memory: "32Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "32Gi", cpu: "4", ephemeral-storage: "20Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["patternlab.calit2.optiputer.net", "nautilus-ext-gpu01.fullerton.edu"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
