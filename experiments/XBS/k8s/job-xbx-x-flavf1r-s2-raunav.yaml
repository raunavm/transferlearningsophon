apiVersion: batch/v1
kind: Job
metadata:
  name: xbx-x-flavf1r-s2-raunav
  namespace: cms-ml
spec:
  backoffLimit: 6
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # a signal (OOM, lost node) is retried; any other failure is deterministic
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; gpu_ok || { echo "exit $rc with no working GPU on $(hostname): the node failed, not the code; retried elsewhere"; exit 137; }; echo "HALT: exit $rc, not retried"; exit 42; }
          git clone --depth 1 --branch "mtx-s2.16" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow
          export PYTHONUNBUFFERED=1
          # BLAS threads = the CPUs requested: nproc reports the node's cores
          export OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}%"
          [ "${USED}" -lt 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          gpu_ok () { timeout 300 python3 -c 'import torch; torch.ones(8, device="cuda").add_(1).sum().item()' >/dev/null 2>&1; }
          gpu_ok || { echo "no working GPU on $(hostname); retried elsewhere"; exit 137; }
          [ -f /data/xbx/v1/pairs/xbb_jc2/DONE ] || { echo "FATAL: /data/xbx/v1/pairs/xbb_jc2/DONE absent: stage first"; exit 42; }
          [ -f /data/xbx/v1/xbb_jc2/eval/DONE ] || { echo "FATAL: /data/xbx/v1/xbb_jc2/eval/DONE absent: stage first"; exit 42; }
          [ -f /data/xbx/v1/qcd/eval/DONE ] || { echo "FATAL: /data/xbx/v1/qcd/eval/DONE absent: stage first"; exit 42; }
          extract () {
            OUT=/data/results/eval/xbx/mtx-flavf1r-s2/$1; shift
            python3 experiments/XBS/extract_xbx.py --arm FLAV_F1R --run-dir /data/results/mtx_v2/mtx-flavf1r-s2 --rung none \
              --num-classes 17 --num-reg 0 --checkpoints best70 --data-config configs/xbx/JetClassII_xbx.yaml \
              --observers jet_pt jet_eta jet_sdmass --no-pooled \
              --data-test "$@" --out ${OUT} || halt
          }
          extract xbb_jc2/train $(ls /data/xbx/v1/pairs/xbb_jc2/train_*.parquet | sort)
          extract xbb_jc2/val /data/xbx/v1/pairs/xbb_jc2/val.parquet
          extract xbb_jc2/eval $(ls /data/xbx/v1/xbb_jc2/eval/*.parquet | sort)
          extract qcd/eval $(ls /data/xbx/v1/qcd/eval/*.parquet | sort)
          echo "every X->bx split of mtx-flavf1r-s2 extracted"
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
        resources:
          requests: { memory: "48Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
          limits:   { memory: "48Gi", cpu: "4", nvidia.com/gpu: "1", ephemeral-storage: "20Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["patternlab.calit2.optiputer.net", "nautilus-ext-gpu01.fullerton.edu", "ry-gpu-10.sdsc.optiputer.net", "ry-gpu-04.sdsc.optiputer.net", "ry-gpu-09.sdsc.optiputer.net", "nrp-01.laccd.edu", "k8s-chase-ci-01.calit2.optiputer.net", "k8s-haosu-15.sdsc.optiputer.net", "ucm-fiona01.ucmerced.edu"]
              - key: nvidia.com/gpu.product
                operator: NotIn
                values: ["NVIDIA-GeForce-RTX-3090", "Tesla-V100-SXM2-32GB"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
