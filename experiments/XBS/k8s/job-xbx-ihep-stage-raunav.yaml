apiVersion: batch/v1
kind: Job
metadata:
  name: xbx-ihep-stage-raunav
  namespace: cms-ml
spec:
  backoffLimit: 6
  podFailurePolicy:
    rules:
    - action: FailJob
      onExitCodes: { containerName: main, operator: In, values: [42] }
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: main
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # a signal (OOM, lost node) is retried; any other failure is deterministic
          halt () { rc=$?; [ $rc -ge 128 ] && exit $rc; echo "HALT: exit $rc, not retried"; exit 42; }
          git clone --depth 1 --branch "mtx-s2.19" \
            https://github.com/raunavm/transferlearningsophon.git \
            /workspace/transferlearningsophon
          cd /workspace/transferlearningsophon
          git rev-parse HEAD
          pip install --no-cache-dir -q pyarrow
          export PYTHONUNBUFFERED=1
          # BLAS threads = the CPUs requested: nproc reports the node's cores
          export OMP_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4
          USED=$(df --output=pcent /data | tail -1 | tr -dc 0-9)
          echo "PVC used: ${USED}%"
          [ "${USED}" -lt 85 ] || { echo "FATAL: /data is ${USED}% full"; exit 42; }
          mkdir -p /data/xbx/v2
          STAGED=""; FAILED=""
          F_xbb=$(ls /data/xbx/ihep/Xbb_ntuple/*.root 2>/dev/null | sort || true)
          if [ -z "${F_xbb}" ]; then
            echo "no files in /data/xbx/ihep/Xbb_ntuple: xbb not staged"
          elif python3 experiments/XBS/stage_xbx.py inspect --file "${F_xbb%%[[:space:]]*}" && \
               python3 experiments/XBS/stage_xbx.py check --window 93.75 143.75 --files ${F_xbb} --out /data/xbx/v2/check_xbb.json; then
            [ -f /data/xbx/v2/xbb/eval/DONE ] || python3 experiments/XBS/stage_xbx.py --root /data/xbx/v2 convert --name xbb --window 93.75 143.75 --files ${F_xbb} || halt
            [ -f /data/xbx/v2/pairs/xbb/DONE ] || python3 experiments/XBS/stage_xbx.py --root /data/xbx/v2 pair --signal xbb || halt
            STAGED="${STAGED} xbb"
          else
            echo "xbb failed its inspection or check (/data/xbx/v2/check_xbb.json): not staged"; FAILED="${FAILED} xbb"
          fi
          F_xbs=$(ls /data/xbx/ihep/Xbs_ntuple/*.root 2>/dev/null | sort || true)
          if [ -z "${F_xbs}" ]; then
            echo "no files in /data/xbx/ihep/Xbs_ntuple: xbs not staged"
          elif python3 experiments/XBS/stage_xbx.py inspect --file "${F_xbs%%[[:space:]]*}" && \
               python3 experiments/XBS/stage_xbx.py check --window 93.75 143.75 --files ${F_xbs} --out /data/xbx/v2/check_xbs.json; then
            [ -f /data/xbx/v2/xbs/eval/DONE ] || python3 experiments/XBS/stage_xbx.py --root /data/xbx/v2 convert --name xbs --window 93.75 143.75 --files ${F_xbs} || halt
            [ -f /data/xbx/v2/pairs/xbs/DONE ] || python3 experiments/XBS/stage_xbx.py --root /data/xbx/v2 pair --signal xbs || halt
            STAGED="${STAGED} xbs"
          else
            echo "xbs failed its inspection or check (/data/xbx/v2/check_xbs.json): not staged"; FAILED="${FAILED} xbs"
          fi
          [ -n "${STAGED}${FAILED}" ] || { echo "FATAL: no sample in /data/xbx/ihep/Xbb_ntuple or /data/xbx/ihep/Xbs_ntuple"; exit 42; }
          echo "staged:${STAGED}"
          du -sh /data/xbx/v2/* || true
          [ -z "${FAILED}" ] || { echo "FATAL: failed its check:${FAILED}"; exit 42; }
        volumeMounts:
        - { name: jc2,  mountPath: /jc2, readOnly: true }
        - { name: data, mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
        resources:
          requests: { memory: "32Gi", cpu: "4", ephemeral-storage: "20Gi" }
          limits:   { memory: "32Gi", cpu: "4", ephemeral-storage: "20Gi" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: ["us-west"]
              - key: kubernetes.io/hostname
                operator: NotIn
                values: ["patternlab.calit2.optiputer.net", "nautilus-ext-gpu01.fullerton.edu"]
      volumes:
      - name: jc2
        persistentVolumeClaim:
          claimName: tn-pvc-base-jetclass2
          readOnly: true
      - name: data
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "8Gi" }
