apiVersion: batch/v1
kind: Job
metadata:
  # Secondary ablation: from-scratch with the existing MLP head (128->256->10, dropout 0.1).
  # Not the primary control — see job-train-from-scratch-linear.yaml.
  # Always keep "raunav" in the name (cluster-safety rule).
  name: from-scratch-mlp-SIZE-sSEED-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon

          # Secondary ablation: from-scratch with MLP head (128->256->10,
          # dropout 0.1). Same paper-faithful ParT recipe as the linear
          # variant (Ranger + flat-decay, lr=1e-3, batch 512, 50 epochs,
          # weight_decay 0). Only the head changes.
          PYTHONUNBUFFERED=1 python3 scripts/train_finetune_sweep.py \
            --train-dir /data/features/train_100M \
            --val-dir   /data/features/val_5M \
            --test-dir  /data/features/test_20M \
            --strategy from_scratch \
            --head-type mlp \
            --optimizer ranger \
            --scheduler flat-decay \
            --decay-final-lr 1e-5 \
            --weight-decay 0 \
            --checkpoint-every 1 \
            --checkpoint-metric val_acc \
            --amp-dtype fp16 \
            --sizes SIZE \
            --seeds SEED \
            --lr 1e-3 \
            --output-dir /data/results/from_scratch_mlp \
            --epochs 51 \
            --patience 51 \
            --batch-size 512 \
            --val-size 100000 \
            --test-size 500000 \
            --skip-existing
        resources:
          requests: { memory: "256Gi", cpu: "6", nvidia.com/gpu: "1" }
          limits:   { memory: "256Gi", cpu: "6", nvidia.com/gpu: "1" }
        volumeMounts:
        - { name: pvc,  mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A40
                - NVIDIA-RTX-A6000
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-GeForce-RTX-4090
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "32Gi" }
