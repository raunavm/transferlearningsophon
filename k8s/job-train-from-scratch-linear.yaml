apiVersion: batch/v1
kind: Job
metadata:
  # Customize the suffix to identify the run.
  # Always keep "raunav" in the name (cluster-safety rule).
  name: from-scratch-linear-SIZE-sSEED-raunav
  namespace: cms-ml
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/escheuller/transfer-learning:cu121
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          git clone https://github.com/raunavm/transferlearningsophon.git
          cd transferlearningsophon

          # Sophon-architecture ParticleTransformer trained from random init
          # on JetClass-10. PRIMARY CONTROL: linear head (LinearHead(128, 10),
          # no activation). No --checkpoint passed — backbone is random init.
          #
          # Training recipe: paper-faithful to ParT (Qu, Li, Qian 2022).
          #   optimizer  = Ranger (Lookahead k=6, alpha=0.5 + RAdam betas
          #                (0.95, 0.999), eps=1e-5)  — weaver-core impl.
          #   scheduler  = flat-decay (constant for first 70% of epochs,
          #                exponential decay to 1e-5 at the final epoch).
          #   lr=1e-3, batch 512, epochs 50, weight_decay 0.
          #   patience set high so the schedule runs the full 50 epochs.
          # --checkpoint-every 1 saves a mid-training checkpoint each epoch
          # (atomic write, rolling retention of last 2 = ~70 MB peak on disk).
          # On pod eviction, relaunching with the same YAML auto-resumes from
          # the latest checkpoint via --skip-existing semantics.
          PYTHONUNBUFFERED=1 python3 scripts/train_finetune_sweep.py \
            --train-dir /data/features/train_100M \
            --val-dir   /data/features/val_5M \
            --test-dir  /data/features/test_20M \
            --strategy from_scratch \
            --head-type linear \
            --optimizer ranger \
            --scheduler flat-decay \
            --decay-final-lr 1e-5 \
            --weight-decay 0 \
            --checkpoint-every 1 \
            --checkpoint-metric val_acc \
            --amp-dtype fp16 \
            --sizes SIZE \
            --seeds SEED \
            --lr 1e-3 \
            --output-dir /data/results/from_scratch_linear \
            --epochs 51 \
            --patience 51 \
            --batch-size 512 \
            --val-size 100000 \
            --test-size 500000 \
            --skip-existing
        resources:
          # From-scratch trains the full ~2.2M-param ParT backbone end to end
          # on raw features (large mmap'd arrays). Match the existing
          # full_ft job-train-sweep.yaml sizing.
          requests: { memory: "256Gi", cpu: "6", nvidia.com/gpu: "1" }
          limits:   { memory: "256Gi", cpu: "6", nvidia.com/gpu: "1" }
        volumeMounts:
        - { name: pvc,  mountPath: /data }
        - { name: dshm, mountPath: /dev/shm }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-A100-SXM4-80GB
                - NVIDIA-A100-PCIE-40GB
                - NVIDIA-A40
                - NVIDIA-RTX-A6000
                - NVIDIA-L40
                - NVIDIA-L40S
                - NVIDIA-GeForce-RTX-4090
      volumes:
      - name: pvc
        persistentVolumeClaim:
          claimName: transfer-learning-vol
      - name: dshm
        emptyDir: { medium: Memory, sizeLimit: "32Gi" }
